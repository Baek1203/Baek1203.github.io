<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!--
  정다면체 깎기 (전자칠판용) — 안내/03_수업화면_기본틀.html을 바탕으로 한 '정다면체 짓기'·'준정다면체 모아 보기'의 틀을 그대로 씀
  정다면체를 칼(평면)로 조금씩 잘라 내어 준정다면체가 되는 모습을 실제로 계산해 보여 준다.
  장면 0 모아 보기: 깎는 방법 5가지 × 정다면체 5가지 표(계열별). 짝인 두 정다면체에서 같은 모양이 나오는 칸은 하나로 합쳤다.
  장면 1~3 계열마다: 짝인 두 정다면체를 나란히 놓고 같은 방법으로 함께 깎는다. '무엇이 될까?' → '다음'으로 깎으면 이름이 나오고 오른쪽 계통도가 채워진다.
  끝까지 깎기는 꼭짓점 깎기 모양에서 멈췄다가 더 깎는다. 비틀기는 면을 떼어 밀어내고 비튼 뒤 틈을 채운다.
  깎는 동안 새로 생긴 면은 다 깎았을 때의 모양 색, 원래 면은 회색. 점선은 원래 정다면체. 면·모서리·꼭짓점의 개수는 깎는 동안 계속 바뀐다.
  움직임은 기기 설정과 상관없이 항상 보여 준다.
-->
<title>정다면체 깎기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap">
<style>
/* ---------- 색: 종이(밝은 화면) ---------- */
:root{
  --bg:#f4f6f9;--surface:#ffffff;--surface-2:#e8edf4;--ink:#15202b;--ink-2:#4b5664;--line:#c8d0da;--ghost:#b8c1cc;
  --accent:#1c4f8c;--on-accent:#ffffff;
  /* 수학 색: 그림과 글에서 같은 대상은 같은 색 */
  --c-arc:#1f63c6;--c-arc2:#0a7f9f;--c-chord:#c9510f;--c-secant:#7442c0;--c-center:#12804f;
  --hi:#f2b705;--hl:rgba(242,183,5,.17);--hl2:rgba(242,183,5,.42);
  --fill-sec:rgba(31,99,198,.16);--fill-sec2:rgba(31,99,198,.30);--fill-mov:rgba(10,127,159,.24);--fill-tri:rgba(201,81,15,.16);
  --ok:#12804f;--no:#c62828;
  --pen1:#d62f2f;--pen2:#1f63c6;--pen3:#12804f;
  /* 다면체의 면과 꼭짓점 */
  --pf-n:#dde6f0;--pf-or:#f6c39a;--pf-tri:#f4d47c;--pf-sq:#a8caf0;--pf-pen:#cdb9ee;--pf-hex:#97d6cd;--pf-etc:#e3c4cf;
  --shd:#0d1b2a;--lit:#ffffff;
  --vc3:#12804f;--vc4:#7442c0;--vc5:#c9510f;
  /* 짓는 면: 관찰(무채), 밑면, 벽, 2층 벽, 지붕 */
  --t-solid:#c3d0e1;--t-base:#8fb4e8;--t-side:#93d0da;--t-side2:#f0cf72;--t-top:#bea8e8;--c-gold:#a87a00;--cut:#d62f2f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* ---------- 색: 칠판(어두운 화면) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2a26;--surface:#213530;--surface-2:#2a413a;--ink:#f0f3ec;--ink-2:#b9c6be;--line:#3e554d;--ghost:#5a716a;
    --accent:#ffd66b;--on-accent:#1b2a26;
    --c-arc:#82bcff;--c-arc2:#6fdbe9;--c-chord:#ffad6b;--c-secant:#caa6ff;--c-center:#86e3ab;
    --hi:#ffe27a;--hl:rgba(255,226,122,.13);--hl2:rgba(255,226,122,.34);
    --fill-sec:rgba(130,188,255,.18);--fill-sec2:rgba(130,188,255,.34);--fill-mov:rgba(111,219,233,.24);--fill-tri:rgba(255,173,107,.2);
    --ok:#86e3ab;--no:#ff8f8f;
    --pen1:#ff9b9b;--pen2:#86c2ff;--pen3:#9bf0bd;
    --pf-n:#46625c;--pf-or:#a5663a;--pf-tri:#97802f;--pf-sq:#3d6c9f;--pf-pen:#6b56a3;--pf-hex:#2c8279;--pf-etc:#8a5b6b;
    --shd:#000000;--lit:#ffffff;
    --vc3:#86e3ab;--vc4:#caa6ff;--vc5:#ffad6b;
    --t-solid:#4f6a77;--t-base:#3e6ca6;--t-side:#2d7b84;--t-side2:#9a7f2e;--t-top:#65539b;--c-gold:#f2cf5b;--cut:#ff7b7b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2a26;--surface:#213530;--surface-2:#2a413a;--ink:#f0f3ec;--ink-2:#b9c6be;--line:#3e554d;--ghost:#5a716a;
  --accent:#ffd66b;--on-accent:#1b2a26;
  --c-arc:#82bcff;--c-arc2:#6fdbe9;--c-chord:#ffad6b;--c-secant:#caa6ff;--c-center:#86e3ab;
  --hi:#ffe27a;--hl:rgba(255,226,122,.13);--hl2:rgba(255,226,122,.34);
  --fill-sec:rgba(130,188,255,.18);--fill-sec2:rgba(130,188,255,.34);--fill-mov:rgba(111,219,233,.24);--fill-tri:rgba(255,173,107,.2);
  --ok:#86e3ab;--no:#ff8f8f;
  --pen1:#ff9b9b;--pen2:#86c2ff;--pen3:#9bf0bd;
  --pf-n:#46625c;--pf-or:#a5663a;--pf-tri:#97802f;--pf-sq:#3d6c9f;--pf-pen:#6b56a3;--pf-hex:#2c8279;--pf-etc:#8a5b6b;
  --shd:#000000;--lit:#ffffff;
  --vc3:#86e3ab;--vc4:#caa6ff;--vc5:#ffad6b;
  --t-solid:#4f6a77;--t-base:#3e6ca6;--t-side:#2d7b84;--t-side2:#9a7f2e;--t-top:#65539b;--c-gold:#f2cf5b;--cut:#ff7b7b;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:clamp(15px,.95vw + .7vh,32px);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
i{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic}

/* ---------- 틀: 위 띠 · 무대 · 아래 띠 ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:.8em;padding:.4em 1em;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:'Noto Serif KR',serif;font-weight:900;font-size:.95em;white-space:nowrap}
.nav{display:flex;gap:.25em;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav>:first-child{margin-left:auto}
.nav>:last-child{margin-right:auto}
.nav button{display:inline-flex;align-items:center;gap:.35em;border:0;background:transparent;border-radius:.55em;padding:.3em .75em;min-height:44px;font-size:.78em;font-weight:600;color:var(--ink-2);white-space:nowrap}
.nav button .n{font-family:'Noto Serif KR',serif;font-weight:900}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="step"]{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;gap:.35em}
.tool{display:inline-flex;align-items:center;gap:.35em;border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.25em .65em;min-height:44px;font-size:.7em;font-weight:600;white-space:nowrap}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ico{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.stage{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2.4vw;padding:2vh 2.8vw;min-height:0}
.stage.wide{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}      /* 설명이 긴 장면 */
.stage.figwide{grid-template-columns:minmax(0,1.6fr) minmax(0,.78fr)}  /* 그림이 주인공인 장면 */
.fig{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.fig>svg{display:block;width:100%;height:100%;overflow:visible}
.fig svg *{pointer-events:none}
.fig svg .grab{pointer-events:auto;cursor:grab;touch-action:none}
.panel{min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:.65em;overflow-y:auto;padding:.2em}
.stage.enter .fig,.stage.enter .panel{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1em;padding:.45em 1em;background:var(--surface);border-top:1px solid var(--line)}
.navbtn{display:inline-flex;align-items:center;gap:.35em;border:1.5px solid var(--line);background:var(--surface);border-radius:.7em;padding:.35em 1.1em;min-height:52px;font-size:.9em;font-weight:700}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.navbtn:disabled{opacity:.35;cursor:default}
.progress{display:flex;justify-content:center;min-width:0}
.dots{display:flex;gap:.45em;align-items:center;min-height:.9em;flex-wrap:wrap;justify-content:center}
.dot{width:.55em;height:.55em;border-radius:50%;background:var(--line);transition:transform .25s,background .25s}
.dot.on{background:var(--accent)}
.dot.cur{transform:scale(1.4)}

/* ---------- 단계 표시 ---------- */
.is-off{opacity:0 !important;pointer-events:none !important}
[data-show],[data-hide],[data-only],[data-ph]{transition:opacity .45s ease}
[data-late]:not(.is-off){transition-delay:1.15s}
[data-late2]:not(.is-off){transition-delay:2.7s}
[data-late3]:not(.is-off){transition-delay:4.2s}
[data-collapse].is-off{display:none}
[data-collapse]:not(.is-off){animation:enter .4s ease both}
[data-collapse][data-late]:not(.is-off){animation-delay:1.15s}
.instant [data-late]:not(.is-off),.instant [data-late2]:not(.is-off),.instant [data-late3]:not(.is-off){transition-delay:0s !important;animation-delay:0s !important}
.no-anim,.no-anim *{transition:none !important}

/* ---------- 설명 칸의 글 ---------- */
.q{margin:0;font-family:'Noto Serif KR',serif;font-weight:900;font-size:1.5em;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--ink-2);font-size:.92em;text-wrap:pretty}
.say{margin:0;font-size:1.05em;line-height:1.65;text-wrap:pretty}
.ask{margin:0;font-size:1.12em;font-weight:700;line-height:1.6;text-wrap:pretty}
.eq2{margin:0;font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-weight:700;font-size:1.25em;line-height:1.5}
.note{margin:0;font-size:.88em;line-height:1.6;color:var(--ink-2);text-wrap:pretty}
.stack{display:flex;flex-direction:column;gap:.5em}
.nw{white-space:nowrap}
.given{display:inline-block;background:var(--surface-2);border-radius:.45em;padding:.12em .6em;font-weight:600}
/* 분수, 색 글자 */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-size:.88em;line-height:1.12;margin:0 .12em}
.fr>span{padding:0 .2em}
.fr>span:first-child{border-bottom:.09em solid currentColor}
.ca{color:var(--accent)}.cn{color:var(--c-center)}.cw{color:var(--c-arc2)}.cl{color:var(--c-arc)}.cr{color:var(--c-chord)}
/* 식 상자, 성질 상자, 답 상자, 핵심 깨달음(상자 없이 강조색 굵은 글) */
.fbox{border:2px solid var(--accent);border-radius:.8em;padding:.45em .9em;display:flex;flex-direction:column;gap:.05em}
.fbox .pl,.prop .pl,.prob .pl{font-weight:800;font-size:.85em;color:var(--accent)}
.fm{margin:0;font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-weight:700;font-size:1.32em;line-height:1.65}
.prop{border:2px solid var(--accent);border-radius:.8em;padding:.5em .9em;display:flex;flex-direction:column;gap:.15em}
.prop p{margin:0;font-size:1.05em;text-wrap:pretty}
.prob{border:1.5px solid var(--line);border-radius:.8em;padding:.45em .9em;display:flex;flex-direction:column;gap:.1em}
.prob p{margin:0;font-size:1em;text-wrap:pretty}
.answer{background:var(--surface-2);border-radius:.8em;padding:.6em .9em;display:flex;flex-direction:column;gap:.25em}
.answer .big{font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-weight:700;font-size:1.45em;line-height:1.3;color:var(--accent)}
.answer .big .nm{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:.68em;font-weight:700;color:var(--ink);margin-left:.4em}
.answer .why{margin:0;font-size:1.02em;line-height:1.7;text-wrap:pretty}
.kkt{margin:0;font-weight:800;font-size:1.12em;line-height:1.5;text-wrap:balance;color:var(--accent)}
/* 표 */
.mt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:1.05em}   /* 표 글자는 뒷자리에서도 읽히게 본문보다 크게 */
.mt th,.mt td{border:1.5px solid var(--line);padding:.35em .4em;text-align:center}
.mt thead th{background:var(--surface-2);font-weight:700}
.mt tbody th{text-align:left;font-weight:700;background:var(--surface)}
/* 복습 문제 */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:1em;font-weight:700;color:var(--ink-2);font-size:.85em}
.ox circle,.ox path{fill:none;stroke:var(--ghost);stroke-width:30;stroke-linecap:round;transition:stroke .4s,opacity .4s}
.fig.rev .ox.ok circle,.fig.rev .ox.ok path{stroke:var(--accent)}
.fig.rev .ox:not(.ok){opacity:.2}

/* ---------- 그림 ---------- */
.base{fill:none;stroke:var(--ink);stroke-width:3.5}
.f-ink{fill:var(--ink)}
.rd{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-family:'Noto Serif KR',Georgia,serif;font-weight:700;fill:var(--ink)}
.tag{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700;fill:var(--ink)}
.num{font-family:'STIX Two Text','Times New Roman',serif;font-weight:600;fill:var(--ink)}
.var{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic;font-weight:600;fill:var(--ink)}
.vi{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic}

/* ---------- 준정다면체 모아 보기 ---------- */
.fig.gal{display:block}
.gallery{width:100%;height:100%;display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:.9em}
.grow{display:grid;grid-template-columns:minmax(5em,9vw) minmax(0,1fr);gap:.9em;min-height:0}
.gpar{display:flex;align-items:center;justify-content:center;gap:.15em;border-radius:.8em;background:var(--surface-2);padding:.3em;min-height:0}
.psv{flex:1 1 0;min-width:0;max-width:7.5em;height:100%;max-height:100%}
.gcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9em;min-height:0}
.gcard{display:flex;flex-direction:column;align-items:center;gap:.3em;min-height:0;min-width:0;border:1.5px solid var(--line);border-radius:.8em;background:var(--surface);padding:.3em .25em .45em;color:var(--ink)}
.gcard:hover{border-color:var(--accent);background:var(--surface-2)}
.gsv{flex:1 1 0;min-height:0;width:100%;height:100%}
.gn{font-weight:800;font-size:1.15em;line-height:1.2;text-align:center;word-break:keep-all}
.gp{display:flex;justify-content:center;gap:.9em;flex-wrap:wrap;font-size:1.05em;font-weight:700;color:var(--ink-2)}
.pc{display:inline-flex;align-items:center;gap:.25em;white-space:nowrap}
.pc b{font-family:'STIX Two Text','Times New Roman',serif;font-size:1.2em;color:var(--ink)}
.pshp{width:1.35em;height:1.35em;flex-shrink:0}
.q.big{font-size:2.1em}
.sub.fam{font-size:1.02em;font-weight:600}
.chips{display:flex;flex-direction:column;gap:.45em}
.chip{display:inline-flex;align-items:center;gap:.45em;font-size:1.2em;font-weight:700}
.chip b{font-family:'STIX Two Text','Times New Roman',serif;font-size:1.3em;margin-left:.2em}
.chip .u{font-weight:600;color:var(--ink-2)}
.shp{width:1.5em;height:1.5em;flex-shrink:0}
.vconf{display:flex;flex-direction:column;gap:.4em;margin-top:.5em;padding-top:.7em;border-top:1.5px solid var(--line)}
.vl{font-weight:700;color:var(--ink-2)}
.vic{display:flex;gap:.3em;flex-wrap:wrap}
.vshp{width:2.5em;height:2.5em}
.kbtn.pri[aria-pressed="true"]{color:var(--on-accent)}
/* ---------- 정다면체 짓기에서 더한 것 ---------- */
.drag3d{fill:transparent}
.fig.app3d{flex-direction:column;align-items:stretch;gap:.45em}
.fig.app3d>svg{flex:1 1 0;min-height:0;height:auto;width:100%}
.kbar{display:flex;align-items:center;justify-content:center;gap:.6em 1.4em;flex-wrap:wrap;font-size:.8em}
.kgrp{display:inline-flex;align-items:center;gap:.5em;flex-wrap:wrap;justify-content:center}
.kbtn{display:inline-flex;align-items:center;gap:.4em;min-height:50px;border:1.5px solid var(--line);border-radius:.75em;background:var(--surface);padding:0 .85em;font-weight:700}
.kbtn:hover{background:var(--surface-2)}
.kbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kbtn.pri{border:2.5px solid var(--accent);color:var(--accent);min-width:9.5em;justify-content:center}
.kbtn:disabled{opacity:.4;cursor:default}
.kbtn.pri:disabled{border-color:var(--line);color:var(--ink-2)}
.kl{font-weight:700;color:var(--ink-2)}
.rng{display:inline-flex;align-items:center;gap:.6em;min-height:50px;padding:0 1em;border:1.5px solid var(--line);border-radius:.75em;background:var(--surface)}
.rng input{width:min(240px,24vw);height:44px;accent-color:var(--accent);cursor:pointer;margin:0}
@keyframes pop{from{opacity:0;transform:translateY(.35em) scale(.8)}to{opacity:1;transform:none}}
.stage.solo{grid-template-columns:minmax(0,1fr)}     /* 그림만 크게 */
.pips{display:inline-flex;align-items:center;gap:.4em;padding:0 .35em}   /* 쌓은 층 */
.pip{width:1.05em;height:1.05em;border-radius:50%;box-sizing:border-box;border:2.5px solid var(--accent);transition:background .3s ease}
.pip.on{background:var(--accent)}
.stage.solo .panel{display:none}
/* 펼치기: 여러 가지 전개도 고르기 */
.netstrip{display:flex;justify-content:center;gap:.4em;flex-wrap:wrap}
.nt{position:relative;display:block;width:clamp(64px,6.4vw,124px);padding:.15em;border:2px solid var(--line);border-radius:.55em;background:var(--surface);min-height:44px}
.nt svg{display:block;width:100%;height:auto;aspect-ratio:150/96}

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches: false });
  const RM = false;   // 수업용 움직임은 기기의 '동작 줄이기' 설정과 상관없이 항상 보여 준다
  const NS = 'http://www.w3.org/2000/svg';
  const FIG = $('#fig'), PANEL = $('#panel'), STAGE = $('#stage');
  const state = { si: 0, step: 0 };

  /* ---------- 기하 (각은 도, 시계 반대 방향, 0°는 오른쪽) ---------- */
  const rad = d => d * Math.PI / 180;
  const n2 = v => Math.round(v * 100) / 100;
  const lerp = (a, b, u) => a + (b - a) * u;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const P = (cx, cy, r, d) => [n2(cx + r * Math.cos(rad(d))), n2(cy - r * Math.sin(rad(d)))];
  const spanOf = (a1, a2, ccw) => { const s = ccw ? a2 - a1 : a1 - a2; return ((s % 360) + 360) % 360; };
  const arcD = (cx, cy, r, a1, a2, ccw = true) => {
    const p = P(cx, cy, r, a1), q = P(cx, cy, r, a2);
    return `M ${p[0]} ${p[1]} A ${n2(r)} ${n2(r)} 0 ${spanOf(a1, a2, ccw) > 180 ? 1 : 0} ${ccw ? 0 : 1} ${q[0]} ${q[1]}`;
  };
  const seg = (p, q) => `M ${n2(p[0])} ${n2(p[1])} L ${n2(q[0])} ${n2(q[1])}`;
  const ease = u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);

  /* ---------- SVG 조각 ---------- */
  const svgWrap = (body, label, w = 600, h = 460) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${body}</svg>`;
  const stroke = (d, c, w, extra = '') => `<path d="${d}" class="rd" style="stroke:var(${c});stroke-width:${w}" ${extra}></path>`;
  const txt = cls => (x, y, t, s, a = 'start', c = '', extra = '') =>
    `<text x="${n2(x)}" y="${n2(y)}" class="${cls}" font-size="${s}" text-anchor="${a}"${c ? ` style="fill:var(${c})"` : ''} ${extra}>${t}</text>`;
  const lbl = txt('lbl'), tag = txt('tag'), num = txt('num'), vr = txt('var');

  /* ---------- 설명 칸의 수식 조각 ---------- */
  const I = ch => `<i>${ch}</i>`;
  const FR = (a, b, cls = '') => `<span class="fr${cls ? ' ' + cls : ''}"><span>${a}</span><span>${b}</span></span>`;

  /* ---------- 단계 엔진 ---------- */
  function drawIn(el, ms = 900) {                  // 선이 그려지며 나타나기
    if (RM || !el || typeof el.getTotalLength !== 'function') return;
    let len = 0;
    try { len = el.getTotalLength(); } catch (e) { return; }
    if (!(len > 0)) return;
    clearTimeout(el._dt);
    el.style.transition = 'none';
    el.style.strokeDasharray = `${len} ${len}`;
    el.style.strokeDashoffset = `${len}`;
    el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset ${ms}ms ease-in-out, opacity .45s ease`;
    el.style.strokeDashoffset = '0';
    el._dt = setTimeout(() => { el.style.transition = ''; el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; }, ms + 80);
  }
  const drawAll = root => {
    if (!root) return;
    if (root.hasAttribute('data-draw')) drawIn(root);
    $$('[data-draw]', root).forEach(x => drawIn(x));
  };
  function applyStep(root, step, prev) {
    $$('[data-show],[data-hide],[data-only]', root).forEach(el => {
      const s = el.getAttribute('data-show'), h = el.getAttribute('data-hide'), o = el.getAttribute('data-only');
      let vis = true;
      if (s !== null && step < Number(s)) vis = false;
      if (h !== null && step >= Number(h)) vis = false;
      if (o !== null && !o.split(',').map(Number).includes(step)) vis = false;
      const wasOff = el.classList.contains('is-off');
      el.classList.toggle('is-off', !vis);
      if (vis && wasOff && step > prev) drawAll(el);
    });
  }
  function tween(ms, fn, done) {                   // 0→1로 움직이기. 돌려받은 함수를 부르면 멈춘다
    if (RM || !(ms > 0)) { fn(1); if (done) done(); return () => {}; }
    let alive = true, fin = false, wd = 0;
    const t0 = performance.now();
    const finish = () => { if (!alive || fin) return; fin = true; clearTimeout(wd); fn(1); if (done) done(); };
    const tick = now => {
      if (!alive || fin) return;
      const u = Math.min(1, Math.max(0, (now - t0) / ms));
      if (u >= 1) { finish(); return; }
      fn(ease(u));
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    wd = setTimeout(finish, ms + 700);           // 화면이 잠시 멈춰도 끝 상태로 마무리
    return () => { alive = false; clearTimeout(wd); };
  }

  const V3 = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: a => Math.hypot(a[0], a[1], a[2]),
    unit: a => { const L = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / L, a[1] / L, a[2] / L]; },
    lerp: (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u],
    avg: ps => { const s = [0, 0, 0]; ps.forEach(p => { s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; }); return [s[0] / ps.length, s[1] / ps.length, s[2] / ps.length]; }
  };
  const QT = {
    id: () => [1, 0, 0, 0],
    mul: (a, b) => [
      a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
      a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
      a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
      a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]],
    norm: q => { const L = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / L, q[1] / L, q[2] / L, q[3] / L]; },
    axis: (ax, ang) => { const u = V3.unit(ax), s = Math.sin(ang / 2); return [Math.cos(ang / 2), u[0] * s, u[1] * s, u[2] * s]; },
    rot: (q, v) => {
      const [w, x, y, z] = q, tx = 2 * (y * v[2] - z * v[1]), ty = 2 * (z * v[0] - x * v[2]), tz = 2 * (x * v[1] - y * v[0]);
      return [v[0] + w * tx + (y * tz - z * ty), v[1] + w * ty + (z * tx - x * tz), v[2] + w * tz + (x * ty - y * tx)];
    },
    mat: q => {
      const [w, x, y, z] = q;
      return [[1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y)],
        [2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x)],
        [2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y)]];
    },
    slerp: (a, b, t) => {
      let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3], bb = b;
      if (d < 0) { d = -d; bb = b.map(x => -x); }
      if (d > 0.9995) return QT.norm(a.map((x, i) => x + (bb[i] - x) * t));
      const th = Math.acos(Math.min(1, d)), s = Math.sin(th), wa = Math.sin((1 - t) * th) / s, wb = Math.sin(t * th) / s;
      return a.map((x, i) => x * wa + bb[i] * wb);
    },
    fromTo: (u, v) => {
      const a = V3.unit(u), b = V3.unit(v), c = V3.dot(a, b);
      if (c < -0.99999) { const p = Math.abs(a[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0]; return QT.axis(V3.cross(a, p), Math.PI); }
      const x = V3.cross(a, b);
      return QT.norm([1 + c, x[0], x[1], x[2]]);
    }
  };
  // 점 p를 점 o를 지나고 방향이 u(단위)인 축 둘레로 th만큼 돌리기
  const rotAxis = (p, o, u, th) => {
    const d = V3.sub(p, o), c = Math.cos(th), s = Math.sin(th), k = V3.dot(u, d) * (1 - c), x = V3.cross(u, d);
    return [o[0] + d[0] * c + x[0] * s + u[0] * k, o[1] + d[1] * c + x[1] * s + u[1] * k, o[2] + d[2] * c + x[2] * s + u[2] * k];
  };
  const rotVec = (v, u, th) => rotAxis(v, [0, 0, 0], u, th);

  /* ---------- 볼록 다면체: 꼭짓점 좌표로 면 찾기 (면은 바깥에서 보아 시계 반대 방향) ---------- */
  function hull(V) {
    const n = V.length, faces = [], keys = new Set(), eps = 1e-6;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) {
      let nr = V3.cross(V3.sub(V[j], V[i]), V3.sub(V[k], V[i]));
      const L = V3.len(nr);
      if (L < 1e-9) continue;
      nr = V3.mul(nr, 1 / L);
      let d = V3.dot(nr, V[i]), pos = false, neg = false;
      const on = [];
      for (let p = 0; p < n; p++) {
        const s = V3.dot(nr, V[p]) - d;
        if (s > eps) pos = true; else if (s < -eps) neg = true; else on.push(p);
        if (pos && neg) break;
      }
      if (pos && neg) continue;
      if (pos) { nr = V3.mul(nr, -1); d = -d; }
      const key = on.join(',');
      if (keys.has(key)) continue;
      keys.add(key);
      const c = V3.avg(on.map(p => V[p])), a = V3.unit(V3.sub(V[on[0]], c)), b = V3.cross(nr, a);
      on.sort((p, q) => {

  /* ---------- 다면체 꼭짓점 좌표 ---------- */

  /* =========================================================

  const SOLIDS = {

  /* ---------- 짓는 단계 ----------

    // 보여 주는 단계(층): 밑면 하나, 그 위로 한 층씩. 점에서 시작하면 그 점과 첫 층을 한 단계로 묶는다.

    const mk = sis => {

      sis.forEach(si => {

        else if (st.kind === 'base') o.base.push(...st.edges);

    if (key === 'dodeca') layers[2].cover = true;    // 그릇(밑면 + 둘레 5개) 위에 같은 그릇을 뒤집어 덮는다
    if (key === 'icosa') {                           // 꼭짓점 둘레 5개 + 그것과 맞닿은 5개, 그 위에 같은 모양을 뒤집어 덮는다
      const L0 = layers[0], L1 = layers[1], L2 = layers[2];
      const up = L1.faces.filter(fi => L0.faces.some(g => shareEdge(F, fi, g)));
      layers[1] = { base: [], pil: L1.pil, ring: [], faces: up, pt: -1, cover: false };
      layers[2] = { base: [], pil: L2.pil, ring: L1.ring, faces: [...L1.faces.filter(fi => !up.includes(fi)), ...L2.faces], pt: -1, cover: true };

    // 그 층 안에서 모서리가 그려지는 때 [t0, t1]과 방향(s → e), 면이 다 둘러싸이는 때 tc (0~1)

    layers.forEach((l, L) => {
      if (l.cover) { [...l.pil, ...l.ring].forEach(ei => { eT[ei] = { L, t0: 0, t1: 0.001, s: E[ei].a, e: E[ei].b }; }); return; }
      const pe = l.pt >= 0 ? 0.42 : 0.38;
      l.pil.forEach(ei => { const e = E[ei], lo = V[e.a][1] < V[e.b][1] ? e.a : e.b; eT[ei] = { L, t0: l.pt >= 0 ? 0.1 : 0, t1: pe, s: lo, e: lo === e.a ? e.b : e.a }; });

      E.forEach((e, ei) => { if (e.f.includes(fi) && eT[ei].L === L) tc = Math.max(tc, eT[ei].t1); });

    const grp = new Map();
    fT.forEach((t, fi) => { if (layers[t.L].cover) return; const k = `${t.L}:${t.tc.toFixed(3)}`; if (!grp.has(k)) grp.set(k, []); grp.get(k).push(fi); });
    grp.forEach(list => { if (list.length > 1) list.sort((a, b) => around(ang(F[a].c)) - around(ang(F[b].c))).forEach((fi, j) => { fT[fi].tc += 0.075 * j; }); });

      cand.forEach(phi => {
        const a = [Math.cos(phi), 0, Math.sin(phi)];

      });

  }

  /* ---------- 전개도: 면마다 부모 면과 붙어 있는 모서리(경첩) ----------
     짓는 순서를 따라 붙인다. 밑면이 있으면 밑면이 뿌리, 없으면 앞쪽의 벽이 뿌리. */
  function shareEdge(F, a, b) {
    const A = F[a].v, B = F[b].v;
    for (let t = 0; t < A.length; t++) {

  }
  function netTree(S, stages, F) {

    const front = list => list.slice().sort((a, b) => F[b].c[2] - F[a].c[2])[0];
    const near = (list, f) => list.filter(g => g !== f && shareEdge(F, g, f));
    const chain = (list, start) => {                 // 이웃한 면을 따라 한 방향으로 잇기
      const done = new Set([start]);
      let cur = start;
      while (done.size < list.length) {
        const nb = near(list, cur).filter(g => !done.has(g));
        if (!nb.length) break;
        const ang = f => Math.atan2(F[f].c[0], F[f].c[2]), d = f => (((ang(f) - ang(cur)) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const nx = nb.sort((a, b) => d(a) - d(b))[0];   // 늘 같은 방향(위에서 보아 시계 반대 방향)으로
        parent[nx] = cur; done.add(nx); cur = nx;

    let root;
    if (S.key === 'tetra' || S.key === 'cube') {
      root = base.faces[0];
      W(1).forEach(f => { parent[f] = root; });
      if (roof) parent[roof.faces[0]] = front(W(1).filter(f => shareEdge(F, f, roof.faces[0])));   // 지붕은 앞쪽 벽에
    } else if (S.key === 'dodeca') {

      const wf = front(W(1)), u0 = front(near(W(2), wf)), rf = roof.faces[0];
      parent[u0] = wf; parent[rf] = u0;

    } else if (S.key === 'octa') {
      root = front(W(1));
      chain(W(1), root);
      const u0 = W(2).find(f => shareEdge(F, f, root));
      parent[u0] = root;
      chain(W(2), u0);
    } else if (S.key === 'icosa') {
      root = front(W(2));
      chain(W(2), root);
      [...W(1), ...W(3)].forEach(f => { parent[f] = W(2).find(g => shareEdge(F, g, f)); });
    }
    return makeNet(S, root, parent);
  }
  // 전개도 하나 = 뿌리 면 + 면마다 부모 면(붙어 있는 이웃). 경첩(붙어 있는 모서리)과 펼칠 때 돌릴 각, 떼어 낼 모서리
  function makeNet(S, root, parent) {
    const F = S.F;
    const hinge = F.map((f, i) => {
      if (parent[i] < 0) return null;
      const [a, b] = shareEdge(F, i, parent[i]), u = V3.unit(V3.sub(S.V[b], S.V[a])), nF = F[i].n, nG = F[parent[i]].n;
      return { a, b, u, th: Math.atan2(V3.dot(u, V3.cross(nF, nG)), V3.dot(nF, nG)) };
    });
    const kept = new Set(hinge.filter(Boolean).map(h => `${Math.min(h.a, h.b)}-${Math.max(h.a, h.b)}`));
    const cut = S.E.map(e => !kept.has(`${e.a}-${e.b}`));     // 모서리마다: 떼어 내면 true
    return { root, parent, hinge, cut };
  }
  // u = 0(접힌 입체) ~ 1(다 펼친 전개도). 다 펼치면 뿌리 면이 바닥(y가 가장 작은 쪽)에 눕는다.

    const { V, F } = P, { root, parent, hinge } = net;
    const nr = F[root].n, qg = QT.slerp(QT.id(), QT.fromTo(nr, [0, -1, 0]), u), cr = F[root].c;
    return F.map((f, i) => {
      let pts = f.v.map(j => V[j]), nn = f.n;
      for (let k = i; parent[k] >= 0; k = parent[k]) {
        const h = hinge[k], o = V[h.a];
        pts = pts.map(p => rotAxis(p, o, h.u, u * h.th));
        nn = rotVec(nn, h.u, u * h.th);
      }
      pts = pts.map(p => V3.add(QT.rot(qg, V3.sub(p, cr)), cr));
      return { i, pts, n: QT.rot(qg, nn) };
    });
  }

  /* ---------- 여러 가지 전개도 (gen_nets.js로 미리 찾아 둔 것: 뿌리 면과 면마다 부모 면) ----------
     정사면체 2가지, 정육면체 11가지, 정팔면체 11가지는 모두. 정십이면체·정이십면체는 길게 뻗은 것부터 둥글게 모인 것까지 고른 8가지.
     맨 앞은 쌓은 순서대로 펼친 전개도. */
  const NET_LIB = {"tetra":[{"root":0,"parent":[-1,0,0,0]},{"root":2,"parent":[2,3,-1,2]}],"cube":[{"root":0,"parent":[-1,0,0,0,0,3]},{"root":0,"parent":[-1,0,0,0,3,3]},{"root":1,"parent":[2,-1,1,1,3,1]},{"root":3,"parent":[3,3,0,-1,0,1]},{"root":4,"parent":[3,5,4,4,-1,4]},{"root":5,"parent":[3,2,5,5,2,-1]},{"root":5,"parent":[1,5,1,4,5,-1]},{"root":3,"parent":[1,3,4,-1,5,3]},{"root":1,"parent":[2,-1,1,1,5,3]},{"root":0,"parent":[-1,2,0,1,0,4]},{"root":2,"parent":[2,0,-1,5,3,2]}],"octa":[{"root":3,"parent":[2,0,3,-1,6,4,7,3]},{"root":4,"parent":[4,5,6,2,-1,4,4,5]},{"root":0,"parent":[-1,0,0,1,6,1,2,6]},{"root":0,"parent":[-1,3,0,2,0,4,2,6]},{"root":0,"parent":[-1,0,0,2,0,1,2,6]},{"root":0,"parent":[-1,0,0,2,0,1,2,3]},{"root":7,"parent":[2,5,6,1,6,7,7,-1]},{"root":6,"parent":[4,5,3,7,6,4,-1,6]},{"root":6,"parent":[4,3,0,7,6,4,-1,6]},{"root":4,"parent":[4,0,3,7,-1,1,4,6]},{"root":1,"parent":[4,-1,0,1,5,1,7,3]}],"dodeca":[{"root":0,"parent":[-1,0,0,0,0,0,11,11,11,11,3,10]},{"root":6,"parent":[3,6,9,7,10,6,-1,6,10,6,7,7]},{"root":1,"parent":[2,-1,1,4,2,1,11,11,2,1,8,9]},{"root":5,"parent":[5,0,8,4,0,-1,5,5,9,6,4,6]},{"root":11,"parent":[4,2,9,4,2,7,9,10,11,11,8,-1]},{"root":2,"parent":[4,2,-1,7,10,7,1,6,2,1,11,8]},{"root":4,"parent":[3,6,0,7,-1,3,9,10,4,11,4,8]},{"root":7,"parent":[5,6,4,7,0,3,9,-1,10,8,11,7]}],"icosa":[{"root":7,"parent":[5,6,8,16,17,7,10,-1,9,5,17,7,10,8,9,13,13,18,16,18]},{"root":7,"parent":[5,6,8,4,1,7,7,-1,9,5,6,7,11,8,11,14,18,10,19,12]},{"root":0,"parent":[-1,0,0,2,1,0,1,6,13,5,6,12,10,16,9,13,3,4,16,18]},{"root":10,"parent":[1,4,0,4,17,0,10,11,9,14,-1,12,10,16,11,14,18,10,17,12]},{"root":10,"parent":[1,4,3,4,17,9,10,11,13,14,-1,12,10,16,15,19,3,10,17,12]},{"root":9,"parent":[2,0,8,2,1,0,7,5,9,-1,12,14,11,8,9,14,18,10,17,15]},{"root":19,"parent":[5,0,8,2,3,9,7,5,13,14,12,12,19,16,11,19,18,18,19,-1]},{"root":3,"parent":[2,0,8,-1,3,0,1,6,13,8,12,14,11,16,15,19,3,4,17,18]}]};

  /* ---------- 준정다면체 (관찰하고 세기만 한다) ----------
     두 가지 이상의 정다각형으로 둘러싸이고, 모든 꼭짓점의 모양이 같은 다면체. 꼭짓점 좌표로 면을 찾는다. */
  const SQ2 = Math.SQRT2;
  const perm3 = p => [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]].map(o => o.map(i => p[i]));
  const SEMI = {
    ttet: { name: '깎은 정사면체', down: 6, raw: () => perm3([3, 1, 1]).flatMap(p => sgn(p)).filter(p => p.filter(x => x < 0).length % 2 === 0) },
    cocta: { name: '육팔면체', down: 4, raw: () => cyc(sgn([1, 1, 0])) },
    tcube: { name: '깎은 정육면체', down: 8, raw: () => cyc(sgn([SQ2 - 1, 1, 1])) },
    tocta: { name: '깎은 정팔면체', down: 4, raw: () => perm3([0, 1, 2]).flatMap(p => sgn(p)) },
    rcocta: { name: '마름모육팔면체', down: 4, raw: () => cyc(sgn([1, 1, 1 + SQ2])) },
    idod: { name: '십이이십면체', down: 5, raw: () => cyc(sgn([0, 0, PHI])).concat(cyc(sgn([0.5, PHI / 2, PHI * PHI / 2]))) },
    tico: { name: '깎은 정이십면체', down: 5, raw: () => RAW.tico() }
  };
  const SEMI_ORDER = ['ttet', 'cocta', 'tcube', 'tocta', 'rcocta', 'idod', 'tico'];
  const SHAPE_OF_N = { 3: '정삼각형', 4: '정사각형', 5: '정오각형', 6: '정육각형', 8: '정팔각형', 10: '정십각형' };
  function semiOf(key) {
    const sd = SEMI[key];
    let V = uniqP(sd.raw());
    const c0 = V3.avg(V);
    V = V.map(p => V3.sub(p, c0));
    let F = hull(V), E = edgesOf(V, F);
    const s = 1 / V3.len(V3.sub(V[E[0].a], V[E[0].b]));
    V = V.map(p => V3.mul(p, s));
    const f0 = F.find(f => f.v.length === sd.down) || F[0];
    let q = QT.fromTo(f0.n, [0, -1, 0]);              // 고른 모양의 면을 바닥에
    V = V.map(p => QT.rot(q, p));
    const ymin = Math.min(...V.map(p => p[1]));
    const low = V.map((p, i) => i).filter(i => V[i][1] < ymin + 1e-6).sort((a, b) => Math.atan2(V[a][2], V[a][0]) - Math.atan2(V[b][2], V[b][0]));
    const ref = V3.avg([V[low[0]], V[low[1]]]);
    q = QT.axis([0, 1, 0], -Math.atan2(ref[0], ref[2]));   // 바닥 면의 한 변이 앞을 향하게
    V = V.map(p => QT.rot(q, p));
    const ym = Math.min(...V.map(p => p[1]));
    V = V.map(p => [p[0], p[1] - ym, p[2]]);
    F = hull(V);
    F.forEach(f => { f.c = V3.avg(f.v.map(i => V[i])); f.name = SHAPE_OF_N[f.v.length]; });
    E = edgesOf(V, F);
    const vf = V.map(() => []);
    F.forEach((f, fi) => f.v.forEach(i => vf[i].push(fi)));
    return Object.assign({ key, semi: true, sd: { name: sd.name }, V, F, E, vf }, shapeInfo(F, vf));
  }
  // 면의 모양별 개수, 한 꼭짓점에 모인 면의 모양별 개수
  function shapeInfo(F, vf, name) {
    const nm = i => F[i].name || name;
    const classes = [];
    F.forEach((f, i) => { const c = classes.find(x => x.name === nm(i)); if (c) c.count++; else classes.push({ name: nm(i), count: 1 }); });
    classes.sort((a, b) => F.find((f, i) => nm(i) === a.name).v.length - F.find((f, i) => nm(i) === b.name).v.length);
    const vconf = classes.map(c => ({ name: c.name, count: vf[0].filter(i => nm(i) === c.name).length })).filter(c => c.count > 0);
    return { classes, vconf };

  /* =========================================================
     그림: 정사영 카메라, 짓는 그림, 전개도
     면은 앞면·뒷면을 가려 칠하고(뒤쪽 안쪽 면은 어둡게), 앞면에 가려진 모서리와 꼭짓점은 점선·빈 동그라미로 그린다.
     ========================================================= */
  const LIGHT = V3.unit([-0.38, 0.8, 0.5]);
  const Q_VIEW = QT.mul(QT.axis([1, 0, 0], rad(20)), QT.axis([0, 1, 0], rad(-18)));   // 처음 보는 방향: 조금 위, 조금 옆
  function camera(q, S, cx, cy, tg) {
    const M = QT.mat(q);
    const rot = v => [M[0][0] * v[0] + M[0][1] * v[1] + M[0][2] * v[2], M[1][0] * v[0] + M[1][1] * v[1] + M[1][2] * v[2], M[2][0] * v[0] + M[2][1] * v[1] + M[2][2] * v[2]];

    return { q, rot, scr, S };

  const inPoly = (q, pp) => {                       // 점 q가 다각형 pp 안에 있는가

    for (let i = 0, j = pp.length - 1; i < pp.length; j = i++) {
      const a = pp[i], b = pp[j];
      if ((a[1] > q[1]) !== (b[1] > q[1]) && q[0] < (b[0] - a[0]) * (q[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;

  function faceSVG(d, tok, nv, front, op = 1) {     // 바탕색 + 빛을 덜 받는 만큼 어둡게 (안쪽이 보이는 면은 더 어둡게)
    const l = V3.dot(front ? nv : V3.mul(nv, -1), LIGHT);
    const a = Math.max(0, Math.min(0.6, (0.95 - l) * 0.24 + (front ? 0 : 0.22)));
    const s = `<path d="${d}" style="fill:var(${tok})"></path>` + (a > 0.01 ? `<path d="${d}" style="fill:var(--shd);opacity:${n2(a)}"></path>` : '');
    return op < 0.999 ? `<g opacity="${n2(op)}">${s}</g>` : s;
  }

  /* ---------- 짓는 그림 ----------
     lp[층] = 0~1. 층마다 모서리가 아래에서 자라 오르고 둘레를 따라 이어지며, 모서리로 다 둘러싸인 면은 저절로 채워진다.
     꼭짓점은 찍지 않는다(점에서 시작하는 정팔면체·정이십면체만 처음 점을 잠깐 보여 준다).

  function buildSVG(P, cm, lp, o = {}) {
    const { V, F, E } = P, ew = o.ew || 3;
    const faces = [];
    F.forEach((f, i) => {
      const T = P.fT[i], g = lp[T.L];
      if (!(g > 0)) return;
      const op = g >= 1 ? 1 : Math.max(0, Math.min(1, (g - T.tc) / 0.1));
      if (op <= 0.001) return;
      const pp = f.v.map(j => cm.scr(V[j])), nv = cm.rot(f.n), st = P.stages[P.fStage[i]];
      faces.push({ i, pp, nv, fr: nv[2] > 1e-6, op, z: cm.rot(f.c)[2], tok: o.fill ? o.fill(st, i) : st.ftok });
    });
    faces.sort((a, b) => a.z - b.z);
    const occ = faces.filter(f => f.fr && f.op >= 0.5);
    const hidden = (s, skip) => occ.some(f => !skip.includes(f.i) && inPoly(s, f.pp));
    let bf = '', ff = '';
    faces.forEach(f => { const s = faceSVG(pathOf(f.pp), f.tok, f.nv, f.fr, f.op); if (f.fr) ff += s; else bf += s; });
    let he = '', ve = '';
    const drawEdge = (p, q, w, adj) => {                // 잘게 나누어 앞면에 가려진 부분은 점선으로
      const N = 14, sp = cm.scr(p), sq = cm.scr(q);
      let runs = [], cur = null;
      for (let k = 0; k < N; k++) {
        const t0 = k / N, t1 = (k + 1) / N, m = cm.scr(V3.lerp(p, q, (t0 + t1) / 2)), h = hidden(m, adj);
        if (!cur || cur.h !== h) { cur = { h, t0, t1 }; runs.push(cur); } else cur.t1 = t1;
      }
      runs.forEach(r => {
        const a = [lerp(sp[0], sq[0], r.t0), lerp(sp[1], sq[1], r.t0)], b = [lerp(sp[0], sq[0], r.t1), lerp(sp[1], sq[1], r.t1)];
        if (r.h) he += seg(a, b) + ' '; else ve += seg(a, b) + ' ';

    };
    E.forEach((e, ei) => {
      const T = P.eT[ei], g = lp[T.L];
      if (!(g > 0)) return;
      const pr = g >= 1 ? 1 : Math.max(0, Math.min(1, (g - T.t0) / (T.t1 - T.t0)));
      if (pr <= 0) return;
      drawEdge(V[T.s], V3.lerp(V[T.s], V[T.e], ease(pr)), ew, e.f);
    });
    let dot = '';
    if (P.pt0 >= 0 && lp[0] > 0 && lp[0] < 1) {          // 시작하는 점
      const g = lp[0], s = cm.scr(V[P.pt0]), r = 8 * Math.min(1, g / 0.08), op = g > 0.8 ? (1 - g) / 0.2 : 1;
      dot = `<circle cx="${n2(s[0])}" cy="${n2(s[1])}" r="${n2(r)}" style="fill:var(--ink)" opacity="${n2(op)}"></circle>`;
    }
    he = he ? stroke(he, '--ink', n2(ew * 0.55), 'stroke-dasharray="7 7" opacity="0.7"') : '';   // 가려진 모서리는 점선 하나로, 보이는 모서리는 선 하나로
    ve = ve ? stroke(ve, '--ink', ew) : '';
    return bf + ff + he + ve + dot;
  }
  const FULL = P => P.layers.map(() => 1);

  /* ---------- 덮는 층: 앞에서 쌓은 것과 같은 모양이 하나 더 떠올라 뒤집히고 내려앉는다 ----------
     g = 0~1. 0~0.22 쌓아 둔 모양 그대로 하나가 위로 떠오름 → 0.22~0.6 가로 축으로 뒤집힘 → 0.6~1 내려앉아 덮음 */
  const c01 = x => Math.max(0, Math.min(1, x));
  function coverPose(P, g) {
    const cv = P.cover, th = Math.PI * ease(c01((g - 0.22) / 0.38));
    const up = [0, cv.h * (g < 0.6 ? ease(c01(g / 0.22)) : 1 - ease(c01((g - 0.6) / 0.4))), 0];
    return cv.faces.map(fi => {
      const f = P.F[fi];
      return { i: fi, pts: f.v.map(j => V3.add(rotAxis(P.V[j], cv.C, cv.axis, Math.PI + th), up)), n: rotVec(f.n, cv.axis, Math.PI + th), op: c01(g / 0.06) };

  function coverSVG(P, cm, moving) {                // 움직이는 동안은 면을 뒤에서부터 칠하고 테두리를 두른다
    const below = P.F.map((f, i) => i).filter(i => P.fT[i].L < P.cover.L).map(i => ({ i, pts: P.F[i].v.map(j => P.V[j]), n: P.F[i].n, op: 1 }));
    return below.concat(moving).map(f => { const pp = f.pts.map(cm.scr), nv = cm.rot(f.n); return Object.assign({}, f, { pp, nv, z: pp.reduce((a, p) => a + p[2], 0) / pp.length }); })
      .sort((a, b) => a.z - b.z)
      .map(f => {
        const st = P.stages[P.fStage[f.i]], d = pathOf(f.pp);
        const s = faceSVG(d, st.ftok, f.nv, f.nv[2] > 0, 1) + `<path d="${d}" style="fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round"></path>`;
        return f.op < 0.999 ? `<g opacity="${n2(f.op)}">${s}</g>` : s;
      }).join('');
  }

  /* ---------- 전개도: 면을 뒤에서부터 칠하고 테두리를 두른다 ---------- */
  function netSVG(P, cm, u, o = {}) {
    if (u < 0.004) return buildSVG(P, cm, FULL(P));
    const N = netPose(P, u).map(f => { const pp = f.pts.map(cm.scr), nv = cm.rot(f.n); return { f, pp, nv, z: pp.reduce((a, p) => a + p[2], 0) / pp.length }; });
    N.sort((a, b) => a.z - b.z);
    return N.map(({ f, pp, nv }) => {
      const st = P.stages[P.fStage[f.i]], fr = nv[2] > 0, d = pathOf(pp);
      return faceSVG(d, o.fill ? o.fill(st, f.i) : st.ftok, fr ? nv : V3.mul(nv, -1), true, 1) + `<path d="${d}" style="fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round"></path>`;   // 펼치는 동안 뒤집혀 보이는 면도 같은 색으로
    }).join('');
  }

  /* ---------- 세어 보기: 누른 면·모서리·꼭짓점에 표시 ----------
     mode 'f' 면, 'e' 모서리, 'v' 꼭짓점. mk = 표시한 것(Set), hov = 가리키는 것, flash = 아직 안 센 것을 잠깐 밝히기 */
  const eKeyOf = P => (P._ek || (P._ek = new Map(P.E.map((e, i) => [`${e.a}-${e.b}`, i]))));
  function countSVG(P, cm, o = {}) {
    const mode = o.mode || '', mk = o.mk || new Set(), hov = o.hov, flash = o.flash, ew = o.ew || 3;
    const { V, F, E } = P, fr = F.map(f => cm.rot(f.n)[2] > 1e-6), pp = V.map(p => cm.scr(p));
    let s = '';
    F.forEach((f, i) => {

    });
    let hid = '', vis = '', mv = '', mh = '', hv = '';
    E.forEach((e, i) => {
      const v = fr[e.f[0]] || fr[e.f[1]], d = seg(pp[e.a], pp[e.b]) + ' ';
      if (mode === 'e' && mk.has(i)) { if (v) mv += d; else mh += d; } else if (v) vis += d; else hid += d;
      if (mode === 'e' && v && (hov === i || (flash && !mk.has(i)))) hv += d;
    });
    if (hid && o.hidden !== false) s += stroke(hid, '--ink', n2(ew * 0.53), 'stroke-dasharray="7 7" opacity="0.5"');
    if (vis) s += stroke(vis, '--ink', ew);
    if (hv) s += stroke(hv, '--hi', 14, 'opacity="0.8"');
    if (mh) s += stroke(mh, '--mk-e', 4, 'stroke-dasharray="9 7" opacity="0.85"');
    if (mv) s += stroke(mv, '--mk-e', 8);
    if (mode === 'v') {
      V.forEach((p, j) => {

    while (R.length > 1) { const a = R[0], b = R[R.length - 1]; if (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) > eps) break; R.pop(); }
    return R;
  }
  // src를 op 방법으로 u(0~1)만큼 깎은 모양 → { V, F:[{v, n, role, k, c}], E:[{a, b, f}], vf }
  function carve(src, op, u) {
    let faces = sourceFaces(src);
    const C = CUT.cut[src][op];
    C.P.forEach(r => {
      const h = r[3] + (r[4] - r[3]) * u;
      if (h < r[3] - 1e-9) faces = clipBy(faces, [r[0], r[1], r[2]], h, r[5], r[6]);
    });

  }
  function weld(faces, eps = 1e-5) {
    const V = [], key = new Map();
    const idx = p => {
      const k = p.map(x => Math.round(x / eps)).join(',');
      if (key.has(k)) return key.get(k);
      // 둥글린 칸 경계에 걸친 점: 가까운 점 찾기
      for (let i = 0; i < V.length; i++) if (Math.abs(V[i][0] - p[0]) < eps && Math.abs(V[i][1] - p[1]) < eps && Math.abs(V[i][2] - p[2]) < eps) { key.set(k, i); return i; }
      V.push(p); key.set(k, V.length - 1); return V.length - 1;
    };
    const F = [];
    faces.forEach(f => {
      let v = f.pts.map(idx);
      v = v.filter((x, i) => x !== v[(i + 1) % v.length]);
      if (v.length >= 3) {
        const c = v.reduce((s, i) => [s[0] + V[i][0] / v.length, s[1] + V[i][1] / v.length, s[2] + V[i][2] / v.length], [0, 0, 0]);
        F.push({ v, n: f.n, role: f.role, k: f.k, c });
      }
    });
    const em = new Map(), E = [];
    F.forEach((f, fi) => f.v.forEach((a, t) => {
      const b = f.v[(t + 1) % f.v.length], k = a < b ? `${a}-${b}` : `${b}-${a}`;
      if (em.has(k)) E[em.get(k)].f.push(fi); else { em.set(k, E.length); E.push({ a: Math.min(a, b), b: Math.max(a, b), f: [fi] }); }
    }));
    E.forEach(e => { if (e.f.length < 2) e.f.push(e.f[0]); });
    const vf = V.map(() => []);
    F.forEach((f, fi) => f.v.forEach(j => vf[j].push(fi)));
    return { V, F, E, vf };
  }

  /* =========================================================
     공통: 이름, 깎기·비틀기 모양, 그림 (수업 화면과 도감 실험실이 함께 씀)
     ========================================================= */
  const SNAME = { tetra: '정사면체', cube: '정육면체', octa: '정팔면체', dodeca: '정십이면체', icosa: '정이십면체' };
  const OPS = [['t', '꼭짓점 깎기'], ['r', '끝까지 깎기'], ['c', '모서리 깎기'], ['o', '모두 깎기'], ['s', '비틀기']];
  const TNAME = {
    ttet: '깎은 정사면체', octa: '정팔면체', cocta: '육팔면체', tocta: '깎은 정팔면체', icosa: '정이십면체',
    tcube: '깎은 정육면체', rcocta: '마름모육팔면체', tcocta: '깎은 육팔면체', scube: '다듬은 육면체',
    tdod: '깎은 정십이면체', idod: '십이이십면체', rid: '마름모십이이십면체', tid: '깎은 십이이십면체', sdod: '다듬은 십이면체', tico: '깎은 정이십면체'
  };
  const FAMS = [
    { name: '정사면체 계열', views: ['tetra'] },
    { name: '정육면체·정팔면체 계열', views: ['cube', 'octa'] },
    { name: '정십이면체·정이십면체 계열', views: ['dodeca', 'icosa'] }
  ];
  // 정사면체 계열에서 나온 도형이 다른 계열의 어디에 있는지: [계열 장면, 단계, 이름표]
  const ELSEWHERE = { octa: [2, 0, '2 계열의 정다면체'], cocta: [2, 3, '2 계열에도 있다'], tocta: [2, 1, '2 계열에도 있다'], icosa: [3, 0, '3 계열의 정다면체'] };
  const KTOK = { 3: '--pf-tri', 4: '--pf-sq', 5: '--pf-pen', 6: '--pf-hex', 7: '--pf-7', 8: '--pf-etc', 10: '--pf-or' };
  const SRCP = {}, FINAL = {};
  Object.keys(SNAME).forEach(s => { SRCP[s] = carve(s, 't', 0); });
  const finalOf = (s, i) => { const k = s + i; return FINAL[k] || (FINAL[k] = carve(s, OPS[i][0], 1)); };
  const toOf = (s, i) => CUT.cut[s][OPS[i][0]].to;
  const maxR = V => Math.max(...V.map(p => Math.hypot(p[0], p[1], p[2])));

  // 끝까지 깎기는 시간 0.5에서 꼭짓점 깎기 모양을 지난다 (정다면체마다 그때의 깎은 정도가 달라도 같은 때에 멈춘다)
  const uOf = (s, oi, tau) => (OPS[oi][0] !== 'r' ? tau : tau <= 0.5 ? markOf(s) * tau / 0.5 : markOf(s) + (1 - markOf(s)) * (tau - 0.5) / 0.5);

  /* ---------- 비틀기: 면을 떼어 밀어내고(0~0.4) 비틀고(0.4~0.7) 틈을 채운다(0.7~1) ---------- */
  const rotAround = (v, n, th) => {
    const c = Math.cos(th), s = Math.sin(th), k = cdot(n, v) * (1 - c), x = ccross(n, v);
    return [v[0] * c + x[0] * s + n[0] * k, v[1] * c + x[1] * s + n[1] * k, v[2] * c + x[2] * s + n[2] * k];

    S0.F.forEach((f, i) => {

      out.push({ pts: P.map(p => { const r = rotAround(csub(p, c0), n, a); return [c0[0] + n[0] * sh + r[0], c0[1] + n[1] * sh + r[1], c0[2] + n[2] * sh + r[2]]; }), n, k: f.length, role: 'o', g: 1 });

  // 다 비튼 모양 (모서리 1, 원래 정다면체와 같은 방향): 틈을 다 채운 면들을 하나로 이은 것
  const SNUBFIN = {};
  const snubFinal = s => SNUBFIN[s] || (SNUBFIN[s] = weld(snubFaces(s, 1).map(f => ({ pts: f.pts, n: f.n, role: f.role, k: f.k })), 1e-5));

  /* ---------- 그림 ---------- */
  function ghostSVG(G, cm, front, fade = 1) {      // 원래 정다면체 (점선). front: true 앞쪽만, false 뒤쪽만, null 모두
    const fr = G.F.map(f => cm.rot(f.n)[2] > 1e-6), pp = G.V.map(p => cm.scr(p));
    let d = '';
    G.E.forEach(e => { if (front === null || (fr[e.f[0]] || fr[e.f[1]]) === front) d += seg(pp[e.a], pp[e.b]) + ' '; });
    const f = front !== false;
    return d ? stroke(d, '--ink-2', f ? 2.2 : 1.6, `stroke-dasharray="${f ? '10 8' : '5 8'}" opacity="${n2((f ? 0.85 : 0.45) * fade)}"`) : '';
  }
  const tokOf = f => (f.role === 'o' ? '--t-solid' : (KTOK[f.k] || '--t-solid'));
  function cutSVG(P, cm, o = {}) {                  // 닫힌 볼록 다면체
    const ew = o.ew || 2.6, mix = o.mix || 0, gf = 1 - 0.5 * mix;
    const fr = P.F.map(f => cm.rot(f.n)[2] > 1e-6), pp = P.V.map(p => cm.scr(p));

    P.F.forEach((f, i) => {
      if (!fr[i]) return;
      const d = pathOf(f.v.map(j => pp[j])), nv = cm.rot(f.n), t0 = tokOf(f), t1 = KTOK[f.v.length];

    P.E.forEach(e => { if (fr[e.f[0]] || fr[e.f[1]]) vis += seg(pp[e.a], pp[e.b]) + ' '; });
    if (vis) s += stroke(vis, '--ink', ew);
    if (o.ghost && !o.ghostBehind) s += ghostSVG(o.ghost, cm, true, gf);

  }
  function snubSVG(F, cm, o = {}) {                 // 떨어져 떠 있는 면들: 뒤에서부터 칠한다 (틈으로 뒷면이 보인다)
    const ew = o.ew || 2.6;
    let s = o.ghost ? ghostSVG(o.ghost, cm, null, 0.75) : '';
    F.map(f => { const pp = f.pts.map(cm.scr); return { f, pp, nv: cm.rot(f.n), z: pp.reduce((a, p) => a + p[2], 0) / pp.length }; })
      .sort((a, b) => a.z - b.z)
      .forEach(({ f, pp, nv }) => {
        const d = pathOf(pp), fr = nv[2] > 0, op = f.g > 0.001 ? 1 : 0;
        let x = faceSVG(d, tokOf(f), nv, fr, 1);
        x += `<path d="${d}" style="fill:none;stroke:var(--ink);stroke-width:${fr ? ew : n2(ew * 0.6)};stroke-linejoin:round"${fr ? '' : ' opacity="0.6"'}></path>`;
        s += op < 0.999 ? `<g opacity="${n2(op)}">${x}</g>` : x;

  }
  const Q_THUMB = QT.mul(QT.axis([1, 0, 0], rad(20)), QT.axis([0, 1, 0], rad(-24)));
  const thumb = (P, mix, w = 160, h = 128) => {
    const f = sphereFit(P.V, [4, 4, w - 8, h - 8], 0.98);
    return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${cutSVG(P, camFit(Q_THUMB, f), { mix, ew: P.V.length > 50 ? 1.1 : 1.5 })}</svg>`;
  };


  /* ---------- 면의 모양 이름 ---------- */
  const KNUM = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const korN = n => (n < 10 ? KNUM[n] : (n >= 20 ? KNUM[Math.floor(n / 10)] : '') + '십' + KNUM[n % 10]);
  const polyName = (k, reg) => `${reg ? '정' : ''}${korN(k)}각형`;
  // 면을 모양(변의 개수)별로: [{k, n}]
  const kindsOf = (P, only) => {
    const m = {};
    P.F.forEach((f, i) => { if (only && !only.has(i)) return; m[f.v.length] = (m[f.v.length] || 0) + 1; });
    return Object.keys(m).map(Number).sort((a, b) => a - b).map(k => ({ k, n: m[k] }));
  };
  // 면의 색 견본 (정다각형이면 칠하고, 아직 고르지 않으면 테두리만)
  const kSwatch = (k, reg, cls = 'sw') => {
    const r = 10.5, a0 = k % 2 ? 90 : 90 + 180 / k, cy = k === 3 ? 13.6 : 12;
    const pts = Array.from({ length: k }, (_, i) => { const a = rad(a0 + 360 * i / k); return `${n2(12 + r * Math.cos(a))},${n2(cy - r * Math.sin(a))}`; }).join(' ');
    return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><polygon points="${pts}" style="fill:${reg && KTOK[k] ? `var(${KTOK[k]})` : 'none'};stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round"></polygon></svg>`;
  };

  /* ---------- 세어 보기: 누른 면·모서리·꼭짓점에 표시 ----------
     o.mode 'f' | 'e' | 'v', o.mk 센 것(Set), o.hov 가리키는 것, o.flash 아직 안 센 것을 밝히기, o.fill(i) 면 색 */
  function cntSVG(P, cm, o = {}) {
    const mode = o.mode, mk = o.mk || new Set(), hov = o.hov, flash = o.flash, ew = o.ew || 2.6;
    const fr = P.F.map(f => cm.rot(f.n)[2] > 1e-6), pp = P.V.map(p => cm.scr(p));
    let s = '', dots = '', mo = '';
    P.F.forEach((f, i) => {
      if (!fr[i]) return;
      const d = pathOf(f.v.map(j => pp[j]));
      s += faceSVG(d, o.fill ? o.fill(i) : '--t-solid', cm.rot(f.n), true, 1);
      if (mode !== 'f') return;
      if (mk.has(i)) {
        s += `<path d="${d}" style="fill:var(--card);opacity:.45"></path>`;
        mo += `<path d="${d}" style="fill:none;stroke:var(--mark);stroke-width:${n2(ew * 1.3)};stroke-linejoin:round"></path>`;
        const c = f.v.reduce((a, j) => [a[0] + pp[j][0] / f.v.length, a[1] + pp[j][1] / f.v.length], [0, 0]);
        dots += `<circle cx="${n2(c[0])}" cy="${n2(c[1])}" r="${n2(ew * 2.6)}" style="fill:var(--mark);stroke:var(--card);stroke-width:2"></circle>`;
      } else if (hov === i || flash) s += `<path d="${d}" style="fill:var(--hi);opacity:${flash ? 0.8 : 0.45}"></path>`;
    });
    let vis = '', mv = '', mh = '', hv = '';
    P.E.forEach((e, i) => {
      const v = fr[e.f[0]] || fr[e.f[1]], d = seg(pp[e.a], pp[e.b]) + ' ';
      if (mode === 'e' && mk.has(i)) { if (v) mv += d; else mh += d; } else if (v) vis += d;
      if (mode === 'e' && v && !mk.has(i) && (hov === i || flash)) hv += d;
    });
    if (hv) s += stroke(hv, '--hi', n2(ew * 4.2), 'opacity="0.85"');
    if (vis) s += stroke(vis, '--ink', ew);
    if (mh) s += stroke(mh, '--mark', n2(ew * 0.9), 'stroke-dasharray="8 6" opacity="0.8"');
    if (mv) s += stroke(mv, '--mark', n2(ew * 2.4));
    s += mo + dots;
    if (mode === 'v') P.V.forEach((p, j) => {
      const [x, y] = pp[j], seen = P.vf[j].some(fi => fr[fi]), c = (r, st) => `<circle cx="${n2(x)}" cy="${n2(y)}" r="${n2(r)}" style="${st}"></circle>`;
      if (seen) {
        if (!mk.has(j) && (hov === j || flash)) s += c(ew * 6, 'fill:var(--hi);opacity:.8');
        s += mk.has(j) ? c(ew * 3.6, 'fill:var(--mark);stroke:var(--card);stroke-width:2.5') : c(ew * 2.6, 'fill:var(--card);stroke:var(--ink);stroke-width:2');
      } else if (mk.has(j)) s += c(ew * 3, 'fill:none;stroke:var(--mark);stroke-width:2;stroke-dasharray:4 3');
    });
    return s;
  }

  /* ---------- 각기둥 · 엇각기둥 (모서리 1) ---------- */
  function prismP(kind, n) {
    const R = 1 / (2 * Math.sin(Math.PI / n)), anti = kind === 'anti';
    const h = anti ? Math.sqrt(1 - Math.pow(2 * R * Math.sin(Math.PI / (2 * n)), 2)) : 1;
    const ring = (y, off) => Array.from({ length: n }, (_, i) => { const a = 2 * Math.PI * i / n + off; return [R * Math.cos(a), y, R * Math.sin(a)]; });
    const T = ring(h / 2, 0), B = ring(-h / 2, anti ? Math.PI / n : 0);
    const faces = [{ pts: T.slice().reverse() }, { pts: B }];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      if (anti) { faces.push({ pts: [T[i], B[i], T[j]] }, { pts: [B[i], B[j], T[j]] }); }
      else faces.push({ pts: [T[i], B[i], B[j], T[j]] });
    }
    return weld(faces.map(f => ({ pts: f.pts, n: newell(f.pts), role: 't', k: f.pts.length })));
  }
  const prismName = (kind, n) => `정${korN(n)}각${kind === 'anti' ? '엇각' : ''}기둥`;
  const PRISM_SAME = { 'prism-4': '정육면체', 'anti-3': '정팔면체' };

  /* =========================================================
     정다면체 깎기 — 정다면체를 깎거나 비틀어 준정다면체가 되는 모습을 보여 주는 화면 (도감의 '계열'대로 묶음)
     장면 0 모아 보기: 깎는 방법(줄) × 정다면체(칸) 표. 짝인 두 정다면체에서 같은 모양이 나오는 칸은 하나로 합쳤다.
     장면 1~3 계열마다: 짝인 두 정다면체를 나란히 놓고 같은 방법으로 함께 깎는다(정사면체 계열은 하나).
       깎는 방법마다 '무엇이 될까?' → '다음'으로 깎는다. 다 깎으면 아래에 이름이 나오고, 오른쪽 계통도 칸이 채워진다.
       끝까지 깎기는 꼭짓점 깎기 모양에서 한 번 멈췄다가 더 깎는다(꼭짓점 깎기 다음 단계는 거기서 이어서 시작).
       비틀기는 깎지 않고, 면을 하나씩 떼어 바깥으로 밀어낸 뒤 비틀고, 벌어진 틈을 새 면으로 채운다.
       깎는 동안 새로 생긴 면은 다 깎았을 때의 모양 색, 원래 면은 회색. 모양이 다 갖추어지면 원래 면도 모양 색으로 바뀐다.
       점선은 원래 정다면체. 면·모서리·꼭짓점의 개수는 깎는 동안 계속 바뀐다.
     ========================================================= */

  /* ---------- 장면 0: 모아 보기 (깎는 방법 × 정다면체) ---------- */
  function tableScene() {
    const COLS = { tetra: 2, cube: 4, octa: 5, dodeca: 7, icosa: 8 };   // 1열은 깎는 방법, 3·6열은 계열 사이 틈

  /* ---------- 장면 1~3: 한 계열을 깎기 ---------- */
  function famScene(fam, si) {

    function shapeOf(i) {

      const cm = cams(), flash = performance.now() < cnt.flashT, reg = regular();

    /* 아래 이름표: 원래 → (끝까지 깎기는 꼭짓점 깎기 모양에서 한 번) → 다 깎은 모양. 움직이는 동안은 흐리게 */

    function paintLadder() {

    function paintCtl() {

      const cb = $('#bCnt', FIG), closed = V.every((s, i) => !Array.isArray(shapeOf(i)));

  const ICO_SPIN = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"></path><path d="M20 4v4h-4"></path></svg>';

  let penOn = false, penVar = '--pen1', cur = null;
  const inkKey = () => String(state.si);
  const ptsStr = pts => pts.map(p => p.join(',')).join(' ');
  function renderInk() {
    const arr = inkStore.get(inkKey()) || [];
    INK.innerHTML = arr.map(s => `<polyline points="${ptsStr(s.pts)}" style="stroke:var(${s.c})"></polyline>`).join('');
  }
  function undoInk() { const arr = inkStore.get(inkKey()); if (arr && arr.length) { arr.pop(); renderInk(); } }
  const toInk = e => {
    const r = INK.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) / (r.width || 1) * 1000), Math.round((e.clientY - r.top) / (r.height || 1) * 1000)];
  };
  INK.addEventListener('pointerdown', e => {
    if (!penOn) return;
    e.preventDefault();
    try { INK.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    const p = toInk(e);
    cur = { c: penVar, pts: [p], el: document.createElementNS(NS, 'polyline') };
    cur.el.setAttribute('points', p.join(','));
    cur.el.style.stroke = `var(${penVar})`;
    INK.appendChild(cur.el);
    const arr = inkStore.get(inkKey()) || [];
    arr.push(cur);
    inkStore.set(inkKey(), arr);
  });
  INK.addEventListener('pointermove', e => {
    if (!cur) return;
    const p = toInk(e), last = cur.pts[cur.pts.length - 1];
    if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 3) return;
    cur.pts.push(p);
    cur.el.setAttribute('points', ptsStr(cur.pts));
  });
  const endStroke = () => {
    if (!cur) return;
    if (cur.pts.length === 1) { cur.pts.push([cur.pts[0][0] + 1, cur.pts[0][1] + 1]); cur.el.setAttribute('points', ptsStr(cur.pts)); }
    delete cur.el;
    cur = null;
  };
  INK.addEventListener('pointerup', endStroke);
  INK.addEventListener('pointercancel', endStroke);
  function setPen(on) {
    penOn = on;
    document.body.classList.toggle('pen-on', on);
    $('#penBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    if (!on) endStroke();
  }
  $('#penBtn').addEventListener('click', () => setPen(!penOn));
  $('#penOff').addEventListener('click', () => setPen(false));
  $('#penUndo').addEventListener('click', undoInk);
  $('#penClear').addEventListener('click', () => { inkStore.set(inkKey(), []); renderInk(); });
  $$('.pen-sw').forEach(b => b.addEventListener('click', () => {
    penVar = b.getAttribute('data-pen');
    $$('.pen-sw').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  }));

  /* ---------- 화면 색: 종이 ↔ 칠판 ---------- */
  const root = document.documentElement;
  try { const t = localStorage.getItem('lesson-theme'); if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t); } catch (err) { /* 무시 */ }
  const themeNow = () => root.getAttribute('data-theme') || (mq('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const paintTheme = () => {
    const dark = themeNow() === 'dark';
    $('#themeLbl').textContent = dark ? '칠판' : '종이';
    $('#themeBtn').setAttribute('aria-label', `화면 색 바꾸기, 지금은 ${dark ? '칠판' : '종이'}`);
  };
  $('#themeBtn').addEventListener('click', () => {
    const t = themeNow() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('lesson-theme', t); } catch (err) { /* 무시 */ }
    paintTheme();
  });
  paintTheme();
  const schemeMq = mq('(prefers-color-scheme: dark)');
  if (schemeMq.addEventListener) schemeMq.addEventListener('change', paintTheme);

  /* ---------- 전체 화면 ---------- */
  const fsBtn = $('#fsBtn');
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  const toggleFs = () => {
    if (!document.fullscreenEnabled) return;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else root.requestFullscreen().catch(() => {});
  };
  fsBtn.addEventListener('click', toggleFs);

  /* ---------- 키보드 (방향키, 발표용 리모컨) ---------- */
  document.addEventListener('keydown', e => {
    if (e.altKey || e.defaultPrevented) return;
    const tn = e.target && e.target.tagName ? e.target.tagName : '';
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { if (penOn) { e.preventDefault(); undoInk(); } return; }
    if (e.ctrlKey || e.metaKey) return;
    if (tn === 'TEXTAREA' || tn === 'INPUT') return;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || ((k === ' ' || k === 'Enter') && tn !== 'BUTTON')) { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'p' || k === 'P' || k === 'ㅔ') setPen(!penOn);
    else if (k === 'f' || k === 'F' || k === 'ㄹ') toggleFs();
    else if (k === 'Escape') { if (penOn) setPen(false); }
    else if (/^[0-9]$/.test(k)) { const nv = NAVS.find(x => x[0] === k); if (nv) go(nv[2], 0); }   // 탭 번호로 바로 가기
  });

  go(0, 0);
})();
</script>

</body></html>
