<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빈틈없이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="회색 자리를 정다각형 조각으로 빈틈없이 채우는 퍼즐">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 목록 화면은 세로로 흐르는 단계 카드, 퍼즐 화면은 한 화면(위 막대 · 판 · 아래 조각 받침) */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #E4E9F0;
  --ink: #1B2232;
  --ink-2: #505B70;
  --ink-3: #7A8496;
  --line: #CDD4DE;
  --grout: #C2C8D1;
  --grout-edge: #687284;
  --board: #F7F8FA;
  --accent: #2950B8;
  --accent-2: #DCE5FA;
  --accent-ink: #FFFFFF;
  --gold: #E0A21B;
  --good: #23935A;
  --good-2: #DDF2E6;
  --warn: #B26A00;
  --warn-2: #FCEBCF;
  --bad: #D2433F;
  --shadow: 0 1px 2px rgba(20, 30, 50, .08), 0 6px 18px rgba(20, 30, 50, .08);
  --c3: #3EAA67; --c4: #EF8A2B; --c5: #8C6CD5; --c6: #F1C02E; --c7: #2FA3A0; --c8: #3A8AD9; --c12: #E35A63;
  --f-display: "Do Hyeon", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161E; --surface: #1B2130; --surface-2: #252C3C; --ink: #E7EBF2; --ink-2: #A9B2C3; --ink-3: #7F899B;
    --line: #333B4D; --grout: #3E4656; --grout-edge: #98A3B6; --board: #161B25; --accent: #7C9DFF; --accent-2: #26325A;
    --accent-ink: #0E1424; --gold: #F0B93A; --good: #4CC285; --good-2: #1D3B2C; --warn: #F2B055; --warn-2: #3D2E14; --bad: #F06A65;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161E; --surface: #1B2130; --surface-2: #252C3C; --ink: #E7EBF2; --ink-2: #A9B2C3; --ink-3: #7F899B;
  --line: #333B4D; --grout: #3E4656; --grout-edge: #98A3B6; --board: #161B25; --accent: #7C9DFF; --accent-2: #26325A;
  --accent-ink: #0E1424; --gold: #F0B93A; --good: #4CC285; --good-2: #1D3B2C; --warn: #F2B055; --warn-2: #3D2E14; --bad: #F06A65;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; }
.screen { height: 100%; }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- 공통 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn { width: 40px; padding: 0; }

/* ---------- 목록 화면 ---------- */
#home { overflow-y: auto; }
.home-wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 28px;
}
.masthead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; cursor: default; user-select: none; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }
.logo svg { width: 54px; height: 54px; }
.logo-word { font-family: var(--f-display); font-size: 40px; line-height: 1; letter-spacing: .5px; }
.tagline { color: var(--ink-2); margin-top: 4px; font-size: 14px; }
.masthead .spacer { flex: 1; }
.mast-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.stage { display: flex; flex-direction: column; gap: 12px; }
.stage-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stage-no {
  font-family: var(--f-mono); font-weight: 600; font-size: 12px; letter-spacing: 1.5px;
  color: var(--accent); text-transform: uppercase;
}
.stage-name { font-family: var(--f-display); font-size: 26px; font-weight: 400; }
.stage-sub { color: var(--ink-2); font-size: 14px; }
.stage-prog { margin-left: auto; color: var(--ink-3); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 10px 12px; cursor: pointer; min-width: 0;
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--ink-3); }
.card .thumb { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; border-radius: 10px; background: var(--board); display: grid; place-items: center; overflow: hidden; }
.card .thumb svg { width: 88%; height: 88%; }
.card .c-id { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.card .c-title { font-weight: 700; font-size: 15px; line-height: 1.3; }
.card .stars { position: absolute; top: 14px; right: 14px; display: flex; gap: 1px; }
.card .c-wip { position: absolute; top: 14px; left: 14px; font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--surface); border: 1px solid var(--accent); border-radius: 99px; padding: 0 8px; line-height: 1.6; }
.stars svg { width: 15px; height: 15px; }
.star-on { fill: var(--gold); }
.star-off { fill: none; stroke: var(--ink-3); stroke-width: 1.4; opacity: .55; }

.make-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
@media (max-width: 720px) { .make-row { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.panel h3 { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.panel p { margin: 0; color: var(--ink-2); font-size: 14px; }
.make-hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.make-hero svg { width: 120px; height: 120px; }
@media (max-width: 460px) { .make-hero { grid-template-columns: 1fr; } .make-hero svg { display: none; } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field {
  width: 100%; min-width: 0; min-height: 40px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--board); color: var(--ink); font: inherit; font-size: 14px;
}
textarea.field { resize: vertical; min-height: 84px; line-height: 1.5; }
.code-field { font-family: var(--f-mono); font-size: 12.5px; word-break: break-all; }
.dex-mini { display: flex; align-items: center; gap: 10px; }
/* 친구 퍼즐 목록 */
.fp-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fp-list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
.fp-item { display: flex; align-items: center; gap: 6px; }
.fp-play {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  padding: 7px 10px 7px 7px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
  transition: border-color .12s, box-shadow .12s;
}
.fp-play:hover { border-color: var(--ink-3); box-shadow: var(--shadow); }
.fp-thumb { width: 54px; height: 54px; flex: none; border-radius: 9px; background: var(--board); display: grid; place-items: center; overflow: hidden; }
.fp-thumb svg { width: 90%; height: 90%; }
.fp-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fp-txt b { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-txt small { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-tag { flex: none; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 1px 9px; white-space: nowrap; }
.fp-tag.ok { color: var(--good); background: var(--good-2); }
.fp-tag.me { color: var(--ink-2); background: var(--surface-2); }
.fp-tag.wip { color: var(--accent); border: 1px solid var(--accent); }
.fp-item.done .fp-thumb { opacity: .7; }
.fp-del { flex: none; }
.fp-empty { margin: 0; padding: 14px; border-radius: 12px; background: var(--board); color: var(--ink-2); font-size: 13.5px; }
.fp-code summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
.fp-code[open] summary { margin-bottom: 8px; }
.fp-code textarea.field { min-height: 60px; }
.fp-sent { padding: 12px 14px; border-radius: 12px; background: var(--good-2); color: var(--ink); font-size: 14px; line-height: 1.5; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* ---------- 퍼즐 화면 ---------- */
#play { display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 8px;
}
.lv-head { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.lv-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.lv-title .mono { color: var(--ink-3); font-size: 13px; }
.lv-title h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-goal { color: var(--ink-2); font-size: 14px; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.boardwrap {
  flex: 1; min-height: 0; position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.board {
  position: relative; width: 100%; height: 100%; border-radius: var(--r); overflow: hidden;
  background: var(--board); border: 1px solid var(--line);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: default; }
.overlay { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; max-width: min(320px, calc(100% - 20px)); pointer-events: none; }
.overlay > * { pointer-events: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); box-shadow: var(--shadow);
}
.chip b { color: var(--ink); font-weight: 700; }
.infocard {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0;
}
.infocard h4 { margin: 0; font-size: 13px; color: var(--ink-2); font-weight: 600; letter-spacing: .3px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.found { display: flex; flex-wrap: wrap; gap: 6px; }
.found .slot {
  width: 64px; height: 70px; border-radius: 10px; border: 1px dashed var(--line); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--ink-3);
}
.found .slot.got { border-style: solid; border-color: var(--ink-3); background: var(--board); color: var(--ink); }
.found .slot svg { width: 46px; height: 46px; }
.found .slot.new { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.typechips { display: flex; flex-wrap: wrap; gap: 6px; }
.typechip { font-family: var(--f-mono); font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink); }
.typechip.uni { background: var(--accent); color: var(--accent-ink); }
.mini-note { font-size: 12.5px; color: var(--ink-2); }
.missions { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.missions div { display: flex; gap: 6px; align-items: flex-start; }
.missions .ck { flex: none; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--ink-3); margin-top: 2px; display: grid; place-items: center; }
.missions .ck.on { background: var(--good); border-color: var(--good); }
.missions .ck.on::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
.overlay .toggle-panel { display: none; }
@media (max-width: 640px) {
  .overlay .infocard.collapsible.closed > :not(h4) { display: none; }
  .overlay .toggle-panel { display: inline-flex; }
}

.tray {
  display: flex; gap: 8px; align-items: stretch; overflow-x: auto; scrollbar-width: thin;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  touch-action: pan-x;
}
.piece-btn {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 78px; padding: 8px 8px 6px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); cursor: grab; user-select: none; touch-action: none;
  position: relative;
}
.piece-btn:hover { border-color: var(--ink-3); }
.piece-btn svg { width: 46px; height: 46px; pointer-events: none; }
.piece-btn .pname { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.piece-btn .pang { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.piece-btn .cnt {
  position: absolute; top: 4px; right: 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 600;
  color: var(--ink); background: var(--surface-2); padding: 0 6px; border-radius: 99px;
}
.piece-btn.empty { opacity: .35; cursor: default; }
.piece-btn .kbd {
  position: absolute; top: 4px; left: 6px; min-width: 17px; text-align: center; font-family: var(--f-mono); font-size: 11px; font-weight: 600; line-height: 16px;
  color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
}
.piece-btn.carrying { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
.piece-btn.carrying .kbd { color: var(--surface); background: var(--accent); border-color: var(--accent); }
.piece-btn.pulse { animation: pulse 1.4s ease-in-out infinite; border-color: var(--accent); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-2); } 50% { box-shadow: 0 0 0 7px var(--accent-2); } }
.tray .tray-sep { flex: 1; }
.tray-tools { display: flex; gap: 6px; align-items: center; flex: none; }

/* ---------- 창 ---------- */
.modal {
  position: fixed; inset: 0; z-index: 30; background: rgba(12, 16, 26, .45); display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
}
.sheet {
  background: var(--surface); color: var(--ink); border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
  width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px;
}
.sheet.wide { width: min(860px, 100%); }
/* 창 안의 내용이 길면 줄어들지 않고 창이 스크롤된다 (탭 줄이 눌려 사라지지 않게) */
.sheet > * { flex-shrink: 0; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; flex: 1; }
.sheet p { margin: 0; }
.big-stars { display: flex; justify-content: center; gap: 8px; }
.big-stars svg { width: 46px; height: 46px; animation: pop .5s ease both; }
.big-stars svg + svg { animation-delay: .15s; }
.done-art { display: grid; place-items: center; background: var(--board); border-radius: 12px; padding: 8px; }
.done-art svg { width: min(240px, 100%); height: auto; }
.done-msg { text-align: center; color: var(--ink-2); }
.done-msg b { color: var(--ink); }
.sheet .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.dex-cell { border: 1px dashed var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.dex-cell.got { border-style: solid; background: var(--board); }
.dex-cell svg { width: 84px; height: 84px; }
.dex-cell .mono { font-size: 12.5px; }
.dex-cell .q { width: 84px; height: 84px; display: grid; place-items: center; color: var(--ink-3); font-family: var(--f-display); font-size: 34px; }
.dex-group { display: flex; flex-direction: column; gap: 8px; }
.dex-group h4 { margin: 0; font-size: 14px; color: var(--ink-2); }
.badge-inf { font-size: 11px; color: var(--accent); }

.rec-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .rec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rec-box { background: var(--board); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rec-box .k { font-size: 12.5px; color: var(--ink-2); }
.rec-box .v { font-family: var(--f-display); font-size: 26px; line-height: 1.15; }
.rec-box .v small { font-family: var(--f-body); font-size: 13px; color: var(--ink-3); }
.rec-list { font-size: 13.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.rec-list b { color: var(--ink); }
.hint-line { font-size: 13px; color: var(--ink-3); }
label.lab { font-size: 13px; color: var(--ink-2); font-weight: 600; }

/* 교사 메뉴 */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.guide { display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.guide h4 { margin: 0; font-size: 15px; }
.guide ol, .guide ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.guide .note { background: var(--accent-2); border-radius: 10px; padding: 10px 12px; }

      <div class="lv-head"><div class="lv-title"><h2>빈틈의 비밀</h2></div><div class="lv-goal">한 점에 모인 정다각형의 빈틈을 닫으면 무엇이 될까요? 그림을 끌면 돌려 볼 수 있어요.</div></div>
    </div>

<!-- 배포판: 기록 서버(Firebase)를 쓰지 않아요. 기록은 이 브라우저에만 남고, 학생 정보를 받거나 보내지 않아요. -->

<script>
/* ===== 빈틈없이 : 기하 엔진 ===== */
const Geo = (() => {
  const TAU = Math.PI * 2;
  const D2R = Math.PI / 180;
  const TYPES = [3, 4, 5, 6, 8, 12];
  const interior = n => 180 * (n - 2) / n;
  const unitArea = n => n / (4 * Math.tan(Math.PI / n));

  /* 변 P→Q 의 왼쪽(반시계)에 정n각형을 만든다. v0=P, v1=Q */
  function polyOnEdge(n, P, Q) {
    const v = [[P[0], P[1]], [Q[0], Q[1]]];
    let h = Math.atan2(Q[1] - P[1], Q[0] - P[0]);
    let x = Q[0], y = Q[1];
    for (let i = 2; i < n; i++) {
      h += TAU / n;
      x += Math.cos(h); y += Math.sin(h);
      v.push([x, y]);
    }
    return v;
  }

  /* 중심과 회전으로 정n각형 (rot=0 이면 아랫변이 수평) */
  function regular(n, cx, cy, rotDeg) {
    const R = 1 / (2 * Math.sin(Math.PI / n));
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = (rotDeg - 90 - 180 / n + i * 360 / n) * D2R;
      v.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
    }
    return v;
  }

  /* 꼭짓점 C 에서 방향 startDeg 로 첫 변을 내는 정n각형 (C가 v0) */
  function polyAtCorner(n, C, startDeg) {
    const a = startDeg * D2R;
    return polyOnEdge(n, C, [C[0] + Math.cos(a), C[1] + Math.sin(a)]);
  }

  function centroid(v) {
    let x = 0, y = 0;
    for (const p of v) { x += p[0]; y += p[1]; }
    return [x / v.length, y / v.length];
  }
  function area(v) {
    let s = 0;
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length];
      s += a[0] * b[1] - a[1] * b[0];
    }
    return s / 2;
  }
  function bbox(v) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of v) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    return [x0, y0, x1, y1];
  }
  function bboxHit(a, b, m = 0) {
    return !(a[2] < b[0] - m || b[2] < a[0] - m || a[3] < b[1] - m || b[3] < a[1] - m);
  }
  function bboxUnion(list) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const b of list) {
      if (b[0] < x0) x0 = b[0]; if (b[1] < y0) y0 = b[1];
      if (b[2] > x1) x1 = b[2]; if (b[3] > y1) y1 = b[3];
    }
    return [x0, y0, x1, y1];
  }

  /* 볼록다각형 겹침(SAT). 맞닿기만 하면 겹침 아님 */
  function overlap(A, B, tol = 2e-3) {
    for (const P of [A, B]) {
      for (let i = 0; i < P.length; i++) {
        const a = P[i], b = P[(i + 1) % P.length];
        let nx = a[1] - b[1], ny = b[0] - a[0];
        const L = Math.hypot(nx, ny); nx /= L; ny /= L;
        let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
        for (const p of A) { const d = p[0] * nx + p[1] * ny; if (d < minA) minA = d; if (d > maxA) maxA = d; }
        for (const p of B) { const d = p[0] * nx + p[1] * ny; if (d < minB) minB = d; if (d > maxB) maxB = d; }
        if (maxA <= minB + tol || maxB <= minA + tol) return false;
      }
    }
    return true;
  }

  /* Sutherland–Hodgman : subject 를 볼록 clip(반시계) 으로 자름 */
  function clipConvex(subject, clip) {
    let out = subject;
    for (let i = 0; i < clip.length && out.length; i++) {
      const a = clip[i], b = clip[(i + 1) % clip.length];
      const inp = out; out = [];
      const side = p => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
      for (let j = 0; j < inp.length; j++) {
        const P = inp[j], Q = inp[(j + 1) % inp.length];
        const sp = side(P), sq = side(Q);
        if (sp >= 0) out.push(P);
        if ((sp >= 0) !== (sq >= 0)) {
          const t = sp / (sp - sq);
          out.push([P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]);
        }
      }
    }
    return out;
  }
  function interArea(A, B) {
    const c = clipConvex(A, B);
    return c.length >= 3 ? Math.abs(area(c)) : 0;
  }

  function pointInConvex(p, v) {
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length];
      if ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) < -1e-9) return false;
    }
    return true;
  }

  /* 허용오차로 점을 묶는 색인 */
  class PointIndex {
    constructor(tol = 1e-4) { this.tol = tol; this.cell = 0.05; this.map = new Map(); this.pts = []; }
    _k(ix, iy) { return ix + ',' + iy; }
    find(x, y) {
      const ix = Math.floor(x / this.cell), iy = Math.floor(y / this.cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const b = this.map.get(this._k(ix + dx, iy + dy));
        if (!b) continue;
        for (const id of b) {
          const p = this.pts[id];
          if (Math.abs(p[0] - x) < this.tol && Math.abs(p[1] - y) < this.tol) return id;
        }
      }
      return -1;
    }
    id(x, y) {
      const f = this.find(x, y);
      if (f >= 0) return f;
      const id = this.pts.length;
      this.pts.push([x, y]);
      const k = this._k(Math.floor(x / this.cell), Math.floor(y / this.cell));
      if (!this.map.has(k)) this.map.set(k, []);
      this.map.get(k).push(id);
      return id;
    }
  }

  /* 여러 다각형 합집합의 경계 (변 단위). 맞닿은 변(반대 방향)은 지운다.
     부분적으로 겹치는 일직선 변도 처리한다. 결과 변의 왼쪽이 안쪽. */
  function boundarySegments(polys) {
    const edges = [];
    polys.forEach((v, k) => {
      for (let i = 0; i < v.length; i++) edges.push({ a: v[i], b: v[(i + 1) % v.length], k });
    });
    const out = [];
    const tol = 1e-4;
    for (const e of edges) {
      const dx = e.b[0] - e.a[0], dy = e.b[1] - e.a[1];
      const L2 = dx * dx + dy * dy, L = Math.sqrt(L2);
      const cover = [];
      for (const f of edges) {
        if (f.k === e.k) continue;
        // 반대방향 & 같은 직선
        const fx = f.b[0] - f.a[0], fy = f.b[1] - f.a[1];
        if (dx * fx + dy * fy >= 0) continue;
        const cross1 = (dx * (f.a[1] - e.a[1]) - dy * (f.a[0] - e.a[0])) / L;
        const cross2 = (dx * (f.b[1] - e.a[1]) - dy * (f.b[0] - e.a[0])) / L;
        if (Math.abs(cross1) > tol || Math.abs(cross2) > tol) continue;
        let t1 = (dx * (f.a[0] - e.a[0]) + dy * (f.a[1] - e.a[1])) / L2;
        let t2 = (dx * (f.b[0] - e.a[0]) + dy * (f.b[1] - e.a[1])) / L2;
        if (t1 > t2) [t1, t2] = [t2, t1];
        if (t2 <= tol || t1 >= 1 - tol) continue;
        cover.push([Math.max(0, t1), Math.min(1, t2)]);
      }
      cover.sort((p, q) => p[0] - q[0]);
      let t = 0;
      const pushSeg = (s, u) => {
        if (u - s < 1e-3) return;
        out.push({
          a: [e.a[0] + dx * s, e.a[1] + dy * s],
          b: [e.a[0] + dx * u, e.a[1] + dy * u],
          k: e.k, full: (s < 1e-6 && u > 1 - 1e-6)
        });
      };
      for (const c of cover) {
        if (c[0] > t) pushSeg(t, c[0]);
        if (c[1] > t) t = c[1];
      }
      if (t < 1) pushSeg(t, 1);
    }
    return out;
  }

  /* 꼭짓점 분석 : 각 점에 모인 각의 합 */
  function analyzeVertices(polys) {
    const pi = new PointIndex(2e-4);
    const inc = [];
    polys.forEach((v, k) => v.forEach((p, i) => {
      const id = pi.id(p[0], p[1]);
      (inc[id] || (inc[id] = [])).push({ k, i });
    }));
    const boxes = polys.map(v => bbox(v));
    const res = [];
    for (let id = 0; id < pi.pts.length; id++) {
      const [x, y] = pi.pts[id];
      const corners = inc[id] || [];
      let sum = 0;
      for (const c of corners) sum += interior(polys[c.k].length);
      let tj = 0;
      const owners = new Set(corners.map(c => c.k));
      for (let k = 0; k < polys.length; k++) {
        if (owners.has(k)) continue;
        const b = boxes[k];
        if (x < b[0] - 1e-3 || x > b[2] + 1e-3 || y < b[1] - 1e-3 || y > b[3] + 1e-3) continue;
        const v = polys[k];
        for (let i = 0; i < v.length; i++) {
          const a = v[i], c = v[(i + 1) % v.length];
          const dx = c[0] - a[0], dy = c[1] - a[1];
          const L2 = dx * dx + dy * dy;
          const t = ((x - a[0]) * dx + (y - a[1]) * dy) / L2;
          if (t <= 1e-3 || t >= 1 - 1e-3) continue;
          const px = a[0] + t * dx - x, py = a[1] + t * dy - y;
          if (px * px + py * py < 4e-8) { tj++; sum += 180; }
        }
      }
      res.push({ x, y, sum, corners, tj, id });
    }
    return res;
  }

  /* 한 점 둘레 조각들의 순서 (꼭짓점 배열) */
  function cornerSequence(vx, polys) {
    const arr = vx.corners.map(c => {
      const ct = centroid(polys[c.k]);
      return { n: polys[c.k].length, a: Math.atan2(ct[1] - vx.y, ct[0] - vx.x) };
    });
    arr.sort((p, q) => p.a - q.a);
    return arr.map(o => o.n);
  }
  function canonical(seq) {
    if (!seq.length) return '';
    let best = null;
    const less = (s, t) => { for (let i = 0; i < s.length; i++) { if (s[i] !== t[i]) return s[i] < t[i]; } return false; };
    for (const s of [seq, seq.slice().reverse()]) {
      for (let r = 0; r < s.length; r++) {
        const t = s.slice(r).concat(s.slice(0, r));
        if (!best || less(t, best)) best = t;
      }
    }
    return best.join('.');
  }

  return {
    TAU, D2R, TYPES, interior, unitArea, polyOnEdge, regular, polyAtCorner,
    centroid, area, bbox, bboxHit, bboxUnion, overlap, clipConvex, interArea,
    pointInConvex, PointIndex, boundarySegments, analyzeVertices, cornerSequence, canonical
  };
})();
if (typeof module !== 'undefined') module.exports = Geo;

/* ===== 빈틈없이 : 모양 만들기 도구와 테셀레이션 생성기 ===== */
const Tiles = (() => {
  const G = (typeof Geo !== 'undefined') ? Geo : require('./geo.js');

  /* 변에 붙여 가며 모양을 만드는 도구 */
  class Builder {
    constructor() { this.p = []; }
    root(n, x = 0, y = 0, ang = 0) {
      const a = ang * G.D2R;
      this.p.push({ n, v: G.polyOnEdge(n, [x, y], [x + Math.cos(a), y + Math.sin(a)]) });
      return this.p.length - 1;
    }
    add(n, parent, edge) {
      const pv = this.p[parent].v;
      const A = pv[edge % pv.length], B = pv[(edge + 1) % pv.length];
      this.p.push({ n, v: G.polyOnEdge(n, B, A) });
      return this.p.length - 1;
    }
    /* 바깥쪽 법선 방향이 dirDeg 에 가장 가까운 변 번호 */
    side(parent, dirDeg) {
      const v = this.p[parent].v; let best = 0, bd = 1e9;
      for (let i = 0; i < v.length; i++) {
        const A = v[i], B = v[(i + 1) % v.length];
        const th = Math.atan2(B[1] - A[1], B[0] - A[0]) / G.D2R - 90;
        const d = Math.abs((((th - dirDeg) % 360) + 540) % 360 - 180);
        if (d < bd) { bd = d; best = i; }
      }
      return best;
    }
    at(n, parent, dirDeg) { return this.add(n, parent, this.side(parent, dirDeg)); }
    fan(n, k, C, startDeg = 0) {
      const ids = [];
      let a = startDeg;
      for (let i = 0; i < k; i++) {
        this.p.push({ n, v: G.polyAtCorner(n, C, a) });
        ids.push(this.p.length - 1);
        a += G.interior(n);
      }
      return ids;
    }
    seq(n, k, C, list) { // list of types around C
      let a = 0; const ids = [];
      for (const t of list) { this.p.push({ n: t, v: G.polyAtCorner(t, C, a) }); ids.push(this.p.length - 1); a += G.interior(t); }
      return ids;
    }

  /* ---------- 퍼즐 상태 ---------- */
  const S = {

  /* ---------- 보기(확대·이동) ---------- */
  function resize() {
    const c = cv(); if (!c) return;
    const r = c.parentElement.getBoundingClientRect();
    S.dpr = window.devicePixelRatio || 1;
    S.W = Math.max(50, r.width); S.H = Math.max(50, r.height);
    c.width = Math.round(S.W * S.dpr); c.height = Math.round(S.H * S.dpr);

    draw();
  }
  function fitView() {
    if (!S.lv) return;
    let bb = S.lv.bbox;
    if (S.lv.type === 'free' && S.pcs.length) bb = G.bboxUnion([bb].concat(S.pcs.map(p => p.bb)));
    const m = Math.min(S.W, S.H) < 500 ? 22 : 44;
    const bw = bb[2] - bb[0], bh = bb[3] - bb[1];
    let s = Math.min((S.W - 2 * m) / bw, (S.H - 2 * m) / bh);
    s = Math.max(14, Math.min(s, S.lv.type === 'free' ? 56 : 110));
    S.view.s = s;
    S.view.ox = S.W / 2 - (bb[0] + bb[2]) / 2 * s;
    S.view.oy = S.H / 2 + (bb[1] + bb[3]) / 2 * s;
  }
  const sx = p => p[0] * S.view.s + S.view.ox;
  const sy = p => -p[1] * S.view.s + S.view.oy;
  const toW = (x, y) => [(x - S.view.ox) / S.view.s, -(y - S.view.oy) / S.view.s];
  function localXY(e) { const r = cv().getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

  /* ---------- 그리기 ---------- */
  let raf = 0;
  function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
  function pathOf(ctx, v) {
    ctx.moveTo(sx(v[0]), sy(v[0]));
    for (let i = 1; i < v.length; i++) ctx.lineTo(sx(v[i]), sy(v[i]));
    ctx.closePath();
  }
  let hatch = null;
  function hatchPattern(ctx) {
    if (hatch && hatch.dark === COL.dark) return hatch.p;
    const c = document.createElement('canvas'); c.width = c.height = 10;
    const g = c.getContext('2d');
    g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-2, 12); g.lineTo(12, -2); g.moveTo(8, 12); g.lineTo(12, 8); g.moveTo(-2, 2); g.lineTo(2, -2); g.stroke();
    hatch = { p: ctx.createPattern(c, 'repeat'), dark: COL.dark };
    return hatch.p;
  }
  function drawPiece(ctx, p, o = {}) {
    const v = p.v;
    const col = COL[p.n] || '#999';
    let scale = 1;
    const t = S.placedAt.get(p.id);
    if (t) {
      const k = (performance.now() - t) / 160;
      if (k < 0) { draw(); return; }
      if (k < 1) { scale = 1 + 0.08 * Math.sin(k * Math.PI); draw(); } else S.placedAt.delete(p.id);

  /* 한 점에 모인 각 */
  function cornersAt(pt, pcs) {

        const q = p.v[i];

  function drawRing(ctx, pt, corners, o = {}) {

    const full = Math.abs(sum - 360) < 0.01;
    ctx.save();
    ctx.lineWidth = 2; ctx.setLineDash([3, 4]); ctx.strokeStyle = COL.ink3;

  function render() {

    }
    // 힌트 자리
    if (S.ghost) {
      ctx.save(); ctx.beginPath(); pathOf(ctx, S.ghost.v);
      ctx.fillStyle = COL[S.ghost.n]; ctx.globalAlpha = 0.28 + 0.12 * Math.sin(performance.now() / 220); ctx.fill();
      ctx.globalAlpha = 1; ctx.setLineDash([6, 5]); ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      draw();
    }
    // 조각
    for (const p of S.pcs) drawPiece(ctx, p, { sel: S.sel === p.id, bad: S.badId === p.id });
    // 꽉 찬 꼭짓점 표시 (자유 만들기)
    if (lv.type === 'free' && S.showVx) {

        ctx.beginPath(); ctx.arc(sx([v.x, v.y]), sy([v.x, v.y]), 3.6, 0, Math.PI * 2);
        ctx.fillStyle = S.uniform === v.code ? COL.gold : COL.surface; ctx.fill();
        ctx.lineWidth = 1.6; ctx.strokeStyle = COL.ink; ctx.stroke();
      }
    }
    // 가운데 점의 고리
    for (const d of (lv.dots || [])) drawRing(ctx, d, cornersAt(d, S.pcs), { always: lv.type === 'flower' });
    // 마우스가 올라간 꼭짓점
    if (S.hover && !S.drag) drawRing(ctx, [S.hover.x, S.hover.y], cornersAt([S.hover.x, S.hover.y], S.pcs), { r: 18 });
    // 끄는 조각
    const d = S.drag;
    if (d && d.active) {
      if (d.snap) {
        const ok = d.snap.ok === 'ok';
        ctx.save(); ctx.beginPath(); pathOf(ctx, d.snap.v);
        ctx.fillStyle = ok ? COL[d.n] : COL.bad; ctx.globalAlpha = ok ? 0.9 : 0.35; ctx.fill(); ctx.globalAlpha = 1;
        ctx.setLineDash(ok ? [] : [6, 4]); ctx.strokeStyle = ok ? shade(COL[d.n], 0.6) : COL.bad; ctx.lineWidth = ok ? 2 : 2.5; ctx.stroke(); ctx.restore();
        if (!ok) drawPiece(ctx, { n: d.n, v: d.float, bb: G.bbox(d.float) }, { alpha: 0.75, shadow: true });
      } else {
        drawPiece(ctx, { n: d.n, v: d.float, bb: G.bbox(d.float) }, { alpha: 0.92, shadow: true });
      }
    }
  }

  /* ---------- 놓을 자리 후보 ---------- */
  function placeCheck(v, bb, others) {
    for (const p of others) if (G.bboxHit(bb, p.bb, 0.01) && G.overlap(v, p.v)) return 'overlap';
    const lv = S.lv;
    if (lv.region) {
      let a = 0; const A = G.area(v);
      for (let i = 0; i < lv.region.length; i++) if (G.bboxHit(bb, lv.regionBB[i], 0.01)) a += G.interArea(v, lv.region[i]);
      if (a < A - 2e-3) return 'outside';
    }
    return 'ok';
  }
  function buildCands(n, exId) {
    const others = S.pcs.filter(p => p.id !== exId);
    const out = [], seen = new Set();
    const add = v => {
      const c = G.centroid(v);
      const ang = ((Math.atan2(v[0][1] - c[1], v[0][0] - c[0]) * 180 / Math.PI) % (360 / n) + 360) % (360 / n);
      const key = c[0].toFixed(3) + ',' + c[1].toFixed(3) + ',' + Math.round(ang * 2);
      if (seen.has(key)) return; seen.add(key);
      out.push({ v, c, bb: G.bbox(v) });
    };
    if (S.lv.snapEdges) for (const e of S.lv.snapEdges) add(G.polyOnEdge(n, e.a, e.b));
    for (const p of others) for (let i = 0; i < p.n; i++) add(G.polyOnEdge(n, p.v[(i + 1) % p.n], p.v[i]));
    if (S.lv.type === 'flower') for (const d of S.lv.dots) for (let a = 0; a < 360; a += 15) add(G.polyAtCorner(n, d, a));
    for (const c of out) c.ok = placeCheck(c.v, c.bb, others);
    return { list: out, others };
  }

  /* ---------- 끌기 ---------- */
  function trayDown(e) {
    endCarry();
    if (S.done || S.clearing) return;
    const n = +e.currentTarget.dataset.n;
    if (S.inv && !(S.inv[n] > 0)) { toast(`${NAME[n]}은 다 썼어요`); return; }
    e.preventDefault();
    beginDrag(e, { n, from: 'tray', rot: 0 });
  }
  function beginDrag(e, o) {
    const touch = e.pointerType === 'touch' || e.pointerType === 'pen';
    S.drag = Object.assign({ pid: e.pointerId, touch, active: true, snap: null, off: [0, 0] }, o);
    S.drag.cands = buildCands(o.n, o.piece ? o.piece.id : null);
    S.sel = null; S.ghost = null; S.badId = null;
    moveDrag(e);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', cancelDrag);
  }
  function floatVerts(d, w) {
    const ctr = [w[0] + d.off[0], w[1] + d.off[1] + (d.touch ? 46 / S.view.s : 0)];
    return { ctr, v: G.regular(d.n, ctr[0], ctr[1], d.rot) };
  }
  function moveDrag(e) {
    const d = S.drag; if (!d || e.pointerId !== d.pid) return;
    const [x, y] = localXY(e);
    d.lastXY = [x, y];
    const w = toW(x, y);
    const f = floatVerts(d, w);
    d.ctr = f.ctr; d.float = f.v;
    const R = Math.max((d.touch ? 52 : 40) / S.view.s, 0.42);
    let best = null, bd = R, worst = null, wd = R * 0.8;
    for (const c of d.cands.list) {
      const dist = Math.hypot(c.c[0] - f.ctr[0], c.c[1] - f.ctr[1]);
      if (c.ok === 'ok') { if (dist < bd) { bd = dist; best = c; } }
      else if (dist < wd) { wd = dist; worst = c; }
    }
    d.snap = best || worst;
    draw();
  }
  function overTray(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    return !!(el && el.closest('#tray'));
  }
  function endDrag(e) {
    const d = S.drag; if (!d || e.pointerId !== d.pid) return;
    detachDrag();
    const lv = S.lv;
    if (overTray(e)) {
      if (d.piece) { pushUndoFrom(d); if (S.inv) S.inv[d.n] = (S.inv[d.n] || 0) + 1; changed(); }
      S.drag = null; draw(); return;
    }
    if (tryPlace(d)) { S.drag = null; changed(); return; }
    // 원래 자리로
    if (d.piece) S.pcs.splice(Math.min(d.idx, S.pcs.length), 0, d.piece);
    S.drag = null; draw();
  }
  // 끄는 조각을 지금 자리(붙을 자리 또는 마우스 자리)에 놓아 본다. 놓았으면 true
  function tryPlace(d) {
    if (d.snap && d.snap.ok === 'ok') {
      pushUndoFrom(d);
      const p = mk(d.n, d.snap.v);
      S.pcs.push(p); S.placedAt.set(p.id, performance.now());
      if (!d.piece && S.inv) S.inv[d.n]--;
      return true;
    }
    if (d.snap) {
      toast(d.snap.ok === 'overlap' ? '다른 조각과 겹쳐서 놓을 수 없어요' : '회색 자리 밖으로 삐져나와요');
    } else if (S.lv.type === 'free' && d.float) {
      if (placeCheck(d.float, G.bbox(d.float), S.pcs) === 'ok') {
        pushUndoFrom(d);
        const p = mk(d.n, d.float); S.pcs.push(p); S.placedAt.set(p.id, performance.now());
        return true;
      }
      toast('다른 조각과 겹쳐서 놓을 수 없어요');
    } else if (!S.warnedFree) {
      S.warnedFree = true; toast('회색 자리나 다른 조각 가까이에 놓으면 착 붙어요');
    }
    return false;
  }

  /* ---------- 숫자 키로 조각 집기: 조각이 마우스를 따라오고, 누르는 곳에 놓인다 ---------- */
  let mouseXY = null;
  window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') mouseXY = [e.clientX, e.clientY]; }, { passive: true });
  function markCarryTray() {
    const n = S.drag && S.drag.carry ? S.drag.n : null;
    for (const el of $$('#tray .piece-btn')) el.classList.toggle('carrying', +el.dataset.n === n);
  }
  function moveCarry(e) { if (S.drag && S.drag.carry && e.pointerType === 'mouse') moveDrag({ pointerId: 'carry', clientX: e.clientX, clientY: e.clientY }); }
  function startCarry(n) {
    if (!S.lv || S.done || S.clearing) return;
    if (S.drag && !S.drag.carry) return;              // 마우스로 끄는 중이면 그대로
    if (S.drag && S.drag.carry && S.drag.n === n) { endCarry(); return; }   // 같은 키를 또 누르면 내려놓기
    if (S.inv && !(S.inv[n] > 0)) { toast(`${NAME[n]}은 다 썼어요`); return; }
    endCarry();
    const r = cv().getBoundingClientRect();
    const at = mouseXY || [r.left + r.width / 2, r.top + r.height / 2];
    S.drag = { pid: 'carry', carry: true, touch: false, active: true, snap: null, off: [0, 0], n, from: 'tray', rot: 0, cands: buildCands(n, null) };
    S.sel = null; S.ghost = null; S.badId = null;
    window.addEventListener('pointermove', moveCarry);
    markCarryTray(); refreshTray();
    moveDrag({ pointerId: 'carry', clientX: at[0], clientY: at[1] });
    if (!S.carryTip) { S.carryTip = true; toast('누르는 곳에 조각이 놓여요. 그만하려면 Esc나 오른쪽 클릭', 3400); }
  }
  function endCarry() {
    if (!S.drag || !S.drag.carry) return;
    window.removeEventListener('pointermove', moveCarry);
    S.drag = null; markCarryTray(); draw();
  }
  function carryPlace(e) {
    const d = S.drag;
    moveDrag({ pointerId: 'carry', clientX: e.clientX, clientY: e.clientY });
    if (!tryPlace(d)) { draw(); return; }
    S.drag = null;
    changed();
    // 같은 조각이 남아 있으면 계속 들고 있는다
    if (S.done || S.clearing || $('#play').hidden || (S.inv && !(S.inv[d.n] > 0))) { window.removeEventListener('pointermove', moveCarry); markCarryTray(); draw(); return; }
    S.drag = Object.assign(d, { snap: null, cands: buildCands(d.n, null) });
    moveDrag({ pointerId: 'carry', clientX: e.clientX, clientY: e.clientY });
  }

  function pushUndoFrom(d) {
    // 옮기던 조각을 잠깐 되돌려 놓고 상태 저장
    if (d.piece) { const tmp = S.pcs.slice(); S.pcs.splice(Math.min(d.idx, S.pcs.length), 0, d.piece); pushUndo(); S.pcs = tmp; }
    else pushUndo();
  }
  function cancelDrag(e) {
    const d = S.drag; if (!d || e.pointerId !== d.pid) return;
    detachDrag();
    if (d.piece) S.pcs.splice(Math.min(d.idx, S.pcs.length), 0, d.piece);
    S.drag = null; draw();
  }
  function detachDrag() {
    window.removeEventListener('pointermove', moveDrag);
    window.removeEventListener('pointerup', endDrag);
    window.removeEventListener('pointercancel', cancelDrag);
  }

  /* 판에서 누르기 : 조각 옮기기 / 판 이동 / 고르기 */
  function hitPiece(w) {
    for (let i = S.pcs.length - 1; i >= 0; i--) {
      const p = S.pcs[i];
      if (w[0] < p.bb[0] || w[0] > p.bb[2] || w[1] < p.bb[1] || w[1] > p.bb[3]) continue;
      if (G.pointInConvex(w, p.v)) return i;
    }
    return -1;
  }
  function nearVertex(w, px = 14) {
    let best = null, bd = px / S.view.s;
    for (const v of S.vx) {
      if (v.corners.length < 1) continue;
      const dd = Math.hypot(v.x - w[0], v.y - w[1]);
      if (dd < bd) { bd = dd; best = v; }
    }
    return best;
  }
  function boardDown(e) {
    if (S.drag && S.drag.carry) { e.preventDefault(); if (e.button === 2) endCarry(); else if (e.button === 0 || e.pointerType !== 'mouse') carryPlace(e); return; }
    if (S.drag || S.done || S.clearing) return;
    if (e.button === 2) {
      // 오른쪽 클릭: 판 위의 조각을 바로 뺀다 (미리 놓인 출발 조각은 그대로)
      e.preventDefault();
      const xy = localXY(e);
      const i = hitPiece(toW(xy[0], xy[1]));
      if (i >= 0 && !S.pcs[i].fixed) { S.lastTap = null; removePiece(S.pcs[i].id); }
      return;
    }
    const c = cv(); c.setPointerCapture(e.pointerId);
    const xy = localXY(e);
    S.ptrs.set(e.pointerId, xy);
    if (S.ptrs.size === 2) { startPinch(); return; }
    const w = toW(xy[0], xy[1]);
    const i = hitPiece(w);
    S.pan = { pid: e.pointerId, start: xy, last: xy, moved: false, hit: i, w, t: performance.now(), type: e.pointerType };
  }
  function boardMove(e) {
    const xy = localXY(e);
    if (S.ptrs.has(e.pointerId)) S.ptrs.set(e.pointerId, xy);
    if (S.pinch) { pinchMove(); return; }
    const pn = S.pan;
    if (pn && pn.pid === e.pointerId) {
      const dx = xy[0] - pn.start[0], dy = xy[1] - pn.start[1];
      if (!pn.moved && Math.hypot(dx, dy) > 6) {
        pn.moved = true;
        const i = pn.hit;
        if (i >= 0 && !S.pcs[i].fixed) {
          // 조각 옮기기 시작
          const p = S.pcs[i];
          S.pcs.splice(i, 1);
          S.pan = null;
          c_release(e);
          const rot = Math.atan2(p.v[1][1] - p.v[0][1], p.v[1][0] - p.v[0][0]) * 180 / Math.PI;
          const w0 = toW(pn.start[0], pn.start[1]);
          beginDrag(e, { n: p.n, from: 'board', piece: p, idx: i, rot, off: [p.c[0] - w0[0], p.c[1] - w0[1]] });
          S.drag.touch = false;
          return;
        }
      }
      if (pn.moved) {
        S.view.ox += xy[0] - pn.last[0]; S.view.oy += xy[1] - pn.last[1];
        S.userView = true; draw();
      }
      pn.last = xy;
      return;
    }
    // 마우스 올림 : 꼭짓점 고리
    if (e.pointerType === 'mouse' && !S.drag && S.lv && S.lv.type === 'free') {
      const v = nearVertex(toW(xy[0], xy[1]), 12);
      const key = v ? v.x + ',' + v.y : null;
      if (key !== (S.hover ? S.hover.x + ',' + S.hover.y : null)) { S.hover = v; draw(); }
    }
  }
  function c_release(e) { try { cv().releasePointerCapture(e.pointerId); } catch (err) { } S.ptrs.delete(e.pointerId); }
  function boardUp(e) {
    S.ptrs.delete(e.pointerId);
    if (S.pinch) { if (S.ptrs.size < 2) S.pinch = null; return; }
    const pn = S.pan;
    if (!pn || pn.pid !== e.pointerId) return;
    S.pan = null;
    if (pn.moved) return;
    // 누르기(탭)
    const now = performance.now();
    const i = pn.hit;
    if (i >= 0 && !S.pcs[i].fixed) {
      const p = S.pcs[i];
      if (S.lastTap && S.lastTap.id === p.id && now - S.lastTap.t < 380) { removePiece(p.id); S.lastTap = null; return; }
      S.lastTap = { id: p.id, t: now };
      S.sel = S.sel === p.id ? null : p.id;
      if (S.lv.type === 'free' && pn.type !== 'mouse') {
        const v = nearVertex(pn.w, 16); S.hover = v;
      }
      refreshTray(); draw(); return;
    }
    if (S.lv.type === 'free') { const v = nearVertex(pn.w, 18); S.hover = v; }
    if (S.lastTap && S.lastTap.id === 'bg' && now - S.lastTap.t < 380) { S.userView = false; fitView(); }
    S.lastTap = { id: 'bg', t: now };
    S.sel = null; refreshTray(); draw();
  }
  function startPinch() {
    const pts = Array.from(S.ptrs.values());
    S.pan = null;
    S.pinch = { d0: Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]), m0: [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2], s0: S.view.s, ox0: S.view.ox, oy0: S.view.oy };
  }
  function pinchMove() {
    const pts = Array.from(S.ptrs.values()); if (pts.length < 2) return;
    const pc = S.pinch;
    const d = Math.hypot(pts[0][0] - pts[1][0], pts[0][1] - pts[1][1]);
    const m = [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2];
    const s = Math.max(10, Math.min(160, pc.s0 * d / pc.d0));
    const w = [(pc.m0[0] - pc.ox0) / pc.s0, (pc.m0[1] - pc.oy0) / pc.s0];
    S.view.s = s; S.view.ox = m[0] - w[0] * s; S.view.oy = m[1] - w[1] * s;
    S.userView = true; draw();
  }
  function wheel(e) {
    e.preventDefault();
    const [x, y] = localXY(e);
    const k = Math.exp(-e.deltaY * 0.0015);
    const s = Math.max(10, Math.min(160, S.view.s * k));
    const w = toW(x, y);
    S.view.s = s; S.view.ox = x - w[0] * s; S.view.oy = y + w[1] * s;
    S.userView = true;
    if (S.drag) moveDrag(Object.assign({ pointerId: S.drag.pid }, { clientX: e.clientX, clientY: e.clientY }));
    draw();
  }

  /* ---------- 바꾼 뒤 확인 ---------- */
  function removePiece(id) {
    const i = S.pcs.findIndex(p => p.id === id); if (i < 0) return;
    const p = S.pcs[i]; if (p.fixed) return;
    pushUndo();
    S.pcs.splice(i, 1);
    if (S.inv) S.inv[p.n] = (S.inv[p.n] || 0) + 1;
    if (S.sel === id) S.sel = null;
    changed();
  }
  function changed() {
    S.sel = null; S.ghost = null; S.badId = null; S.hover = null;
    for (const b of $$('#tray .pulse')) b.classList.remove('pulse');
    analyze();
    refreshTray();
    if (S.lv.type === 'fill') checkFill();
    else if (S.lv.type === 'flower') checkFlower();
    else if (S.lv.type === 'free') { P.creative = S.pcs.map(p => ({ n: p.n, v: p.v.map(q => [+q[0].toFixed(6), +q[1].toFixed(6)]) })); save(); }
    if (S.lv.type !== 'free') saveProg();
    renderPanel();
    draw();
  }
  function analyze(silent = false) {
    const polys = S.pcs.map(p => p.v);
    S.vx = polys.length ? G.analyzeVertices(polys) : [];
    S.full = [];
    let fresh = [];
    for (const v of S.vx) {
      if (Math.abs(v.sum - 360) < 0.01 && !v.tj) {
        const code = G.canonical(G.cornerSequence(v, polys));
        S.full.push({ x: v.x, y: v.y, code });
        if (DEX_ALL.includes(code) && !P.dex[code]) { P.dex[code] = Date.now(); fresh.push(code); }
      }
    }
    // 규칙 무늬
    S.uniform = null;
    if (S.lv && S.lv.type === 'free' && S.full.length >= 6) {
      const c0 = S.full[0].code;
      if (S.full.every(v => v.code === c0)) {
        S.uniform = c0;
        if (!P.uni.includes(c0)) { P.uni.push(c0); if (!silent) setTimeout(() => toast(`규칙 무늬 완성! 꽉 찬 꼭짓점이 모두 ${c0} 모양이에요`, 3200), 300); }
      }
    }
    if (fresh.length) {
      save();
      if (!silent) setTimeout(() => toast(`도감에 새 꼭짓점: ${fresh.join(', ')} (${DEX_ALL.filter(c => P.dex[c]).length}/15)`, 2600), 120);
    }
  }
  function checkFill() {
    const lv = S.lv;
    const tot = S.pcs.reduce((s, p) => s + G.area(p.v), 0);
    if (tot >= lv.area - 1e-3) complete();
  }
  function checkFlower() {
    const lv = S.lv, f = lv.flower;
    const cs = cornersAt([0, 0], S.pcs);
    const sum = cs.reduce((s, c) => s + deg(c.n), 0);
    if (Math.abs(sum - 360) > 0.01) return;
    const polys = cs.map(c => c.p.v);
    const seq = cs.map(c => ({ n: c.n, a: Math.atan2(c.p.c[1], c.p.c[0]) })).sort((a, b) => a.a - b.a).map(o => o.n);
    const code = G.canonical(seq);
    if (f.k && cs.length !== f.k) { toast(`꽃은 완성! 그런데 조각이 ${cs.length}개예요. ${f.k}개로 만들어 보세요`, 2800); return; }
    if (S.found.includes(code)) { toast('이미 찾은 꽃이에요. 다른 꽃을 만들어 보세요', 2600); return; }
    S.found.push(code); S.justFound = true;
    const rec = lvRec(lv.id); rec.f = Array.from(new Set((rec.f || []).concat(S.found)));
    if (S.found.length >= f.all) { complete(); return; }
    if (S.found.length >= f.need && rec.s < 1) { rec.s = 1; save(); toast(`통과! 남은 꽃도 찾아보세요 (${S.found.length}/${f.all})`, 2600); }
    else toast(`새 꽃 발견! (${S.found.length}/${f.all})`);
    save();
    S.clearing = true; S.flash = performance.now();
    setTimeout(() => { if (S.lv !== lv) return; S.clearing = false; S.justFound = false; pushUndo(); S.pcs = []; S.undo = []; saveProg(); renderPanel(); analyze(true); draw(); }, 1100);
  }

  /* ---------- 완성 ---------- */
  function complete() {
    if (S.done) return;
    S.done = true; S.flash = performance.now(); draw();
    const lv = S.lv;
    clearProg(lv);
    let stars = 2, note = '';
    if (lv.type === 'fill') {
      const count = S.pcs.filter(p => !p.fixed).length;
      if (lv.unlimited) { stars = count <= lv.target ? 2 : 1; note = `조각 <b>${count}</b>개로 채웠어요.` + (stars === 2 ? '' : ` ${lv.target}개 이하로 다시 도전해 볼까요?`); }
      else { stars = S.hints ? 1 : 2; if (S.hints) note = `힌트를 ${S.hints}번 썼어요. 힌트 없이 풀면 별이 두 개!`; }
    }
    if (lv.custom) {
      P.solvedIds = P.solvedIds || [];
      const mine = P.made.some(m => m.code === lv.code);
      const hc = hashCode(lv.code || '');
      if (!mine && !P.solvedIds.includes(hc)) { P.solvedIds.push(hc); P.solved = (P.solved || 0) + 1; }
    }
    else {
      const rec = lvRec(lv.id);
      rec.s = Math.max(rec.s || 0, stars);
      rec.h = Math.min(rec.h ?? 99, S.hints);
    }
    trackStop(true);
    let msg = '';
    if (lv.type === 'fill' && lv.pattern) msg = `꽉 찬 꼭짓점이 모두 <b class="mono">${lv.pattern}</b> 모양이에요. 이 규칙대로라면 끝없이 이어 붙일 수 있어요.`;
    else if (lv.dots && lv.dots.length && lv.type === 'fill') {
      const sums = lv.dots.map(d => fmtDeg(cornersAt(d, S.pcs).reduce((s, c) => s + deg(c.n), 0)));
      msg = `가운데 점에 모인 각: <b class="mono">${sums.join(' · ')}</b><br>빈틈은 그대로 두세요. 언젠가 다시 만날 거예요.`;
    } else if (lv.type === 'flower' && lv.flower.impossible) {
      msg = `정오각형의 한 각은 <b class="mono">108°</b>. 3개면 <b class="mono">324°</b>로 <b class="mono">36°</b>가 모자라고, 4개면 <b class="mono">432°</b>로 넘쳐요.`;
    } else if (lv.type === 'flower') {
      msg = lv.flower.all > 1 ? `${lv.flower.all}가지 꽃을 모두 찾았어요. 꽃마다 가운데 각의 합은 언제나 <b class="mono">360°</b>!` : `가운데 점에 모인 각의 합: <b class="mono">360°</b>`;
    }
    const art = lv.type === 'flower' ? (S.found.length ? flowerSVG(S.found[S.found.length - 1]) : (lv.flower.impossible ? svgOfPolys(S.pcs.map(p => ({ v: p.v, n: p.n, kind: 'piece' })), { pad: 0.3, dots: [[0, 0]] }) : ''))
      : svgOfPolys(S.pcs.map(p => ({ v: p.v, n: p.n, kind: 'piece' })), { pad: 0.2, dots: lv.dots });
    const idx = ORDER.indexOf(lv.id);
    let next = null;
    if (!lv.custom && idx >= 0) for (let i = idx + 1; i < ORDER.length; i++) if (stageOpen(DEFS[i].stage)) { next = DEFS[i]; break; }
    setTimeout(() => {
      if (S.lv !== lv || !S.done || $('#play').hidden) return;
      openSheet(`
        <div class="sheet-head"><h3>완성!</h3></div>
        <div class="big-stars">${STAR(stars >= 1)}${STAR(stars >= 2)}</div>
        ${art ? `<div class="done-art">${art}</div>` : ''}
        ${msg ? `<p class="done-msg">${msg}</p>` : ''}
        ${note ? `<p class="done-msg">${note}</p>` : ''}
        <div class="actions">
          <button class="btn" data-act="home">목록</button>
          <button class="btn" data-act="replay">다시 하기</button>
          ${lv.pattern ? `<button class="btn" data-act="extend">끝없이 이어 보기</button>` : ''}
          ${next ? `<button class="btn primary" data-go="${next.id}">다음 · ${next.id} ${next.title}</button>` : (lv.custom && Sync.on ? `<button class="btn primary" data-act="friends">다른 친구 퍼즐 풀기</button>` : !lv.custom && stageOpen(5) ? `<button class="btn primary" data-act="free">나만의 모양 만들기</button>` : `<button class="btn primary" data-act="record">나의 기록 보기</button>`)}
        </div>`);
    }, 650);
  }

  /* ---------- 무늬 넓히기 ---------- */
  const EXT = {
    '3.3.3.3.3.3': { n: 3, v: [k => Tiles.tiling('3.3.3.3.3.3', k)] },
    '4.4.4.4': { n: 4, v: [k => Tiles.tiling('4.4.4.4', k)] },
    '6.6.6': { n: 6, v: [k => Tiles.tiling('6.6.6', k)] },
    '3.6.3.6': { n: 6, v: [k => Tiles.tiling('3.6.3.6', k)] },
    '3.4.6.4': { n: 6, v: [k => Tiles.tiling('3.4.6.4', k)] },
    '3.12.12': { n: 12, v: [k => Tiles.tiling('3.12.12', k)] },
    '4.6.12': { n: 12, v: [k => Tiles.tiling('4.6.12', k)] },
    '4.8.8': { n: 8, v: [k => Tiles.tiling('4.8.8', k)] },
    '3.3.3.4.4': { n: 4, v: [k => Tiles.tiling('3.3.3.4.4', k)] },
    '3.3.4.3.4': { n: 4, v: [k => Tiles.snubSquare(k, false), k => Tiles.snubSquare(k, true)] },
    '3.3.3.3.6': { n: 6, v: [k => Tiles.snubHex(k, false), k => Tiles.snubHex(k, true)] },
  };
  function moveTiles(local, th, c0) {
    const c = Math.cos(th), sn = Math.sin(th);
    return local.map(p => { const v = p.v.map(q => [q[0] * c - q[1] * sn + c0[0], q[0] * sn + q[1] * c + c0[1]]); return { n: p.n, v, c: G.centroid(v) }; });
  }
  function findTiling(pcs, code) {
    const sp = EXT[code]; if (!sp) return null;
    const p0 = pcs.find(p => p.n === sp.n); if (!p0) return null;
    const c0 = p0.c;
    const base = Math.atan2(p0.v[1][1] - p0.v[0][1], p0.v[1][0] - p0.v[0][0]);
    const R = Math.max(...pcs.map(p => Math.hypot(p.c[0] - c0[0], p.c[1] - c0[1]))) + 1.2;
    for (const make of sp.v) for (let k = 0; k < sp.n; k++) {
      const th = base + k * 2 * Math.PI / sp.n;
      const tr = moveTiles(make(c => Math.hypot(c[0], c[1]) < R), th, c0);
      if (pcs.every(p => tr.some(q => q.n === p.n && Math.hypot(q.c[0] - p.c[0], q.c[1] - p.c[1]) < 3e-3))) return { make, th, c0, R };
    }
    return null;
  }
  function extendPattern(show) {
    const code = show ? S.lv.pattern : S.uniform;
    if (!code || !EXT[code]) { toast('이 무늬는 한 가지 꼭짓점만으로는 끝없이 이어지지 않아요', 3000); return; }
    const f = findTiling(S.pcs, code);
    if (!f) { toast('조각이 한 가지 규칙으로 이어져 있지 않아서 넓힐 수 없어요', 3200); return; }
    const cur = Math.max(...S.pcs.map(p => Math.hypot(p.c[0] - f.c0[0], p.c[1] - f.c0[1])));
    const R = cur + (show ? 4.2 : 2.6);
    const tr = moveTiles(f.make(c => Math.hypot(c[0], c[1]) < R), f.th, f.c0);
    const add = tr.filter(q => !S.pcs.some(p => p.n === q.n && Math.hypot(q.c[0] - p.c[0], q.c[1] - p.c[1]) < 3e-3))
      .filter(q => { const bb = G.bbox(q.v); return !S.pcs.some(p => G.bboxHit(bb, p.bb, 0.01) && G.overlap(q.v, p.v)); });
    if (!show && S.pcs.length + add.length > 520) { toast('판이 꽉 찼어요. 더는 넓힐 수 없어요'); return; }
    if (!add.length) { toast('더 넓힐 자리가 없어요'); return; }
    if (!show) pushUndo();
    const t0 = performance.now();
    add.sort((a, b) => Math.hypot(a.c[0] - f.c0[0], a.c[1] - f.c0[1]) - Math.hypot(b.c[0] - f.c0[0], b.c[1] - f.c0[1]));
    add.forEach((q, i) => { const p = mk(q.n, q.v); p.ext = show; S.pcs.push(p); S.placedAt.set(p.id, t0 + i * 6); });
    if (show) { S.ext = true; S.userView = false; S.lv.bbox = G.bboxUnion([S.lv.bbox].concat(add.map(q => G.bbox(q.v)))); fitView(); analyze(true); draw(); toast(`같은 규칙으로 ${add.length}조각을 더 이었어요`); }
    else { S.userView = false; changed(); fitView(); draw(); toast(`무늬를 ${add.length}조각 더 넓혔어요`); }
  }

  /* ---------- 힌트 ---------- */
  function hint() {
    const lv = S.lv; if (S.done) return;
    if (lv.type === 'fill') {
      const solC = lv.sol.map(p => ({ n: p.n, v: p.v, c: G.centroid(p.v) }));
      const same = (a, p) => a.n === p.n && Math.hypot(a.c[0] - p.c[0], a.c[1] - p.c[1]) < 2e-3;
      const bad = S.pcs.find(p => !p.fixed && !solC.some(s => same(s, p)));
      S.hints++;
      if (bad) { S.badId = bad.id; toast('빨간 점선 조각을 다른 곳에 놓아 보세요 (다른 방법일 수도 있어요)', 3200); }
      else {
        const nx = solC.find(s => !S.pcs.some(p => same(s, p)));
        if (nx) { S.ghost = nx; toast(`${NAME[nx.n]}이 들어갈 자리예요`); }
      }
      saveProg(); renderPanel(); draw();
    } else if (lv.type === 'flower') {
      const left = lv.flowers.filter(c => !S.found.includes(c));
      if (!left.length) return;
      const c = left[0];
      const cnt = {}; c.split('.').forEach(n => cnt[n] = (cnt[n] || 0) + 1);
      const words = Object.keys(cnt).map(Number).sort((a, b) => a - b).map(n => `${SHORT[n]} ${cnt[n]}개`).join(' + ');
      const sameSet = S.found.some(f => f.split('.').sort().join() === c.split('.').sort().join());
      S.hints++; saveProg();
      toast(sameSet ? `찾은 꽃과 같은 조각(${words})으로, 놓는 순서를 바꿔 보세요` : `${words}로 만드는 꽃이 남았어요`, 3600);
    }
  }

  /* ---------- 단추 동작 ---------- */
  const ACT = {
    home: () => { closeSheet(); show('home'); },
    record: () => openRecord(),
    dex: () => openDex(),
    free: () => { closeSheet(); startLevel({ id: 'free', stage: 5, type: 'free', title: '나만의 모양', goal: '조각을 마음껏 이어 붙여 무늬를 만들어요. 가까이 놓으면 변끼리 착 붙어요.' }); },
    playcode: () => {
      const code = ($('#codeIn').value || '').trim();
      const r = decodePuzzle(code);
      if (!r) { toast('코드를 읽을 수 없어요. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요', 3400); return; }
      playCustom(r, code);
    },
    undo: () => {
      if ((S.drag && !S.drag.carry) || S.clearing || S.done) return;
      const s = S.undo.pop(); if (!s) { toast('되돌릴 것이 없어요'); return; }
      restore(s); S.sel = null; S.ghost = null; S.badId = null;
      analyze(true); refreshTray(); renderPanel();
      if (S.lv.type === 'free') { P.creative = S.pcs.map(p => ({ n: p.n, v: p.v })); save(); }
      else saveProg();
      if (S.drag && S.drag.carry) { S.drag.cands = buildCands(S.drag.n, null); if (S.inv && !(S.inv[S.drag.n] > 0)) endCarry(); else if (S.drag.lastXY) { const r = cv().getBoundingClientRect(); moveDrag({ pointerId: 'carry', clientX: S.drag.lastXY[0] + r.left, clientY: S.drag.lastXY[1] + r.top }); } }
      draw();
    },
    reset: () => { endCarry(); if (S.drag) return; pushUndo(); startLevelKeepUndo(); },
    replay: () => { closeSheet(); if (S.lv.custom) playCustom(S.lv.decoded, S.lv.code, S.lv.meta, { fresh: true }); else startLevel(DEFS.find(d => d.id === S.lv.id), { fresh: true }); },
    friends: () => { closeSheet(); show('home'); const el = $('#fpPanel'); if (el) el.scrollIntoView({ block: 'center' }); },
    extend: () => { closeSheet(); extendPattern(true); },
    grow: () => extendPattern(false),
    hint: () => hint(),
    fit: () => { S.userView = false; fitView(); draw(); },
    remove: () => { if (S.sel) removePiece(S.sel); },
    rotate: () => rotateSel(15),
    togglevx: (el) => { S.showVx = !S.showVx; el.setAttribute('aria-pressed', S.showVx); draw(); },
    togglecard: () => { S.cardOpen = !S.cardOpen; renderPanel(); },
    impossible: () => {
      const cs = cornersAt([0, 0], S.pcs).filter(c => c.n === 5);
      if (cs.length < 3) { toast('먼저 정오각형을 가운데 점에 여러 개 모아 보세요', 2800); return; }
      S.found = []; complete();
    },
    clearall: (el) => {
      if (!S.pcs.length) return;
      if (el.dataset.sure) { pushUndo(); S.pcs = []; changed(); el.dataset.sure = ''; el.querySelector('.lbl').textContent = '모두 지우기'; return; }
      el.dataset.sure = '1'; el.querySelector('.lbl').textContent = '한 번 더 누르면 지워요';
      setTimeout(() => { if (el.isConnected) { el.dataset.sure = ''; el.querySelector('.lbl').textContent = '모두 지우기'; } }, 2600);
    },
    mkpuzzle: () => openMakePuzzle(),
    saveimg: () => saveCreationImage(),
    close: () => closeSheet(),
  };
  function startLevelKeepUndo() {
    const u = S.undo; const lv = S.lv;
    if (lv.custom) { playCustom(lv.decoded, lv.code, lv.meta, { fresh: true }); } else startLevel(DEFS.find(d => d.id === lv.id) || lv, { fresh: true });
    S.undo = u;
  }
  function rotateSel(step) {
    const p = S.pcs.find(q => q.id === S.sel); if (!p || p.fixed || S.lv.type !== 'free') return;
    const rot = Math.atan2(p.v[1][1] - p.v[0][1], p.v[1][0] - p.v[0][0]) * 180 / Math.PI + step;
    const v = G.regular(p.n, p.c[0], p.c[1], rot);
    const others = S.pcs.filter(q => q.id !== p.id);
    if (placeCheck(v, G.bbox(v), others) !== 'ok') { toast('돌리면 다른 조각과 겹쳐요'); return; }
    pushUndo(); p.v = v; p.bb = G.bbox(v);
    const id = p.id; analyze(); P.creative = S.pcs.map(q => ({ n: q.n, v: q.v })); save(); S.sel = id; renderPanel(); draw();
  }

  /* ---------- 창 ---------- */
  function openSheet(html, wide = false) {
    const m = $('#modal');
    m.innerHTML = `<div class="sheet${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
    m.hidden = false;
    const f = m.querySelector('.actions .btn.primary') || m.querySelector('.btn'); if (f) f.focus({ preventScroll: true });
  }
  function closeSheet() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSheet(); });

  /* 도감 */
  function openDex() {
    const n = DEX_ALL.filter(c => P.dex[c]).length;
    let h = `<div class="sheet-head"><h3>꼭짓점 도감</h3><span class="mono">${n} / 15</span><button class="btn small" data-act="close">닫기</button></div>
      <p class="hint-line">한 점을 정다각형으로 빈틈없이 둘러싸는 방법을 모았어요. 숫자는 둘레에 놓인 조각의 변의 개수예요. <span class="badge-inf">∞</span> 표시는 이 꼭짓점만 되풀이해서 평면 전체를 덮을 수 있는 모양이에요.</p>`;
    for (const g of DEX) {
      h += `<div class="dex-group"><h4>조각 ${g.k}개</h4><div class="dex-grid">`;
      for (const c of g.list) {
        h += P.dex[c] ? `<div class="dex-cell got">${flowerSVG(c)}<span class="mono">${c}</span>${ALONE.has(c) ? '<span class="badge-inf">∞ 끝없이</span>' : '<span class="badge-inf" style="color:var(--ink-3)">섞어야 이어져요</span>'}</div>`
          : `<div class="dex-cell"><div class="q">?</div><span class="mono" style="color:var(--ink-3)">조각 ${g.k}개</span></div>`;
      }
      h += `</div></div>`;
    }
    openSheet(h, true);
  }

  /* 나의 기록 */
  function stats() {
    const st = LV.STAGES.map(s => {
      const ds = DEFS.filter(d => d.stage === s.id);
      return { id: s.id, name: s.name, n: ds.length, c: ds.filter(d => (P.levels[d.id] || {}).s > 0).length, s: ds.reduce((a, d) => a + ((P.levels[d.id] || {}).s || 0), 0) };
    });
    const cleared = st.reduce((a, s) => a + s.c, 0), stars = st.reduce((a, s) => a + s.s, 0);
    const flowers = DEFS.filter(d => d.type === 'flower').reduce((a, d) => a + (((P.levels[d.id] || {}).f || []).length), 0);
    return { st, cleared, stars, total: DEFS.length, dex: DEX_ALL.filter(c => P.dex[c]).length, flowers, uni: P.uni.slice(), made: P.made.length, solved: P.solved || 0, hints: P.hints || 0 };
  }
  function displayName() {
    if (WHO && !WHO.local) return `${WHO.className || WHO.classId} ${WHO.no}번 ${WHO.name}`;
    return P.name || '';
  }
  // 5단계(나만의 모양) 기록을 보여 줄지: 열려 있거나, 이미 해 둔 것이 있을 때만
  const show5 = s => stageOpen(5) || s.uni.length > 0 || s.made > 0 || s.solved > 0;
  function openRecord() {
    const s = stats();
    const five = show5(s);
    const h = `<div class="sheet-head"><h3>나의 기록</h3><button class="btn small" data-act="close">닫기</button></div>
      <div class="row"><label class="lab" for="recName">이름</label><input class="field" id="recName" style="max-width:260px" maxlength="20" placeholder="번호와 이름" value="${esc(displayName())}"></div>
      ${Sync.on ? `<p class="hint-line">${ICON.cloud} 기록은 선생님께 자동으로 저장돼요. 생각 쓰기도 함께 저장돼요.</p>` : ''}
      <div class="rec-grid"${five ? '' : ' style="grid-template-columns:repeat(2,minmax(0,1fr))"'}>
        <div class="rec-box"><span class="k">해결한 퍼즐</span><span class="v">${s.cleared}<small> / ${s.total}</small></span></div>
        <div class="rec-box"><span class="k">모은 별</span><span class="v">${s.stars}<small> / ${s.total * 2}</small></span></div>
        <div class="rec-box"><span class="k">꼭짓점 도감</span><span class="v">${s.dex}<small> / 15</small></span></div>
        ${five ? `<div class="rec-box"><span class="k">규칙 무늬</span><span class="v">${s.uni.length}<small>종</small></span></div>
        <div class="rec-box"><span class="k">만든 퍼즐 · 푼 친구 퍼즐</span><span class="v">${s.made}<small>개</small> · ${s.solved}<small>개</small></span></div>` : ''}
        <div class="rec-box"><span class="k">힌트 쓴 횟수</span><span class="v">${s.hints}<small>번</small></span></div>
      </div>
      <div class="rec-list">${s.st.map(t => `<div><b>${t.id}단계 ${t.name}</b> ${t.c} / ${t.n} · 별 ${t.s}</div>`).join('')}
        ${s.uni.length ? `<div><b>내가 만든 규칙 무늬</b> <span class="mono">${s.uni.join(', ')}</span></div>` : ''}
        ${P.made.length ? `<div><b>마지막에 만든 퍼즐</b> ${esc(P.made[P.made.length - 1].title)} (조각 ${P.made[P.made.length - 1].n}개)</div>` : ''}</div>
      <label class="lab" for="recMemo">생각 쓰기 · 정오각형으로는 왜 한 점을 빈틈없이 둘러쌀 수 없을까요? 각의 크기로 설명해 보세요.</label>
      <textarea class="field" id="recMemo" maxlength="400" placeholder="예) 정오각형의 한 각은 ...">${esc(P.memo || '')}</textarea>
      ${Sync.on ? '' : `<p class="hint-line">다 썼으면 <b>그림으로 저장</b>하거나 <b class="mono">Win + Shift + S</b>로 이 창을 캡처해 패들렛에 올려요.</p>`}
      <div class="actions">${Sync.on
        ? `<button class="btn" id="recSave">${ICON.img}그림으로 저장</button><button class="btn primary" data-act="close">닫기</button>`
        : `<button class="btn" data-act="close">닫기</button><button class="btn primary" id="recSave">${ICON.img}그림으로 저장</button>`}</div>`;
    openSheet(h, true);
    $('#recName').addEventListener('input', e => { P.name = e.target.value; save(); });
    if (Sync.on) { const el = $('#recName'); el.readOnly = true; el.title = '이름은 처음 들어올 때 정해요'; }

  /* ---------- 그림 만들기 ---------- */
  function polysToCanvas(ctx, items, box, opt = {}) {
    // items: [{v,n}] → box [x,y,w,h]
    if (!items.length) return;
    const bb = G.bboxUnion(items.map(o => G.bbox(o.v)));
    const pad = opt.pad ?? 0.3;
    const w = bb[2] - bb[0] + 2 * pad, h = bb[3] - bb[1] + 2 * pad;
    const s = Math.min(box[2] / w, box[3] / h);
    const ox = box[0] + (box[2] - w * s) / 2, oy = box[1] + (box[3] - h * s) / 2;
    const X = p => ox + (p[0] - bb[0] + pad) * s, Y = p => oy + (bb[3] - p[1] + pad) * s;
    for (const o of items) {
      ctx.beginPath(); o.v.forEach((p, i) => i ? ctx.lineTo(X(p), Y(p)) : ctx.moveTo(X(p), Y(p))); ctx.closePath();
      ctx.fillStyle = COL[o.n]; ctx.fill(); ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1, s * 0.035); ctx.strokeStyle = shade(COL[o.n], 0.6); ctx.stroke();
    }
    if (opt.dot) { ctx.beginPath(); ctx.arc(X([0, 0]), Y([0, 0]), Math.max(2, s * 0.08), 0, Math.PI * 2); ctx.fillStyle = '#1B2232'; ctx.fill(); }
  }
  async function offerFile(canvas, filename, title) {

    if (DL && blob) {
      try { await DL.save({ filename, data: blob }); toast('저장했어요'); return; }
      catch (err) { if (err && err.code === 'declined') return; }
    }
    const url = canvas.toDataURL('image/png');
    openSheet(`<div class="sheet-head"><h3>${esc(title)}</h3><button class="btn small" data-act="close">닫기</button></div>
      <img src="${url}" alt="${esc(title)}" style="width:100%;border-radius:12px;border:1px solid var(--line)">
      <p class="hint-line">그림을 마우스 오른쪽 단추로 눌러 <b>이미지를 다른 이름으로 저장</b>하거나 ${Sync.on ? '<b>이미지 복사</b>를 고르세요' : '<b>이미지 복사</b>해서 패들렛에 붙여 넣으세요'}. (휴대폰은 그림을 길게 눌러요)</p>`, true);

  function saveRecordImage() {
    readColors();
    const s = stats();
    const boxes = [['해결한 퍼즐', `${s.cleared} / ${s.total}`], ['모은 별', `${s.stars} / ${s.total * 2}`], ['꼭짓점 도감', `${s.dex} / 15`]]
      .concat(show5(s) ? [['규칙 무늬', `${s.uni.length}종`], ['만든 퍼즐', `${s.made}개`], ['푼 친구 퍼즐', `${s.solved}개`]] : []);
    const rowsUp = (2 - Math.ceil(boxes.length / 3)) * 150;  // 한 줄이면 아래 내용을 150px 올림
    const c = document.createElement('canvas'); c.width = 1200; c.height = 1500 - rowsUp;
    const ctx = c.getContext('2d');
    const F = (w, px, fam = '"IBM Plex Sans KR", "Malgun Gothic", sans-serif') => `${w} ${px}px ${fam}`;
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, 1200, c.height);
    ctx.fillStyle = '#EEF1F5'; ctx.fillRect(0, 0, 1200, 170);
    polysToCanvas(ctx, flowerPolys('3.4.6.4'), [50, 30, 110, 110], { pad: 0.1 });
    ctx.fillStyle = '#1B2232'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = F('400', 64, '"Do Hyeon", "Malgun Gothic", sans-serif'); ctx.fillText('빈틈없이 · 나의 기록', 185, 105);
    ctx.font = F('500', 26); ctx.fillStyle = '#505B70';
    const dt = new Date(); ctx.fillText(`${displayName() || '이름 없음'}   ${dt.getFullYear()}.${dt.getMonth() + 1}.${dt.getDate()}`, 187, 145);
    boxes.forEach((b, i) => {
      const x = 50 + (i % 3) * 370, y = 210 + Math.floor(i / 3) * 150;
      ctx.fillStyle = '#F4F6F9'; roundRect(ctx, x, y, 350, 128, 18); ctx.fill();
      ctx.fillStyle = '#505B70'; ctx.font = F('600', 24); ctx.fillText(b[0], x + 24, y + 44);
      ctx.fillStyle = '#1B2232'; ctx.font = F('400', 52, '"Do Hyeon", "Malgun Gothic", sans-serif'); ctx.fillText(b[1], x + 24, y + 104);
    });
    let y = 560 - rowsUp;
    ctx.font = F('600', 26); ctx.fillStyle = '#1B2232';
    ctx.fillText(s.st.map(t => `${t.id}단계 ${t.c}/${t.n}`).join('    ') + `    힌트 ${s.hints}번`, 50, y);
    y += 40;
    ctx.font = F('600', 24); ctx.fillStyle = '#505B70'; ctx.fillText('꼭짓점 도감', 50, y + 16);
    y += 34;
    DEX_ALL.forEach((code, i) => {
      const x = 50 + (i % 8) * 138, yy = y + Math.floor(i / 8) * 150;
      ctx.strokeStyle = '#CDD4DE'; ctx.lineWidth = 2; roundRect(ctx, x, yy, 124, 136, 14); ctx.stroke();
      if (P.dex[code]) {
        polysToCanvas(ctx, flowerPolys(code), [x + 10, yy + 6, 104, 98], { pad: 0.12, dot: true });
        ctx.fillStyle = '#1B2232'; ctx.font = F('600', 17, '"IBM Plex Mono", Consolas, monospace'); ctx.textAlign = 'center'; ctx.fillText(code, x + 62, yy + 126); ctx.textAlign = 'left';
      } else { ctx.fillStyle = '#B5BDC9'; ctx.font = F('400', 48, '"Do Hyeon", sans-serif'); ctx.textAlign = 'center'; ctx.fillText('?', x + 62, yy + 84); ctx.textAlign = 'left'; }
    });
    y += 320;
    if (s.uni.length) { ctx.fillStyle = '#1B2232'; ctx.font = F('600', 26); ctx.fillText('규칙 무늬: ' + s.uni.join(', '), 50, y); y += 46; }
    ctx.fillStyle = '#505B70'; ctx.font = F('600', 24); ctx.fillText('생각 쓰기 — 정오각형으로 한 점을 빈틈없이 둘러쌀 수 없는 까닭', 50, y); y += 42;
    ctx.fillStyle = '#1B2232'; ctx.font = F('400', 27);
    const memo = (P.memo || '(아직 쓰지 않았어요)').replace(/\s+/g, ' ');
    let line = '';
    for (const ch of memo) {
      if (ctx.measureText(line + ch).width > 1100) { ctx.fillText(line, 50, y); y += 40; line = ''; if (y > c.height - 40) break; }
      line += ch;
    }
    if (line && y <= c.height - 40) ctx.fillText(line, 50, y);
    offerFile(c, `빈틈없이-기록${P.name ? '-' + P.name.replace(/[\\/:*?"<>|]/g, '') : ''}.png`, '나의 기록');
  }
