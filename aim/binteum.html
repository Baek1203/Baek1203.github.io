        <li><b>나만의 모양 20분</b> 규칙 무늬 미션 → 나만의 퍼즐을 만들어 <b>퍼즐 코드</b>를 패들렛에 올리기 → 친구가 올린 코드를 첫 화면 <b>친구 퍼즐 풀기</b>에 붙여 넣어 풀기. 시간이 모자란 반은 5단계를 열지 않고 4단계와 도감 채우기로 마무리해도 됩니다.</li>
        <li><b>기록 10분</b> '나의 기록'에서 생각 쓰기를 채운 뒤, <b>그림으로 저장</b>하거나 Win + Shift + S로 캡처해 패들렛에 제출합니다.</li>
      </ol>
      <h4>5단계 여닫기</h4>
      <p>5단계(나만의 모양)는 처음에 닫혀 있어요. 5단계까지 하는 반에는 학생에게 주는 주소 끝에 <span class="mono">#s5</span>를 붙여 엽니다. 이 기기만 열려면 '관리' 탭을 쓰세요.</p>
      <h4>조작 요약</h4>
      <ul><li>끌어서 놓기, 판의 조각은 우클릭이나 두 번 눌러 빼기(또는 아래 받침으로 끌어다 놓기)</li><li>숫자 키 1·2·3…으로 받침의 조각을 집으면 마우스를 따라오고, 누르는 곳에 놓여요 (같은 조각이 남아 있으면 계속 들고 있음 · Esc나 오른쪽 클릭으로 그만)</li><li>Ctrl + Z 되돌리기, 판 빈 곳을 끌면 이동, 휠로 확대</li><li>자유 만들기에서만 R 키로 고른 조각 돌리기</li></ul>
    </div>`,
    level: `<div class="guide">
      <p>학생이 패들렛에 올린 <b>나의 기록 그림</b>(해결 수·도감 수·규칙 무늬·만든 퍼즐·생각 쓰기)과 수업 중 관찰을 함께 봅니다.</p>
      <div class="tbl-wrap"><table class="lvl-table">
        <tr><th>수준</th><th>기록으로 확인</th><th>설명으로 확인 (생각 쓰기)</th></tr>
        <tr><td><b>상</b></td><td>4단계 6개 이상 해결, 꼭짓점 도감 12개 이상, (5단계를 연 반은) 두 가지 이상 조각의 규칙 무늬 또는 조각 8개 이상 퍼즐 제작</td><td>108° × 3 = 324°는 모자라고 108° × 4 = 432°는 넘친다처럼 각의 합 360°와 비교해 정확히 설명</td></tr>
        <tr><td><b>중</b></td><td>1~3단계 20개 중 17개 이상, 4단계 2개 이상 해결, 도감 7개 이상</td><td>"한 점에 모인 각이 360°가 되어야 한다"는 말은 있으나 계산이나 근거가 일부 빠짐</td></tr>
        <tr><td><b>하</b></td><td>1·2단계 중심, 도감 6개 이하, 힌트를 자주 사용</td><td>"안 맞아서", "틈이 생겨서"처럼 현상만 말함</td></tr>
      </table></div>
      <p class="hint-line">두 기준이 다르면 설명 쪽을 더 무겁게 봅니다. 힌트 횟수는 참고만 합니다. 5단계를 열지 않은 반은 '규칙 무늬·퍼즐 제작' 조건을 빼고 봅니다.</p>
      <h4>세특 문장 예시</h4>
      <div class="quote"><b>상</b> 정다각형 조각으로 한 점을 빈틈없이 둘러싸는 조건을 탐구하여 한 점에 모인 각의 합이 360°여야 함을 발견하고, 정오각형의 한 내각 108°로는 3개면 모자라고 4개면 넘쳐 평면을 채울 수 없음을 계산으로 설명함. 여러 종류의 정다각형을 섞어 모든 꼭짓점이 같은 모양인 규칙 무늬를 설계하고, 이를 친구가 풀 수 있는 퍼즐로 만들어 공유함.</div>
      <div class="quote"><b>중</b> 정다각형 조각을 한 점에 모으는 활동에서 각의 합이 360°일 때 빈틈이 생기지 않음을 알아내고, 여러 종류의 조각을 활용해 자신만의 퍼즐을 만들어 친구와 바꾸어 풂.</div>
      <div class="quote"><b>하</b> 정다각형 조각을 회색 영역에 맞추는 퍼즐 활동에 꾸준히 참여하며, 조각의 모양에 따라 맞는 자리가 다르다는 것을 경험함.</div>
    </div>`,
    secret: `<div class="guide">
      <div class="note">정다면체 단원에서 쓰는 화면이에요. 그전까지는 학생에게 보여 주지 마세요.</div>
      <p>3단계의 <b>부채 세 개</b>(세모 3·4·5개)와 <b>부채 두 개</b>(네모 3개, 오각형 3개)는 사실 정다면체 다섯 개의 꼭짓점을 펼친 모양이에요. 학생들은 가운데 점에 180°, 240°, 300°, 270°, 324°가 모이고 빈틈이 남는 것을 이미 보았어요.</p>
      <ol>
        <li>"그때 그 부채, 기억나요? 빈틈은 그대로 두라고 했죠."</li>
        <li>빈틈을 닫으면 점이 솟아올라 입체의 꼭짓점이 되는 것을 보여 줍니다.</li>
        <li>세모 6개·네모 4개·육각형 3개는 빈틈이 0이라 접을 수 없고 평면을 덮을 뿐이며(테셀레이션), 360°를 넘으면 모일 수조차 없음을 확인합니다.</li>
        <li>그래서 가능한 경우는 다섯 가지뿐, 정다면체는 5종류.</li>
      </ol>
      <div class="row"><button class="btn primary" id="openLab">빈틈의 비밀 열기</button></div>
    </div>`,
  };

  /* ---------- 키보드 ---------- */
  document.addEventListener('keydown', e => {
    if ($('#play').hidden) return;
    if (e.target.closest('input, textarea')) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); ACT.undo(); return; }
    if (e.key === 'Escape') {
      if (!$('#modal').hidden) { closeSheet(); return; }
      if (S.drag && S.drag.carry) { endCarry(); return; }
      if (S.drag) { cancelDrag({ pointerId: S.drag.pid }); return; }
      S.sel = null; refreshTray(); draw(); return;
    }
    if (/^[1-9]$/.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey) {
      if (!$('#modal').hidden || !S.lv) return;
      const n = S.lv.allow[+e.key - 1];
      if (n) { e.preventDefault(); startCarry(n); }
      return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace') { if (S.sel) { e.preventDefault(); removePiece(S.sel); } return; }
    if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ' || e.key === 'e' || e.key === 'E' || e.key === 'ㄷ') {
      const step = (e.key === 'e' || e.key === 'E' || e.key === 'ㄷ') ? -15 : 15;
      if (S.drag && S.lv.type === 'free') { S.drag.rot += step; if (S.drag.lastXY) moveDrag({ pointerId: S.drag.pid, clientX: S.drag.lastXY[0] + cv().getBoundingClientRect().left, clientY: S.drag.lastXY[1] + cv().getBoundingClientRect().top }); }
      else rotateSel(step);
    }
  });

  /* ---------- 시작 ---------- */
  /* ---------- 들어가기 (기록 서버를 쓸 때) ---------- */
  let LG = { cls: null, no: '', name: '', confirm: null, ok: false, msg: '' };
  function renderLogin(msg) {
    if (msg !== undefined) LG.msg = msg;
    const el = $('#login .home-wrap'); if (!el) return;
    const list = Sync.classes;
    el.innerHTML = `
      <header class="masthead"><div class="logo">${flowerSVG('3.4.6.4')}<div><div class="logo-word">빈틈없이</div><div class="tagline">회색 자리를 겹치지 않게, 빈틈없이 채우는 정다각형 퍼즐</div></div></div></header>
      <div class="panel login-card">
        <h3>들어가기</h3>
        <p>우리 반을 고르고 번호와 이름을 써요. 퍼즐 기록은 선생님께 저장돼요.</p>
        <span class="lab">반</span>
        <div class="seg" id="lgClass">${list.length ? list.map(c => `<button type="button" data-cls="${esc(c.id)}" class="${LG.cls === c.id ? 'on' : ''}">${esc(c.name || c.id)}</button>`).join('') : `<span class="hint-line">${LG.ok ? '아직 만들어진 반이 없어요. 선생님께 알려 주세요.' : '반 목록을 불러오는 중이에요…'}</span>`}</div>
        <div class="login-row">
          <label class="lab" for="lgNo">번호<input class="field" id="lgNo" type="number" inputmode="numeric" min="1" max="99" value="${esc(LG.no)}"></label>
          <label class="lab" for="lgName">이름<input class="field" id="lgName" maxlength="10" autocomplete="off" value="${esc(LG.name)}"></label>
        </div>
        ${LG.confirm ? `<div class="note-box"><p style="margin:0">이 번호에는 <b>${esc(LG.confirm)}</b> 학생의 기록이 있어요. 내가 맞으면 이어서 하고, 아니면 반과 번호를 다시 확인해 주세요.</p><div class="row"><button class="btn primary small" id="lgYes">네, 제 기록이에요</button><button class="btn small" id="lgNoBtn">다시 쓸게요</button></div></div>` : ''}
        <div class="actions"><button class="btn primary" id="lgGo">시작하기</button></div>
        <p class="hint-line" id="lgMsg" role="status">${esc(LG.msg || '')}</p>
        <details class="lg-local"><summary>기록 서버에 연결이 안 되나요?</summary><p class="hint-line">이 기기에만 저장하며 할 수 있어요. 이때는 선생님 대시보드에 기록이 나타나지 않아요.</p><button class="btn small" id="lgLocal">이 기기에만 저장하며 하기</button></details>
      </div>`;
    $('#lgNo').addEventListener('input', e => { LG.no = e.target.value; });
    $('#lgName').addEventListener('input', e => { LG.name = e.target.value; });
    $('#lgName').addEventListener('keydown', e => { if (e.key === 'Enter') loginGo(); });
    $('#lgGo').addEventListener('click', () => loginGo());
    $('#lgLocal').addEventListener('click', () => {
      WHO = { local: true, name: (LG.name || '').trim().slice(0, 10), no: parseInt(LG.no, 10) || 0 };
      try { localStorage.setItem(WKEY, JSON.stringify(WHO)); } catch (e) { }
      if (P.owner && P.owner !== 'local') P = blank();
      P.owner = 'local'; P.name = WHO.name; save(); show('home');
    });
    const y = $('#lgYes'); if (y) y.addEventListener('click', () => loginGo(true));
    const n = $('#lgNoBtn'); if (n) n.addEventListener('click', () => { LG.confirm = null; LG.no = ''; renderLogin(''); });
  }
  async function showLogin(msg) {
    show('login'); renderLogin(msg || '');
    const ok = await Sync.ready;
    if (!ok) { LG.ok = true; renderLogin('기록 서버에 연결하지 못했어요. 인터넷 연결을 확인하거나, 아래에서 이 기기에만 저장하며 시작하세요.'); return; }
    try {
      const qs = await Sync.db.collection('classes').get();
      Sync.classes = qs.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(c => !c.hidden)
        .sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || String(a.name || a.id).localeCompare(String(b.name || b.id), 'ko', { numeric: true }));
      LG.ok = true; renderLogin();
    } catch (e) { LG.ok = true; renderLogin('반 목록을 불러오지 못했어요. (' + (e.code || e.message || '') + ')'); }
  }
  async function loginGo(confirmed) {
    const c = Sync.classes.find(x => x.id === LG.cls);
    const no = parseInt(LG.no, 10), name = (LG.name || '').trim().slice(0, 10);
    if (!c) return renderLogin('반을 골라 주세요.');
    if (!(no >= 1 && no <= 99)) return renderLogin('번호를 1부터 99 사이로 써 주세요.');
    if (!name) return renderLogin('이름을 써 주세요.');
    renderLogin('확인하고 있어요…');
    try {
      const snap = await Sync.db.collection('students').doc(c.id + '_' + no).get();
      const old = snap.exists ? (snap.data().name || '') : '';
      if (old && old !== name && !confirmed) { LG.confirm = old; renderLogin(''); return; }
      await attach({ classId: c.id, className: c.name || c.id, no, name });
      LG = { cls: null, no: '', name: '', confirm: null, ok: true, msg: '' };
      show('home');
      toast(`${name} 학생, 반가워요!`);
    } catch (e) { renderLogin('들어가지 못했어요. (' + (e.code || e.message || '연결 오류') + ')'); }
  }
  ACT.logout = async (el) => {
    if (!el.dataset.sure) {
      const label = el.textContent;
      el.dataset.sure = '1'; el.textContent = '한 번 더 누르면 로그인을 풀어요';
      setTimeout(() => { if (el.isConnected) { el.dataset.sure = ''; el.textContent = label; } }, 2800);
      return;
    }
    closeSheet();
    trackStop(false);
    try { await Sync.flush(); } catch (e) { }
    if (Sync.unsub) { try { Sync.unsub(); } catch (e) { } }
    Sync.on = false; Sync.ref = null; Sync.unsub = null; CLS = null; FP.list = []; FP.err = ''; FP.ready = false;
    WHO = null; P = blank(); resetProg();
    try { localStorage.removeItem(WKEY); localStorage.removeItem(KEY); } catch (e) { }
    Sync.setStatus('off');
    showLogin('');
  };

  function init() {
    const c = cv();
    c.addEventListener('pointerdown', boardDown);
    c.addEventListener('pointermove', boardMove);
    c.addEventListener('pointerup', boardUp);
    c.addEventListener('pointercancel', e => { S.ptrs.delete(e.pointerId); S.pan = null; S.pinch = null; });
    c.addEventListener('pointerleave', () => { if (S.hover && !S.drag) { S.hover = null; draw(); } });
    c.addEventListener('wheel', wheel, { passive: false });
    c.addEventListener('contextmenu', e => e.preventDefault());
    if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(c.parentElement);
    else window.addEventListener('resize', resize);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { draw(); });
    new MutationObserver(() => draw()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    window.addEventListener('hashchange', () => { if (!$('#home').hidden) renderHome(); });
    if (Sync.has && !(WHO && (WHO.local || WHO.classId))) { showLogin(); return; }
    show('home');
    if (Sync.has && WHO && !WHO.local) {
      Sync.setStatus('wait');
      attach(WHO).then(() => renderHome()).catch(e => { Sync.setStatus('error'); toast('기록 서버에 연결하지 못했어요. 연결되면 다시 저장해요', 3400); setTimeout(() => attach(WHO).then(() => renderHome()).catch(() => { }), 20000); });
    }
  }
  window.BT = { S, P: () => P, startLevel, DEFS, encodePuzzle, decodePuzzle, toW, sx, sy, show, openTeacher, Sync, stageOpen, TD: () => TD, who: () => WHO, cls: () => CLS };
  init();
})();

</script>
