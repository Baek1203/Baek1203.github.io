<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일차방정식 대시보드 예시</title>
<meta name="description" content="일차방정식의 활용 AI 튜터 교사용 대시보드를 예시 데이터로 둘러보는 화면">
<style>
  /* 원본(일차방정식 교사용 대시보드)의 Tailwind 화면을 그대로 옮기고, Firebase 대신 예시 데이터를 넣었어요. */
  :root {
    --bg: #f1f5f9; --card: #ffffff; --line: #e5e7eb; --line-soft: #f3f4f6;
    --text: #1f2937; --text-2: #6b7280; --head: #1e293b; --head-text: #ffffff;
    --blue: #2563eb; --blue-soft: #eff6ff; --bar: #60a5fa; --done: #22c55e; --done-text: #16a34a;
    --score: #059669; --score-head: #6ee7b7; --name: #1e3a8a; --track: #e5e7eb; --hover: #eff6ff;
    --note-bg: #fffbeb; --note-line: #fde68a; --note-text: #92400e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1120; --card: #111827; --line: #1f2937; --line-soft: #1f2937;
      --text: #e5e7eb; --text-2: #9ca3af; --head: #0f172a; --head-text: #f9fafb;
      --blue: #3b82f6; --blue-soft: #172554; --bar: #60a5fa; --done: #22c55e; --done-text: #4ade80;
      --score: #34d399; --score-head: #6ee7b7; --name: #93c5fd; --track: #1f2937; --hover: #172033;
      --note-bg: rgba(245, 158, 11, .12); --note-line: rgba(251, 191, 36, .35); --note-text: #fcd34d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1120; --card: #111827; --line: #1f2937; --line-soft: #1f2937;
    --text: #e5e7eb; --text-2: #9ca3af; --head: #0f172a; --head-text: #f9fafb;
    --blue: #3b82f6; --blue-soft: #172554; --bar: #60a5fa; --done: #22c55e; --done-text: #4ade80;
    --score: #34d399; --score-head: #6ee7b7; --name: #93c5fd; --track: #1f2937; --hover: #172033;
    --note-bg: rgba(245, 158, 11, .12); --note-line: rgba(251, 191, 36, .35); --note-text: #fcd34d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); padding: 24px 16px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.5; }
  @media (min-width: 768px) { body { padding: 40px; } }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .note { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; padding: 12px 16px; border-radius: 16px;
    background: var(--note-bg); border: 1px solid var(--note-line); color: var(--note-text); font-size: 14px; font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding: 24px; border-radius: 24px; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  h1 { margin: 0; display: flex; align-items: center; font-size: 30px; font-weight: 800; color: var(--text); }
  h1 span { font-size: 36px; margin-right: 12px; }
  .head p { margin: 8px 0 0; color: var(--text-2); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; padding: 8px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.05); width: fit-content; max-width: 100%; }
  .tabs button { border: 0; cursor: pointer; padding: 12px 24px; border-radius: 12px; font: inherit; font-size: 18px; font-weight: 700; color: var(--text-2); background: transparent; transition: background-color .15s, color .15s; }
  .tabs button:hover { background: var(--line-soft); }
  .tabs button[aria-selected="true"] { background: var(--blue); color: #fff; box-shadow: 0 4px 6px -1px rgba(37,99,235,.3); }
  .tabs button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .card { background: var(--card); border-radius: 24px; border: 1px solid var(--line); box-shadow: 0 20px 25px -5px rgba(0,0,0,.08), 0 8px 10px -6px rgba(0,0,0,.06); overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  thead tr { background: var(--head); color: var(--head-text); }
  th { padding: 16px; white-space: nowrap; font-size: 14px; font-weight: 700; }
  th.c, td.c { text-align: center; }
  th.score { color: var(--score-head); font-weight: 900; font-size: 16px; }
  tbody tr { border-top: 1px solid var(--line); transition: background-color .15s; }
  tbody tr:hover { background: var(--hover); }
  td { padding: 16px; }
  td.no { font-weight: 700; color: var(--text); text-align: center; }
  td.name { font-weight: 700; color: var(--name); white-space: nowrap; }
  .p { display: flex; flex-direction: column; align-items: center; }
  .p b { font-size: 14px; color: var(--text-2); }
  .p.all b { color: var(--done-text); }
  .track { width: 64px; height: 8px; margin-top: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--bar); }
  .p.all .track i { background: var(--done); }
  td.best { text-align: center; font-size: 20px; font-weight: 900; color: var(--score); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <p class="note" role="note">예시 데이터예요. 실제 학생 기록이 아니라, 대시보드가 어떻게 보이는지 둘러보도록 만든 가상의 학급이에요.</p>

  <div class="head">
    <div>
      <h1><span aria-hidden="true">👨‍🏫</span>교사용 통합 대시보드</h1>
      <p>학생들의 카테고리별 달성도와 서바이벌 최고 기록을 확인하세요.</p>
    </div>
  </div>

  <div class="tabs" id="classTabs" role="tablist" aria-label="학급"></div>

  <div class="card">
    <div class="scroll">
      <table>
        <thead><tr id="tableHeader"></tr></thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  // 원본과 같은 유형과 문제 수
  var PROBLEM_TYPES = [
    { id: "num_age", name: "수/나이", icon: "🔢", count: 3 },
    { id: "price_qty", name: "가격/수량", icon: "💰", count: 4 },
    { id: "surplus_ratio", name: "과부족/비례", icon: "🍎", count: 3 },
    { id: "geometry_work", name: "도형/일", icon: "📐", count: 3 },
    { id: "speed_1", name: "거속시(왕복)", icon: "🚶", count: 3 },
    { id: "speed_2", name: "거속시(마주보기)", icon: "🚂", count: 3 }
  ];
  var CLASSES = ["1", "2", "3", "4"];

  // 예시 데이터: 같은 화면이 늘 같게 보이도록 고정된 난수로 만든 가상의 학생
  var seed = 20261022;
  function rand() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  var FAMILY = "김이박최정강조윤장임한오서신권황안송류홍".split("");
  var GIVEN = ["하늘", "서준", "지우", "도윤", "하린", "민준", "서연", "예준", "지아", "시우", "수아", "주원", "하은", "건우", "윤서", "우진", "채원", "현우", "지민", "은우", "다은", "선우", "소율", "준서", "나연", "태윤"];
  // 뒤쪽 유형일수록 어려워서 덜 끝낸 모습
  var EASE = [0.92, 0.82, 0.66, 0.55, 0.42, 0.3];

  var students = [];
  CLASSES.forEach(function (c, ci) {
    var n = 24 + (ci % 2) * 2;
    for (var k = 1; k <= n; k++) {
      var skill = Math.min(1, Math.max(0.05, rand() * 0.9 + (ci === 1 ? 0.12 : 0)));
      var progress = {};
      PROBLEM_TYPES.forEach(function (t, ti) {
        for (var i = 0; i < t.count; i++) {
          var p = EASE[ti] * (0.45 + skill * 0.75) - i * 0.08;
          if (rand() < p) progress[t.id + "-" + i] = true;
        }
      });
      var solved = Object.keys(progress).length;
      progress.testHighScore = Math.max(0, Math.round(solved * (4 + skill * 6) + (rand() - 0.5) * 12)) * 10;
      students.push({
        gradeClass: c, studentNum: k,
        name: FAMILY[Math.floor(rand() * FAMILY.length)] + GIVEN[Math.floor(rand() * GIVEN.length)],
        progress: progress
      });
    }
  });

  var current = "1";
  var header = document.getElementById("tableHeader");
  header.innerHTML = '<th class="c" scope="col">번호</th><th scope="col">이름</th>' +
    PROBLEM_TYPES.map(function (t) { return '<th class="c" scope="col" title="' + t.name + '">' + t.icon + " " + t.name + "</th>"; }).join("") +
    '<th class="c score" scope="col">🔥 서바이벌 최고점</th>';

  var tabs = document.getElementById("classTabs");
  function renderTabs() {
    tabs.innerHTML = CLASSES.map(function (c) {
      return '<button type="button" role="tab" data-c="' + c + '" aria-selected="' + (c === current) + '">' + c + "반</button>";
    }).join("");
  }
  tabs.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    current = b.dataset.c; renderTabs(); renderTable();
  });

  function renderTable() {
    var rows = students.filter(function (s) { return s.gradeClass === current; });
    document.getElementById("studentTableBody").innerHTML = rows.map(function (s) {
      var cells = PROBLEM_TYPES.map(function (t) {
        var done = 0;
        for (var i = 0; i < t.count; i++) if (s.progress[t.id + "-" + i]) done++;
        var all = done === t.count;
        return '<td class="c"><div class="p' + (all ? " all" : "") + '"><b>' + done + " / " + t.count + '</b><span class="track"><i style="width:' + (done / t.count * 100) + '%"></i></span></div></td>';
      }).join("");
      return '<tr><td class="no">' + s.studentNum + '</td><td class="name">' + s.name + "</td>" + cells + '<td class="best">' + (s.progress.testHighScore || 0) + "</td></tr>";
    }).join("");
  }

  renderTabs();
  renderTable();
})();
</script>
</body>
</html>

</body></html>
