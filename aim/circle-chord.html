<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<!--
  원과 현 수업 화면 (전자칠판용) — 안내/03_수업화면_기본틀.html을 복사해 장면만 바꿈
  흐름: 1 현의 수직이등분선 → 2 현에 내린 수선 → 3 현의 길이 → 4 길이 구하기 → 덤 → 마무리(성질 총정리 → 교과서 문제)
  이 화면의 색 (그림과 글에서 같은 대상은 같은 색)
    현 = 주황(--c-chord), 반지름 = 파랑(--c-arc), 원의 중심에서 현까지의 거리 = 초록(--c-center),
    접힌 선·현의 수직이등분선 = 보라(--c-secant), 색종이 앞면 = --fill-sec, 색종이 뒷면 = --fill-sec2
  한 단계 안에서 여러 마디로 움직이는 곳은 data-ph="단계:마디"로, 그 마디가 끝난 뒤 보일 글을 단다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원과 현 수업 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap">
<style>
/* ---------- 색: 종이(밝은 화면) ---------- */
:root{
  --bg:#f4f6f9;--surface:#ffffff;--surface-2:#e8edf4;--ink:#15202b;--ink-2:#4b5664;--line:#c8d0da;--ghost:#b8c1cc;
  --accent:#1c4f8c;--on-accent:#ffffff;
  /* 수학 색: 그림과 글에서 같은 대상은 같은 색 */
  --c-arc:#1f63c6;--c-arc2:#0a7f9f;--c-chord:#c9510f;--c-secant:#7442c0;--c-center:#12804f;
  --hi:#f2b705;--hl:rgba(242,183,5,.17);
  --fill-sec:rgba(31,99,198,.16);--fill-sec2:rgba(31,99,198,.30);--fill-mov:rgba(10,127,159,.24);--fill-tri:rgba(201,81,15,.16);
  --ok:#12804f;--no:#c62828;
  --pen1:#d62f2f;--pen2:#1f63c6;--pen3:#12804f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* ---------- 색: 칠판(어두운 화면) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2a26;--surface:#213530;--surface-2:#2a413a;--ink:#f0f3ec;--ink-2:#b9c6be;--line:#3e554d;--ghost:#5a716a;
    --accent:#ffd66b;--on-accent:#1b2a26;
    --c-arc:#82bcff;--c-arc2:#6fdbe9;--c-chord:#ffad6b;--c-secant:#caa6ff;--c-center:#86e3ab;
    --hi:#ffe27a;--hl:rgba(255,226,122,.13);
    --fill-sec:rgba(130,188,255,.18);--fill-sec2:rgba(130,188,255,.34);--fill-mov:rgba(111,219,233,.24);--fill-tri:rgba(255,173,107,.2);
    --ok:#86e3ab;--no:#ff8f8f;
    --pen1:#ff9b9b;--pen2:#86c2ff;--pen3:#9bf0bd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2a26;--surface:#213530;--surface-2:#2a413a;--ink:#f0f3ec;--ink-2:#b9c6be;--line:#3e554d;--ghost:#5a716a;
  --accent:#ffd66b;--on-accent:#1b2a26;
  --c-arc:#82bcff;--c-arc2:#6fdbe9;--c-chord:#ffad6b;--c-secant:#caa6ff;--c-center:#86e3ab;
  --hi:#ffe27a;--hl:rgba(255,226,122,.13);
  --fill-sec:rgba(130,188,255,.18);--fill-sec2:rgba(130,188,255,.34);--fill-mov:rgba(111,219,233,.24);--fill-tri:rgba(255,173,107,.2);
  --ok:#86e3ab;--no:#ff8f8f;
  --pen1:#ff9b9b;--pen2:#86c2ff;--pen3:#9bf0bd;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:clamp(15px,.95vw + .7vh,32px);line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
i{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic}

/* ---------- 틀: 위 띠 · 무대 · 아래 띠 ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:.8em;padding:.4em 1em;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:'Noto Serif KR',serif;font-weight:900;font-size:.95em;white-space:nowrap}
.nav{display:flex;gap:.25em;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav>:first-child{margin-left:auto}
.nav>:last-child{margin-right:auto}
.nav button{display:inline-flex;align-items:center;gap:.35em;border:0;background:transparent;border-radius:.55em;padding:.3em .75em;min-height:44px;font-size:.78em;font-weight:600;color:var(--ink-2);white-space:nowrap}
.nav button .n{font-family:'Noto Serif KR',serif;font-weight:900}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="step"]{background:var(--accent);color:var(--on-accent)}
.tools{display:flex;gap:.35em}
.tool{display:inline-flex;align-items:center;gap:.35em;border:1px solid var(--line);background:var(--surface);border-radius:.55em;padding:.25em .65em;min-height:44px;font-size:.7em;font-weight:600;white-space:nowrap}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ico{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.stage{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2.4vw;padding:2vh 2.8vw;min-height:0}
.stage.wide{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}      /* 설명이 긴 장면 */
.stage.figwide{grid-template-columns:minmax(0,1.6fr) minmax(0,.78fr)}  /* 그림이 주인공인 장면 */
.fig{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.fig>svg{display:block;width:100%;height:100%;overflow:visible}
.fig svg *{pointer-events:none}
.fig svg .grab{pointer-events:auto;cursor:grab;touch-action:none}
.panel{min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;gap:.65em;overflow-y:auto;padding:.2em}
.stage.enter .fig,.stage.enter .panel{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1em;padding:.45em 1em;background:var(--surface);border-top:1px solid var(--line)}
.navbtn{display:inline-flex;align-items:center;gap:.35em;border:1.5px solid var(--line);background:var(--surface);border-radius:.7em;padding:.35em 1.1em;min-height:52px;font-size:.9em;font-weight:700}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.navbtn:disabled{opacity:.35;cursor:default}
.progress{display:flex;justify-content:center;min-width:0}
.dots{display:flex;gap:.45em;align-items:center;min-height:.9em;flex-wrap:wrap;justify-content:center}
.dot{width:.55em;height:.55em;border-radius:50%;background:var(--line);transition:transform .25s,background .25s}
.dot.on{background:var(--accent)}
.dot.cur{transform:scale(1.4)}

/* ---------- 단계 표시 ---------- */
.is-off{opacity:0 !important;pointer-events:none !important}
[data-show],[data-hide],[data-only],[data-ph]{transition:opacity .45s ease}
[data-late]:not(.is-off){transition-delay:1.15s}
[data-late2]:not(.is-off){transition-delay:2.7s}
[data-late3]:not(.is-off){transition-delay:4.2s}
[data-collapse].is-off{display:none}
[data-collapse]:not(.is-off){animation:enter .4s ease both}
[data-collapse][data-late]:not(.is-off){animation-delay:1.15s}
.instant [data-late]:not(.is-off),.instant [data-late2]:not(.is-off),.instant [data-late3]:not(.is-off){transition-delay:0s !important;animation-delay:0s !important}
.no-anim,.no-anim *{transition:none !important}

/* ---------- 설명 칸의 글 ---------- */
.q{margin:0;font-family:'Noto Serif KR',serif;font-weight:900;font-size:1.5em;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--ink-2);font-size:.92em;text-wrap:pretty}
.say{margin:0;font-size:1.05em;line-height:1.65;text-wrap:pretty}
.ask{margin:0;font-size:1.12em;font-weight:700;line-height:1.6;text-wrap:pretty}
.eq2{margin:0;font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-weight:700;font-size:1.25em;line-height:1.5}
.note{margin:0;font-size:.88em;line-height:1.6;color:var(--ink-2);text-wrap:pretty}
.stack{display:flex;flex-direction:column;gap:.5em}
.nw{white-space:nowrap}
.given{display:inline-block;background:var(--surface-2);border-radius:.45em;padding:.12em .6em;font-weight:600}
/* 분수, 색 글자 */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-size:.88em;line-height:1.12;margin:0 .12em}
.fr>span{padding:0 .2em}
.fr>span:first-child{border-bottom:.09em solid currentColor}
.ca{color:var(--accent)}.cn{color:var(--c-center)}.cw{color:var(--c-arc2)}.cl{color:var(--c-arc)}.cr{color:var(--c-chord)}
/* 식 상자, 성질 상자, 답 상자, 핵심 상자 */
.fbox{border:2px solid var(--accent);border-radius:.8em;padding:.45em .9em;display:flex;flex-direction:column;gap:.05em}
.fbox .pl,.prop .pl{font-weight:800;font-size:.85em;color:var(--accent)}
.fm{margin:0;font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-weight:700;font-size:1.32em;line-height:1.65}
.fm-s{font-size:1.14em;line-height:1.8}
.fm .dim{color:var(--ink-2);font-weight:400}
.prop{border:2px solid var(--accent);border-radius:.8em;padding:.5em .9em;display:flex;flex-direction:column;gap:.15em}
.prop p{margin:0;font-size:1.05em;text-wrap:pretty}
.answer{background:var(--surface-2);border-radius:.8em;padding:.6em .9em;display:flex;flex-direction:column;gap:.25em}
.answer .big{font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-weight:700;font-size:1.6em;line-height:1.3;color:var(--accent)}
.answer .why{margin:0;font-size:1.02em;line-height:1.8;text-wrap:pretty}
.kkey{display:flex;flex-direction:column;gap:.15em;margin-top:.2em}
.kkt{margin:0;font-weight:800;font-size:1.12em;line-height:1.5;text-wrap:balance;color:var(--accent)}
.kkey .say{font-size:1em;line-height:1.6}
/* 식의 한 부분 아래에 이름 붙이기 */
.kbr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.5}
.kbr .kbe{padding:0 .12em .08em;border-bottom:.12em solid var(--c-arc);border-radius:0 0 .4em .4em}
.kbr .kbl{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:.6em;font-weight:800;line-height:1.4;color:var(--c-arc);white-space:nowrap}
/* 표 */
.mt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.92em}
.mt th,.mt td{border:1.5px solid var(--line);padding:.35em .4em;text-align:center}
.mt thead th{background:var(--surface-2);font-weight:700}
.mt tbody th{text-align:left;font-weight:700;background:var(--surface)}
/* 복습 문제 */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:1em;font-weight:700;color:var(--ink-2);font-size:.85em}
.ox circle,.ox path{fill:none;stroke:var(--ghost);stroke-width:30;stroke-linecap:round;transition:stroke .4s,opacity .4s}
.fig.rev .ox.ok circle,.fig.rev .ox.ok path{stroke:var(--accent)}
.fig.rev .ox:not(.ok){opacity:.2}
.fig .rv{opacity:0;transition:opacity .45s ease}
.fig.rev .rv{opacity:1}
.fig .hide-rev{transition:opacity .45s ease}
.fig .dim-rev{opacity:.2;transition:opacity .45s ease}   /* 총정리: 다음 단계에서 또렷해질 그림 */
.fig.rev .dim-rev{opacity:1}
.fig.rev .hide-rev{opacity:0}

/* ---------- 그림 ---------- */
.base{fill:none;stroke:var(--ink);stroke-width:3.5}
.guide{fill:none;stroke:var(--ink-2);stroke-width:3}
.ghost{opacity:.4}
.f-ink{fill:var(--ink)}
.rd{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-family:'Noto Serif KR',Georgia,serif;font-weight:700;fill:var(--ink)}                     /* 점 이름 A, B, O */
.tag{font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700;fill:var(--ink)}  /* 한글 이름표 */
.num{font-family:'STIX Two Text','Times New Roman',serif;font-weight:600;fill:var(--ink)}           /* 수, 단위 */
.var{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic;font-weight:600;fill:var(--ink)}  /* 문자 r, l, x */
.vi{font-family:'STIX Two Text','Times New Roman',serif;font-style:italic}
.is-dim{opacity:.15}
@keyframes pulse{0%,100%{stroke-width:10px}50%{stroke-width:17px}}
.pulse{animation:pulse 1.3s ease-in-out infinite}

/* ---------- 원과 현에서 더한 것 ---------- */
.cs{color:var(--c-secant)}
.ov{display:inline-block;border-top:.075em solid currentColor;line-height:1;padding-top:.07em}  /* 선분의 길이 AB̅ */
.rt{white-space:nowrap}
.nb{display:inline-block}
.q.tall{line-height:1.55}   /* 선분 기호(윗줄)가 든 문제는 줄 사이를 넓힌다 */   /* 선분 기호가 든 조건을 한 덩어리로 줄바꿈 */
.rad{display:inline-block;border-top:.075em solid currentColor;line-height:1.1;padding:0 .1em 0 .05em;margin-left:-.03em}  /* 근호 안 */
.ph-off{opacity:0 !important}
[data-collapse].ph-off{display:none}
.pf{display:flex;flex-direction:column}
.pfl{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:.8em;align-items:baseline;border-radius:.45em;padding:0 .35em;margin:0 -.35em;transition:background .35s ease,opacity .45s ease}
.pfl.now{background:var(--hl)}
.pfl .mk{font-family:'STIX Two Text','Times New Roman',serif;font-size:1.05em;color:var(--ink-2);white-space:nowrap}
.prob{border:1.5px solid var(--line);border-radius:.8em;padding:.5em .9em;display:flex;flex-direction:column;gap:.15em}
.prob .pl{font-weight:800;font-size:.85em;color:var(--accent)}
.prob p{margin:0;font-size:1.05em;text-wrap:pretty}
.answer .fm2{margin:0;font-family:'STIX Two Text','Times New Roman','Noto Serif KR',serif;font-weight:700;font-size:1.1em;line-height:1.85}
.kbr.kg .kbe{border-bottom-color:var(--c-center)}.kbr.kg .kbl{color:var(--c-center)}
.kbr.ko .kbe{border-bottom-color:var(--c-chord)}.kbr.ko .kbl{color:var(--c-chord)}
.qlist{margin:0;font-size:.95em;line-height:1.7;color:var(--ink-2)}
.qlist b{font-family:'Noto Serif KR',serif;color:var(--ink);margin-right:.4em}
.handle{fill:var(--accent);stroke:var(--surface);stroke-width:4}
.handle-ring,.ping{fill:none;stroke:var(--accent);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.3);opacity:0}}
.hit{fill:transparent}

/* ---------- 펜 ---------- */
.ink{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.pen-on .ink{pointer-events:auto;cursor:crosshair;touch-action:none}
.ink polyline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.penbar{position:absolute;top:.6em;right:.8em;z-index:6;display:none;align-items:center;gap:.35em;background:var(--surface);border:1px solid var(--line);border-radius:.8em;padding:.3em .4em;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.pen-on .penbar{display:flex}
.pen-sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);background:var(--sw);box-shadow:0 0 0 2px var(--line)}
.pen-sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.pbtn{min-height:44px;border:1px solid var(--line);border-radius:.55em;background:var(--surface);padding:0 .7em;font-size:.7em;font-weight:600;white-space:nowrap}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .brand,.tool span{display:none}
  .stage,.stage.wide,.stage.figwide{grid-template-columns:minmax(0,1fr);padding:1.5vh 4vw}
  .fig{height:46vh}
  .panel{overflow:visible;justify-content:flex-start}
  .penbar{flex-wrap:wrap;max-width:calc(100% - 1.6em)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">원과 현</div>
    <nav class="nav" id="nav" aria-label="수업 흐름"></nav>
    <div class="tools">
      <button type="button" class="tool" id="penBtn" aria-pressed="false" aria-label="펜"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"></path><path d="M14 7l3 3"></path></svg><span>펜</span></button>
      <button type="button" class="tool" id="themeBtn" aria-label="화면 색 바꾸기"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg><span id="themeLbl">종이</span></button>
      <button type="button" class="tool" id="fsBtn" aria-label="전체 화면"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg><span>전체 화면</span></button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="fig" id="fig"></div>
    <div class="panel" id="panel"></div>
    <svg class="ink" id="ink" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="penbar" role="toolbar" aria-label="펜 도구">
      <button type="button" class="pen-sw" data-pen="--pen1" aria-pressed="true" aria-label="빨강 펜" style="--sw:var(--pen1)"></button>
      <button type="button" class="pen-sw" data-pen="--pen2" aria-pressed="false" aria-label="파랑 펜" style="--sw:var(--pen2)"></button>
      <button type="button" class="pen-sw" data-pen="--pen3" aria-pressed="false" aria-label="초록 펜" style="--sw:var(--pen3)"></button>
      <button type="button" class="pbtn" id="penUndo">되돌리기</button>
      <button type="button" class="pbtn" id="penClear">모두 지우기</button>
      <button type="button" class="pbtn" id="penOff">펜 끄기</button>
    </div>
  </main>
  <footer class="bottom">
    <button type="button" class="navbtn" id="prevBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>이전</button>
    <div class="progress"><div class="dots" id="dots"></div></div>
    <button type="button" class="navbtn primary" id="nextBtn">다음<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
  </footer>
</div>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const mq = q => (window.matchMedia ? window.matchMedia(q) : { matches: false });
  const RM = false;   // 수업용 움직임은 기기의 '동작 줄이기' 설정과 상관없이 항상 보여 준다
  const NS = 'http://www.w3.org/2000/svg';
  const FIG = $('#fig'), PANEL = $('#panel'), STAGE = $('#stage');
  const state = { si: 0, step: 0 };

  /* ---------- 기하 (각은 도, 시계 반대 방향, 0°는 오른쪽) ---------- */
  const rad = d => d * Math.PI / 180;
  const n2 = v => Math.round(v * 100) / 100;
  const lerp = (a, b, u) => a + (b - a) * u;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const P = (cx, cy, r, d) => [n2(cx + r * Math.cos(rad(d))), n2(cy - r * Math.sin(rad(d)))];
  const spanOf = (a1, a2, ccw) => { const s = ccw ? a2 - a1 : a1 - a2; return ((s % 360) + 360) % 360; };
  const arcD = (cx, cy, r, a1, a2, ccw = true) => {
    const p = P(cx, cy, r, a1), q = P(cx, cy, r, a2);
    return `M ${p[0]} ${p[1]} A ${n2(r)} ${n2(r)} 0 ${spanOf(a1, a2, ccw) > 180 ? 1 : 0} ${ccw ? 0 : 1} ${q[0]} ${q[1]}`;
  };
  const sectorD = (cx, cy, r, a1, a2) => {
    const p = P(cx, cy, r, a1), q = P(cx, cy, r, a2);
    return `M ${n2(cx)} ${n2(cy)} L ${p[0]} ${p[1]} A ${n2(r)} ${n2(r)} 0 ${spanOf(a1, a2, true) > 180 ? 1 : 0} 0 ${q[0]} ${q[1]} Z`;
  };
  const circD = (cx, cy, r) => `M ${n2(cx + r)} ${n2(cy)} A ${n2(r)} ${n2(r)} 0 1 0 ${n2(cx - r)} ${n2(cy)} A ${n2(r)} ${n2(r)} 0 1 0 ${n2(cx + r)} ${n2(cy)}`;
  const seg = (p, q) => `M ${n2(p[0])} ${n2(p[1])} L ${n2(q[0])} ${n2(q[1])}`;
  const ease = u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);

  /* ---------- 원과 현에서 더한 기하 ---------- */
  const deg = r => r * 180 / Math.PI;
  const n4 = v => Math.round(v * 10000) / 10000;
  const nd = x => ((x % 360) + 540) % 360 - 180;                        // 각을 -180 ~ 180으로
  const vadd = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const vsub = (p, q) => [p[0] - q[0], p[1] - q[1]];
  const vmul = (p, k) => [p[0] * k, p[1] * k];
  const vdot = (p, q) => p[0] * q[0] + p[1] * q[1];
  const vunit = p => { const L = Math.hypot(p[0], p[1]) || 1; return [p[0] / L, p[1] / L]; };
  const vmid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const U = d => [Math.cos(rad(d)), -Math.sin(rad(d))];                 // 각 d 방향의 단위 벡터(그림 좌표)
  const angOf = (C, p) => deg(Math.atan2(C[1] - p[1], p[0] - C[0]));   // 점 C에서 본 점 p의 각
  const midAng = (a, b) => a + ((((b - a) % 360) + 360) % 360) / 2;      // a에서 시계 반대 방향으로 b까지의 가운데 각
  const pt = p => `${n2(p[0])} ${n2(p[1])}`;
  const polyD = (...ps) => 'M ' + ps.map(pt).join(' L ') + ' Z';
  const segD = (cx, cy, r, a1, a2) => {                                 // a1 → a2(시계 반대 방향) 호와 현으로 둘러싸인 활꼴
    const p = P(cx, cy, r, a1), q = P(cx, cy, r, a2);
    return `M ${p[0]} ${p[1]} A ${n2(r)} ${n2(r)} 0 ${spanOf(a1, a2, true) > 180 ? 1 : 0} 0 ${q[0]} ${q[1]} Z`;
  };
  const rightD = (M, u, v, s = 16) => {                                 // 직각 표시: 꼭짓점 M, 두 변의 방향 u, v
    const p1 = vadd(M, vmul(u, s)), p2 = vadd(p1, vmul(v, s)), p3 = vadd(M, vmul(v, s));
    return `M ${pt(p1)} L ${pt(p2)} L ${pt(p3)}`;
  };
  const rightBox = (M, u, v, s = 16) => polyD(M, vadd(M, vmul(u, s)), vadd(vadd(M, vmul(u, s)), vmul(v, s)), vadd(M, vmul(v, s)));
  const tickD = (p, q, n = 1, h = 11, gap = 8) => {                       // 같은 길이 표시(선분 가운데에 n개)
    const m = vmid(p, q), t = vunit(vsub(q, p)), nr = [-t[1], t[0]];
    let d = '';
    for (let i = 0; i < n; i++) { const c = vadd(m, vmul(t, (i - (n - 1) / 2) * gap)); d += seg(vadd(c, vmul(nr, -h)), vadd(c, vmul(nr, h))) + ' '; }
    return d.trim();
  };
  // 색종이 접기: 점 Q를 지나고 방향이 d인 선에 대하여 접는다. s = 1(펼침) → 0(세움) → -1(다 접힘)
  const foldM = (Q, d, s) => {
    const [dx, dy] = vunit(d), nx = -dy, ny = dx;
    const a = dx * dx + s * nx * nx, b = dx * dy + s * nx * ny, c = dy * dy + s * ny * ny;
    return `matrix(${n4(a)} ${n4(b)} ${n4(b)} ${n4(c)} ${n2(Q[0] - (a * Q[0] + b * Q[1]))} ${n2(Q[1] - (b * Q[0] + c * Q[1]))})`;
  };
  const foldPt = (p, Q, d, s) => {
    const [dx, dy] = vunit(d), nx = -dy, ny = dx, r = vsub(p, Q);
    const al = r[0] * dx + r[1] * dy, ac = r[0] * nx + r[1] * ny;
    return [Q[0] + al * dx + s * ac * nx, Q[1] + al * dy + s * ac * ny];
  };

  /* ---------- SVG 조각 ---------- */
  const svgWrap = (body, label, w = 600, h = 460) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${body}</svg>`;
  const stroke = (d, c, w, extra = '') => `<path d="${d}" class="rd" style="stroke:var(${c});stroke-width:${w}" ${extra}></path>`;
  const dot = (p, r = 7) => `<circle cx="${n2(p[0])}" cy="${n2(p[1])}" r="${r}" class="f-ink"></circle>`;
  const txt = cls => (x, y, t, s, a = 'start', c = '', extra = '') =>
    `<text x="${n2(x)}" y="${n2(y)}" class="${cls}" font-size="${s}" text-anchor="${a}"${c ? ` style="fill:var(${c})"` : ''} ${extra}>${t}</text>`;
  const lbl = txt('lbl'), tag = txt('tag'), num = txt('num'), vr = txt('var');
  const baseCircle = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" class="base"></circle>`;
  const setD = (root, id, d) => { const el = $(id, root); if (el) el.setAttribute('d', d); };
  const IT = ch => `<tspan class="vi">${ch}</tspan>`;          // 그림 속 기울인 문자
  const setXY = (el, p) => { if (el) { el.setAttribute('x', n2(p[0])); el.setAttribute('y', n2(p[1])); } };
  const vis = (el, on) => { if (el) el.style.display = on ? '' : 'none'; };

  /* ---------- 설명 칸의 수식 조각 ---------- */
  const I = ch => `<i>${ch}</i>`;
  const R_ = I('r'), L_ = I('l'), S_ = I('S'), X_ = I('x');
  const FR = (a, b, cls = '') => `<span class="fr${cls ? ' ' + cls : ''}"><span>${a}</span><span>${b}</span></span>`;
  const HALF = FR(1, 2);
  const OV = s => `<span class="ov">${s}</span>`;                                   // 선분의 길이 AB̅
  const RT = s => `<span class="rt">√<span class="rad">${s}</span></span>`;          // 근호

  /* ---------- 단계 엔진 ---------- */
  function drawIn(el, ms = 900) {                  // 선이 그려지며 나타나기
    if (RM || !el || typeof el.getTotalLength !== 'function') return;
    let len = 0;
    try { len = el.getTotalLength(); } catch (e) { return; }
    if (!(len > 0)) return;
    clearTimeout(el._dt);
    el.style.transition = 'none';
    el.style.strokeDasharray = `${len} ${len}`;
    el.style.strokeDashoffset = `${len}`;
    el.getBoundingClientRect();
    el.style.transition = `stroke-dashoffset ${ms}ms ease-in-out, opacity .45s ease`;
    el.style.strokeDashoffset = '0';
    el._dt = setTimeout(() => { el.style.transition = ''; el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; }, ms + 80);
  }
  const drawAll = root => {
    if (!root) return;
    if (root.hasAttribute('data-draw')) drawIn(root);
    $$('[data-draw]', root).forEach(x => drawIn(x));
  };
  function applyStep(root, step, prev) {
    $$('[data-show],[data-hide],[data-only]', root).forEach(el => {
      const s = el.getAttribute('data-show'), h = el.getAttribute('data-hide'), o = el.getAttribute('data-only');
      let vis = true;
      if (s !== null && step < Number(s)) vis = false;
      if (h !== null && step >= Number(h)) vis = false;
      if (o !== null && !o.split(',').map(Number).includes(step)) vis = false;
      const wasOff = el.classList.contains('is-off');
      el.classList.toggle('is-off', !vis);
      if (vis && wasOff && step > prev) drawAll(el);
    });
  }
  function tween(ms, fn, done) {                   // 0→1로 움직이기. 돌려받은 함수를 부르면 멈춘다
    if (RM || !(ms > 0)) { fn(1); if (done) done(); return () => {}; }
    let alive = true, fin = false, wd = 0;
    const t0 = performance.now();
    const finish = () => { if (!alive || fin) return; fin = true; clearTimeout(wd); fn(1); if (done) done(); };
    const tick = now => {
      if (!alive || fin) return;
      const u = Math.min(1, Math.max(0, (now - t0) / ms));
      if (u >= 1) { finish(); return; }
      fn(ease(u));
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    wd = setTimeout(finish, ms + 700);           // 화면이 잠시 멈춰도 끝 상태로 마무리
    return () => { alive = false; clearTimeout(wd); };
  }

  /* ---------- 한 단계 안의 마디 움직임 (기본틀 장면 2의 방식을 여러 단계에 쓰도록 묶음) ----------
     PH[단계] = 마디 수, MS[단계] = 마디마다 걸리는 시간(ms), drawT(단계, t)는 t = 0(단계 시작) ~ 마디 수(끝)의 모습을 그린다.
     단계에 앞에서 들어오면 첫 마디만 움직이고 멈추며, 그다음 '다음'마다 한 마디씩 움직인다.
     움직이는 중에 '다음'을 누르면 그 마디를 바로 끝낸다. 첫 마디에서의 '이전'은 앞 단계로 간다. */
  const PHASE = {
    ph: 0, goal: null, cancel: null,
    nPh(step) { return (this.PH && this.PH[step]) || 0; },
    phStop() { if (this.cancel) { this.cancel(); this.cancel = null; } this.goal = null; },
    phPaint() {
      const st = state.step, done = this.ph;
      $$('[data-ph]', STAGE).forEach(el => {
        const [s, k] = el.getAttribute('data-ph').split(':').map(Number);
        el.classList.toggle('ph-off', !(st > s || (st === s && done >= k)));
      });
    },
    phSettle(ph) { this.phStop(); this.ph = ph; this.drawT(state.step, ph); this.phPaint(); },
    phPlay(to) {
      const from = this.ph, step = state.step, ms = this.MS[step][to - 1];
      this.phStop(); this.goal = to;
      this.cancel = tween(ms, u => this.drawT(step, from + (to - from) * u), () => { this.cancel = null; this.goal = null; this.ph = to; this.phPaint(); });
    },
    advance() {
      const n = this.nPh(state.step);
      if (!n) return false;
      if (this.goal !== null) { this.phSettle(this.goal); return true; }   // 움직이는 중이면 그 마디를 바로 끝낸다
      if (this.ph < n) { this.phPlay(this.ph + 1); return true; }
      return false;
    },
    retreat() {
      const n = this.nPh(state.step);
      if (!n) return false;
      const at = this.goal !== null ? this.goal : this.ph;
      if (at >= 2) { this.phSettle(at - 1); return true; }
      return false;                                                        // 첫 마디에서는 앞 단계로
    },
    phEnter(step, prev) {
      const n = this.nPh(step);
      if (n && step === prev + 1) { this.phSettle(0); this.phPlay(1); }
      else this.phSettle(n);
    },
    phReset() { this.phStop(); this.ph = 0; }
  };
  const markNow = step => $$('[data-now]', PANEL).forEach(el => el.classList.toggle('now', Number(el.getAttribute('data-now')) === step));

  /* =========================================================
     1. 현의 수직이등분선: 색종이 접기 ㉮ ㉯ → l이 O를 지난다 → 다른 현(끌기) → 까닭 → 핵심
     1단계 마디 1개(현 그리기 → 현을 따라 접었다 펴기), 2단계 마디 2개(A와 B를 포개어 접기 → 펴기)
     ========================================================= */
  const B1 = { cx: 300, cy: 230, R: 170, ext: 28, def: { A: 160, B: 40, C: 275, D: 5 } };
  const scBisect = Object.assign({}, PHASE, {
    title: '현의 수직이등분선', nav: 0, steps: () => 7, PH: { 1: 1, 2: 2 }, MS: { 1: [2600], 2: [1300, 1200] },
    ang: null, back: null, drag: null,
    build() {
      const { cx, cy, R } = B1, O = [cx, cy];
      this.ang = Object.assign({}, B1.def); this.phReset(); this.back = null; this.drag = null;
      const hdl = k => `<g id="b1h${k}"><circle class="handle-ring" cx="0" cy="0" r="15"></circle><circle class="grab hit" cx="0" cy="0" r="30" data-k="${k}"></circle></g>`;
      const pl = id => `<text id="${id}" class="lbl" x="0" y="0" font-size="34" text-anchor="middle" dy="12"></text>`;
      FIG.innerHTML = svgWrap(`
        <circle id="b1Whole" cx="${cx}" cy="${cy}" r="${R}" style="fill:var(--fill-sec)"></circle>
        <path id="b1Base" d="" style="fill:var(--fill-sec)"></path>
        <path id="b1BaseArc" class="rd" d="" style="stroke:var(--ink);stroke-width:3.5"></path>
        <circle id="b1Edge" cx="${cx}" cy="${cy}" r="${R}" class="base"></circle>
        <path id="b1Ch" class="rd" d="" style="stroke:var(--c-chord);stroke-width:7"></path>
        <g id="b1Cr">
          <path id="b1L" class="rd" d="" style="stroke:var(--c-secant);stroke-width:4" stroke-dasharray="14 10"></path>
          <path id="b1RtA" class="rd" d="" style="stroke:var(--ink);stroke-width:2.5"></path>
          <path id="b1TkA" class="rd" d="" style="stroke:var(--c-chord);stroke-width:3"></path>
          <text id="b1Ll" class="var" x="0" y="0" font-size="36" text-anchor="middle" dy="12" style="fill:var(--c-secant)">l</text>
        </g>
        <g id="b1CD" data-only="4">
          <path id="b1Ch2" class="rd" d="" style="stroke:var(--c-chord);stroke-width:7" data-draw></path>
          <path id="b1M" class="rd" d="" style="stroke:var(--c-secant);stroke-width:4" stroke-dasharray="14 10" data-draw></path>
          <path id="b1RtC" class="rd" d="" style="stroke:var(--ink);stroke-width:2.5"></path>
          <path id="b1TkC" class="rd" d="" style="stroke:var(--c-chord);stroke-width:3"></path>
          <text id="b1Ml" class="var" x="0" y="0" font-size="36" text-anchor="middle" dy="12" style="fill:var(--c-secant)">m</text>
        </g>
        <g data-show="5">
          <path id="b1Rad" class="rd" d="" style="stroke:var(--c-arc);stroke-width:5" data-draw></path>
          <path id="b1RadTk" class="rd" d="" style="stroke:var(--c-arc);stroke-width:3"></path>
        </g>
        <g id="b1Flap" style="display:none">
          <path id="b1FlapF" d=""></path>
          <path id="b1FlapArc" class="rd" d="" style="stroke:var(--ink);stroke-width:3.5"></path>
          <path id="b1FlapCh" class="rd" d="" style="stroke:var(--c-chord);stroke-width:7"></path>
        </g>
        <path id="b1FoldEdge" class="rd" d="" style="stroke:var(--ink);stroke-width:2.5"></path>
        <g data-only="3"><circle class="ping" cx="${cx}" cy="${cy}" r="14"></circle></g>
        <g id="b1Pts"></g>
        ${dot(O, 7)}
        ${lbl(...vadd(O, vmul(U(215), 36)), 'O', 30, 'middle', '', 'dy="11"')}
        ${pl('b1lA')}${pl('b1lB')}
        <g data-only="4">${pl('b1lC')}${pl('b1lD')}</g>
        ${['A', 'B', 'C', 'D'].map(hdl).join('')}`, '중심 O를 찾아 둔 원 모양 색종이와 현 AB');
      ['A', 'B', 'C', 'D'].forEach(k => { const t = $(`#b1l${k}`, FIG); if (t) t.textContent = k; });
      PANEL.innerHTML = `
        <h2 class="q">현의 수직이등분선에는 어떤 성질이 있을까요?</h2>
        <p class="sub" data-only="0" data-collapse>원 모양 색종이를 완전히 포개어지도록 반으로 두 번 접어 원의 중심 O를 찾아 두었어요.</p>
        <p class="say" data-only="1" data-collapse>㉮ 현 AB를 그리고, 그 현을 따라 접었다 펴요.</p>
        <p class="say" data-only="2" data-collapse>㉯ 두 점 A, B가 서로 포개어지도록 접었다 펴요.</p>
        <div class="stack" data-only="2" data-collapse data-ph="2:2">
          <p class="say">펼치면 접힌 선 ${I('l')}이 생겨요. ${I('l')}은 현 AB의 수직이등분선이에요.</p>
          <p class="ask">접힌 선 ${I('l')}은 원의 중심 O를 지날까요?</p>
        </div>
        <p class="say" data-only="3" data-collapse>➊ 접힌 선 ${I('l')}은 원의 중심 O를 지나요.</p>
        <div class="stack" data-only="4" data-collapse>
          <p class="ask">➋ 다른 현을 그어도 그럴까요?</p>
          <p class="say">현 CD의 수직이등분선 ${I('m')}도 원의 중심 O를 지나요.</p>
          <p class="note">점 A, B, C, D를 끌어서 다른 현을 만들어 봐요. ${I('l')}과 ${I('m')}은 언제나 O에서 만나요.</p>
        </div>
        <div class="stack" data-show="5" data-collapse>
          <p class="ask">왜 그럴까요?</p>
          <p class="say"><span class="cl">${OV('OA')} = ${OV('OB')}</span> (반지름)이므로 점 O는 두 점 A, B에서 같은 거리에 있어요.</p>
          <p class="say">선분의 양 끝점에서 같은 거리에 있는 점은 그 선분의 수직이등분선 위에 있어요.</p>
        </div>
        <div class="kkey" data-show="6" data-collapse>
          <p class="kkt">현의 수직이등분선은 그 원의 중심을 지나요!</p>
          <p class="say">그래서 두 현의 수직이등분선이 만나는 점이 원의 중심이에요.</p>
        </div>`;
      // 점 A, B, C, D 끌기 (4단계에서만)
      const svg = $('svg', FIG);
      const toSvg = e => {
        try { const m = svg.getScreenCTM(); if (!m) return null; const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(m.inverse()); return [q.x, q.y]; }
        catch (err) { return null; }
      };
      $$('.hit', FIG).forEach(h => {
        const k = h.getAttribute('data-k'), mate = { A: 'B', B: 'A', C: 'D', D: 'C' }[k];
        h.addEventListener('pointerdown', e => {
          if (state.step !== 4) return;
          e.preventDefault(); this.stopBack();
          try { h.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
          this.drag = k;
        });
        h.addEventListener('pointermove', e => {
          if (this.drag !== k || state.step !== 4) return;
          const p = toSvg(e);
          if (!p) return;
          const a = angOf([B1.cx, B1.cy], p);

      this.k = -2;
      PANEL.innerHTML = `
        <div class="qhead"><span id="qtag"></span><span id="qc"></span></div>
        <h2 class="q" id="qt"></h2>
        <p class="qlist" id="qs"></p>
        <div class="stack" id="qsum">
          <div class="prop">
            <span class="pl">현의 수직이등분선</span>
            <p>한 원에서</p>
            <p>① 원의 중심에서 현에 내린 수선은 그 현을 수직이등분한다.</p>
            <p>② 현의 수직이등분선은 그 원의 중심을 지난다.</p>
          </div>
          <div class="prop" id="qsum2">
            <span class="pl">현의 길이</span>
            <p>한 원에서</p>
            <p>① 원의 중심으로부터 같은 거리에 있는 두 현의 길이는 같다.</p>
            <p>② 길이가 같은 두 현은 원의 중심으로부터 같은 거리에 있다.</p>
          </div>
        </div>
        <div class="answer is-off" id="qa"><div class="big" id="qab"></div><p class="why" id="qaw"></p></div>`;
    },
    update(step) {
      const k = Math.floor(step / 2) - 1, rev = step % 2 === 1;     // k = -1이면 성질 총정리
      const qa = $('#qa', PANEL), sum = $('#qsum', PANEL);
      if (k !== this.k) {
        this.k = k;
        qa.classList.add('no-anim'); qa.classList.add('is-off'); void qa.offsetWidth; qa.classList.remove('no-anim');
        FIG.classList.remove('rev');
        if (k < 0) {
          FIG.innerHTML = SUMFIG;
          $('#qtag', PANEL).textContent = '마무리 · 오늘 배운 성질';
          $('#qc', PANEL).textContent = '';
          $('#qt', PANEL).innerHTML = '오늘 배운 성질을 정리해요.';
          $('#qt', PANEL).classList.remove('tall');
          $('#qs', PANEL).hidden = true;
          sum.hidden = false;
        } else {
          const it = QUIZ[k];
          FIG.innerHTML = it.fig;
          $('#qtag', PANEL).textContent = `마무리 문제 · ${it.tag}`;
          $('#qc', PANEL).textContent = `${k + 1} / ${QUIZ.length}`;
          $('#qs', PANEL).innerHTML = it.sub || '';
          $('#qs', PANEL).hidden = !it.sub;
          $('#qt', PANEL).innerHTML = it.q;
          $('#qt', PANEL).classList.toggle('tall', it.q.includes('class="ov"'));
          $('#qab', PANEL).innerHTML = it.ans;
          $('#qaw', PANEL).innerHTML = it.why;
          sum.hidden = true;
        }
        const svg = $('svg', FIG);
        if (svg) svg.style.animation = 'enter .4s ease both';
      }
      if (k < 0) $('#qsum2', PANEL).classList.toggle('is-off', !rev);
      qa.classList.toggle('is-off', k < 0 || !rev);
      FIG.classList.toggle('rev', rev);
    }
  };

  /* ---------- 장면 목록과 위 띠 (번호, 이름, 장면 순서) ---------- */
  const scenes = [scBisect, scPerp, scLen, scCalc, scEnv, scQuiz];
  const NAVS = [['1', '현의 수직이등분선', 0], ['2', '현에 내린 수선', 1], ['3', '현의 길이', 2], ['4', '길이 구하기', 3], ['', '덤', 4], ['', '마무리', 5]];

  /* ---------- 진행 ---------- */
  let curSi = -1;
  function go(si, step) {
    si = Math.max(0, Math.min(scenes.length - 1, si));
    const sc = scenes[si];
    step = Math.max(0, Math.min(sc.steps() - 1, step));
    if (si !== curSi) {
      if (curSi >= 0 && scenes[curSi].leave) scenes[curSi].leave();
      curSi = si; state.si = si; state.step = step;
      FIG.className = 'fig'; FIG.innerHTML = ''; PANEL.innerHTML = '';
      STAGE.classList.toggle('wide', !!sc.wide);
      STAGE.classList.toggle('figwide', !!sc.figwide);
      STAGE.classList.add('instant');
      sc.build();
      FIG.classList.add('no-anim'); PANEL.classList.add('no-anim');
      sc.update(step, step);
      void FIG.offsetWidth;
      FIG.classList.remove('no-anim'); PANEL.classList.remove('no-anim');
      STAGE.classList.remove('enter'); void STAGE.offsetWidth; STAGE.classList.add('enter');
      renderInk();
    } else {
      const prev = state.step;
      state.step = step;
      STAGE.classList.toggle('instant', step < prev);   // 뒤로 갈 때는 늦게 나타나기 없이 바로
      if (prev !== step) sc.update(step, prev);
    }
    updateChrome();
  }
  const next = () => {
    const sc = scenes[state.si];
    if (sc.advance && sc.advance()) return;
    if (state.step < sc.steps() - 1) go(state.si, state.step + 1);
    else if (state.si < scenes.length - 1) go(state.si + 1, 0);
  };
  const prev = () => {
    const sc = scenes[state.si];
    if (sc.retreat && sc.retreat()) return;
    if (state.step > 0) go(state.si, state.step - 1);
    else if (state.si > 0) go(state.si - 1, scenes[state.si - 1].steps() - 1);
  };

  const navEl = $('#nav');
  navEl.innerHTML = NAVS.map((n, i) => `<button type="button" data-nav="${i}" data-si="${n[2]}">${n[0] ? `<span class="n">${n[0]}</span>` : ''}${n[1]}</button>`).join('');
  $$('button', navEl).forEach(b => b.addEventListener('click', () => go(Number(b.getAttribute('data-si')), 0)));

  function updateChrome() {
    const sc = scenes[state.si], n = sc.steps();
    $$('button', navEl).forEach(b => {
      if (Number(b.getAttribute('data-nav')) === sc.nav) b.setAttribute('aria-current', 'step');
      else b.removeAttribute('aria-current');
    });
    const di = sc.dots ? sc.dots(state.step) : { n, cur: state.step };
    $('#dots').innerHTML = Array.from({ length: di.n }, (_, i) => `<span class="dot${i <= di.cur ? ' on' : ''}${i === di.cur ? ' cur' : ''}"></span>`).join('');
    $('#prevBtn').disabled = state.si === 0 && state.step === 0;
    $('#nextBtn').disabled = state.si === scenes.length - 1 && state.step === n - 1;
  }
  $('#nextBtn').addEventListener('click', next);
  $('#prevBtn').addEventListener('click', prev);

  /* ---------- 펜 (장면마다 따로 남는다) ---------- */
  const INK = $('#ink');
  const inkStore = new Map();
  let penOn = false, penVar = '--pen1', cur = null;
  const inkKey = () => String(state.si);
  const ptsStr = pts => pts.map(p => p.join(',')).join(' ');
  function renderInk() {
    const arr = inkStore.get(inkKey()) || [];
    INK.innerHTML = arr.map(s => `<polyline points="${ptsStr(s.pts)}" style="stroke:var(${s.c})"></polyline>`).join('');
  }
  function undoInk() { const arr = inkStore.get(inkKey()); if (arr && arr.length) { arr.pop(); renderInk(); } }
  const toInk = e => {
    const r = INK.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) / (r.width || 1) * 1000), Math.round((e.clientY - r.top) / (r.height || 1) * 1000)];
  };
  INK.addEventListener('pointerdown', e => {
    if (!penOn) return;
    e.preventDefault();
    try { INK.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    const p = toInk(e);
    cur = { c: penVar, pts: [p], el: document.createElementNS(NS, 'polyline') };
    cur.el.setAttribute('points', p.join(','));
    cur.el.style.stroke = `var(${penVar})`;
    INK.appendChild(cur.el);
    const arr = inkStore.get(inkKey()) || [];
    arr.push(cur);
    inkStore.set(inkKey(), arr);
  });
  INK.addEventListener('pointermove', e => {
    if (!cur) return;
    const p = toInk(e), last = cur.pts[cur.pts.length - 1];
    if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 3) return;
    cur.pts.push(p);
    cur.el.setAttribute('points', ptsStr(cur.pts));
  });
  const endStroke = () => {
    if (!cur) return;
    if (cur.pts.length === 1) { cur.pts.push([cur.pts[0][0] + 1, cur.pts[0][1] + 1]); cur.el.setAttribute('points', ptsStr(cur.pts)); }
    delete cur.el;
    cur = null;
  };
  INK.addEventListener('pointerup', endStroke);
  INK.addEventListener('pointercancel', endStroke);
  function setPen(on) {
    penOn = on;
    document.body.classList.toggle('pen-on', on);
    $('#penBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
    if (!on) endStroke();
  }
  $('#penBtn').addEventListener('click', () => setPen(!penOn));
  $('#penOff').addEventListener('click', () => setPen(false));
  $('#penUndo').addEventListener('click', undoInk);
  $('#penClear').addEventListener('click', () => { inkStore.set(inkKey(), []); renderInk(); });
  $$('.pen-sw').forEach(b => b.addEventListener('click', () => {
    penVar = b.getAttribute('data-pen');
    $$('.pen-sw').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  }));

  /* ---------- 화면 색: 종이 ↔ 칠판 ---------- */
  const root = document.documentElement;
  try { const t = localStorage.getItem('lesson-theme'); if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t); } catch (err) { /* 무시 */ }
  const themeNow = () => root.getAttribute('data-theme') || (mq('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const paintTheme = () => {
    const dark = themeNow() === 'dark';
    $('#themeLbl').textContent = dark ? '칠판' : '종이';
    $('#themeBtn').setAttribute('aria-label', `화면 색 바꾸기, 지금은 ${dark ? '칠판' : '종이'}`);
  };
  $('#themeBtn').addEventListener('click', () => {
    const t = themeNow() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('lesson-theme', t); } catch (err) { /* 무시 */ }
    paintTheme();
  });
  paintTheme();
  const schemeMq = mq('(prefers-color-scheme: dark)');
  if (schemeMq.addEventListener) schemeMq.addEventListener('change', paintTheme);

  /* ---------- 전체 화면 ---------- */
  const fsBtn = $('#fsBtn');
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  const toggleFs = () => {
    if (!document.fullscreenEnabled) return;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else root.requestFullscreen().catch(() => {});
  };
  fsBtn.addEventListener('click', toggleFs);

  /* ---------- 키보드 (방향키, 발표용 리모컨) ---------- */
  document.addEventListener('keydown', e => {
    if (e.altKey || e.defaultPrevented) return;
    const tn = e.target && e.target.tagName ? e.target.tagName : '';
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { if (penOn) { e.preventDefault(); undoInk(); } return; }
    if (e.ctrlKey || e.metaKey) return;
    if (tn === 'TEXTAREA' || tn === 'INPUT') return;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || ((k === ' ' || k === 'Enter') && tn !== 'BUTTON')) { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'p' || k === 'P' || k === 'ㅔ') setPen(!penOn);
    else if (k === 'f' || k === 'F' || k === 'ㄹ') toggleFs();
    else if (k === 'Escape') { if (penOn) setPen(false); }
    else if (/^[1-9]$/.test(k) && NAVS[Number(k) - 1]) go(NAVS[Number(k) - 1][2], 0);
  });

  go(0, 0);
})();
</script>
</body>
