<title>작도 몽타주 모아보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 작도 실습실 교사용 화면의 종이·잉크 색을 그대로 잇는다. 모눈 깔린 판 위에서 학생 몽타주 카드를 펼치고, 포개고, 유형별로 모은다.
   위: 이름 + 과제(조사 2 · 조사 3) / 가운데 줄: 주어진 조건 + 보기 방식 / 아래: 판(남은 높이 전부) */
:root{
  --desk:#E4DCC6; --paper:#FCFAF3; --card:#FFFCF6; --chip:#F4EFE3; --rule:#DCD3BE; --grid:rgba(28,26,22,.055);
  --ink:#1C1A16; --ink-soft:#6A6355; --gold:#C98A10; --on-gold:#231B06;
  --t1:#1F3F94; --t2:#C0342A; --t3:#2A7148; --t4:#B07A0C; --t5:#6A4CA8; --t6:#8A6A0E;
  --stack-op:.7;
  --sans:"Pretendard","Pretendard Variable","IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#14120E; --paper:#1D1B16; --card:#25221C; --chip:#2C2922; --rule:#3B362C; --grid:rgba(242,237,225,.05);
    --ink:#F2EDE1; --ink-soft:#B3AA97; --gold:#E2AE45; --on-gold:#1D1606;
    --t1:#8FA8F0; --t2:#F08A7E; --t3:#7CC79C; --t4:#E8B84E; --t5:#B9A2F0; --t6:#D9BF6A;
    --stack-op:.8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#14120E; --paper:#1D1B16; --card:#25221C; --chip:#2C2922; --rule:#3B362C; --grid:rgba(242,237,225,.05);
  --ink:#F2EDE1; --ink-soft:#B3AA97; --gold:#E2AE45; --on-gold:#1D1606;
  --t1:#8FA8F0; --t2:#F08A7E; --t3:#7CC79C; --t4:#E8B84E; --t5:#B9A2F0; --t6:#D9BF6A;
  --stack-op:.8; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{min-height:100%;height:100%;display:flex;flex-direction:column;gap:10px;
  padding-block:12px 14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.top{display:flex;align-items:flex-end;gap:12px 28px;flex-wrap:wrap}
.brand{min-width:0}
.brand h1{margin:0;font:700 clamp(19px,1.6vw,24px)/1.2 var(--sans);letter-spacing:-.02em;text-wrap:balance}
.brand p{margin:4px 0 0;font:500 13px/1.4 var(--sans);color:var(--ink-soft)}
.tasks{display:flex;gap:10px 18px;flex-wrap:wrap;margin-left:auto}
.tg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg-l{font:700 11.5px/1 var(--sans);letter-spacing:.06em;color:var(--ink-soft);margin-right:2px}
.tk{display:inline-flex;align-items:baseline;gap:6px;padding:9px 13px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--rule);background:var(--card);font:600 13px/1 var(--sans);white-space:nowrap}
.tk b{font-weight:700}
.tk:hover{border-color:var(--ink-soft)}
.tk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--rule)}
.cond{margin:0;flex:1 1 320px;min-width:0;font:500 15px/1.5 var(--sans)}
.cond small{display:block;font:700 11.5px/1.2 var(--sans);letter-spacing:.06em;color:var(--ink-soft);margin-bottom:3px}
.cond b{font-weight:700;font-variant-numeric:tabular-nums}
.modes{display:flex;gap:4px;padding:4px;border-radius:11px;background:var(--chip);border:1px solid var(--rule)}
.modes button{border:0;background:transparent;padding:10px 14px;border-radius:8px;cursor:pointer;
  font:600 13.5px/1 var(--sans);color:var(--ink-soft);white-space:nowrap}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.count{font:700 13px/1 var(--sans);color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.stage{position:relative;flex:1 1 auto;min-height:360px;border-radius:14px;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:contain;scrollbar-gutter:stable;background-color:var(--paper);border:1px solid var(--rule);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:local}
.stage.locked{overflow-y:hidden}
.canvas{position:relative;width:100%}
.board{position:absolute;left:0;top:0;width:100%;display:block;overflow:visible}
/* 카드 한 장 = 종이(rect) + 몽타주(polygon) + 임시 이름(text). 포갤 때 카드째로 돌고 뒤집힌다 */
.card{transform-box:view-box;transform:translate(0px,0px) rotate(0deg) scale(1,1);
  transition:transform .85s cubic-bezier(.3,1.16,.42,1)}
.card rect{fill:var(--card);stroke:var(--rule);stroke-width:1.5;
  transition:fill-opacity .5s,stroke .5s,stroke-opacity .5s}
.card text{font:700 14px var(--sans);fill:var(--ink-soft);text-anchor:middle;transition:fill-opacity .5s}
.card polygon{fill-opacity:.12;stroke-width:2.4;stroke-linejoin:round;transition:stroke-opacity .5s,fill-opacity .5s}
.card.on rect{fill-opacity:var(--ra,.08);stroke:var(--ink-soft);stroke-opacity:.42}
.card.on text{fill-opacity:.62}
.card.turn rect{fill-opacity:.9;stroke:var(--ink-soft);stroke-opacity:.45}
.card.on polygon{stroke-opacity:var(--stack-op);fill-opacity:var(--fo,.03)}
.stage.instant .card{transition:none!important}
.tlab{position:absolute;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--rule);
  font:700 13px/1 var(--sans);white-space:nowrap;font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .4s .5s;pointer-events:none}
.tlab i{width:10px;height:10px;border-radius:99px;background:var(--c)}
.tlab em{font-style:normal;font-weight:600;color:var(--ink-soft)}
.stage.typed .tlab{opacity:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;font:600 15px/1.5 var(--sans);color:var(--ink-soft);text-align:center;padding:24px}
@media (prefers-reduced-motion:reduce){.card{transition-duration:.35s}.tlab{transition-delay:0s}}
@media (max-width:640px){
  .tasks{margin-left:0}
  .modes{width:100%;flex-wrap:wrap}.modes button{flex:1 1 40%;padding-inline:6px}
  .stage{min-height:62vh}
}
</style>

  <header class="top">

      <h1>작도 몽타주 모아보기</h1>
      <p>작도 실습실 · 여러 반이 조사 2와 조사 3에서 작도한 삼각형</p>
    </div>
    <nav class="tasks" id="tasks" aria-label="과제"></nav>

  </section>
  <main class="stage" id="stage" aria-label="몽타주 판"><div class="canvas" id="canvas"></div></main>
</div>

                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var task = store.get("montage.task");
  if (ORDER.indexOf(task) < 0) task = "t5";
  var mode = "spread";
  var items = [], cards = [], labels = [], grid = null;

  /* ---------- 과제 고르기 ---------- */
  var groups = {};
  ORDER.forEach(function (t) { (groups[INFO[t].grp] = groups[INFO[t].grp] || []).push(t); });
  $("tasks").innerHTML = Object.keys(groups).map(function (g) {
    return '<div class="tg"><span class="tg-l">' + g + '</span>' + groups[g].map(function (t) {
      return '<button type="button" class="tk" id="tk-' + t + '" data-task="' + t + '" aria-pressed="false"><b>' +
        INFO[t].k + '</b>' + INFO[t].n + '</button>';
    }).join("") + '</div>';
  }).join("");
  $("tasks").addEventListener("click", function (e) {
    var b = e.target.closest("[data-task]"); if (!b || b.dataset.task === task) return;
    task = b.dataset.task; store.set("montage.task", task); mode = "spread"; load();
  });
  $("modes").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mode]"); if (!b || b.dataset.mode === mode) return;
    mode = b.dataset.mode; paintModes(); apply(true);
  });
  function paintModes() {
    [].forEach.call($("modes").querySelectorAll("button"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === mode)); });
  }

  /* ---------- 자료 ----------
     한 장 = [색, 유형, O, X, Z(학생이 그린 좌표), α, f, 기준 무게중심]
     α·f: 정답 삼각형(기준)에 가장 잘 겹치도록 돌릴 각(라디안)과 뒤집기(1/-1) — 미리 계산해 둔 값 */
  var canvas = $("canvas");
  function load() {
    [].forEach.call($("tasks").querySelectorAll("[data-task]"), function (b) { b.setAttribute("aria-pressed", String(b.dataset.task === task)); });
    var info = INFO[task], d = (DATA && DATA.tasks[task]) || { n: 0, items: [] };
    $("cond").innerHTML = "<small>" + info.grp + " · " + info.k + " " + info.n + "</small>" + info.cond;
    $("count").textContent = "모두 " + d.items.length + "장";
    items = d.items.map(function (r, i) {
      var P = [{ x: r[2], y: r[3] }, { x: r[4], y: r[5] }, { x: r[6], y: r[7] }];
      var g = { x: (P[0].x + P[1].x + P[2].x) / 3, y: (P[0].y + P[1].y + P[2].y) / 3 };
      var al = r[8], f = r[9], gr = { x: r[10], y: r[11] }, c = Math.cos(al), s = Math.sin(al);
      var A = P.map(function (q) { var dx = q.x - g.x, dy = f * (q.y - g.y); return { x: c * dx - s * dy + gr.x, y: s * dx + c * dy + gr.y }; });
      return { col: DATA.colors[r[0]] || "#1C1A16", kind: r[1], P: P, g: g, al: al, f: f, gr: gr, A: A,
               name: "탐정 " + (i + 1 < 10 ? "0" : "") + (i + 1),
               span: Math.max(dist(P[0], P[1]), dist(P[1], P[2]), dist(P[2], P[0])) };
    });
    canvas.innerHTML = '<svg class="board" id="board" aria-hidden="true">' + items.map(function (it) {
      return '<g class="card"><rect rx="10"></rect><polygon fill="' + it.col + '" stroke="' + it.col + '"></polygon><text>' + it.name + '</text></g>';
    }).join("") + "</svg>";
    cards = [].slice.call(canvas.querySelectorAll(".card"));
    labels = [];
    for (var k = 0; k < d.n; k++) {
      var lab = document.createElement("div");
      var cnt = items.filter(function (it) { return it.kind === k; }).length;
      lab.className = "tlab";
      lab.style.setProperty("--c", "var(" + TCOL[k % TCOL.length] + ")");
      lab.innerHTML = "<i></i>" + (k + 1) + "형<em>" + cnt + "장</em>";
      canvas.appendChild(lab); labels.push(lab);
    }
    if (!items.length) {
      var em = document.createElement("div"); em.className = "empty";
      em.textContent = "이 과제에는 아직 보여 줄 몽타주가 없습니다.";
      canvas.appendChild(em);
    }
    var n = Math.max(1, items.length);
    /* 다 겹친 곳이 반쯤 진해지도록, 장수가 많을수록 한 장의 채움을 옅게 */
    stage.style.setProperty("--fo", (1 - Math.pow(0.5, 1 / n)).toFixed(4));
    stage.style.setProperty("--ra", Math.min(0.45, Math.max(0.03, 1 - Math.pow(0.45, 1 / n))).toFixed(3));
    paintModes();
    stage.scrollTop = 0;
    layout(false);
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  /* ---------- 펼쳐 놓기: 큰 카드를 줄지어 깔고, 넘치면 판을 내려 본다 ---------- */
  function layout(animate) {
    var W = stage.clientWidth, H = stage.clientHeight, n = items.length;
    if (!n || !W || !H) { grid = null; return; }
    var gap = 12, pad = 16;
    var want = W < 560 ? (W - pad * 2 - gap) / 2 : 300;
    var cols = Math.max(1, Math.round((W - pad * 2 + gap) / (want + gap)));
    var cw = Math.min(340, (W - pad * 2 - gap * (cols - 1)) / cols), ch = cw * 0.75;
    var rows = Math.ceil(n / cols);
    var gw = cols * cw + (cols - 1) * gap, gh = rows * ch + (rows - 1) * gap;
    var x0 = (W - gw) / 2, y0 = pad;
    var maxSpan = items.reduce(function (m, it) { return Math.max(m, it.span); }, 1);
    var k = Math.min(1.6, (ch * 0.76) / maxSpan);
    grid = { cw: cw, ch: ch, k: k, W: W, H: H, spreadH: Math.max(H, gh + pad * 2), cols: cols };
    var board = $("board");
    items.forEach(function (it, i) {
      var el = cards[i], col = i % cols, row = Math.floor(i / cols);
      it.left = x0 + col * (cw + gap); it.top = y0 + row * (ch + gap);
      var cx = it.left + cw / 2, cy = it.top + ch / 2;
      it.cx = cx; it.cy = cy;
      el.style.transformOrigin = cx.toFixed(1) + "px " + cy.toFixed(1) + "px";
      var r = el.firstChild, t = el.lastChild;
      r.setAttribute("x", it.left.toFixed(1)); r.setAttribute("y", it.top.toFixed(1));
      r.setAttribute("width", cw.toFixed(1)); r.setAttribute("height", ch.toFixed(1));
      /* 몽타주는 카드 위쪽에, 이름은 아래쪽에 */
      var my = cy - ch * 0.06;
      el.childNodes[1].setAttribute("points", it.P.map(function (p) {
        return ((p.x - it.g.x) * k + cx).toFixed(2) + "," + ((p.y - it.g.y) * k + my).toFixed(2);
      }).join(" "));
      it.my = my;
      t.setAttribute("x", cx.toFixed(1)); t.setAttribute("y", (it.top + ch - 12).toFixed(1));
    });
    apply(animate);
  }

  /* ---------- 움직이기 ----------
     펼쳐 놓기: 제자리 · 방향 맞추기: 제자리에서 카드째 돌려 몽타주 방향만 맞춤
     한데 포개기 / 유형별로 포개기: 카드 크기 그대로, 카드째 돌리고 뒤집어 정답 모양에 겹침 */
  var HOME = "translate(0px,0px) rotate(0deg) scale(1,1)";
  function turnOf(it) {                        /* 카드 중심을 축으로 돌릴 때, 몽타주 무게중심이 옮겨 가는 만큼 */
    var oy = it.my - it.cy, c = Math.cos(it.al), s = Math.sin(it.al);
    var th = it.al * 180 / Math.PI;
    return { rx: -s * (it.f * oy), ry: c * (it.f * oy), oy: oy, th: ((th % 360) + 540) % 360 - 180 };
  }
  function tf(dx, dy, it, t) {
    return "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) rotate(" + t.th.toFixed(2) + "deg) scale(1," + it.f + ")";
  }
  function apply(animate) {
    if (!grid) return;
    var W = grid.W, H = grid.H, n = items.length;
    if (!animate) stage.classList.add("instant");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    /* 앞의 몇 장은 착, 착 하나씩 보이게 천천히, 뒤로 갈수록 빨라져 전체는 4초 남짓 */
    var span = reduce ? 0 : Math.min(3.6, 0.25 * n);
    var pw = n > 1 ? Math.min(1, Math.max(0.5, Math.log(span / 0.13) / Math.log(n))) : 1;
    var arrive = function (i) { return animate && n > 1 ? (span * Math.pow(i / n, pw)).toFixed(3) + "s" : "0s"; };
    var back = function (i) { return animate ? (reduce ? 0 : (n - 1 - i) * Math.min(0.02, 0.9 / Math.max(1, n))).toFixed(3) + "s" : "0s"; };
    stage.classList.toggle("typed", mode === "type");
    var canvasH = grid.spreadH, scrollable = true;
    if (mode === "spread") {
      cards.forEach(function (el, i) {
        el.style.transitionDelay = back(i);
        el.classList.remove("on", "turn");
        el.style.transform = HOME;
      });
    } else if (mode === "align") {
      items.forEach(function (it, i) {
        var el = cards[i], t = turnOf(it);
        el.style.transitionDelay = arrive(i);
        el.classList.remove("on"); el.classList.add("turn");
        el.style.transform = tf(-t.rx, t.oy - t.ry, it, t);   /* 몽타주 무게중심은 제자리에 */
      });
    } else {
      var nk = mode === "type" ? Math.max(1, labels.length) : 1;
      var sets = [];
      for (var j = 0; j < nk; j++) sets.push([]);
      items.forEach(function (it, i) { sets[mode === "type" ? it.kind : 0].push(i); });
      /* 자리: 한 줄에 들어가면 판 가운데 높이에, 많으면(조사 3 ②) 여러 줄로 */
      var per = Math.max(1, Math.floor(W / (grid.cw * 1.3)));
      var slots = [], slotH = grid.ch * 1.5 + 40, top0 = mode === "type" ? 40 : 0;
      if (nk <= per) {
        for (j = 0; j < nk; j++) slots.push({ x: W * (j + 0.5) / nk, y: top0 + (H - top0) / 2, ly: 14 });
        scrollable = false;
      } else {
        var sw = W / per;
        for (j = 0; j < nk; j++) {
          var cj = j % per, rj = Math.floor(j / per);
          slots.push({ x: sw * (cj + 0.5), y: rj * slotH + 40 + (slotH - 40) / 2, ly: rj * slotH + 14 });
        }
        var typeH = Math.ceil(nk / per) * slotH + 16;
        scrollable = typeH > H;
        canvasH = Math.max(canvasH, typeH);
      }
      sets.forEach(function (ids, j) {
        if (!ids.length) return;
        var b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
        ids.forEach(function (i) { items[i].A.forEach(function (p) {
          b.x0 = Math.min(b.x0, p.x); b.y0 = Math.min(b.y0, p.y); b.x1 = Math.max(b.x1, p.x); b.y1 = Math.max(b.y1, p.y); }); });
        var Tx = slots[j].x - grid.k * (b.x0 + b.x1) / 2, Ty = slots[j].y - grid.k * (b.y0 + b.y1) / 2;
        ids.forEach(function (i) {
          var it = items[i], el = cards[i], t = turnOf(it);
          /* 몽타주 무게중심이 가야 할 곳 */
          var gx = Tx + grid.k * it.gr.x, gy = Ty + grid.k * it.gr.y;
          el.style.transitionDelay = arrive(i);
          el.classList.remove("turn"); el.classList.add("on");
          el.style.transform = tf(gx - t.rx - it.cx, gy - t.ry - it.cy, it, t);
        });
        if (labels[j]) { labels[j].style.left = slots[j].x + "px"; labels[j].style.top = slots[j].ly + "px"; }
      });
      if (animate && stage.scrollTop) stage.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    }
    canvas.style.height = canvasH + "px";
    $("board").setAttribute("viewBox", "0 0 " + W + " " + canvasH);
    $("board").style.height = canvasH + "px";
    stage.classList.toggle("locked", (mode === "stack" || mode === "type") && !scrollable);
    if (!animate) { void stage.offsetWidth; stage.classList.remove("instant"); }
  }

  var rt = 0;
  function resized() {
    if (grid && Math.abs(stage.clientWidth - grid.W) < 2 && Math.abs(stage.clientHeight - grid.H) < 2) return;
    layout(false);
  }
  if (window.ResizeObserver) new ResizeObserver(function () { clearTimeout(rt); rt = setTimeout(resized, 80); }).observe(stage);
  else window.addEventListener("resize", function () { layout(false); });
  load();
})();
</script>

</body></html>
