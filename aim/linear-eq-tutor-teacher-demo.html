<style>
/* 레이아웃: 상단 바(학급 선택) → 탭 → 요약이 먼저, 세부가 뒤. 단계 결과는 늘 같은 네 가지 색(첫 시도·힌트 뒤·세 번째·공개)으로 읽힌다. */
:root {

  --surface: #ffffff;
  --surface-2: #eef1f7;
  --line: #dde2ec;
  --ink: #161d2e;

  --reveal: #c3374f; --reveal-soft: #fce7eb;
  --note-bg: #fff7e2; --note-line: #f3dfab; --note-ink: #7a5300;

  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #151c2c; --surface-2: #1c2538; --line: #273149;
    --ink: #e8edf7; --ink-2: #aeb7ca; --ink-3: #7e889e;
    --accent: #84a6ff; --accent-soft: rgba(132, 166, 255, .14);
    --first: #4cd09f; --first-soft: rgba(76, 208, 159, .14);
    --hint: #7cbcf0;  --hint-soft: rgba(124, 188, 240, .14);
    --late: #f0b252;  --late-soft: rgba(240, 178, 82, .14);
    --reveal: #ff7d93; --reveal-soft: rgba(255, 125, 147, .15);
    --note-bg: rgba(240, 178, 82, .10); --note-line: rgba(240, 178, 82, .30); --note-ink: #f3c879;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px -8px rgba(0, 0, 0, .6);
    color-scheme: dark;

}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #151c2c; --surface-2: #1c2538; --line: #273149;
  --ink: #e8edf7; --ink-2: #aeb7ca; --ink-3: #7e889e;
  --accent: #84a6ff; --accent-soft: rgba(132, 166, 255, .14);

}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

}
.demo { display: flex; gap: 10px; align-items: baseline; margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: var(--note-bg); border: 1px solid var(--note-line); color: var(--note-ink); font-size: 13.5px; }

.tabs button {
  flex: none; border: 0; background: transparent; cursor: pointer; padding: 10px 14px 12px; font-size: 15px; font-weight: 600; color: var(--ink-3);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}

.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding-block: 24px 64px; }

.c-first { background: var(--first); } .c-hint { background: var(--hint); } .c-late { background: var(--late); } .c-reveal { background: var(--reveal); }

.insight { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; cursor: pointer; transition: border-color .15s, box-shadow .15s; min-width: 0; }
.insight:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.insight .tag { align-self: flex-start; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; }
.insight h3 { font-size: 15px; font-weight: 600; line-height: 1.5; }
.insight p { font-size: 13px; color: var(--ink-3); }
.insight q { quotes: "“" "”"; font-size: 15px; color: var(--ink); }
.insight q.eq { font-family: var(--mono); font-size: 14px; }
.wrongs .qt { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.t-reveal { background: var(--reveal-soft); color: var(--reveal); }
.t-late { background: var(--late-soft); color: var(--late); }
.t-hint { background: var(--hint-soft); color: var(--hint); }

.heat .prob b { font-weight: 600; display: block; line-height: 1.35; }

.cell {

.wrongs code { font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere; }
.wrongs small { grid-column: 1; font-size: 12.5px; color: var(--ink-3); }

.students tbody tr { cursor: pointer; }

.mini { display: flex; height: 8px; width: 96px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }

}

.dstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }

.dstats div { padding: 10px; border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.dstats b { font-size: 18px; font-weight: 600; }
.dstats span { font-size: 11.5px; color: var(--ink-3); }
.ptype { margin-top: 18px; }
.ptype h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--accent); }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.prow:last-child { border-bottom: 0; }
.prow .pt { min-width: 0; }
.prow .pt small { display: block; font-size: 12px; color: var(--ink-3); }
.dots { display: flex; gap: 4px; }
.dots i { width: 14px; height: 14px; border-radius: 4px; }
.dots i.none { background: transparent; border: 1px dashed var(--line); }
.trail { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.trail-item { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); font-size: 13.5px; }
.trail-item b { font-weight: 600; }
.trail-item .seq { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.trail-item code { font-family: var(--mono); font-size: 13px; padding: 2px 7px; border-radius: 7px; background: var(--reveal-soft); }
.trail-item .arrow { color: var(--ink-3); }

.foot { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }

    if (days === 0) return "오늘 " + hm;
    if (days === 1) return "어제 " + hm;

  }
  function probName(p) { return p.title; }

  /* ---------- 개요 ---------- */

    if (topWrong) insights.push('<button type="button" class="insight" data-go="' + topWrong.c.p.key + "|" + topWrong.c.col + '"><span class="tag t-late">가장 많이 나온 오답</span><h3><q class="eq">' + esc(topWrong.w.a) + "</q></h3><p>" + esc(topWrong.c.p.title) + " · " + COLS[topWrong.c.col] + " · " + topWrong.w.n + "번 · " + esc(topWrong.w.why) + "</p></button>");
    if (topQ) insights.push('<button type="button" class="insight" data-go="' + topQ.key + "|" + topQ.col + '"><span class="tag t-hint">학생이 가장 많이 물은 것</span><h3><q>' + esc(topQ.q) + "</q></h3><p>" + esc(PROB_BY_KEY[topQ.key].title) + " · " + COLS[topQ.col] + " · " + topQ.n + "번</p></button>");

    // 유형별 진도
    var typeRows = TYPES.map(function (t) {

    var helps = stats.map(function (x) { return { s: x.s, ss: x.ss, why: needsHelp(x.s, x.ss) }; }).filter(function (x) { return x.why.length; })

    function sev(x) { return x.ss.reveals * 2 + (x.ss.firstRate != null && x.ss.firstRate < 0.45 ? 4 : 0) + (x.ss.solved <= 2 ? 1 : 0) + x.why.length; }

      '<div class="grid-2">' +

          }).join("") : '<p class="empty">지금은 눈에 띄는 학생이 없어요.</p>') +

  /* ---------- 막히는 곳 ---------- */
  function metricOf(a) {
    if (!a || !a.n) return null;
    if (state.metric === "reveal") return a.o.reveal / a.n;
    if (state.metric === "first") return a.o.first / a.n;
    return a.avgTries;
  }
  function cellStyle(a, mc) {
    var v = metricOf(a); if (v == null) return "";
    var tone, amt;
    if (state.metric === "reveal") { tone = "--reveal"; amt = clamp(v / 0.45, 0, 1); }
    else if (state.metric === "first") { tone = "--first"; amt = clamp((v - 0.3) / 0.7, 0, 1); }
    else { tone = "--late"; amt = clamp((v - 1) / 1.1, 0, 1); }
    return "background: color-mix(in srgb, var(" + tone + ") " + Math.round(amt * 58) + "%, var(--surface));";
  }
  function cellText(a, mc) {
    var v = metricOf(a); if (v == null) return "—";
    if (state.metric === "tries") return v.toFixed(1) + "번";
    return Math.round(v * 100) + "%";
  }
  function renderSteps() {
    var list = roster();
    if (!state.cell) {
      // 처음엔 답 공개가 가장 많은 칸을 열어 둠
      var best = null;
      PROBS.forEach(function (p) { if (p.mc) return; for (var col = 0; col < 4; col++) { if (!p.cols[col].length) continue; var a = cellAgg(list, p.key, col); if (a.n >= 10 && (!best || a.o.reveal / a.n > best.v)) best = { k: p.key + "|" + col, v: a.o.reveal / a.n }; } });
      state.cell = best ? best.k : PROBS[1].key + "|1";
    }
    var rows = "";
    TYPES.forEach(function (t) {
      rows += '<tr class="type"><td colspan="5">' + esc(t.name) + "</td></tr>";
      PROBS.filter(function (p) { return p.type === t && !p.mc; }).forEach(function (p) {
        rows += '<tr><td class="prob"><b>' + esc(p.title) + "</b><small>" + levelLabel(p) + (p.mc ? " · 객관식" : "") + "</small></td>";
        for (var col = 0; col < 4; col++) {
          var key = p.key + "|" + col;
          if (!p.cols[col].length) { rows += '<td><span class="cell na">없음</span></td>'; continue; }
          var a = cellAgg(list, p.key, col);
          rows += '<td><button type="button" class="cell num" data-cell="' + key + '" aria-pressed="' + (state.cell === key) + '" style="' + cellStyle(a, p.mc) + '" aria-label="' + esc(p.title) + " " + COLS[col] + " " + cellText(a, p.mc) + '">' + cellText(a, p.mc) + "</button></td>";
        }
        rows += "</tr>";
      });
    });
    var mLabel = { reveal: "답 공개 비율", first: "첫 시도 정답률", tries: "평균 시도 횟수" };
    $("v-steps").innerHTML =
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-h"><h2>문제 × 단계</h2><div class="seg" role="group" aria-label="보기 기준">' +
          ["reveal", "first", "tries"].map(function (m) { return '<button type="button" data-metric="' + m + '" aria-pressed="' + (state.metric === m) + '">' + mLabel[m] + "</button>"; }).join("") +
        '</div></div><div class="table-scroll"><table class="heat"><thead><tr><th>문제</th>' + COLS.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
        '<p class="foot">칸을 누르면 그 단계의 결과, 자주 나온 오답, 학생 질문이 보여요. 칸이 진할수록 ' + (state.metric === "first" ? "첫 시도에 잘 풀었어요." : "더 많이 막혔어요.") + " 객관식 튜토리얼은 개요의 유형별 진도에서 볼 수 있어요.</p></div>" +
        '<div class="panel detail" id="cellDetail"></div>' +
      "</div>";
    renderCellDetail();
  }
  function renderCellDetail() {
    var el = $("cellDetail"); if (!el || !state.cell) return;
    var parts = state.cell.split("|"), p = PROB_BY_KEY[parts[0]], col = Number(parts[1]);
    var a = cellAgg(roster(), p.key, col);
    var step = p.steps[p.cols[col][0]];

      '<p class="qtext">' + esc(p.text) + "</p>" +

      '<div class="dsec"><h4>어떻게 넘어갔나</h4><div class="dist">' + ORDER.map(function (k) {
        return '<div class="' + OUT[k].soft + '"><b class="num">' + (a.n ? Math.round(a.o[k] / a.n * 100) : 0) + "%</b><span>" + OUT[k].short + " " + a.o[k] + "명</span></div>";
      }).join("") + "</div></div>" +
      (a.alts.length ? '<div class="dsec"><h4>다른 풀이로 인정</h4><ul class="wrongs">' + a.alts.map(function (w) { return '<li class="alt"><code>' + esc(w.a) + "</code><small>" + esc(w.why) + '</small><span class="cnt">' + w.n + "명</span></li>"; }).join("") + "</ul></div>" : "") +
      '<div class="dsec"><h4>자주 나온 오답</h4>' + (a.wrong.length ? '<ul class="wrongs">' + a.wrong.slice(0, 6).map(function (w) { return "<li><code>" + esc(w.a) + "</code><small>" + esc(w.why) + '</small><span class="cnt">' + w.n + "번</span></li>"; }).join("") + "</ul>" : '<p class="empty">오답이 없어요.</p>') + "</div>" +
      '<div class="dsec"><h4>학생이 튜터에게 물은 것</h4>' + (a.qs.length ? '<ul class="wrongs">' + a.qs.map(function (q) { return '<li><span class="qt">' + esc(q.q) + '</span><small>답은 알려 주지 않고 설명이나 힌트로 답했어요.</small><span class="cnt">' + q.n + "번</span></li>"; }).join("") + "</ul>" : '<p class="empty">이 단계에서는 질문이 없었어요.</p>') + "</div>";

  /* ---------- 학생 ---------- */

    var q = state.q.trim();

    var sorters = {

        '<td><div class="bar"><span class="track"><i style="width:' + (ss.solved / 20 * 100) + '%"></i></span><span class="num">' + ss.solved + "</span></div></td>" +
        '<td><div class="mini" role="img" aria-label="첫 시도 ' + ss.o.first + ", 두 번째 " + ss.o.hint + ", 세 번째 " + ss.o.late + ", 공개 " + ss.o.reveal + '">' + (ss.steps ? ORDER.map(function (k) { return ss.o[k] ? '<i class="' + OUT[k].cls + '" style="width:' + (ss.o[k] / ss.steps * 100) + '%"></i>' : ""; }).join("") : "") + "</div></td>" +
        '<td class="r num">' + pct(ss.firstRate) + "</td>" +
        '<td class="r num">' + ss.reveals + "</td>" +

    }).join("");
    $("v-students").innerHTML =
      '<div class="panel"><div class="toolbar">' +
        '<input type="search" id="studentSearch" placeholder="이름이나 번호로 찾기" aria-label="학생 찾기" value="' + esc(state.q) + '">' +
        '<label class="field" for="studentSort">정렬 <select id="studentSort">' +
          [["no", "번호순"], ["solved", "푼 문제 많은 순"], ["reveal", "답 공개 많은 순"], ["first", "첫 시도 정답률 낮은 순"], ["best", "서바이벌 높은 순"]].map(function (o) { return '<option value="' + o[0] + '"' + (state.sort === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") +
        "</select></label>" + legendHtml() + "</div>" +
        '<div class="table-scroll"><table class="students"><thead><tr><th>번호</th><th>이름</th><th>푼 문제 (/20)</th><th>단계 결과</th><th class="r">첫 시도</th><th class="r">답 공개</th><th class="r">질문</th><th class="r">서바이벌</th><th>최근 활동</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="9" class="empty">찾는 학생이 없어요.</td></tr>') + "</tbody></table></div>" +
        '<p class="foot">이름을 누르면 문제별 기록과 오답 흐름을 볼 수 있어요.</p></div>';
  }

  /* ---------- 서바이벌 ---------- */
  function renderSurvival() {
    var list = roster().map(function (s) { return { s: s, ss: studentStats(s) }; }).filter(function (x) { return x.ss.runs; });
    var hist = []; for (var i = 0; i <= 20; i++) hist.push(0);
    list.forEach(function (x) { hist[x.ss.best]++; });
    var maxH = Math.max.apply(null, hist.concat([1]));
    var W = 640, H = 220, padL = 28, padB = 26, padT = 14, bw = (W - padL - 8) / 21;
    var ticks = []; var stepT = maxH > 8 ? Math.ceil(maxH / 4) : 2; for (var tv = 0; tv <= maxH; tv += stepT) ticks.push(tv);
    var svg = '<svg class="hist" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="최고 기록별 학생 수">' +
      ticks.map(function (tv) { var y = H - padB - tv / maxH * (H - padB - padT); return '<line x1="' + padL + '" x2="' + (W - 4) + '" y1="' + y + '" y2="' + y + '"></line><text x="' + (padL - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + tv + "</text>"; }).join("") +
      hist.map(function (v, i) {
        var h = v / maxH * (H - padB - padT), x = padL + 4 + i * bw, y = H - padB - h;
        return (v ? '<rect class="b' + (i === 20 ? " top" : "") + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw - 4).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3"><title>' + i + "점: " + v + "명</title></rect>" : "") +
          (i % 2 === 0 ? '<text class="lbl" x="' + (x + (bw - 4) / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + i + "</text>" : "");
      }).join("") + "</svg>";
    var ranked = list.slice().sort(function (a, b) { return b.ss.best - a.ss.best || a.ss.runs - b.ss.runs; }).slice(0, 10);
    var kills = {};
    Object.keys(SURVIVAL_KILL).forEach(function (k) { var parts = k.split("|"); if (state.cls !== "all" && parts[0] !== state.cls) return; kills[parts[1]] = (kills[parts[1]] || 0) + SURVIVAL_KILL[k]; });
    var killList = Object.keys(kills).map(function (k) { return { p: PROB_BY_KEY[k], n: kills[k] }; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 6);
    var totalRuns = list.reduce(function (s, x) { return s + x.ss.runs; }, 0);
    $("v-survival").innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><span>도전한 학생</span><b class="num">' + list.length + '<small>명</small></b><em>모두 ' + totalRuns + "번 도전</em></div>" +
        '<div class="kpi"><span>20문제 모두 통과</span><b class="num">' + hist[20] + '<small>명</small></b><em>단 한 번도 틀리지 않음</em></div>' +
        '<div class="kpi"><span>최고 기록 중앙값</span><b class="num">' + (list.length ? list.map(function (x) { return x.ss.best; }).sort(function (a, b) { return a - b; })[Math.floor(list.length / 2)] : 0) + '<small>/ 20</small></b><em>학생마다 가장 좋은 기록</em></div>' +
        '<div class="kpi"><span>탈락을 가장 많이 부른 문제</span><b style="font-size:17px;line-height:1.4">' + (killList[0] ? esc(killList[0].p.title) : "—") + '</b><em>' + (killList[0] ? killList[0].n + "번" : "") + "</em></div>" +
      "</div>" +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-h"><h2>최고 기록 분포</h2><p>학생마다 가장 좋은 기록 하나</p></div>' + svg + "</div>" +
        '<div class="panel"><div class="panel-h"><h2>순위 10</h2><p>같은 점수면 적게 도전한 학생이 위</p></div><ol class="rank">' +
          ranked.map(function (x, i) { return '<li><span class="pos">' + (i + 1) + '</span><span class="who">' + (state.cls === "all" ? clsName(x.s.cls).replace("1학년 ", "") + " " : "") + esc(x.s.name) + '</span><span class="sc">' + x.ss.best + "점</span></li>"; }).join("") +
        "</ol></div>" +
      "</div>" +
      '<div class="panel"><div class="panel-h"><h2>탈락을 부른 문제</h2><p>서바이벌에서 틀려 끝난 문제 · 수업에서 다시 다뤄 볼 후보</p></div><div class="table-scroll"><table class="kill"><thead><tr><th>문제</th><th>유형</th><th class="r">탈락</th><th>막대</th></tr></thead><tbody>' +
        killList.map(function (k) { return "<tr><td><b>" + esc(k.p.title) + "</b></td><td>" + esc(k.p.type.name) + '</td><td class="r num">' + k.n + '</td><td style="min-width:140px"><div class="bar"><span class="track"><i style="width:' + (k.n / killList[0].n * 100) + '%;background:var(--reveal)"></i></span></div></td></tr>'; }).join("") +
      "</tbody></table></div></div>";
  }

  /* ---------- 학생 상세 ---------- */
  var lastFocus = null;
  function openStudent(id) {
    var s = STUDENTS.filter(function (x) { return x.id === id; })[0]; if (!s) return;
    var ss = studentStats(s);
    var byType = TYPES.map(function (t) {
      var rows = PROBS.filter(function (p) { return p.type === t; }).map(function (p) {
        var rec = s.probs[p.key];
        var dots = [0, 1, 2, 3].map(function (col) {
          if (!p.cols[col].length) return "";
          var c = rec && rec.cols[col];
          return c ? '<i class="' + OUT[c.outcome].cls + '" title="' + COLS[col] + ": " + OUT[c.outcome].label + '"></i>' : '<i class="none" title="' + COLS[col] + ': 아직"></i>';
        }).join("");
        return '<div class="prow"><span class="pt">' + esc(p.title) + "<small>" + levelLabel(p) + (rec ? "" : " · 아직 안 풂") + '</small></span><span class="dots">' + dots + "</span></div>";
      }).join("");
      return '<div class="ptype"><h4>' + esc(t.name) + "</h4>" + rows + "</div>";
    }).join("");
    var trails = [];
    Object.keys(s.probs).forEach(function (k) {
      var p = PROB_BY_KEY[k]; if (p.mc) return;
      s.probs[k].cols.forEach(function (c, col) {
        if (!c) return;
        if (c.outcome === "reveal" || c.outcome === "late" || c.question || c.alt) trails.push({ p: p, col: col, c: c });
      });
    });
    trails.sort(function (a, b) { return (b.c.outcome === "reveal") - (a.c.outcome === "reveal"); });
    var trailHtml = trails.slice(0, 8).map(function (x) {
      var seq = x.c.wrongs.map(function (w) { return "<code>" + esc(w.a) + "</code>"; }).join('<span class="arrow">→</span>');
      var end = x.c.outcome === "reveal" ? '<span class="chip t-reveal">답 공개</span>' : x.c.outcome === "late" ? '<span class="chip t-late">세 번째에 해결</span>' : x.c.alt ? '<span class="chip t-first">다른 풀이로 인정</span>' : '<span class="chip t-first">' + OUT[x.c.outcome].label + "</span>";
      return '<div class="trail-item"><b>' + esc(x.p.title) + "</b> · " + COLS[x.col] +
        '<div class="seq">' + (x.c.alt ? "<code style=\"background:var(--first-soft)\">" + esc(x.c.alt[0]) + "</code>" : seq + (seq ? '<span class="arrow">→</span>' : "")) + end + "</div>" +
        (x.c.question ? '<p class="q">튜터에게 물은 것: “' + esc(x.c.question) + "”</p>" : "") + "</div>";
    }).join("");
    $("drawer").innerHTML =
      '<div class="drawer-h"><div><h2 id="drawer-title">' + s.no + "번 " + esc(s.name) + "</h2><p>" + clsName(s.cls) + " · 최근 활동 " + ago(s.last) + '</p></div><button type="button" class="close" id="drawerClose" aria-label="닫기">×</button></div>' +
      '<div class="dstats"><div><b class="num">' + ss.solved + '</b><span>푼 문제 / 20</span></div><div><b class="num">' + pct(ss.firstRate) + '</b><span>첫 시도 정답</span></div><div><b class="num">' + ss.reveals + '</b><span>답 공개</span></div><div><b class="num">' + (ss.runs ? ss.best : "—") + '</b><span>서바이벌 최고</span></div></div>' +
      '<div style="margin-top:14px">' + legendHtml() + "</div>" +
      byType +
      '<div class="trail"><h4 style="margin:0;font-size:13px;color:var(--ink-3)">눈여겨볼 대화 흐름</h4>' + (trailHtml || '<p class="empty">막힌 단계 없이 잘 풀었어요.</p>') + "</div>";
    lastFocus = document.activeElement;
    $("drawer").hidden = false; $("scrim").hidden = false;
    $("drawer").scrollTop = 0;
    $("drawerClose").focus();
  }
  function closeStudent() {
    $("drawer").hidden = true; $("scrim").hidden = true;
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
  }

  /* ---------- 화면 전환과 이벤트 ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var VIEWS = ["overview", "steps", "students", "survival"];
  function render() {
    VIEWS.forEach(function (v) {
      $("v-" + v).hidden = v !== state.view;
      $("tab-" + v).setAttribute("aria-selected", v === state.view ? "true" : "false");
      $("tab-" + v).tabIndex = v === state.view ? 0 : -1;
    });
    if (state.view === "overview") renderOverview();
    if (state.view === "steps") renderSteps();
    if (state.view === "students") renderStudents();
    if (state.view === "survival") renderSurvival();
  }
  function go(view) {
    if (VIEWS.indexOf(view) < 0) view = "overview";
    state.view = view;
    try { if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view); } catch (e) {}
    render();
  }

  $("cls").innerHTML = '<option value="all">전체 학급</option>' + CLASSES.map(function (c) { return '<option value="' + c.id + '">' + c.name + "</option>"; }).join("");
  if (state.cls !== "all" && !CLASSES.some(function (c) { return c.id === state.cls; })) state.cls = "all";
  $("cls").value = state.cls;
  $("cls").addEventListener("change", function (e) {
    state.cls = e.target.value; state.cell = null;
    try { localStorage.setItem("ilchaDashCls", state.cls); } catch (err) {}
    render();
  });
  $("tabs").addEventListener("click", function (e) { var b = e.target.closest("button[data-v]"); if (b) go(b.dataset.v); });
  $("tabs").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var i = VIEWS.indexOf(state.view) + (e.key === "ArrowRight" ? 1 : -1);
    go(VIEWS[(i + VIEWS.length) % VIEWS.length]); $("tab-" + state.view).focus();
  });
  document.addEventListener("click", function (e) {
    var s = e.target.closest("[data-student]"); if (s) { openStudent(s.dataset.student); return; }
    var g = e.target.closest("[data-go]"); if (g) { state.cell = g.dataset.go; go("steps"); return; }
    var c = e.target.closest("button[data-cell]");
    if (c) {
      state.cell = c.dataset.cell;
      document.querySelectorAll("button[data-cell]").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.cell === state.cell ? "true" : "false"); });
      renderCellDetail();
      if (window.innerWidth < 960) $("cellDetail").scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    var m = e.target.closest("button[data-metric]"); if (m) { state.metric = m.dataset.metric; renderSteps(); return; }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "studentSearch") { state.q = e.target.value; var pos = e.target.selectionStart; renderStudents(); var inp = $("studentSearch"); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) {} }
  });
  document.addEventListener("change", function (e) { if (e.target.id === "studentSort") { state.sort = e.target.value; renderStudents(); } });
  $("scrim").addEventListener("click", closeStudent);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("drawer").hidden) closeStudent(); });
  document.addEventListener("click", function (e) { if (e.target.id === "drawerClose") closeStudent(); });

  var h = (location.hash || "").replace("#", "");
  go(VIEWS.indexOf(h) >= 0 ? h : "overview");
})();
</script>

</body></html>
