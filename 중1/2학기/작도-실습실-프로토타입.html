<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작도 실습실 · 눈금 없는 자와 컴퍼스</title>
<style>
  :root{
    --paper:#FCFAF3; --paper-2:#E4DCC6; --card:#FFFCF6; --rule:#DCD3BE;
    --ink:#1C1A16; --ink-soft:#6A6355;
    --red:#C0342A; --blue:#1F3F94; --gold:#C98A10; --green:#2A7148;
    --panel-sh:0 10px 30px rgba(28,26,22,.14);
    --sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);background:var(--paper-2);color:var(--ink);overscroll-behavior:none}
  .app{height:100dvh;display:flex;flex-direction:column}

  /* ---------- 머리말 ---------- */
  .head{display:flex;align-items:center;gap:14px;padding:11px 18px;flex:0 0 auto;
    background:var(--card);border-bottom:1px solid var(--rule)}
  .tabs{display:flex;gap:7px}
  .tab{font:700 13.5px/1 var(--sans);padding:11px 16px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--rule);background:#F4EFE3;color:var(--ink-soft)}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .prompt{flex:1;min-width:0;font:600 14.5px/1.4 var(--sans);margin:0;color:#332F27}
  .prompt b{font-family:var(--serif);font-weight:700;font-size:16.5px;color:var(--ink)}

  /* ---------- 작도판 ---------- */
  .wrap{flex:1;min-height:0;position:relative;padding:14px 18px 84px 274px;
    background:var(--paper-2)}
  svg#board{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;
    background:var(--paper);border:1px solid #D3C9B2;border-radius:5px;
    box-shadow:0 3px 16px rgba(28,26,22,.11);-webkit-user-select:none;user-select:none}
  svg#board *{pointer-events:none}

  .hud{position:absolute;top:0;bottom:84px;left:274px;right:18px;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:18px 8px}
  .verdict{display:none;gap:12px;align-items:flex-start;padding:13px 18px;border-radius:12px;
    background:var(--card);border:1.5px solid var(--ink);max-width:min(580px,96%);
    box-shadow:0 10px 30px rgba(28,26,22,.18)}
  .verdict.on{display:flex}
  .verdict .dot{width:11px;height:11px;border-radius:50%;margin-top:5px;flex:0 0 auto}
  .verdict strong{font:700 15px/1.3 var(--sans)}
  .verdict small{display:block;font:500 12.5px/1.55 var(--sans);color:var(--ink-soft);margin-top:5px}
  .verdict b{color:var(--gold)}
  .toast{background:var(--ink);color:#FBF7EE;font:600 13px/1.4 var(--sans);padding:10px 16px;border-radius:9px;
    opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;max-width:min(560px,96%)}
  .toast.on{opacity:1;transform:none}

  /* ---------- 도구 설명 띠 ---------- */
  #toolbar{position:absolute;left:274px;right:18px;bottom:14px;display:flex;justify-content:center;
    flex-wrap:wrap;gap:8px;pointer-events:none}
  .tcell{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--rule);
    border-radius:11px;padding:8px 12px 8px 8px;box-shadow:0 4px 14px rgba(28,26,22,.1);transition:.18s}
  .tcell .k{font:800 12px/1 var(--sans);color:#FBF7EE;background:var(--ink);
    border-radius:7px;padding:7px 10px;white-space:nowrap}
  .tcell .v{font:600 13.5px/1.25 var(--sans);color:#2A261E;white-space:nowrap}
  .tcell .v b{color:var(--red);font-weight:800}
  .tcell .s{font:800 12.5px/1 var(--sans);color:#8A6A0E;background:#F8EFD8;
    border:1px solid #E8D7A8;border-radius:7px;padding:7px 10px;white-space:nowrap}
  .tcell.hot{border-color:var(--gold);box-shadow:0 6px 20px rgba(201,138,16,.35)}
  .tcell.hot .k{background:var(--gold);color:#231B06}

  /* ---------- 왼쪽 패널 ---------- */
  .panel{position:absolute;left:14px;top:14px;width:246px;max-height:calc(100% - 28px);z-index:5;
    background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--panel-sh);
    padding:11px;display:flex;flex-direction:column;gap:9px;
    -webkit-user-select:none;user-select:none}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .toolwrap{position:relative;display:flex}
  .tool{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:12px 4px;cursor:pointer;text-align:center;border-radius:9px;
    background:#F6F1E6;border:1.5px solid var(--rule);color:var(--ink);font:700 12.5px/1.2 var(--sans)}
  .tool svg{color:var(--c)}
  .tool:hover{border-color:var(--c)}
  .tool[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff;
    box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
  .tool[aria-pressed="true"] svg{color:#fff}

  .pop{position:absolute;left:100%;top:-5px;display:none;flex-direction:column;gap:5px;
    padding:5px 0 5px 9px;z-index:9}
  .toolwrap.open .pop{display:flex}
  .pop .mini{min-width:96px;padding:12px 15px;white-space:nowrap;background:var(--card);
    border:1.5px solid var(--rule);color:var(--ink);font:700 13px/1 var(--sans);
    box-shadow:0 8px 22px rgba(28,26,22,.22)}
  .pop .mini:hover{border-color:var(--blue)}
  .pop .mini[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

  .panel h2{margin:2px 3px 0;font:800 11px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center}
  .panel h2 em{font:800 11px/1 var(--sans);font-style:normal;letter-spacing:.02em;color:#8A6A0E;
    background:#F8EFD8;border-radius:999px;padding:4px 9px}
  .steps{list-style:none;margin:0;padding:3px 10px;overflow:auto;min-height:0;flex:0 1 auto;
    background:#fff;border:1px solid var(--rule);border-radius:10px}
  .steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
    font:600 13px/1.55 var(--sans);border-bottom:1px solid #EFEADD}
  .steps li:last-child{border-bottom:0}
  .steps li .n{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;
    font:800 11.5px/1 var(--sans);background:#E7E0CD;color:#78715F;transition:.2s;margin-top:1px}
  .steps li .tx{color:#22201A;transition:.2s;letter-spacing:-.1px}
  .steps li .tx u{text-decoration:none;font-weight:800;box-shadow:inset 0 -7px 0 #FBEBC4}
  .steps li .tx b{color:var(--red);font-weight:800}
  .steps li.done .tx u{box-shadow:none}
  .steps li.done .n{background:var(--green);color:#fff}
  .steps li.done .tx{color:#2A7148;font-weight:700}

  .mini{background:#F6F1E6;border:1.5px solid var(--rule);color:#4A4436;border-radius:8px;
    padding:11px 3px;cursor:pointer;font:700 12.5px/1 var(--sans)}
  .mini:hover{border-color:#B9AE94}
  .mini.danger{color:var(--red)}
  .mini:disabled{opacity:.4;cursor:default}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .fab{width:100%;padding:14px;cursor:pointer;border-radius:9px;font:800 14px/1 var(--sans);
    background:#fff;border:2px solid var(--ink);color:var(--ink);transition:.2s}
  .fab:hover{background:#F6F1E6}
  .fab.ready{background:var(--gold);border-color:var(--gold);color:#231B06;
    animation:pulse 1.7s ease-in-out 3}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,138,16,.6)}50%{box-shadow:0 0 0 12px rgba(201,138,16,0)}}

  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:7}
  .confetti i{position:absolute;left:50%;top:36%;opacity:0;border-radius:2px;
    animation:burst 1.5s cubic-bezier(.15,.7,.35,1) forwards}
  @keyframes burst{
    0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.55)}}

  @media (max-width:1080px){
    .wrap{padding:10px 10px 84px 216px} .hud,#toolbar{left:216px;right:10px}
    .panel{width:192px;padding:9px} .tool{font-size:11.5px;padding:9px 2px}
    .steps li{font-size:11.5px} .tcell .k,.tcell .v{font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-task="seg" aria-selected="true">과제 1 · 선분 옮기기</button>
      <button class="tab" role="tab" data-task="ang" aria-selected="false">과제 2 · 각 옮기기</button>
    </div>
    <p class="prompt" id="prompt"></p>
  </div>

  <div class="wrap" id="wrap">
    <svg id="board" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" aria-label="작도판"></svg>

    <div class="panel">
      <div class="tools">
        <div class="toolwrap" id="rulerwrap">
          <button class="tool" data-tool="ruler" style="--c:#1F3F94" aria-pressed="false">
            <svg width="22" height="22" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21.5 21.5 3l5.5 5.5L8.5 27z"/></svg>눈금 없는 자</button>
          <div class="pop">
            <button class="mini" data-kind="segment" aria-pressed="true">선분</button>
            <button class="mini" data-kind="ray" aria-pressed="false">반직선</button>
            <button class="mini" data-kind="line" aria-pressed="false">직선</button>
          </div>
        </div>
        <button class="tool" data-tool="compass" style="--c:#C0342A" aria-pressed="true">
          <svg width="22" height="22" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><circle cx="15" cy="5" r="2.4"/><path d="M13.6 7.2 6 26M16.4 7.2 24 26"/></svg>컴퍼스</button>
        <button class="tool" data-tool="point" style="--c:#C98A10" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><circle cx="15" cy="15" r="3.4" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="8.5"/></svg>점</button>
        <button class="tool" data-tool="erase" style="--c:#6A6355" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21 16 10l6 6-5 5H8z"/><path d="M4 26h22"/></svg>지우개</button>
      </div>

      <h2>해야 할 순서<em id="progress">0 / 0</em></h2>
      <ul class="steps" id="steps"></ul>

      <button class="fab" id="overlay">포개어 보기</button>
      <div class="two">
        <button class="mini" id="undo">되돌리기</button>
        <button class="mini danger" id="clear">처음부터</button>
      </div>
    </div>

    <div id="toolbar"></div>

    <div class="confetti" id="confetti"></div>

    <div class="hud">
      <div class="verdict" id="verdict"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
"use strict";
const TAU=Math.PI*2;
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm2pi=a=>((a%TAU)+TAU)%TAU;
const normPi=a=>{a=norm2pi(a);return a>Math.PI?a-TAU:a;};
const ang=(c,p)=>Math.atan2(p.y-c.y,p.x-c.x);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const CLOSED=new Set(["L","M","N","R","S","X","Z"]);   /* 엘·엠·엔·알·에스·엑스·제트 */
function closed(l){const s=String(l);if(s.endsWith("′")||s.endsWith("'"))return false;
  return CLOSED.has(s[s.length-1].toUpperCase());}
const eul=l=>l+(closed(l)?"을":"를");
const wa =l=>l+(closed(l)?"과":"와");
const ro =l=>l+(closed(l)?"으로":"로");

/* ---- 체크리스트 판정 도우미 ---- */
const arcsOf=st=>st.items.filter(i=>i.t==="A");
const rPts=a=>a.r.k==="pts"?[a.r.a,a.r.b]:null;
const same2=(x,y)=>!!x&&!!y&&((x[0]===y[0]&&x[1]===y[1])||(x[0]===y[1]&&x[1]===y[0]));
const KEY=(st,k)=>st.items.find(i=>i.key===k);
const xpt=(st,u,v)=>st.items.find(p=>p.t==="P"&&p.def.k==="x"&&
  ((p.def.a===u&&p.def.b===v)||(p.def.a===v&&p.def.b===u)));
const joined=(st,a,b)=>st.items.some(i=>i.t==="L"&&!i.given&&
  ((i.p1===a&&i.p2===b)||(i.p1===b&&i.p2===a)));

/* ============================ 과제 ============================ */
const P=(label,x,y,o={})=>Object.assign({t:"P",label,x,y,given:true,def:{k:"fix"}},o);

const TASKS={
  seg:{
    prompt:"선분 <b>AB</b>와 길이가 같은 선분을, 직선 <b>l</b> 위에 점 <b>P</b>에서 시작하도록 작도하시오.",
    build:()=>[
      P("A",150,130), P("B",350,205),
      {t:"L",kind:"segment",p1:"A",p2:"B",given:true,key:"AB"},
      P("",96,412,{hidden:true}), P("",718,412,{hidden:true}),
      {t:"L",kind:"line",p1:"#3",p2:"#4",given:true,name:"l",key:"l",labelPos:{x:744,y:398}},
      P("P",260,412)
    ],
    pool:["C","D","E","F","G","H"],
    steps(st){
      const A=byLabel(st,"A"),B=byLabel(st,"B"),Pp=byLabel(st,"P"),l=KEY(st,"l");
      const AB=[A.id,B.id];
      const w=same2(st.compass.from,AB)||arcsOf(st).some(a=>same2(rPts(a),AB));
      const arc=arcsOf(st).find(a=>a.c===Pp.id&&same2(rPts(a),AB));
      const Q=arc&&xpt(st,arc.id,l.id);
      const links=Q?st.items.filter(i=>i.t==="L"&&!i.given&&
        ((i.p1===Pp.id&&i.p2===Q.id)||(i.p1===Q.id&&i.p2===Pp.id))):[];
      const link=links.find(i=>i.kind==="segment")||links[0];   /* 선분이 있으면 그것을 본다 */
      const wrong=link&&link.kind!=="segment";
      return[
        {t:"컴퍼스를 선분 AB만큼 벌린다",ok:w},
        {t:"벌림을 그대로 둔 채 침을 점 P로 옮겨 호를 그린다",ok:!!arc},
        {t:"호와 직선 l이 만나는 점을 찍는다",ok:!!Q},
        {t:"눈금 없는 자로 점 P와 그 점을 <u>선분</u>으로 잇는다"+
           (wrong?` <b>— 지금 그은 것은 ${KIND[link.kind]}입니다</b>`:""),
         ok:!!(link&&link.kind==="segment")}
      ];
    },
    check(st){
      const A=byLabel(st,"A"),B=byLabel(st,"B"),Pp=byLabel(st,"P");
      const l=st.items.find(i=>i.name==="l");
      const L1=get(st,l.p1),L2=get(st,l.p2),tgt=d2(A,B);
      const segs=st.items.filter(i=>i.t==="L"&&!i.given&&i.kind==="segment"&&(i.p1===Pp.id||i.p2===Pp.id));
      /* 여러 개를 그었다면 조건을 만족하는 것을 우선 채택한다 */
      const rs=segs.map(ln=>{
        const Q=get(st,ln.p1===Pp.id?ln.p2:ln.p1),len=d2(Pp,Q);
        const off=Math.abs((L2.x-L1.x)*(L1.y-Q.y)-(L1.x-Q.x)*(L2.y-L1.y))/d2(L1,L2);
        return {ok:len>6&&Math.abs(len-tgt)<0.9&&off<0.9,Q,len};
      });
      const best=rs.find(r=>r.ok)||rs[0];
      if(!best){
        const other=st.items.find(i=>i.t==="L"&&!i.given&&(i.p1===Pp.id||i.p2===Pp.id));
        return {none:true,msg:other
          ?`점 P에서 ${KIND[other.kind]}을 그었습니다. 옮겨야 하는 것은 선분이므로, 자 버튼에 마우스를 올려 ‘선분’을 고른 뒤 다시 그어 보세요.`
          :"점 P에서 시작하는 선분이 아직 없습니다. 포갤 도형을 먼저 작도하세요."};
      }
      return {ok:best.ok,answer:[Pp,best.Q],target:[A,B],
        msg:best.len>tgt?"작도한 선분이 선분 AB보다 깁니다.":"작도한 선분이 선분 AB보다 짧습니다."};
    },
    overlay(st){
      const c=this.check(st); if(c.none)return c;
      const [Pp,Q]=c.answer,[A,B]=c.target;
      return Object.assign(c,{segs:[[Pp,Q]],marks:[],pivot:Pp,
        dTheta:ang(A,B)-ang(Pp,Q),dPos:{x:A.x-Pp.x,y:A.y-Pp.y},
        title:"점 P를 점 A에, 방향을 선분 AB에 맞추어 미끄러뜨립니다."});
    }
  },
  ang:{
    prompt:"<b>∠XOY</b>와 크기가 같은 각을, 반직선 <b>O′X′</b>를 한 변으로 하여 작도하시오.",
    build(){
      const O={x:110,y:270},r=210,th=-55*Math.PI/180;
      return [
        P("O",O.x,O.y), P("X",O.x+r,O.y), P("Y",O.x+r*Math.cos(th),O.y+r*Math.sin(th)),
        {t:"L",kind:"segment",p1:"O",p2:"X",given:true,key:"OX",over:28},
        {t:"L",kind:"segment",p1:"O",p2:"Y",given:true,key:"OY",over:28},
        P("O′",470,472), P("X′",740,472),
        {t:"L",kind:"segment",p1:"O′",p2:"X′",given:true,key:"O2X2",over:34}
      ];
    },
    pool:["A","B","C","D","E","F"],
    steps(st){
      const O=byLabel(st,"O"),O2=byLabel(st,"O′");
      const a1=arcsOf(st).find(a=>a.c===O.id);
      const pA=a1&&xpt(st,a1.id,KEY(st,"OX").id), pB=a1&&xpt(st,a1.id,KEY(st,"OY").id);
      const a2=a1&&arcsOf(st).find(a=>a.c===O2.id&&Math.abs(radiusOf(a)-radiusOf(a1))<0.01);
      const pC=a2&&xpt(st,a2.id,KEY(st,"O2X2").id);
      const a3=(pA&&pB&&pC)&&arcsOf(st).find(a=>a.c===pC.id&&same2(rPts(a),[pA.id,pB.id]));
      const pD=(a2&&a3)&&xpt(st,a2.id,a3.id);
      return[
        {t:"컴퍼스를 적당히 벌려 점 O를 중심으로 호를 그린다",ok:!!a1},
        {t:"그 호가 두 변과 만나는 두 점을 찍는다",ok:!!(pA&&pB)},
        {t:"벌림을 그대로 둔 채 침을 O′로 옮겨 호를 그린다",ok:!!a2},
        {t:"그 호가 반직선 O′X′와 만나는 점을 찍는다",ok:!!pC},
        {t:"컴퍼스를 2번의 두 점만큼 벌려, 4번 점을 중심으로 호를 그린다",ok:!!a3},
        {t:"두 호가 만나는 점을 찍는다",ok:!!pD},
        {t:"눈금 없는 자로 점 O′와 그 점을 잇는다",ok:!!(pD&&joined(st,O2.id,pD.id))}
      ];
    },
    check(st){
      const O=byLabel(st,"O"),X=byLabel(st,"X"),Y=byLabel(st,"Y");
      const O2=byLabel(st,"O′"),X2=byLabel(st,"X′");
      const a1=normPi(ang(O,Y)-ang(O,X));
      const lns=st.items.filter(i=>i.t==="L"&&!i.given&&(i.p1===O2.id||i.p2===O2.id));
      const rs=lns.map(ln=>{
        const R=get(st,ln.p1===O2.id?ln.p2:ln.p1),a2=normPi(ang(O2,R)-ang(O2,X2));
        return {ok:d2(O2,R)>6&&Math.abs(Math.abs(a1)-Math.abs(a2))<0.5*Math.PI/180,R,a2};
      });
      const best=rs.find(r=>r.ok)||rs[0];
      if(!best) return {none:true,msg:"점 O′에서 뻗어 나가는 변이 아직 없습니다. 포갤 도형을 먼저 작도하세요."};
      return {ok:best.ok,a1,a2:best.a2,O,X,Y,O2,X2,R:best.R,
        msg:Math.abs(best.a2)>Math.abs(a1)?"작도한 각이 ∠XOY보다 큽니다.":"작도한 각이 ∠XOY보다 작습니다."};
    },
    overlay(st){
      const c=this.check(st); if(c.none)return c;
      const {O,X,Y,O2,X2,R,a1,a2}=c;
      const u=ang(O2,X2),s=Math.sign(a1)||1,mag=Math.abs(a2);
      const L1=d2(O,X)+KEY(st,"OX").over,L2=d2(O,Y)+KEY(st,"OY").over;
      return Object.assign(c,{
        segs:[[O2,{x:O2.x+L1*Math.cos(u),y:O2.y+L1*Math.sin(u)}],
              [O2,{x:O2.x+L2*Math.cos(u+s*mag),y:O2.y+L2*Math.sin(u+s*mag)}]],
        marks:[{c:O2,r:56,a0:u,sw:s*mag}],pivot:O2,
        dTheta:ang(O,X)-u,dPos:{x:O.x-O2.x,y:O.y-O2.y},
        flipped:Math.sign(a2)!==s,
        title:"점 O′를 점 O에, 변 O′X′를 변 OX에 맞추어 미끄러뜨립니다."});
    }
  }
};

/* ============================ 상태 ============================ */
let S,drag=null,over=null,hover=null,busy=false,toastT=null;
const board=document.getElementById("board");
const $=id=>document.getElementById(id);
const get=(st,id)=>st.items.find(i=>i.id===id);
const byLabel=(st,l)=>st.items.find(i=>i.t==="P"&&i.label===l);
const pt=id=>get(S,id);

function loadTask(id){
  const T=TASKS[id];
  S={taskId:id,items:[],nextId:1,pool:T.pool.slice(),tool:"compass",rulerKind:"segment",
     compass:{center:null,free:{x:620,y:290},r:90,from:null,theta:-0.5,used:0},
     pending:[],log:[],undo:[],flash:null};
  const raw=T.build(),ids=[];
  raw.forEach(o=>{
    const it=Object.assign({},o);it.id="i"+(S.nextId++);ids.push(it.id);
    const res=k=>k[0]==="#"?ids[+k.slice(1)]:(S.items.find(p=>p.t==="P"&&p.label===k)||{}).id;
    if(it.t==="L"){it.p1=res(it.p1);it.p2=res(it.p2);}
    S.items.push(it);
  });
  $("prompt").innerHTML=T.prompt;
  over=null;won=false;$("verdict").classList.remove("on");$("overlay").classList.remove("ready");
  recompute();render();
}
const snapS=()=>JSON.stringify({items:S.items,compass:S.compass,log:S.log,pool:S.pool,nextId:S.nextId});
function pushUndo(){S.undo.push(snapS());if(S.undo.length>60)S.undo.shift();}
function restore(j){const o=JSON.parse(j);S.items=o.items;S.compass=o.compass;S.log=o.log;S.pool=o.pool;S.nextId=o.nextId;}

/* ============================ 계산 ============================ */
const radiusOf=a=>a.r.k==="num"?a.r.v:d2(pt(a.r.a),pt(a.r.b));
function recompute(){
  for(const it of S.items){
    if(it.t==="P"&&it.def.k==="x"){
      const cs=intersect(get(S,it.def.a),get(S,it.def.b),false);
      if(cs.length){let b=cs[0],bd=Infinity;
        for(const c of cs){const d=Math.hypot(c.x-it.x,c.y-it.y);if(d<bd){bd=d;b=c;}}
        it.x=b.x;it.y=b.y;}
    }
  }
  for(const a of S.items){
    if(a.t!=="A")continue;
    const c=pt(a.c);
    for(const p of S.items){
      if(p.t!=="P"||p.def.k!=="x")continue;
      if(p.def.a!==a.id&&p.def.b!==a.id)continue;
      const th=ang(c,p),d=norm2pi(th-a.a0);
      if(d>a.sweep+1e-9){
        if(d-a.sweep<=TAU-d)a.sweep=Math.min(d,TAU);
        else{a.sweep=Math.min(a.sweep+(TAU-d),TAU);a.a0=th;}
      }
    }
  }
  const C=S.compass;
  if(C.from)C.r=d2(pt(C.from[0]),pt(C.from[1]));
}
function intersect(u,v,bounded){
  if(!u||!v)return[];
  let o;
  if(u.t==="L"&&v.t==="L")o=ixLL(u,v);
  else if(u.t==="L"&&v.t==="A")o=ixLA(u,v);
  else if(u.t==="A"&&v.t==="L")o=ixLA(v,u);
  else o=ixAA(u,v);
  return bounded?o.filter(p=>onItem(u,p)&&onItem(v,p)):o;
}
function ixLL(u,v){
  const a=pt(u.p1),b=pt(u.p2),c=pt(v.p1),d=pt(v.p2);
  const r={x:b.x-a.x,y:b.y-a.y},s={x:d.x-c.x,y:d.y-c.y};
  const den=r.x*s.y-r.y*s.x;if(Math.abs(den)<1e-9)return[];
  const t=((c.x-a.x)*s.y-(c.y-a.y)*s.x)/den;
  return[{x:a.x+t*r.x,y:a.y+t*r.y}];
}
function ixLA(L,A){
  const a=pt(L.p1),b=pt(L.p2),c=pt(A.c),r=radiusOf(A);
  const dx=b.x-a.x,dy=b.y-a.y,fx=a.x-c.x,fy=a.y-c.y;
  const qa=dx*dx+dy*dy,qb=2*(fx*dx+fy*dy),qc=fx*fx+fy*fy-r*r;
  const D=qb*qb-4*qa*qc;if(D<0||qa<1e-12)return[];
  const sd=Math.sqrt(D);
  return[(-qb-sd)/(2*qa),(-qb+sd)/(2*qa)].map(t=>({x:a.x+t*dx,y:a.y+t*dy}));
}
function ixAA(A,B){
  const c1=pt(A.c),c2=pt(B.c),r1=radiusOf(A),r2=radiusOf(B),d=d2(c1,c2);
  if(d<1e-9||d>r1+r2||d<Math.abs(r1-r2))return[];
  const a=(r1*r1-r2*r2+d*d)/(2*d),h2=r1*r1-a*a;if(h2<0)return[];
  const h=Math.sqrt(h2);
  const mx=c1.x+a*(c2.x-c1.x)/d,my=c1.y+a*(c2.y-c1.y)/d;
  const rx=-(c2.y-c1.y)*h/d,ry=(c2.x-c1.x)*h/d;
  return[{x:mx+rx,y:my+ry},{x:mx-rx,y:my-ry}];
}
function onItem(it,p){
  if(it.t==="A")return norm2pi(ang(pt(it.c),p)-it.a0)<=it.sweep+0.06;
  const a=pt(it.p1),b=pt(it.p2),dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
  if(L<1e-9)return false;
  const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L;
  if(it.kind==="segment")return t>=-0.004&&t<=1.004+(it.over?it.over/Math.sqrt(L):0);
  if(it.kind==="ray")return t>=-0.004;
  return true;
}
function candidates(){
  const out=[],cv=S.items.filter(i=>i.t==="L"||i.t==="A");
  for(let i=0;i<cv.length;i++)for(let j=i+1;j<cv.length;j++)
    for(const p of intersect(cv[i],cv[j],true)){
      if(S.items.some(o=>o.t==="P"&&!o.hidden&&d2(o,p)<7))continue;
      if(out.some(o=>d2(o,p)<7))continue;
      out.push({x:p.x,y:p.y,a:cv[i].id,b:cv[j].id});
    }
  return out;
}

/* ============================ 그리기 ============================ */
const CO={given:"#191713",mine:"#2A63D8",arc:"#C0342A",hollow:"#8A8271",
          body:"#3A342B",wood:"#C98A10",paper:"#FCFAF3"};
const ext=(a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
  return{x:b.x+dx/L*1400,y:b.y+dy/L*1400};};
const f=n=>Math.round(n*100)/100;
function arcPath(cx,cy,r,a0,sw){
  if(sw>=TAU-1e-6)return null;
  const p0={x:cx+r*Math.cos(a0),y:cy+r*Math.sin(a0)};
  const p1={x:cx+r*Math.cos(a0+sw),y:cy+r*Math.sin(a0+sw)};
  return `M${f(p0.x)} ${f(p0.y)} A${f(r)} ${f(r)} 0 ${sw>Math.PI?1:0} 1 ${f(p1.x)} ${f(p1.y)}`;
}
const lbl=(x,y,t,col)=>`<text x="${f(x)}" y="${f(y)}" style="font-family:var(--serif)" font-size="19"
  font-weight="600" fill="${col}" stroke="${CO.paper}" stroke-width="3.6" paint-order="stroke"
  stroke-linejoin="round">${esc(t)}</text>`;

function needle(){const C=S.compass;return C.center?pt(C.center):C.free;}
function geom(){
  const C=S.compass,c=needle(),r=Math.max(C.r,0);
  const leg=Math.max(135,r*0.62),al=Math.acos(Math.min(1,(r/2)/leg));
  return{c,r,leg,
    tip:{x:c.x+r*Math.cos(C.theta),y:c.y+r*Math.sin(C.theta)},
    hg:{x:c.x+leg*Math.cos(C.theta-al),y:c.y+leg*Math.sin(C.theta-al)}};
}
function distSeg(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
  if(L<1e-9)return d2(p,a);
  const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L,0,1);
  return Math.hypot(a.x+t*dx-p.x,a.y+t*dy-p.y);
}
function compassPart(pos){
  if(S.tool!=="compass")return null;
  const{c,tip,hg}=geom();
  if(d2(hg,pos)<18)return "hinge";
  if(d2(tip,pos)<15||distSeg(pos,hg,tip)<12)return "pencil";
  if(d2(c,pos)<15||distSeg(pos,hg,c)<12)return "needle";
  return null;
}

function render(){
  const C=S.compass,showC=(S.tool==="compass");
  let g="";

  for(const a of S.items.filter(i=>i.t==="A")){
    const c=pt(a.c),r=radiusOf(a),d=arcPath(c.x,c.y,r,a.a0,a.sweep);
    g+=d?`<path d="${d}" fill="none" stroke="${CO.arc}" stroke-width="2.3" stroke-linecap="round" opacity=".8"/>`
        :`<circle cx="${f(c.x)}" cy="${f(c.y)}" r="${f(r)}" fill="none" stroke="${CO.arc}" stroke-width="2.3" opacity=".8"/>`;
  }
  for(const l of S.items.filter(i=>i.t==="L"&&i.given)){
    let a=pt(l.p1),b=pt(l.p2);
    if(l.kind==="ray")b=ext(a,b);
    else if(l.kind==="line"){const A=ext(b,a),B=ext(a,b);a=A;b=B;}
    else if(l.over){const L=d2(a,b)||1;b={x:b.x+(b.x-a.x)/L*l.over,y:b.y+(b.y-a.y)/L*l.over};}
    g+=`<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" stroke="${CO.given}" stroke-width="2.4" stroke-linecap="round"/>`;
    if(l.name)g+=`<text x="${l.labelPos.x}" y="${l.labelPos.y}" style="font-family:var(--serif);font-style:italic" font-size="21" fill="${CO.given}">${l.name}</text>`;
  }
  for(const l of S.items.filter(i=>i.t==="L"&&!i.given)){
    let a=pt(l.p1),b=pt(l.p2);
    if(l.kind==="ray")b=ext(a,b);
    if(l.kind==="line"){const A=ext(b,a),B=ext(a,b);a=A;b=B;}
    const L=`x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}"`;
    const th=ang(a,b),nx=-Math.sin(th),ny=Math.cos(th);
    /* 방금 그은 선에만 형광펜 띠 — 아래 도형이 비쳐 보이면서 '덧그렸다'가 읽힌다 */
    if(l.id===S.flash)
      g+=`<line ${L} stroke="${CO.mine}" stroke-width="11" stroke-linecap="butt" opacity=".2"/>`;
    g+=`<line ${L} stroke="${CO.mine}" stroke-width="3.2" stroke-linecap="round"/>`;
    if(l.kind==="segment"){                         /* 어디부터 어디까지인지 못 박는 마감 */
      for(const p of[a,b])
        g+=`<line x1="${f(p.x-nx*9)}" y1="${f(p.y-ny*9)}" x2="${f(p.x+nx*9)}" y2="${f(p.y+ny*9)}"
             stroke="${CO.mine}" stroke-width="2.8" stroke-linecap="round"/>`;
    }
  }
  if(drag&&drag.mode==="draw"&&drag.hi-drag.lo>0.001){
    const c=needle(),r=C.r;
    g+=`<circle cx="${f(c.x)}" cy="${f(c.y)}" r="${f(r)}" fill="none" stroke="${CO.arc}" stroke-width="1" stroke-dasharray="3 6" opacity=".35"/>`;
    const d=arcPath(c.x,c.y,r,drag.a0+drag.lo,Math.min(drag.hi-drag.lo,TAU-1e-6));
    if(d)g+=`<path d="${d}" fill="none" stroke="${CO.arc}" stroke-width="2.8" stroke-linecap="round"/>`;
  }
  const wantPt=(S.tool==="point");
  for(const c of candidates()){
    if(wantPt)g+=`<circle cx="${f(c.x)}" cy="${f(c.y)}" r="12" fill="#E9A61A" opacity=".2"/>`;
    g+=`<circle cx="${f(c.x)}" cy="${f(c.y)}" r="${wantPt?7:6}" fill="${CO.paper}"
      stroke="${wantPt?"#E9A61A":CO.hollow}" stroke-width="${wantPt?2.4:1.6}" stroke-dasharray="2.6 2.4"/>`;
  }
  for(const p of S.items.filter(i=>i.t==="P"&&!i.hidden)){
    const col=p.given?CO.given:CO.mine;
    if(S.pending.includes(p.id))g+=`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="12" fill="none" stroke="var(--gold)" stroke-width="3"/>`;
    g+=`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="5" fill="${col}"/>`;
    if(p.label)g+=lbl(p.x+10,p.y-9,p.label,col);
  }
  if(over)g+=overlaySVG();
  if(showC)g+=compassSVG();
  board.innerHTML=g;
  paintUI();
}

function compassSVG(){
  const C=S.compass,{c,tip,hg,r}=geom();
  const part=drag&&drag.part?drag.part:hover;
  const mid={x:(c.x+tip.x)/2,y:(c.y+tip.y)/2};
  const gl=Math.hypot(hg.x-mid.x,hg.y-mid.y)||1;
  const gd={x:(hg.x-mid.x)/gl,y:(hg.y-mid.y)/gl};
  const knob={x:hg.x+gd.x*23,y:hg.y+gd.y*23};
  const lp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  const w1=lp(hg,tip,.58),w2=lp(hg,tip,.93);
  const H="#E9A61A";
  let g=`<g>`;
  const glow=(a,b)=>`<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" stroke="${H}"
      stroke-width="16" stroke-linecap="round" opacity=".38"/>`+
    `<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" stroke="${H}"
      stroke-width="9" stroke-linecap="round" opacity=".85"/>`;
  if(part==="needle")g+=glow(hg,c);
  if(part==="pencil")g+=glow(hg,tip);
  if(part==="hinge"){
    g+=glow(hg,knob);
    g+=`<circle cx="${f(hg.x)}" cy="${f(hg.y)}" r="20" fill="${H}" opacity=".35"/>`;
    g+=`<circle cx="${f(hg.x)}" cy="${f(hg.y)}" r="14" fill="${H}" opacity=".9"/>`;
  }

  /* 중심쪽 다리 — 침 */
  g+=`<line x1="${f(hg.x)}" y1="${f(hg.y)}" x2="${f(c.x)}" y2="${f(c.y)}" stroke="${CO.body}" stroke-width="5" stroke-linecap="round"/>`;
  g+=`<circle cx="${f(c.x)}" cy="${f(c.y)}" r="${part==="needle"?5.5:4}" fill="${CO.body}"/>`;
  /* 바깥쪽 다리 — 연필 */
  g+=`<line x1="${f(hg.x)}" y1="${f(hg.y)}" x2="${f(tip.x)}" y2="${f(tip.y)}" stroke="${CO.body}" stroke-width="5" stroke-linecap="round"/>`;
  g+=`<line x1="${f(w1.x)}" y1="${f(w1.y)}" x2="${f(w2.x)}" y2="${f(w2.y)}" stroke="${CO.wood}" stroke-width="9"/>`;
  g+=`<circle cx="${f(tip.x)}" cy="${f(tip.y)}" r="${part==="pencil"?5:3.4}" fill="${CO.body}"/>`;
  /* 가운데 손잡이 */
  g+=`<line x1="${f(hg.x)}" y1="${f(hg.y)}" x2="${f(knob.x)}" y2="${f(knob.y)}" stroke="${CO.body}" stroke-width="7" stroke-linecap="round"/>`;
  g+=`<circle cx="${f(hg.x)}" cy="${f(hg.y)}" r="8" fill="${CO.body}"/>`;
  g+=`<circle cx="${f(knob.x)}" cy="${f(knob.y)}" r="5.5" fill="${CO.body}"/>`;

  /* 종이 위에 떠 있으면 침 자리를 점선으로 표시 */
  if(!C.center)g+=`<circle cx="${f(c.x)}" cy="${f(c.y)}" r="11" fill="none" stroke="${CO.body}" stroke-width="1.4" stroke-dasharray="2 4"/>`;
  /* 옮기는 중 스냅 미리보기 */
  if(drag&&drag.part==="needle"&&drag.snap){
    g+=`<circle cx="${f(drag.snap.x)}" cy="${f(drag.snap.y)}" r="17" fill="${H}" opacity=".22"/>`;
    g+=`<circle cx="${f(drag.snap.x)}" cy="${f(drag.snap.y)}" r="13" fill="none" stroke="${H}" stroke-width="3.5"/>`;
  }

  const CAP={needle:"끌면 컴퍼스가 옮겨집니다",pencil:"끌면 벌림이 바뀝니다",hinge:"끌면 호가 그려집니다"};
  if(part&&!drag){
    const at=part==="needle"?c:part==="pencil"?tip:knob;
    g+=bubble(at.x,at.y+(part==="hinge"?-26:34),CAP[part]);
  }
  return g+"</g>";
}
/* 판 위에 얹는 말풍선 — 도형 위에서도 읽히도록 흰 배경을 깐다 */
function textW(t,sz){let w=0;
  for(const ch of t)w+=/[\uAC00-\uD7A3]/.test(ch)?sz:(/\s/.test(ch)?sz*0.32:sz*0.56);
  return w;}
function bubble(x,y,t,sz){
  sz=sz||13;
  const w=textW(t,sz)+22,h=sz+16;
  return `<rect x="${f(x-w/2)}" y="${f(y-h+5)}" width="${f(w)}" height="${f(h)}" rx="7"
      fill="#FFFFFF" stroke="var(--gold)" stroke-width="1.6" opacity=".97"/>
    <text x="${f(x)}" y="${f(y-2)}" text-anchor="middle" font-size="${sz}" font-weight="700"
      fill="#1C1A16">${esc(t)}</text>`;
}

function overlaySVG(){
  const o=over,t=o.t;
  const col=t<1?"var(--gold)":(o.ok?"var(--green)":CO.arc);
  const lift=Math.sin(Math.PI*t)*7;                       /* 들렸다 내려앉는 그림자 */
  const tr=a=>`translate(${f(o.dPos.x*t+a)} ${f(o.dPos.y*t+a)}) rotate(${f(o.dTheta*t*180/Math.PI)} ${f(o.pivot.x)} ${f(o.pivot.y)})`;
  const body=(c,w,dash,op)=>{
    let s="";
    for(const m of o.marks||[]){
      const d=arcPath(m.c.x,m.c.y,m.r,m.sw<0?m.a0+m.sw:m.a0,Math.abs(m.sw));
      if(d)s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w*.4}" opacity="${op}"/>`;
    }
    for(const[a,b]of o.segs)
      s+=`<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" stroke="${c}" stroke-width="${w}"
           stroke-linecap="round" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:""}/>`;
    return s;
  };
  let s="";
  if(lift>.4)s+=`<g transform="${tr(lift)}">${body("#191713",7,"",.14)}</g>`;
  s+=`<g transform="${tr(0)}">${body(col,7,"",.5)}${body(col,2.4,"9 6",1)}</g>`;
  return s;
}

function paintUI(){
  const C=S.compass;
  document.querySelectorAll("[data-tool]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tool===S.tool));
  document.querySelectorAll("[data-kind]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.kind===S.rulerKind));
  $("undo").disabled=!S.undo.length;
  paintToolbar();
  const st=TASKS[S.taskId].steps(S),done=st.filter(x=>x.ok).length;
  $("steps").innerHTML=st.map((x,i)=>
    `<li class="${x.ok?"done":""}"><span class="n">${x.ok?"✓":i+1}</span><span class="tx">${x.t}</span></li>`).join("");
  $("progress").textContent=`${done} / ${st.length}`;
  checkWin();
}

let won=false;
function checkWin(){
  const ok=TASKS[S.taskId].check(S).ok;
  if(ok&&!won){won=true;celebrate();}
  if(!ok&&won){won=false;$("overlay").classList.remove("ready");
    if(!over)$("verdict").classList.remove("on");}
}
function celebrate(){
  verdict("ok","작도에 성공했습니다","왼쪽 <b>포개어 보기</b>를 눌러, 작도한 도형이 원래 도형에 그대로 포개어지는지 확인해 보세요.");
  $("overlay").classList.add("ready");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=$("confetti");if(!box||typeof document.createElement!=="function")return;
  box.innerHTML="";
  const cols=["#C0342A","#1F3F94","#C98A10","#2A7148"];
  for(let i=0;i<48;i++){
    const a=Math.random()*TAU,d=90+Math.random()*240,e=document.createElement("i");
    e.style.cssText=`--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d+130).toFixed(0)}px;`+
      `--rot:${(Math.random()*900-450).toFixed(0)}deg;background:${cols[i%4]};`+
      `width:${(5+Math.random()*5).toFixed(1)}px;height:${(8+Math.random()*8).toFixed(1)}px;`+
      `animation-delay:${(Math.random()*.18).toFixed(2)}s`;
    box.appendChild(e);
  }
  setTimeout(()=>{if($("confetti"))$("confetti").innerHTML="";},2300);
}
const KIND={segment:"선분",ray:"반직선",line:"직선"};
function paintToolbar(){
  const C=S.compass,part=(drag&&drag.part)||hover;
  const cell=(k,v,st,hot)=>`<div class="tcell${hot?" hot":""}"><span class="k">${k}</span>`+
    `<span class="v">${v}</span>${st?`<span class="s">${st}</span>`:""}</div>`;
  let h;
  if(S.tool==="compass"){
    const at=C.center?`점 ${esc(pt(C.center).label)}에 꽂음`:"종이 위에 놓임";
    const w=C.r<1?"아직 벌리지 않음":(C.from?`선분 ${esc(pt(C.from[0]).label+pt(C.from[1]).label)}만큼`:"임의의 길이");
    h=cell("중심쪽 다리","잡고 끌면 <b>옮기기</b>",at,part==="needle")
     +cell("바깥쪽 다리","잡고 끌면 <b>벌리기</b>",w,part==="pencil")
     +cell("가운데 손잡이","잡고 끌면 <b>돌려 그리기</b>","",part==="hinge");
  }else if(S.tool==="ruler"){
    h=cell("눈금 없는 자","자 버튼에 마우스를 올리면 종류를 바꿀 수 있어요",`지금은 ${KIND[S.rulerKind]}`);
  }else if(S.tool==="point"){
    h=cell("점","두 도형이 만나는 자리에 생기는 <b>속 빈 점</b>을 클릭하세요","");
  }else{
    h=cell("지우개","내가 그린 <b>선이나 호</b>를 클릭하면 지워집니다","");
  }
  $("toolbar").innerHTML=h;
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2800);}
const log=m=>S.log.push(m);

/* ============================ 조작 ============================ */
function toSVG(e){const p=board.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  return p.matrixTransform(board.getScreenCTM().inverse());}
const HIT=22;
/* 이미 찍혀 있는 점만 반환한다 — 속 빈 교점은 '점' 도구로 찍기 전에는 쓸 수 없다 */
function hitPoint(pos,rad){
  let best=null,bd=rad||HIT;
  for(const p of S.items){
    if(p.t!=="P"||p.hidden)continue;
    const d=d2(p,pos);if(d<bd){bd=d;best=p;}
  }
  return best;
}
function candidateNear(pos,rad){
  let best=null,bd=rad||HIT;
  for(const c of candidates()){const d=d2(c,pos);if(d<bd){bd=d;best=c;}}
  return best;
}
const NEEDPT="여기는 아직 점이 아닙니다. ‘점’ 도구로 먼저 점을 찍어 주세요.";
function hitCurve(pos){
  let best=null,bd=11;
  for(const it of S.items){
    if(it.t==="A"){
      const d=Math.abs(d2(pt(it.c),pos)-radiusOf(it));
      if(d<bd&&onItem(it,pos)){bd=d;best=it;}
    }else if(it.t==="L"&&!it.given){
      const a=pt(it.p1),b=pt(it.p2),dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
      let t=((pos.x-a.x)*dx+(pos.y-a.y)*dy)/L;
      if(it.kind==="segment")t=clamp(t,0,1);else if(it.kind==="ray")t=Math.max(0,t);
      const d=Math.hypot(a.x+t*dx-pos.x,a.y+t*dy-pos.y);
      if(d<bd){bd=d;best=it;}
    }
  }
  return best;
}
function meet(u,v){
  const nm=i=>i.t==="A"?"호":({segment:"선분",ray:"반직선",line:"직선"}[i.kind]);
  const a=nm(u),b=nm(v),ga=n=>n==="호"?"가":"이";
  return a===b?`두 ${a}${ga(a)}`:`${a}${a==="호"?"와":"과"} ${b}${ga(b)}`;
}
function promote(c){
  if(c.id)return c.id;
  const lb=S.pool.shift()||"·";
  const p={t:"P",id:"i"+(S.nextId++),label:lb,x:c.x,y:c.y,given:false,def:{k:"x",a:c.a,b:c.b}};
  S.items.push(p);
  log(`${meet(get(S,c.a),get(S,c.b))} 만나는 점을 ${ro(lb)} 정했다.`);
  return p.id;
}
function removeCascade(id){
  const dead=new Set([id]);let grew=true;
  while(grew){grew=false;
    for(const it of S.items){
      if(dead.has(it.id))continue;
      const refs=it.t==="L"?[it.p1,it.p2]
        :it.t==="A"?[it.c].concat(it.r.k==="pts"?[it.r.a,it.r.b]:[])
        :(it.def.k==="x"?[it.def.a,it.def.b]:[]);
      if(refs.some(r=>dead.has(r))){dead.add(it.id);grew=true;}
    }}
  S.items=S.items.filter(i=>!dead.has(i.id));
  const C=S.compass;
  if(dead.has(C.center)){C.free={x:needle().x,y:needle().y};C.center=null;}
  if(C.from&&(dead.has(C.from[0])||dead.has(C.from[1])))C.from=null;
}
function startDraw(pos){
  const C=S.compass;
  if(!C.center)return toast("중심쪽 다리를 잡고 끌어, 침을 점 위에 올려놓으세요.");
  if(C.r<1)return toast("바깥쪽 다리를 잡고 끌어 컴퍼스를 벌리세요.");
  if(d2(needle(),pos)<20)return toast("침에서 조금 떨어진 곳부터 돌려 주세요.");
  pushUndo();
  drag={mode:"draw",part:"hinge",a0:C.theta,prev:ang(needle(),pos),acc:0,lo:0,hi:0};
  render();
}
board.addEventListener("contextmenu",e=>e.preventDefault());
board.addEventListener("dragstart",e=>e.preventDefault());
board.addEventListener("pointerdown",e=>{
  if(busy)return;
  e.preventDefault();
  board.setPointerCapture(e.pointerId);
  const pos=toSVG(e),C=S.compass,right=(e.button===2);
  if(over){over=null;$("verdict").classList.remove("on");render();}
  else if(!won)$("verdict").classList.remove("on");

  if(S.tool==="erase"){
    const c=hitCurve(pos);
    if(c&&!c.given){pushUndo();removeCascade(c.id);recompute();render();}
    else toast("지울 수 있는 것은 내가 그린 선과 호입니다.");
    return;
  }
  if(S.tool==="ruler"){
    const h=hitPoint(pos);
    if(!h)return toast(candidateNear(pos)?NEEDPT:"눈금 없는 자는 이미 찍혀 있는 점끼리만 이을 수 있습니다.");
    pushUndo();
    const id=promote(h);
    if(S.pending[0]===id){S.pending=[];recompute();render();return;}
    S.pending.push(id);
    if(S.pending.length===2){
      const[a,b]=S.pending;
      S.flash="i"+S.nextId;
      S.items.push({t:"L",id:"i"+(S.nextId++),kind:S.rulerKind,p1:a,p2:b,given:false});
      log(`눈금 없는 자로 점 ${wa(pt(a).label)} 점 ${eul(pt(b).label)} 이어 ${KIND[S.rulerKind]}을 그렸다.`);
      S.pending=[];
    }
    recompute();render();return;
  }
  if(S.tool==="point"){
    const c=candidateNear(pos);
    if(c){pushUndo();promote(c);recompute();render();}
    else toast("점은 두 도형이 만나는 자리(속 빈 점)에 찍을 수 있습니다.");
    return;
  }

  /* ---------------- 컴퍼스 ---------------- */
  if(right)return startDraw(pos);                 /* 오른쪽 버튼 끌기 = 돌려 그리기 */
  const part=compassPart(pos);
  if(part==="hinge")return startDraw(pos);        /* 가운데 손잡이 = 돌려 그리기 */
  if(part==="pencil"){                            /* 바깥쪽 다리 = 벌리기 */
    pushUndo();
    drag={mode:"open",part:"pencil",origin:pos,started:false};
    return render();
  }
  if(part==="needle"){                            /* 중심쪽 다리 = 컴퍼스 옮기기 */
    pushUndo();
    const c=needle();
    drag={mode:"move",part:"needle",off:{x:c.x-pos.x,y:c.y-pos.y},snap:null};
    return render();
  }
  const h=hitPoint(pos);                          /* 빈 곳의 점을 톡 클릭해도 침이 옮겨감 */
  if(!h)return toast(candidateNear(pos)?NEEDPT:
    "컴퍼스의 세 부분을 잡고 끌어 보세요. 점을 클릭하면 침이 그 점으로 옮겨갑니다.");
  pushUndo();
  const had=C.center,keep=C.r>=1;
  C.center=promote(h);
  if(had!==C.center&&keep)toast("침만 옮겼습니다. 컴퍼스 벌림은 그대로입니다.");
  recompute();render();
});

function applyOpen(pos){
  const C=S.compass,c=needle(),h=C.center?hitPoint(pos):null;
  if(h&&h.id!==C.center){
    const id=promote(h);
    C.r=d2(c,pt(id));C.theta=ang(c,pt(id));C.from=[C.center,id];
  }else{C.r=d2(c,pos);C.theta=ang(c,pos);C.from=null;}
}

window.addEventListener("pointermove",e=>{
  if(busy)return;
  const pos=toSVG(e),C=S.compass;
  if(!drag){                                     /* 손을 올린 부분이 무슨 일을 하는지 알려줌 */
    const h=compassPart(pos);
    if(h!==hover){hover=h;
      board.style.cursor=h==="needle"?"move":h?"grab":"crosshair";
      render();}
    return;
  }
  if(drag.mode==="move"){
    const p={x:pos.x+drag.off.x,y:pos.y+drag.off.y};
    const h=hitPoint(p,28);                      /* 점 근처에서는 자석처럼 끌어당김 */
    drag.snap=h?{x:h.x,y:h.y,ref:h}:null;
    C.center=null; C.free=h?{x:h.x,y:h.y}:p;
    render();return;
  }
  if(drag.mode==="open"){
    if(!drag.started){
      if(d2(drag.origin,pos)<12)return;                  /* 손떨림 방지 문턱 */
      drag.started=true;
    }
    applyOpen(pos);render();
  }else if(drag.mode==="draw"){
    const c=pt(C.center);
    if(d2(c,pos)<8)return;
    const a=ang(c,pos);
    drag.acc+=normPi(a-drag.prev);drag.prev=a;
    drag.lo=Math.min(drag.lo,drag.acc);                  /* 지나간 궤적을 모두 잉크로 */
    drag.hi=Math.max(drag.hi,drag.acc);
    if(drag.hi-drag.lo>TAU){
      if(drag.acc>=drag.hi-1e-9)drag.lo=drag.hi-TAU;else drag.hi=drag.lo+TAU;
      drag.acc=clamp(drag.acc,drag.lo,drag.hi);
    }
    C.theta=drag.a0+drag.acc;render();
  }
});

window.addEventListener("pointerup",()=>{
  if(!drag||busy)return;
  const d=drag,C=S.compass;drag=null;
  if(d.mode==="move"){
    if(d.snap){
      const keep=C.r>=1;
      C.center=promote(d.snap.ref);
      if(keep)toast(`침을 점 ${pt(C.center).label} 위에 올렸습니다. 벌림은 그대로입니다.`);
    }else toast(candidateNear(needle())?NEEDPT:"침이 점 위에 있어야 호를 그릴 수 있습니다.");
    recompute();render();return;
  }
  if(d.mode==="open"){
    if(!d.started){recompute();render();return;}
    if(C.r<12)toast("좀 더 크게 벌려 주세요.");
    else{
      C.used=0;
      log(C.from?`컴퍼스를 선분 ${pt(C.from[0]).label}${pt(C.from[1]).label}만큼 벌렸다.`:"컴퍼스를 적당히 벌렸다.");
    }
  }else if(d.mode==="draw"){
    const span=Math.min(d.hi-d.lo,TAU);
    if(span<0.08)toast("연필 끝을 잡고 빙 돌리면 호가 그려집니다.");
    else{
      S.items.push({t:"A",id:"i"+(S.nextId++),c:C.center,
        r:C.from?{k:"pts",a:C.from[0],b:C.from[1]}:{k:"num",v:C.r},
        a0:norm2pi(d.a0+d.lo),sweep:span});
      log(`${C.used>0?"컴퍼스 벌림을 그대로 둔 채, ":""}점 ${eul(pt(C.center).label)} 중심으로 호를 그렸다.`);
      C.used++;recompute();
      const arc=S.items[S.items.length-1];
      if(!candidates().some(k=>k.a===arc.id||k.b===arc.id))
        toast("이 호는 아무것과도 만나지 않았습니다. 벌림이나 돌린 범위를 바꿔 보세요.");
    }
  }
  recompute();render();
});

/* ============================ 포개어 보기 ============================ */
function verdict(kind,title,sub){
  const col={ok:"var(--ok)",no:"var(--vermilion)",none:"var(--ink-soft)"}[kind];
  $("verdict").innerHTML=`<span class="dot" style="background:${col}"></span>
    <span><strong>${title}</strong><small>${sub}</small></span>`;
  $("verdict").classList.add("on");
}
async function runOverlay(){
  if(busy)return;
  const o=TASKS[S.taskId].overlay(S);
  if(o.none)return verdict("none","포갤 도형이 아직 없습니다",o.msg);
  busy=true;$("verdict").classList.remove("on");
  o.t=0;over=o;render();
  const dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:1150;
  const t0=performance.now();
  await new Promise(res=>{
    (function step(now){
      const u=dur?Math.min(1,(now-t0)/dur):1;
      o.t=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
      render();
      u<1?requestAnimationFrame(step):res();
    })(t0);
  });
  o.t=1;render();busy=false;
  if(o.ok)verdict("ok","완전히 포개어집니다",
    `${o.title} 빈틈도 튀어나온 부분도 없습니다. 두 도형은 합동입니다.`+(o.flipped?" (뒤집어서 포개었습니다.)":""));
  else verdict("no","포개면 어긋납니다",`${o.title} ${o.msg} 작도 과정을 다시 살펴보세요.`);
}

/* ============================ 버튼 ============================ */
const rwrap=$("rulerwrap");
const popOpen=v=>rwrap.classList.toggle("open",v);
rwrap.addEventListener("mouseenter",()=>popOpen(true));   /* 자 버튼이나 세 버튼 위에 있으면 열림 */
rwrap.addEventListener("mouseleave",()=>popOpen(false));  /* 그 영역을 벗어나면 닫힘 */
document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{
  if(b.dataset.tool==="ruler"){S.rulerKind="segment";rwrap.classList.toggle("open");}
  else popOpen(false);
  S.tool=b.dataset.tool;S.pending=[];S.flash=null;drag=null;hover=null;board.style.cursor="crosshair";b.blur();render();});
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{
  S.tool="ruler";S.rulerKind=b.dataset.kind;S.pending=[];S.flash=null;popOpen(false);b.blur();render();});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));
  loadTask(b.dataset.task);});
$("undo").onclick=()=>{if(S.undo.length){restore(S.undo.pop());S.pending=[];over=null;
  $("verdict").classList.remove("on");recompute();render();}};
$("clear").onclick=()=>loadTask(S.taskId);
$("overlay").onclick=runOverlay;

loadTask("seg");
</script>
