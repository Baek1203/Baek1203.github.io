<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사건번호 2026-△ · 임무 브리핑</title>
<style>
  :root{
    --night:#15141B; --night2:#1E1C26; --file:#E7DBBE; --file2:#DCCEAC;
    --ink:#221F1A; --dim:#8B8474; --red:#C8352B; --red-d:#8E2119;
    --gold:#D9A441; --line:#3A3644;
    --s:"Georgia","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;
    --g:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --m:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--night);color:var(--file);font-family:var(--g);cursor:pointer;
    user-select:none;-webkit-user-select:none;
    word-break:keep-all;overflow-wrap:break-word;line-break:strict}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.62) 100%)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.05;
    background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

  .deck{position:absolute;inset:0;display:grid;place-items:center;padding:4vmin 6vmin}
  .slide{position:absolute;inset:0;display:none;place-items:center;
    padding:11vmin 7vmin 10vmin;grid-template-rows:1fr}
  .slide.on{display:grid}
  .inner{width:min(1180px,96vw);text-align:left}

  /* ── 머리말 ── */
  .hdr{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:2vmin;
    padding:2.2vmin 3.4vmin;font-family:var(--m);font-size:clamp(10px,1.35vmin,15px);
    letter-spacing:.22em;color:#6E6879;text-transform:uppercase}
  .hdr .dot{width:8px;height:8px;border-radius:99px;background:var(--red);
    box-shadow:0 0 12px var(--red);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hdr .sp{flex:1}

  /* ── 아래 ── */
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;
    gap:1.6vmin;padding:2.2vmin 3.4vmin;font-family:var(--m);
    font-size:clamp(10px,1.3vmin,14px);color:#5E5869;letter-spacing:.14em}
  .foot .sp{flex:1}
  .pips{display:flex;gap:.8vmin}
  .pips i{width:2.6vmin;max-width:26px;height:3px;background:#332F3D;border-radius:2px;
    transition:background .3s}
  .pips i.on{background:var(--gold)}
  .nav{border:1px solid var(--line);background:none;color:#7A7488;cursor:pointer;
    font-family:var(--m);font-size:inherit;padding:.9vmin 1.6vmin;border-radius:4px;
    letter-spacing:.1em}
  .nav:hover{border-color:var(--gold);color:var(--gold)}

  /* ── 글자 ── */
  .eyebrow{font-family:var(--m);font-size:clamp(11px,1.7vmin,18px);letter-spacing:.34em;
    color:var(--red);text-transform:uppercase;margin:0 0 2.4vmin}
  h1{font-family:var(--s);font-size:clamp(38px,9.4vmin,120px);line-height:1.02;margin:0;
    letter-spacing:-.02em;font-weight:700}
  h2{font-family:var(--s);font-size:clamp(26px,5.4vmin,64px);line-height:1.24;margin:0 0 3vmin;
    font-weight:700;letter-spacing:-.01em}
  h2 em{font-style:normal;color:var(--gold)}
  h2 u{text-decoration:none;padding-bottom:.08em;
    border-bottom:.1em solid rgba(200,53,43,.9);
    text-shadow:0 0 1px rgba(0,0,0,.001)}
  p.lead{font-size:clamp(15px,2.5vmin,28px);line-height:1.85;margin:0 0 2vmin;color:#CBC0A6;
    max-width:34em}
  p.lead b{color:var(--file);font-weight:800}
  .sub{font-family:var(--m);font-size:clamp(11px,1.6vmin,17px);letter-spacing:.2em;
    color:var(--dim);margin-top:2.6vmin}

  /* ── 도장 ── */
  .stamp{position:absolute;font-family:var(--m);font-weight:700;
    border:.42vmin solid var(--red);color:var(--red);padding:1.1vmin 2.2vmin;
    letter-spacing:.28em;font-size:clamp(12px,2vmin,22px);opacity:.86;
    transform:rotate(-11deg);border-radius:3px;text-transform:uppercase}
  .stamp.two{border-color:var(--gold);color:var(--gold);transform:rotate(7deg)}

  /* ── 서류철 ── */
  .file{background:var(--file);color:var(--ink);border-radius:2px;padding:3.4vmin 3.8vmin;
    box-shadow:0 3vmin 6vmin rgba(0,0,0,.55);position:relative;
    background-image:linear-gradient(180deg,#EFE4C9,#DFD1AE)}
  .file::before{content:"";position:absolute;left:8%;top:-1.5vmin;width:16vmin;height:3.2vmin;
    background:rgba(255,255,255,.34);border-left:1px solid rgba(0,0,0,.07);
    border-right:1px solid rgba(0,0,0,.07);transform:rotate(-1.6deg)}
  .file h3{font-family:var(--m);font-size:clamp(10px,1.5vmin,15px);letter-spacing:.26em;
    color:#8A7C5C;margin:0 0 1.8vmin;text-transform:uppercase}
  .file p{font-size:clamp(14px,2.2vmin,25px);line-height:1.8;margin:0;color:#2A2620}

  /* ── 진술 카드 ── */
  .says{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4vmin;margin-top:1vmin}
  .say{background:var(--file);color:var(--ink);padding:2.6vmin 2.4vmin;border-radius:2px;
    box-shadow:0 2vmin 4vmin rgba(0,0,0,.5);position:relative}
  .say:nth-child(1){transform:rotate(-1.6deg)}
  .say:nth-child(2){transform:rotate(.8deg)}
  .say:nth-child(3){transform:rotate(-.6deg)}
  .say b{display:block;font-family:var(--m);font-size:clamp(9px,1.35vmin,13px);
    letter-spacing:.22em;color:#8A7C5C;margin-bottom:1.4vmin}
  .say .bar{height:1.9vmin;background:#2A2620;border-radius:2px;margin-bottom:1vmin;opacity:.88}
  .say .bar.s{width:66%}
  .say .bar.m{width:88%}

  /* ── 번호 목록 ── */
  ol.steps{list-style:none;margin:0;padding:0;counter-reset:n}
  ol.steps li{counter-increment:n;display:flex;gap:2.6vmin;align-items:flex-start;
    padding:1.9vmin 0;border-bottom:1px solid var(--line)}
  ol.steps li:last-child{border-bottom:0}
  ol.steps li::before{content:counter(n,decimal-leading-zero);font-family:var(--m);
    font-size:clamp(15px,2.8vmin,32px);color:var(--red);font-weight:700;flex:0 0 auto;
    line-height:1.35;min-width:2.6em}
  ol.steps b{font-size:clamp(16px,2.9vmin,32px);line-height:1.4;display:block;font-weight:800}
  ol.steps span{display:block;font-size:clamp(13px,1.95vmin,21px);color:var(--dim);
    margin-top:.7vmin;line-height:1.65}

  /* ── 경고 ── */
  .warn{border-left:.6vmin solid var(--red);background:rgba(200,53,43,.10);
    padding:2.6vmin 3vmin;border-radius:0 4px 4px 0}
  .warn p{margin:0;font-size:clamp(15px,2.5vmin,28px);line-height:1.8}
  .big-red{color:var(--red);font-weight:800}

  /* ── 진행 ── */
  .track{display:flex;align-items:center;gap:1.4vmin;margin-top:1vmin;flex-wrap:wrap}
  .node{background:var(--night2);border:1px solid var(--line);border-radius:99px;
    padding:1.5vmin 2.4vmin;font-size:clamp(12px,1.95vmin,21px);font-weight:700;color:#9A93A8}
  .node.on{border-color:var(--gold);color:var(--gold)}
  .node.goal{background:var(--red);border-color:var(--red);color:#fff}
  .arw{color:#4A4557;font-family:var(--m)}

  /* ── 등장 ── */
  .rv{opacity:0;transform:translateY(2.2vmin);
    transition:opacity .62s cubic-bezier(.2,.7,.3,1),transform .62s cubic-bezier(.2,.7,.3,1)}
  .slide.on .rv.show{opacity:1;transform:none}
  .board{width:100%;height:100%;display:grid;place-items:center}
  .board img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;
    border-radius:4px;box-shadow:0 3vmin 8vmin rgba(0,0,0,.7)}
  .slide.board-slide{padding:8vmin 3vmin 8vmin}
  .cursor::after{content:"_";color:var(--red);animation:bl 1.05s step-end infinite}
  @keyframes bl{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.rv{transition:none}.cursor::after{animation:none}}
</style>
</head>
<body>
<div class="hdr">
  <span class="dot"></span><span>도형 수사대 · 감식과</span>
  <span class="sp"></span><span id="hcase">CASE 2026-△</span>
</div>

<div class="deck" id="deck"></div>

<div class="foot">
  <button class="nav" id="prev">◀ 이전</button>
  <button class="nav" id="next">다음 ▶</button>
  <span id="cnt"></span>
  <span class="sp"></span>
  <div class="pips" id="pips"></div>
  <span class="sp"></span>
  <button class="nav" id="fs">전체화면</button>
</div>

<script>
"use strict";
const $=i=>document.getElementById(i);

const SLIDES=[
/* 0 ── 표지 ─────────────────────────────── */

{steps:2,html:`

{steps:4,html:`

];

/* ── 진행 ── */
let I=0,S=0;
const deck=$("deck");
deck.innerHTML=SLIDES.map((s,i)=>
  `<section class="slide${s.last?" board-slide":""}" data-i="${i}">${s.html}</section>`).join("");
$("pips").innerHTML=SLIDES.map((_,i)=>`<i data-i="${i}"></i>`).join("");
$("pips").querySelectorAll("i").forEach(p=>p.onclick=e=>{e.stopPropagation();go(+p.dataset.i,0);});

function render(){
  deck.querySelectorAll(".slide").forEach((el,i)=>el.classList.toggle("on",i===I));
  const cur=deck.querySelector(".slide.on");
  cur.querySelectorAll(".rv").forEach(el=>{
    const need=+(el.dataset.step||0);
    if(need<=S){
      const d=+(el.dataset.d||0);
      el.style.transitionDelay=(d*0.11)+"s";
      requestAnimationFrame(()=>el.classList.add("show"));
    }else el.classList.remove("show");
  });
  $("pips").querySelectorAll("i").forEach((p,i)=>p.classList.toggle("on",i<=I));
  $("cnt").textContent=String(I+1).padStart(2,"0")+" / "+String(SLIDES.length).padStart(2,"0");
  $("prev").disabled=(I===0&&S===0);
}
function go(i,s){
  i=Math.max(0,Math.min(i,SLIDES.length-1));
  if(i!==I)deck.querySelectorAll(".rv").forEach(el=>el.classList.remove("show"));
  I=i;S=Math.max(0,Math.min(s,SLIDES[I].steps-1));render();
}
function next(){
  if(S<SLIDES[I].steps-1)go(I,S+1);
  else if(I<SLIDES.length-1)go(I+1,0);
}
function prev(){
  if(S>0)go(I,S-1);
  else if(I>0)go(I-1,SLIDES[I-1].steps-1);
}
document.body.onclick=e=>{if(e.target.closest(".foot,.hdr"))return;next();};
$("next").onclick=e=>{e.stopPropagation();next();};
$("prev").onclick=e=>{e.stopPropagation();prev();};
$("fs").onclick=e=>{e.stopPropagation();
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
addEventListener("keydown",e=>{
  const k=e.key;
  if(k==="ArrowRight"||k===" "||k==="Enter"||k==="PageDown"){e.preventDefault();next();}
  else if(k==="ArrowLeft"||k==="Backspace"||k==="PageUp"){e.preventDefault();prev();}
  else if(k==="Home"){go(0,0);}
  else if(k==="End"){go(SLIDES.length-1,SLIDES[SLIDES.length-1].steps-1);}
  else if(k==="f"||k==="F"){$("fs").click();}
});
render();
</script>
