<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감식 기록장 · 일반화 게시판</title>
<style>
  :root{
    --paper:#FCFAF3; --paper-2:#E4DCC6; --card:#FFFCF6; --rule:#DCD3BE;
    --ink:#1C1A16; --soft:#6A6355; --gold:#C98A10; --green:#2A7148; --red:#C0342A;
    --lav:#6A4CA8;
    --f:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--f);background:var(--paper-2);color:var(--ink);
    word-break:keep-all;overflow-wrap:break-word}
  .app{height:100dvh;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:10px;padding:11px 16px;flex:0 0 auto;
    background:var(--card);border-bottom:1px solid var(--rule)}
  .top strong{font:800 15px/1 var(--f)}
  .sp{flex:1}
  .chip{font:700 11px/1 var(--f);padding:7px 11px;border-radius:99px;background:#EDE6D5;
    border:1.5px solid var(--rule);color:var(--soft)}
  .chip.on{background:#E4F1E8;border-color:#B6D9C4;color:#1F5C39}
  .chip.off{background:#F8E3E1;border-color:#E3B6B1;color:#8E2A22}
  .me{font:700 12px/1 var(--f);padding:9px 13px;border-radius:99px;background:#F8EFD8;
    border:1.5px solid var(--gold);color:#8A6A0E;cursor:pointer}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;flex:0 0 auto;
    background:#F4EFE3;border-bottom:1px solid var(--rule)}
  .tab{flex:0 0 auto;font:700 12.5px/1 var(--f);padding:11px 14px;border-radius:99px;cursor:pointer;
    border:1.5px solid var(--rule);background:#fff;color:var(--ink);white-space:nowrap}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab.lk{opacity:.5;border-style:dashed;cursor:default}

  .body{flex:1;min-height:0;overflow:auto;padding:20px 18px 60px}
  .mid{max-width:720px;margin:0 auto}

  h1.tt{font:800 21px/1.35 var(--f);margin:0 0 5px}
  p.sub{margin:0 0 20px;font:600 12.5px/1.65 var(--f);color:var(--soft)}

  .card2{background:#fff;border:2px solid var(--rule);border-radius:16px;padding:20px 22px;
    margin-bottom:16px}
  .card2 h2{margin:0 0 4px;font:800 14px/1 var(--f);color:var(--gold)}
  .frame{font:800 clamp(17px,2.4vw,23px)/2.1 var(--f);margin:14px 0 0}
  .frame input{font:800 clamp(16px,2.2vw,22px)/1.5 var(--f);padding:8px 14px;
    border:0;border-bottom:2.5px solid var(--gold);background:#FFFCF2;color:var(--ink);
    min-width:min(320px,60vw);border-radius:8px 8px 0 0}
  .frame input:focus{outline:0;background:#FFF7E2}
  .frame input:disabled{border-bottom-style:dashed;color:var(--soft);background:#F7F4EC}
  .go{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;
    font:800 14px/1 var(--f);background:var(--ink);color:#fff}
  .go:disabled{background:#DCD3BE;color:#96907F;cursor:default}
  .go.sub{background:#fff;border:1.5px solid var(--rule);color:var(--soft)}
  .hint{margin:12px 0 0;font:600 12px/1.65 var(--f);color:var(--soft)}
  .lock{background:#F7F4EC;border:2px dashed var(--rule);border-radius:16px;padding:30px 22px;
    text-align:center;font:700 13.5px/1.8 var(--f);color:var(--soft)}

  .posted{background:#E4F1E8;border:2px solid #B6D9C4;border-radius:16px;padding:18px 22px;
    margin-bottom:16px}
  .posted em{display:block;font:800 11.5px/1 var(--f);font-style:normal;color:#4C8163;
    margin-bottom:8px}
  .posted p{margin:0;font:800 clamp(16px,2.3vw,22px)/1.7 var(--f);color:#17402C}

  .wall{display:grid;gap:9px}
  .note{background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:12px 15px}
  .note b.who{display:block;font:800 11px/1 var(--f);color:var(--lav);margin-bottom:5px}
  .note p{margin:0;font:600 14px/1.6 var(--f)}
  .note.mine{border-color:var(--gold);background:#FFFCF2}
  .note.mine b.who{color:#8A6A0E}

  .light{background:#fff;border:2px solid var(--rule);border-radius:16px;padding:20px 22px}
  .light h2{margin:0 0 4px;font:800 14px/1 var(--f);color:var(--red)}
  .light p.q{margin:8px 0 16px;font:700 15px/1.6 var(--f)}
  .lamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .lamp{border:2.5px solid var(--rule);background:#fff;border-radius:14px;padding:16px 8px;
    cursor:pointer;text-align:center;font:800 13px/1.45 var(--f);color:var(--ink)}
  .lamp i{display:block;width:34px;height:34px;border-radius:99px;margin:0 auto 9px;
    background:var(--c)}
  .lamp small{display:block;font:600 11px/1.4 var(--f);color:var(--soft);margin-top:5px}
  .lamp.on{border-color:var(--ink);background:#FBF8F0}
  .lamp:disabled{opacity:.45;cursor:default}
  .done{margin-top:14px;background:#E4F1E8;border:1.5px solid #B6D9C4;border-radius:12px;
    padding:12px 15px;font:700 13px/1.6 var(--f);color:#1F5C39}

  .modal{position:fixed;inset:0;background:rgba(28,26,22,.5);display:grid;place-items:center;
    padding:18px;z-index:40}
  .modal[hidden]{display:none}
  .sheet{background:var(--card);border-radius:18px;width:min(420px,100%);padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .sheet h1{margin:0 0 5px;font:800 19px/1.3 var(--f)}
  .sheet p{margin:0 0 16px;font:600 12.5px/1.65 var(--f);color:var(--soft)}
  .row{display:flex;align-items:center;gap:9px;margin:11px 0}
  .row label{flex:0 0 62px;font:800 12.5px/1 var(--f);color:var(--soft)}
  .row input,.row select{flex:1;font:700 15px/1 var(--f);padding:12px 13px;border-radius:11px;
    border:1.5px solid var(--rule);background:#FCFAF3;color:var(--ink)}
  .row .dice{flex:0 0 auto;font:700 13px/1 var(--f);padding:12px;border-radius:11px;
    border:1.5px solid var(--rule);background:#F8EFD8;cursor:pointer}
  .msg{margin:2px 0 10px;font:600 12px/1.5 var(--f);color:var(--soft);min-height:1px}
  .msg.bad{color:var(--red)}
  .mbtn{width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;
    font:800 14px/1 var(--f);background:var(--ink);color:#fff}
  .mbtn.ghost{margin-top:8px;background:#fff;border:1.5px solid var(--rule);color:var(--soft);
    font-weight:700}
  .badge{background:#F8EFD8;border:1.5px solid var(--gold);border-radius:12px;padding:13px 15px;
    margin-bottom:14px;font:700 12.5px/1.7 var(--f);color:#6A5210}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <strong>감식 기록장</strong>
    <span class="chip" id="saved" style="opacity:0">저장됨</span>
    <span class="sp"></span>
    <span class="chip" id="net">연결 확인 중</span>
    <button class="me" id="me">코드네임 정하기</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="body"><div class="mid" id="main"></div></div>
</div>

<div class="modal" id="idModal" hidden><div class="sheet">
  <h1>감식관 등록</h1>
  <p>작도 실습실에서 쓰던 <b>코드네임</b>을 그대로 넣으세요. 쓰던 기록이 이어집니다.</p>
  <div class="row"><label>반</label><select id="idCls">
    <option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option></select></div>
  <div class="row"><label>코드네임</label><input id="idNick" maxlength="12" autocomplete="off">
    <button class="dice" id="idDice">🎲</button></div>
  <p class="msg" id="idMsg"></p>
  <button class="mbtn" id="idSave">저장</button>
  <button class="mbtn ghost" id="idHand">이 기기를 다른 사람에게 넘기기</button>
</div></div>

<div class="modal" id="realModal" hidden><div class="sheet">
  <h1>감식관 신원 확인</h1>
  <p>코드네임은 <b>현장에서 쓰는 이름</b>입니다.<br>
     자기평가는 정식 기록으로 남기 때문에 <b>감식관의 실제 신원</b>이 필요합니다.</p>
  <div class="badge">한 번만 확인하면 다음부터는 묻지 않습니다.<br>
    코드네임 <b id="realCode">—</b> 로 활동한 사람이 누구인지만 기록됩니다.</div>
  <div class="row"><label>학번</label><input id="realNo" inputmode="numeric" maxlength="5"
    placeholder="10314" autocomplete="off"></div>
  <div class="row"><label>이름</label><input id="realName" maxlength="10" autocomplete="off"></div>
  <p class="msg" id="realMsg"></p>
  <button class="mbtn" id="realGo">확인하고 제출</button>
  <button class="mbtn ghost" id="realCancel">나중에</button>
</div></div>

<script>
"use strict";
const $=i=>document.getElementById(i);

/* ══ 설정 ═══════════════════════════════════════════════════
   신호등 자기평가를 구글 시트로도 보내려면 아래 따옴표 안에
   Apps Script 웹 앱 주소를 붙여 넣으세요.
   비워 두면 서버(Firebase)에만 쌓입니다.
   ═════════════════════════════════════════════════════════ */
const SHEET_URL="";

const DB="https://jak-do-default-rtdb.asia-southeast1.firebasedatabase.app";
const gj=async p=>{const r=await fetch(`${DB}/${p}.json`);if(!r.ok)throw 0;return r.json();};
const pj=async(p,v)=>{const r=await fetch(`${DB}/${p}.json`,{method:"PUT",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw 0;};
const NS="jakdo.v2";
const LS={get(k,d){try{const v=localStorage.getItem(NS+":"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(NS+":"+k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(NS+":"+k);}catch(e){}}};
const esc=s=>String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
let ON=null;
const setNet=ok=>{if(ON===ok)return;ON=ok;
  $("net").className="chip "+(ok?"on":"off");$("net").textContent=ok?"연결됨":"연결 안 됨";};
let fl=null;
const flash=()=>{$("saved").style.opacity=1;clearTimeout(fl);
  fl=setTimeout(()=>{$("saved").style.opacity=0;},1100);};

/* ── 신원 ── */
let me=LS.get("me",{cls:"1-1",nick:"",no:"",group:"",color:"#2A63D8"});
let real=LS.get("real",null);
const DEV=(()=>{let d=LS.get("dev",null);if(!d){d=Math.random().toString(36).slice(2,10);LS.set("dev",d);}return d;})();
const cls=()=>me.cls||"1-1";
const NA=["초록","파랑","노랑","붉은","하얀","검은","은빛","금빛","작은","날쌘","조용한","용감한",
  "슬기로운","다정한","씩씩한","반짝이는","느긋한","부지런한"];
const NB=["거북","여우","수달","담비","사슴","부엉이","고래","다람쥐","두더지","고슴도치","까치",
  "해달","살쾡이","알파카","펭귄","오소리","너구리","물총새"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const clean=t=>t.replace(/[.#$\[\]\/]/g,"").trim().slice(0,12);
const note=(t,bad)=>{$("idMsg").textContent=t||"";$("idMsg").className="msg"+(bad?" bad":"");};
const paintMe=()=>{$("me").textContent=me.nick?`${me.cls} · ${me.nick}`:"코드네임 정하기";};
function openId(f){$("idCls").value=me.cls||"1-1";$("idNick").value=me.nick||"";note("");
  $("idModal").hidden=false;$("idModal").dataset.f=f?"1":"";}
let busy=false;
async function saveId(force){
  if(busy)return;
  const c=$("idCls").value,nk=clean($("idNick").value);
  if(!nk)return note("코드네임을 넣거나 🎲를 눌러 주세요.",1);
  busy=true;note("확인하는 중…");
  let o=null;try{o=await gj(`codes/${c}/${nk}`);setNet(true);}catch(e){o="off";setNet(false);}
  if(o&&o!=="off"&&o.dev!==DEV&&!force){busy=false;
    note("이미 쓰이고 있는 코드네임입니다. 내가 쓰던 것이면 “이어서 하기”를 누르세요.",1);
    $("idSave").textContent="이어서 하기";$("idSave").dataset.f="1";return;}
  me=Object.assign({},me,{cls:c,nick:nk,no:nk});LS.set("me",me);
  if(o!=="off")pj(`codes/${c}/${nk}`,{dev:DEV,at:Date.now()}).catch(()=>{});
  busy=false;note("");$("idSave").textContent="저장";delete $("idSave").dataset.f;
  $("idModal").hidden=true;paintMe();await pull();paint();
}
$("idSave").onclick=()=>saveId($("idSave").dataset.f==="1");
$("idDice").onclick=()=>{$("idNick").value=rnd(NA)+rnd(NB);note("");
  $("idSave").textContent="저장";delete $("idSave").dataset.f;};
$("idHand").onclick=()=>{
  if(!confirm("이 기기의 코드네임과 이름을 지웁니다."))return;
  LS.del("me");LS.del("real");real=null;
  me={cls:me.cls,nick:"",no:"",group:"",color:"#2A63D8"};
  $("idNick").value="";paintMe();openId(1);paint();};
$("me").onclick=()=>openId();
$("idModal").addEventListener("click",e=>{
  if(e.target===$("idModal")&&$("idModal").dataset.f!=="1")$("idModal").hidden=true;});

/* ── 차시 ── */
const LESS=[
  {n:"1",tab:"① 도구 감식",t:"도구 감식",sub:"1차시 · 재지 않고 옮기기",
   pre:"작도는",post:".",ph:"어떤 것인지 한 마디로",
   q:"두 훈련(길이 옮기기 · 각 옮기기)의 <b>공통점</b>을 찾아 문장을 완성하세요."},
  {n:"2",tab:"② 형태 감식",t:"형태 감식",sub:"2차시 · 삼각형이 되는 조건",
   pre:"삼각형이 만들어지기 위해서는",post:".",ph:"세 변 사이에 어떤 관계가",
   q:"세 변의 길이 사이에 어떤 관계가 있어야 하는지 쓰세요."},
  {n:"4",tab:"③ 결정 감식",t:"결정 감식",sub:"4차시 · 무엇이 하나로 정하는가",
   pre:"삼각형이 하나로 정해지는 것은",post:".",ph:"무엇에 달려 있는지",
   q:"조건의 개수인지, 다른 무엇인지 밝혀 쓰세요."},
  {n:"5",tab:"④ 대조 감식",t:"대조 감식",sub:"5차시 · 같다고 말할 근거",
   pre:"삼각형이 하나로 정해지는 조건은",post:".",ph:"무엇이 되는지",
   q:"하나로 정해지는 조건과 합동 조건의 관계를 쓰세요."},
  {n:"6",tab:"⑤ 최종 판정",t:"최종 판정",sub:"6차시 · 정해지지 않을 때",
   pre:"주어진 조건으로 삼각형이 하나로 정해지지 않으면",post:".",ph:"어떻게 되는지",
   q:"사건 4에서 내린 결론을 한 문장으로 쓰세요."},
  {n:"u",tab:"★ 수사 원칙",t:"수사 원칙",sub:"단원 종합 · 사건 종결",
   pre:"삼각형을 하나로 정하는 조건이 같으면",post:".",ph:"두 삼각형은 어떤 관계인지",
   q:"게시판의 두 문장을 하나로 합치면 어떤 문장이 됩니까?"}
];
const LAMPS=[
  {k:"g",c:"#2A7148",t:"혼자 할 수 있다",s:"순서를 보지 않아도 된다"},
  {k:"y",c:"#C98A10",t:"순서를 보면 할 수 있다",s:"아직 손에 익지 않았다"},
  {k:"r",c:"#C0342A",t:"아직 어렵다",s:"다시 배우고 싶다"}
];

let OPEN={},MINE={},CLS={},ALL={},SELF=null,V={n:"1"};
async function pull(){
  if(!me.nick)return;
  try{
    const [o,mine,cl,all,sf]=await Promise.all([
      gj(`gens/${cls()}/open`),gj(`gens/${cls()}/mine/${me.no}`),
      gj(`gens/${cls()}/class`),gj(`gens/${cls()}/mine`),
      gj(`gens/${cls()}/self/${me.no}`)]);
    OPEN=o||{};MINE=mine||{};CLS=cl||{};ALL=all||{};SELF=sf||null;setNet(true);
  }catch(e){setNet(false);}
}
const opened=n=>n==="1"?(OPEN["1"]!==false):!!OPEN[n];
const submitted=n=>!!(MINE[n]&&String(MINE[n]).trim());

async function send(n,text){
  MINE[n]=text;
  try{await pj(`gens/${cls()}/mine/${me.no}`,
    Object.assign({},MINE,{nick:me.nick,group:me.group,at:Date.now()}));
    setNet(true);flash();}catch(e){setNet(false);}
  await pull();paint();
}

/* ── 신호등 ── */
let pendingLamp=null;
function openReal(){
  $("realCode").textContent=me.nick;
  $("realNo").value=(real&&real.no)||"";$("realName").value=(real&&real.name)||"";
  $("realMsg").textContent="";$("realModal").hidden=false;
  setTimeout(()=>$("realNo").focus(),80);
}
$("realCancel").onclick=()=>{$("realModal").hidden=true;};
$("realGo").onclick=async()=>{
  const no=$("realNo").value.trim(),nm=$("realName").value.trim();
  if(!/^\d{3,5}$/.test(no)){$("realMsg").textContent="학번을 숫자로 넣어 주세요.";return;}
  if(!nm){$("realMsg").textContent="이름을 넣어 주세요.";return;}
  real={no,name:nm};LS.set("real",real);
  $("realModal").hidden=true;
  await sendSelf(pendingLamp);
};
async function pickLamp(k){
  if(!OPEN.self)return;
  pendingLamp=k;
  if(!real){openReal();return;}
  await sendSelf(k);
}
async function sendSelf(k){
  if(!k)return;
  const rec={code:me.nick,level:k,at:Date.now()};   /* 서버에는 코드네임만 남깁니다 */
  SELF=rec;paint();
  try{await pj(`gens/${cls()}/self/${me.no}`,rec);setNet(true);flash();}catch(e){setNet(false);}
  if(SHEET_URL&&real){                              /* 실명은 선생님 시트로만 갑니다 */
    try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({cls:cls(),sid:real.no,name:real.name,code:me.nick,level:k,
        label:(LAMPS.find(x=>x.k===k)||{}).t,at:new Date().toISOString()})});}catch(e){}
  }
}

/* ── 그리기 ── */
function paintTabs(){
  $("tabs").innerHTML=LESS.map(L=>{
    const lk=!opened(L.n);
    return `<button class="tab${V.n===L.n?" on":""}${lk?" lk":""}" data-n="${L.n}">${
      lk?"🔒 ":""}${L.tab}</button>`;}).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>{b.onclick=()=>{
    if(b.classList.contains("lk"))return;
    V.n=b.dataset.n;b.blur();paint();};});
}
function paint(){
  paintMe();paintTabs();
  const M=$("main");
  if(!me.nick){M.innerHTML=`<div class="lock">오른쪽 위 <b>코드네임 정하기</b>를 눌러 시작하세요.</div>`;return;}
  const L=LESS.find(x=>x.n===V.n)||LESS[0];
  let h=`<h1 class="tt">${L.tab.slice(0,1)} ${L.t}</h1>
    <p class="sub">${L.sub} · 오늘 밝혀낸 것을 한 문장으로 남깁니다.</p>`;
  if(!opened(L.n)){
    M.innerHTML=h+`<div class="lock">아직 열리지 않은 차시입니다.<br>
      선생님이 열어 주면 여기에 문장이 나타납니다.</div>`;return;}

  const post=(CLS[L.n]&&CLS[L.n].posted)?CLS[L.n].text:null;
  if(post)h+=`<div class="posted"><em>우리 반이 함께 정한 문장</em><p>${esc(post)}</p></div>`;

  const done=submitted(L.n);
  h+=`<div class="card2"><h2>문장 완성하기</h2>
    <p class="sub" style="margin:0">${L.q}</p>
    <p class="frame">${L.pre}
      <input id="blank" value="${esc(MINE[L.n]||"")}" placeholder="${esc(L.ph)}"${done?" disabled":""}>${L.post}</p>
    ${done?`<button class="go sub" id="edit">고쳐 쓰기</button>
            <p class="hint">냈습니다. 아래에서 친구들의 문장을 볼 수 있어요.</p>`
          :`<button class="go" id="send" disabled>문장 내기</button>
            <p class="hint">내기 전에는 친구들의 문장이 보이지 않습니다.</p>`}
  </div>`;

  if(done){
    const rows=Object.keys(ALL).map(k=>({no:k,nick:(ALL[k]||{}).nick,t:(ALL[k]||{})[L.n]}))
      .filter(r=>r.t&&String(r.t).trim());
    h+=`<div class="card2"><h2>친구들의 문장 · ${rows.length}명</h2>
      <div class="wall" style="margin-top:12px">${rows.map(r=>
        `<div class="note${r.no===me.no?" mine":""}"><b class="who">${esc(r.nick||r.no)}${
          r.no===me.no?" · 나":""}</b><p>${esc(L.pre)} <b>${esc(r.t)}</b>${esc(L.post)}</p></div>`
        ).join("")}</div></div>`;
  }

  if(L.n==="1"){
    const lv=SELF&&SELF.level;
    h+=`<div class="light"><h2>오늘의 나 · 신호등</h2>
      <p class="q">각의 작도를 혼자 힘으로 할 수 있나요?</p>
      <div class="lamps">${LAMPS.map(x=>
        `<button class="lamp${lv===x.k?" on":""}" data-k="${x.k}" style="--c:${x.c}"${
          OPEN.self?"":" disabled"}><i></i>${x.t}<small>${x.s}</small></button>`).join("")}</div>
      ${OPEN.self
        ?(lv?`<div class="done">제출했습니다${real?` · ${esc(real.name)}(${esc(real.no)})`:""}. 다시 눌러 바꿀 수 있어요.</div>`:"")
        :`<p class="hint">선생님이 열어 주면 누를 수 있습니다.</p>`}</div>`;
  }
  M.innerHTML=h;

  const b=$("blank");
  if(b&&!done){
    const btn=$("send");
    const upd=()=>{btn.disabled=!b.value.trim();};
    b.oninput=upd;upd();
    btn.onclick=()=>send(L.n,b.value.trim());
    b.onkeydown=e=>{if(e.key==="Enter"&&b.value.trim())send(L.n,b.value.trim());};
  }
  const ed=$("edit");
  if(ed)ed.onclick=()=>{MINE[L.n]="";paint();setTimeout(()=>{const x=$("blank");if(x)x.focus();},0);};
  M.querySelectorAll(".lamp").forEach(x=>{x.onclick=()=>pickLamp(x.dataset.k);});
}

const editing=()=>{const a=document.activeElement;
  return !!(a&&a.tagName==="INPUT"&&$("main").contains(a));};
let sig="";
setInterval(async()=>{
  await pull();
  const s=JSON.stringify([OPEN,CLS,Object.keys(ALL).length,SELF&&SELF.level,MINE]);
  if(s===sig)return;
  sig=s;
  if(editing())return;
  paint();
},2500);

paintMe();
(async()=>{await pull();paint();if(!me.nick)setTimeout(()=>openId(1),300);})();
</script>
</body>
</html>
