<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사건 파일 · 감식반</title>
<style>
  :root{
    --dark:#141210; --dark2:#1F1B17; --paper:#EFE9DB; --card:#FBF6E9;
    --ink:#241F16; --soft:#6A6355; --rule:#C6B994; --red:#C0342A; --gold:#C98A10;
    --ok:#2A7148; --blue:#1F3F94;
    --f:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    --s:"Noto Serif KR",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:var(--f);background:var(--dark);color:var(--ink)}
  button{font-family:inherit}
  .hide{display:none!important}

  /* ── 공통 머리 ── */
  .top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:11px 16px;
    background:var(--dark);border-bottom:3px solid var(--red)}
  .top b.brand{font:900 16px/1 var(--f);color:#F6F1E6;letter-spacing:.04em}
  .top .ver{font:800 10px/1 var(--f);color:#8A8474}
  .top .sp{flex:1}
  .top .me{font:800 12px/1 var(--f);color:#F0C86A;border:1.5px solid #6A5A2A;
    border-radius:99px;padding:6px 11px}
  .tb{font:800 12.5px/1 var(--f);padding:9px 13px;border-radius:9px;cursor:pointer;
    border:1.6px solid #45403A;background:#2A2620;color:#F6F1E6}
  .tb:active{transform:translateY(1px)}
  .tb.red{background:var(--red);border-color:var(--red)}
  .net{font:800 10.5px/1 var(--f);border-radius:99px;padding:5px 9px;border:1.5px solid #45403A;
    color:#9A9484}
  .net.on{color:#9FD9B4;border-color:#2F5E44}

  /* ── 등록 ── */
  .reg{min-height:100%;display:flex;align-items:center;justify-content:center;padding:26px 18px}
  .rcard{width:min(460px,100%);background:var(--paper);border:3px solid #000;border-radius:3px}
  .rhead{background:var(--dark);color:#F6F1E6;padding:20px 22px 17px}
  .rhead .no{font:900 10.5px/1 var(--f);color:var(--red);letter-spacing:.16em}
  .rhead h1{margin:8px 0 7px;font:900 22px/1.2 var(--f)}
  .rhead p{margin:0;font:700 12px/1.7 var(--f);color:#B9B2A2}
  .rbody{padding:18px 22px 20px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .row label{flex:0 0 58px;font:800 12.5px/1 var(--f);color:#4A4034}
  .row input,.row select{flex:1;font:700 14.5px/1 var(--f);padding:12px;border-radius:8px;
    border:1.8px solid var(--rule);background:#fff;color:var(--ink);min-width:0}
  .row input:focus,.row select:focus{outline:none;border-color:var(--gold)}
  .swat{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .sw{width:28px;height:28px;border-radius:99px;border:2.5px solid #fff;cursor:pointer;
    background:var(--c);box-shadow:0 0 0 1.5px var(--rule)}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
  .dice{flex:0 0 auto;padding:12px 13px;border-radius:8px;cursor:pointer;
    border:1.8px solid var(--ink);background:var(--ink);color:#fff;font:800 12.5px/1 var(--f)}
  .row input[readonly]{background:#F4EFE3;font-weight:800}
  .msg{min-height:18px;margin:2px 0 9px;font:700 12px/1.5 var(--f);color:var(--red)}
  .go{width:100%;padding:14px;border-radius:9px;cursor:pointer;font:900 14.5px/1 var(--f);
    border:2.5px solid var(--red);background:var(--red);color:#fff}
  .tiny{margin:11px 0 0;font:700 11px/1.6 var(--f);color:var(--soft);text-align:center}
  .tiny a{color:var(--soft);cursor:pointer;text-decoration:underline}

  /* ── 사건 목록 ── */
  .list{padding:26px 18px 60px}
  .lin{max-width:940px;margin:0 auto}
  .lin h1{margin:0;font:900 25px/1.2 var(--f);color:#F6F1E6}
  .lin .sub{margin:9px 0 0;font:700 12.5px/1.7 var(--f);color:#9A9484}
  .lin hr{border:0;border-top:2px solid #3A332A;margin:15px 0 20px}
  .files{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
  .file{position:relative;display:block;width:100%;text-align:left;cursor:pointer;
    border:2px solid var(--rule);border-radius:3px 15px 5px 5px;padding:33px 15px 15px;
    background:linear-gradient(180deg,var(--card),#EFE6CF);box-shadow:0 3px 0 #080706;
    font:inherit;color:var(--ink)}
  .file:active{transform:translateY(2px);box-shadow:0 1px 0 #080706}
  .file .tab{position:absolute;left:-2px;top:-2px;width:78px;height:21px;background:var(--rule);
    border-radius:3px 9px 0 0;font:900 11px/21px var(--f);color:#3E362A;text-align:center}
  .file h4{margin:0 0 9px;font:900 16px/1.2 var(--f)}
  .file .seal{margin:0;font:800 12px/1.5 var(--f);color:#6A5A44;border-left:3px solid var(--red);
    padding-left:9px}
  .file .st{display:inline-block;margin-top:12px;font:800 10.5px/1 var(--f);border-radius:99px;
    padding:5px 9px}
  .st.n{background:#EFEADF;color:#6A6355}
  .st.i{background:#FFF6E3;color:#8A6A0E}
  .st.d{background:#EFF7F1;color:var(--ok)}
  .st.l{background:#E4DCC6;color:#8A8271}
  .file.lock{opacity:.5;cursor:not-allowed;box-shadow:0 1px 0 #080706}
  .file.lock::after{content:"🔒";position:absolute;right:12px;bottom:11px;font-size:17px}
  .file .say2{margin:0;font:700 13px/1.65 var(--s);color:#241F16;
    border-left:3px solid var(--red);padding-left:9px}
  .file .say2 em{font-style:normal;background:#FBE9A7;padding:0 4px;border-radius:3px;
    font-weight:900}
  .file .arrow{display:block;margin-top:11px;font:900 12.5px/1 var(--f);color:var(--red)}
  .file.fin::after{content:"완료";position:absolute;right:11px;bottom:11px;
    border:2.5px solid var(--ok);color:var(--ok);border-radius:5px;padding:3px 8px;
    font:900 12px/1 var(--f);transform:rotate(-9deg)}
  .file.fin{opacity:.9}
  .file.done::after{content:"검거";position:absolute;right:11px;bottom:11px;
    border:2.5px solid var(--ok);color:var(--ok);border-radius:5px;padding:3px 8px;
    font:900 12px/1 var(--f);transform:rotate(-9deg)}
  .advh{margin:26px 0 4px;font:900 18px/1.2 var(--f);color:#F0C86A;
    border-top:2px solid #3A332A;padding-top:18px}
  .advh em{font-style:normal;font:800 12px/1 var(--f);color:#9A9484;margin-left:7px}
  .advs{margin:0 0 13px;font:700 12px/1.6 var(--f);color:#9A9484}
  .file.adv{border-color:#C9A227;background:linear-gradient(180deg,#FBF3DC,#F0E4C2)}
  .file.adv .tab{background:#C9A227;color:#3E2F08}
  .lfoot{margin:22px 0 0;font:700 12px/1.8 var(--f);color:#9A9484}

  .certgo{margin-top:22px;padding:18px 20px;background:var(--card);border:2px solid var(--rule);
    border-radius:12px;text-align:center}
  .certgo p{margin:0 0 13px;font:800 14px/1.7 var(--f)}
  .certgo .go{max-width:320px;margin:0 auto}

  .idwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .idc{width:330px;background:var(--card);border:3px solid #141210;border-radius:8px;
    overflow:hidden;box-shadow:0 6px 0 #080706}
  .idtop{background:#141210;color:#F6F1E6;padding:9px 13px;display:flex;
    justify-content:space-between;align-items:center}
  .idtop span{font:900 10px/1 var(--f);color:var(--red);letter-spacing:.16em}
  .idtop b{font:900 12px/1 var(--f);letter-spacing:.2em;color:#8A8474}
  .idbody{display:flex;gap:13px;padding:14px}
  .photo{flex:0 0 auto;border:2px solid var(--rule);border-radius:6px;overflow:hidden;
    background:#EFE9DB;line-height:0}
  .idbody dl{margin:0;flex:1;min-width:0}
  .idbody dt{font:800 9.5px/1 var(--f);color:var(--soft);letter-spacing:.1em;margin-top:9px}
  .idbody dt:first-child{margin-top:0}
  .idbody dd{margin:4px 0 0;font:800 13.5px/1.3 var(--f);word-break:break-all}
  .idbody dd.big{font:900 19px/1.2 var(--f)}
  .idfoot{background:#E7E0CE;border-top:2px solid var(--rule);padding:7px 13px;
    font:700 10.5px/1 var(--f);color:var(--soft);text-align:center;letter-spacing:.04em}

  .bdgbox{margin-top:15px;background:var(--card);border:2px solid var(--rule);
    border-radius:12px;padding:13px 15px}
  .bdgbox h5{margin:0 0 4px;font:900 12px/1 var(--f);color:var(--soft)}
  .bdgbox h5 em{font-style:normal;color:var(--ink)}
  .bdgbox p.bh{margin:0 0 11px;font:700 11.5px/1.6 var(--f);color:var(--soft)}
  .bdgs{display:flex;gap:9px;flex-wrap:wrap}
  .bdg{display:flex;flex-direction:column;align-items:center;gap:5px;width:74px;
    opacity:.34;filter:grayscale(1)}
  .bdg.got{opacity:1;filter:none}
  .bdg i{width:var(--bs);height:var(--bs);border-radius:99px;background:var(--bc);
    box-shadow:0 2px 0 rgba(20,18,16,.28);display:flex;align-items:center;
    justify-content:center;font-style:normal}
  .bdg i svg{width:66%;height:66%;display:block}
  .bdg.got i{box-shadow:0 2px 0 rgba(20,18,16,.28),0 0 0 3px #fff,0 0 0 4.5px var(--bc)}
  .bdg em{font-style:normal;font:800 10px/1.3 var(--f);color:var(--ink);text-align:center;
    word-break:keep-all}
  .newbdg{display:flex;gap:10px;align-items:center;background:#FFF6E3;
    border-left:5px solid var(--gold);border-radius:9px;padding:10px 12px;margin-bottom:12px}
  .newbdg .t{font:900 12.5px/1.5 var(--f);color:#8A6A0E}
  .newbdg .t b{display:block;font:900 14px/1.4 var(--f);color:var(--ink)}
  .fixid{margin-top:15px;background:var(--card);border:2px solid var(--rule);border-radius:12px;
    padding:13px 15px}
  .fixid h5{margin:0 0 9px;font:900 12px/1 var(--f);color:var(--soft)}
  .frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .frow label{font:800 12px/1 var(--f);color:#4A4034}
  .frow select,.frow input{font:700 13.5px/1 var(--f);padding:9px 10px;border-radius:8px;
    border:1.8px solid var(--rule);background:#fff;color:var(--ink);width:104px}
  .frow button{padding:9px 14px;border-radius:8px;cursor:pointer;border:2px solid var(--ink);
    background:var(--ink);color:#fff;font:800 12.5px/1 var(--f)}
  .fxmsg{margin:9px 0 0;font:700 11.5px/1.6 var(--f);color:var(--soft)}
  .dress{flex:1;min-width:250px;background:var(--card);border:2px solid var(--rule);
    border-radius:12px;padding:14px 16px}
  .pgrp{margin-bottom:13px}
  .pgrp h5{margin:0 0 7px;font:900 12px/1 var(--f);color:var(--soft)}
  .popts{display:flex;gap:6px;flex-wrap:wrap}
  .popt{padding:9px 12px;border-radius:8px;cursor:pointer;border:1.8px solid var(--rule);
    background:#fff;font:800 12px/1 var(--f);color:var(--ink)}
  .popt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .cols{display:flex;gap:7px;flex-wrap:wrap}
  .cbtn{width:30px;height:30px;border-radius:99px;cursor:pointer;background:var(--c);
    border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--rule)}
  .cbtn[aria-pressed="true"]{box-shadow:0 0 0 3.5px var(--ink)}
  .rnd{width:100%;padding:11px;border-radius:9px;cursor:pointer;border:2px solid var(--gold);
    background:#FFF6E3;font:800 12.5px/1 var(--f);color:#8A6A0E}

  .finwrap{padding:24px 16px 60px}
  .fin{max-width:660px;margin:0 auto;background:var(--card);border:3px solid #141210;
    border-radius:5px;box-shadow:0 8px 0 #080706;animation:up .5s ease both}
  .finh{background:#141210;color:#F6F1E6;padding:18px 22px 16px;text-align:center}
  .finh .no{font:900 10.5px/1 var(--f);color:var(--red);letter-spacing:.2em}
  .finh h1{margin:9px 0 0;font:900 23px/1.3 var(--f)}
  .finb{padding:20px 22px 22px}
  .award{display:flex;gap:15px;align-items:center;padding-bottom:17px;
    border-bottom:2.5px double var(--rule);margin-bottom:17px}
  .award .ph{flex:0 0 auto;border:2px solid var(--rule);border-radius:6px;overflow:hidden;
    line-height:0;background:#EFE9DB}
  .atx{flex:1;min-width:0}
  .atx .lead{margin:0 0 9px;font:700 13.5px/1.7 var(--s)}
  .atx .who{margin:0}
  .atx .who b{font:900 21px/1.2 var(--f)}
  .atx .who small{display:block;margin-top:4px;font:700 11.5px/1 var(--f);color:var(--soft)}
  .atx .date{margin:8px 0 0;font:800 11.5px/1 var(--f);color:var(--soft)}
  .bigstamp{flex:0 0 auto;border:4px solid var(--red);color:var(--red);border-radius:9px;
    padding:9px 11px;font:900 15px/1.25 var(--f);text-align:center;transform:rotate(-9deg);
    opacity:.92}
  .finb h4{margin:0 0 9px;font:900 12.5px/1 var(--f);color:var(--soft);letter-spacing:.06em}
  .fintb{width:100%;border-collapse:collapse;margin-bottom:17px;background:#fff;
    border:1.8px solid var(--rule);border-radius:9px;overflow:hidden}
  .fintb th,.fintb td{border-bottom:1px solid #E4DCC6;padding:7px 9px;
    font:700 12px/1.5 var(--f);text-align:left}
  .fintb th{background:#E7E0CE;font:800 11px/1.3 var(--f)}
  .fintb tr:last-child td{border-bottom:0}
  .fintb .c{text-align:center;white-space:nowrap}
  .concl{background:#141210;color:#F6F1E6;border-radius:10px;padding:15px 17px;margin-bottom:17px}
  .concl span{display:block;font:900 10px/1 var(--f);color:var(--red);letter-spacing:.18em;
    margin-bottom:10px}
  .concl p{margin:0 0 9px;font:700 13.5px/1.75 var(--s);color:#EDE7DA}
  .concl p b{color:#F0C86A}
  .concl .last{margin:12px 0 0;padding-top:11px;border-top:1px solid #3A332A;
    font:800 14.5px/1.7 var(--s);color:#FBF6E9}
  .fintwo{display:flex;gap:9px;flex-wrap:wrap}
  .fintwo .go{flex:1;min-width:160px}
  .go.ghost{background:#fff;border-color:var(--ink);color:var(--ink)}
  .conf{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
  .conf i{position:absolute;top:-24px;border-radius:2px;
    animation:fall linear both}
  @keyframes fall{to{transform:translateY(112vh) rotate(var(--r));opacity:.15}}
  @media (prefers-reduced-motion:reduce){.conf{display:none}}
  .repgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
  .repmini{background:var(--card);border:2px solid var(--rule);border-radius:10px;overflow:hidden}
  .rmh{background:#141210;color:#F6F1E6;padding:8px 12px;display:flex;
    justify-content:space-between;align-items:center}
  .rmh span{font:900 11px/1 var(--f);letter-spacing:.12em;color:var(--red)}
  .rmh i{font-style:normal;border:2px solid #9FD9B4;color:#9FD9B4;border-radius:4px;
    padding:2px 7px;font:900 10.5px/1 var(--f);transform:rotate(-6deg)}
  .rmb{display:flex;gap:10px;padding:11px 12px}
  .rmb .ph{flex:0 0 auto;border:1.5px solid var(--rule);border-radius:5px;overflow:hidden;
    line-height:0;background:#EFE9DB}
  .rmt{flex:1;min-width:0}
  .rmt b{display:block;font:900 13.5px/1.2 var(--f)}
  .rmt p{margin:5px 0 0;font:700 11.5px/1.6 var(--s);color:var(--ink)}
  .rmt p.ex{color:#8A6A0E}
  .rmt em{font-style:normal;background:#FBE9A7;padding:0 3px;border-radius:3px;font-weight:900}
  .rmf{display:flex;gap:9px;align-items:center;border-top:1.5px solid var(--rule);
    padding:9px 12px;background:#fff}
  .rmf span{font:800 11.5px/1.4 var(--f);color:var(--soft)}
  /* ── 수사 보고서 ── */
  .rep{position:fixed;inset:0;z-index:55;background:rgba(10,9,8,.86);overflow:auto;
    padding:24px 16px}
  .repin{max-width:620px;margin:0 auto;background:var(--card);border:3px solid #141210;
    border-radius:4px;animation:up .4s ease both}
  .reph{background:#141210;color:#F6F1E6;padding:15px 20px;display:flex;
    justify-content:space-between;align-items:center;gap:12px}
  .reph .no{font:900 10px/1 var(--f);color:var(--red);letter-spacing:.16em}
  .reph h2{margin:6px 0 0;font:900 19px/1.2 var(--f)}
  .repb{padding:18px 20px 20px}
  .repwho{display:flex;gap:13px;align-items:center;padding-bottom:14px;
    border-bottom:2px solid var(--rule);margin-bottom:14px}
  .repwho .ph{flex:0 0 auto;width:62px;border:2px solid var(--rule);border-radius:6px;
    overflow:hidden;line-height:0;background:#EFE9DB}
  .repwho b{display:block;font:900 17px/1.2 var(--f)}
  .repwho small{display:block;margin-top:4px;font:700 11.5px/1 var(--f);color:var(--soft)}
  .repwho .stamp2{margin-left:auto;border:3.5px solid var(--ok);color:var(--ok);
    border-radius:7px;padding:7px 13px;font:900 17px/1 var(--f);transform:rotate(-8deg);
    white-space:nowrap}
  .repl{margin:0 0 11px}
  .repl dt{font:800 9.5px/1 var(--f);color:var(--soft);letter-spacing:.1em;margin-bottom:5px}
  .repl dd{margin:0 0 11px;font:700 13.5px/1.7 var(--f)}
  .repl dd em{font-style:normal;background:#FBE9A7;padding:0 5px;border-radius:3px;font-weight:900}
  .repl .why{background:#EFF7F1;border-left:5px solid var(--ok);border-radius:8px;
    padding:11px 13px;font:800 13.5px/1.75 var(--f);color:#1E5636}
  .repsus{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--rule);
    border-radius:10px;padding:10px 12px}
  .repsus>span:first-child{flex:0 0 auto;line-height:0}
  .repsus .txt{flex:1;min-width:0}
  .repsus b{display:block;font:900 14px/1.3 var(--f)}
  .repsus small{display:block;margin-top:4px;font:700 11.5px/1.5 var(--f);color:var(--soft);
    word-break:keep-all}
  /* ── 수사 화면 ── */
  #app{height:100%;display:flex;flex-direction:column}
  .work{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper)}
  .dos{background:var(--dark);color:#F6F1E6;padding:11px 16px 13px;flex:0 0 auto;
    border-bottom:3px solid var(--red)}
  .dos .no{font:900 10.5px/1 var(--f);color:var(--red);letter-spacing:.16em;margin-bottom:9px}
  .dos .say{font:800 18px/1.5 var(--s);color:#FBF6E9;letter-spacing:-.01em;
    padding-left:13px;border-left:4px solid var(--red)}
  .dos .say em{font-style:normal;background:#FBE9A7;color:#241F16;padding:1px 7px;
    border-radius:4px;font-weight:900}
  .dos .extra{margin-top:9px;padding:8px 13px;border-radius:8px;background:#2A2620;
    font:800 15px/1.45 var(--s);color:#F0C86A;border-left:4px solid var(--gold)}
  .dos .extra em{font-style:normal;background:#F0C86A;color:#241F16;padding:1px 6px;
    border-radius:4px}
  .dos .extra span{display:block;font:900 9.5px/1 var(--f);color:#8A8474;
    letter-spacing:.14em;margin-bottom:6px}
  @media (max-width:760px){.dos .say{font-size:17px}.dos .extra{font-size:15px}}

  .dos .dnote{margin-top:9px;font:700 12.5px/1.6 var(--f);color:#C9A227}
  .mid{flex:1;min-height:0;display:flex;gap:11px;padding:10px 12px 12px;overflow:auto}
  .side{flex:0 0 212px;display:flex;flex-direction:column;gap:9px;min-width:0}
  .bwrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
  svg#board{width:100%;height:auto;max-height:100%;aspect-ratio:800/520;background:#FCFAF3;
    border:2px solid var(--rule);border-radius:10px;touch-action:none;display:block;
    max-width:min(100%,760px)}

  .card{background:#fff;border:1.8px solid var(--rule);border-radius:10px;padding:10px 11px}
  .card h5{margin:0 0 8px;font:900 12.5px/1 var(--f)}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tool{padding:9px 4px;border-radius:9px;cursor:pointer;border:2px solid var(--rule);
    background:#fff;font:800 12px/1.3 var(--f);color:var(--ink);display:flex;
    flex-direction:column;align-items:center;gap:5px}

const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const nr=(a,b,t)=>Math.abs(a-b)<=t;
function angAt(A,B,C){                        /* A 에서의 각 (도) */
  const d=(ang(A,C)-ang(A,B))*180/Math.PI;
  return Math.abs(((d+540)%360)-180);
}
function triOf(P){
  const s=[d2(P[1],P[2]),d2(P[2],P[0]),d2(P[0],P[1])];
  const a=[angAt(P[0],P[1],P[2]),angAt(P[1],P[2],P[0]),angAt(P[2],P[0],P[1])];
  return {pts:P,sides:s,angles:a};
}

   more : 추가 진술과 그때 좁혀지는 용의자 */
function triSSS(a,b,c){const x=(a*a+c*c-b*b)/(2*a);return [{x:0,y:0},{x:a,y:0},
  {x:x,y:-Math.sqrt(Math.max(0,c*c-x*x))}];}
function triSAS(a,c,deg){const t=-deg*Math.PI/180;
  return [{x:0,y:0},{x:a,y:0},{x:c*Math.cos(t),y:c*Math.sin(t)}];}
function triASA(a,d1,d2){const t1=d1*Math.PI/180,t2=d2*Math.PI/180;
  const x=a*Math.tan(t2)/(Math.tan(t1)+Math.tan(t2));
  return [{x:0,y:0},{x:a,y:0},{x:x,y:-x*Math.tan(t1)}];}
function triSSA(a,b,deg,far){const t=-deg*Math.PI/180;
  const ux=Math.cos(t),uy=Math.sin(t),px=-a,py=0;
  const B=2*(px*ux+py*uy),C=px*px+py*py-b*b;
  const D=Math.sqrt(Math.max(0,B*B-4*C));
  const s=far?(-B+D)/2:(-B-D)/2;
  return [{x:0,y:0},{x:a,y:0},{x:ux*s,y:uy*s}];}

function condOK(cond,t){
  const S=t.sides.slice().sort((a,b)=>a-b).map(x=>x/U);
  const A=t.angles.slice().sort((a,b)=>a-b);
  const LT=0.14, AT=1.6;                      /* 칸 · 도 */
  if(cond.k==="sss"){const w=cond.v.slice().sort((a,b)=>a-b);
    return w.every((v,i)=>nr(S[i],v,LT));}
  if(cond.k==="aaa"){const w=cond.v.slice().sort((a,b)=>a-b);
    return w.every((v,i)=>nr(A[i],v,AT));}
  if(cond.k==="sas"){const [a,c,dg]=cond.v;
    for(let i=0;i<3;i++)for(let j=0;j<3;j++){
      if(i===j)continue;const k=3-i-j;
      if(nr(t.sides[i]/U,a,LT)&&nr(t.sides[j]/U,c,LT)&&nr(t.angles[k],dg,AT))return true;}
    return false;}
  if(cond.k==="asa"){const [a,d1,d2]=cond.v;
    for(let i=0;i<3;i++){
      if(!nr(t.sides[i]/U,a,LT))continue;
      const p=[t.angles[(i+1)%3],t.angles[(i+2)%3]].sort((x,y)=>x-y);
      const q=[d1,d2].sort((x,y)=>x-y);
      if(nr(p[0],q[0],AT)&&nr(p[1],q[1],AT))return true;}
    return false;}
  if(cond.k==="ssa"){const [a,b,dg]=cond.v;
    for(let i=0;i<3;i++)for(let j=0;j<3;j++){
      if(i===j)continue;
      if(!nr(t.sides[i]/U,a,LT)||!nr(t.sides[j]/U,b,LT))continue;
      for(let v=0;v<3;v++)if(nr(t.angles[v],dg,AT))return true;}
    return false;}
  return false;
}

function qualOK(){
  const q=QUAL[QI], Pp=P("B");
  if(!Pp)return false;
  const mine=items.filter(o=>o.t==="S"&&!o.given);
  if(q.k==="seg"){
    const L1=P("L1"),L2=P("L2");
    for(const sg of mine){
      const a=P(sg.a),b=P(sg.b);if(!a||!b)continue;
      for(const [u,v] of [[a,b],[b,a]]){
        if(d2(u,Pp)>4)continue;
        if(distToSeg(v,L1,L2)>2.5)continue;
        if(Math.abs(d2(u,v)/U-q.cm)>0.14)continue;
        return true;
      }}
    return false;
  }
  /* 각: P 에서 나가는 두 변이 q.deg 를 이루면 된다 */
  const dirs=[];
  for(const sg of mine){
    const a=P(sg.a),b=P(sg.b);if(!a||!b)continue;
    if(d2(a,Pp)<4&&d2(b,Pp)>20)dirs.push(ang(Pp,b));
    else if(d2(b,Pp)<4&&d2(a,Pp)>20)dirs.push(ang(Pp,a));
  }
  const L1=P("L1"),L2=P("L2");
  dirs.push(ang(L1,L2),ang(L2,L1));            /* 직선 l 도 한 변이 될 수 있다 */
  for(let i=0;i<dirs.length;i++)for(let j=i+1;j<dirs.length;j++){
    const d=Math.abs(normPi(dirs[j]-dirs[i]))*180/Math.PI;
    if(Math.abs(d-q.deg)<1.6)return true;
  }
  return false;
}

  let r=RANKS[0][1];for(const [k,v] of RANKS)if(closed()>=k)r=v;

}

let GID=0;
function gSeg(l1,l2,x,y,cm,out){
  const x2=x+cm*U;
  out.push({t:"P",id:"g"+(++GID),x:x,y:y,given:true,label:l1});
  out.push({t:"P",id:"g"+(++GID),x:x2,y:y,given:true,label:l2});
  out.push({t:"S",id:"g"+(++GID),a:"g"+(GID-2),b:"g"+(GID-1),kind:"segment",given:true,
    num:cm});
}
function gAng(lo,lx,ly,x,y,deg,arm,out){
  const t=-deg*Math.PI/180;
  out.push({t:"P",id:"g"+(++GID),x:x,y:y,given:true,label:lo});
  const o="g"+GID;
  out.push({t:"P",id:"g"+(++GID),x:x+arm,y:y,given:true,label:lx});
  const a="g"+GID;
  out.push({t:"P",id:"g"+(++GID),x:x+arm*Math.cos(t),y:y+arm*Math.sin(t),given:true,label:ly});
  const b="g"+GID;
  out.push({t:"S",id:"g"+(++GID),a:o,b:a,kind:"segment",given:true,deg:deg});
  out.push({t:"S",id:"g"+(++GID),a:o,b:b,kind:"segment",given:true});
}

/* 곡선 목록 */
const curves=()=>items.filter(o=>o.t==="S"||o.t==="C");
function segEnds(s){
  const a=P(s.a),b=P(s.b);if(!a||!b)return null;
  if(s.kind==="segment")return [a,b];
  const L=d2(a,b)||1,ux=(b.x-a.x)/L,uy=(b.y-a.y)/L,E=1600;
  if(s.kind==="ray")return [a,{x:a.x+ux*E,y:a.y+uy*E}];
  return [{x:a.x-ux*E,y:a.y-uy*E},{x:a.x+ux*E,y:a.y+uy*E}];
}
const radOf=c=>c.r||0;               /* 숫자로만 두어, 점을 지워도 흔들리지 않는다 */
function arcCenter(o){                /* 중심이 사라져도 좌표로 살아남는다 */
  if(o.cid){const p=P(o.cid);if(p)return p;}
  if(o.c){const p=P(o.c);if(p)return p;}
  return (o.cx!=null)?{x:o.cx,y:o.cy}:null;
}

/* 두 곡선의 교점 */
function meet(u,v){
  const out=[];
  if(zoneOf(u)!==zoneOf(v))return out;        /* 다른 영역끼리는 만나지 않는다 */
  const lineOf=s=>{const e=segEnds(s);if(!e)return null;return e;};
  if(u.t==="S"&&v.t==="S"){
    const A=lineOf(u),B=lineOf(v);if(!A||!B)return out;
    const [p1,p2]=A,[p3,p4]=B;
    const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);
    if(Math.abs(d)<1e-9)return out;
    const t=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;
    const s=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
    if(t<-0.001||t>1.001||s<-0.001||s>1.001)return out;
    out.push({x:p1.x+t*(p2.x-p1.x),y:p1.y+t*(p2.y-p1.y)});
    return out;
  }
  if(u.t==="C"&&v.t==="C"){
    const c1=arcCenter(u),c2=arcCenter(v);if(!c1||!c2)return out;
    const r1=radOf(u),r2=radOf(v),D=d2(c1,c2);
    if(D<1e-9||D>r1+r2+0.001||D<Math.abs(r1-r2)-0.001)return out;
    const a=(r1*r1-r2*r2+D*D)/(2*D),h=Math.sqrt(Math.max(0,r1*r1-a*a));
    const mx=c1.x+a*(c2.x-c1.x)/D,my=c1.y+a*(c2.y-c1.y)/D;
    const rx=-(c2.y-c1.y)/D*h,ry=(c2.x-c1.x)/D*h;
    out.push({x:mx+rx,y:my+ry});if(h>0.001)out.push({x:mx-rx,y:my-ry});
    return out;
  }
  const S=(u.t==="S")?u:v, Cc=(u.t==="C")?u:v;
  const e=lineOf(S);const c=arcCenter(Cc);if(!e||!c)return out;
  const r=radOf(Cc),[p1,p2]=e;
  const dx=p2.x-p1.x,dy=p2.y-p1.y;
  const A=dx*dx+dy*dy,Bq=2*(dx*(p1.x-c.x)+dy*(p1.y-c.y));
  const Cq=(p1.x-c.x)**2+(p1.y-c.y)**2-r*r;
  const D=Bq*Bq-4*A*Cq;if(D<0||A<1e-9)return out;
  const sq=Math.sqrt(D);
  [(-Bq-sq)/(2*A),(-Bq+sq)/(2*A)].forEach(t=>{
    if(t<-0.001||t>1.001)return;
    out.push({x:p1.x+t*dx,y:p1.y+t*dy});
  });
  return out;
}
function onArc(o,p){
  if(o.t!=="C")return true;
  if(o.sw==null||Math.abs(o.sw)>=6.283)return true;
  const c=arcCenter(o);if(!c)return false;
  let d=ang(c,p)-o.a0;
  d=((d%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const sw=o.sw;
  return (sw>0)?(d<=sw+0.04):((Math.PI*2-d)<=(-sw)+0.04);
}
function spots(){                             /* 찍을 수 있는 교점 */
  const cv=curves(),out=[];
  for(let i=0;i<cv.length;i++)for(let j=i+1;j<cv.length;j++){
    for(const p of meet(cv[i],cv[j])){
      if(p.x<6||p.x>794||p.y<6||p.y>514)continue;
      if(!onArc(cv[i],p)||!onArc(cv[j],p))continue;
      if(zoneOfPt(p)!==zoneOf(cv[i]))continue;
      if(items.some(o=>o.t==="P"&&!o.hidden&&d2(o,p)<3))continue;
      if(out.some(o=>d2(o,p)<3))continue;
      out.push(p);
    }}
  return out;
}
const POOL="CDEFGHKMNQRSTVWXYZ".split("");
function newLabel(){
  const used=new Set(items.filter(o=>o.t==="P"&&o.label).map(o=>o.label));
  for(const k of POOL)if(!used.has(k))return k;

}
function hitPoint(p,r){
  let best=null,bd=r||16;
  for(const o of items)if(o.t==="P"&&!o.hidden){const d=d2(o,p);if(d<bd){bd=d;best=o;}}
  return best;
}
function distToSeg(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
  if(L<1e-9)return d2(p,a);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L;t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);
}
function hitCurve(p){
  for(const o of items){
    if(o.given)continue;
    if(o.t==="S"){const e=segEnds(o);if(e&&distToSeg(p,e[0],e[1])<9)return o;}
    if(o.t==="C"){const c=arcCenter(o);
      if(c&&Math.abs(d2(p,c)-radOf(o))<9&&onArc(o,p))return o;}
  }
  for(const o of items)if(o.t==="P"&&!o.given&&!o.hidden&&d2(o,p)<12)return o;
  return null;
}
function removeItem(id){
  const dead=new Set([id]);let grew=true;
  while(grew){grew=false;
    for(const o of items){
      if(dead.has(o.id))continue;
      const refs=o.t==="S"?[o.a,o.b]:[];   /* 호는 좌표로 남아 흔들리지 않는다 */
      if(refs.some(r=>r&&dead.has(r))){dead.add(o.id);grew=true;}
    }}
  items=items.filter(o=>!dead.has(o.id));
  pend=pend.filter(id2=>!dead.has(id2));
}

function foundTri(){
  const sg=items.filter(o=>o.t==="S"&&!o.given&&o.kind==="segment");
  for(let i=0;i<sg.length;i++)for(let j=i+1;j<sg.length;j++)for(let k=j+1;k<sg.length;k++){
    const ids=new Set([sg[i].a,sg[i].b,sg[j].a,sg[j].b,sg[k].a,sg[k].b]);
    if(ids.size!==3)continue;
    const pts=[...ids].map(P);
    if(pts.some(x=>!x))continue;
    const ar=Math.abs((pts[1].x-pts[0].x)*(pts[2].y-pts[0].y)
                     -(pts[2].x-pts[0].x)*(pts[1].y-pts[0].y))/2;
    if(ar<80)continue;

  }

}

function needle(){
  if(C.center){const p=P(C.center);if(p)return p;C.center=null;}
  return C.free;
}
function geom(){
  const c=needle(),r=Math.max(C.r,0);
  const leg=Math.max(135,r*0.62),al=Math.acos(Math.min(1,(r/2)/leg));
  return {c,r,leg,
    tip:{x:c.x+r*Math.cos(C.theta),y:c.y+r*Math.sin(C.theta)},
    hg:{x:c.x+leg*Math.cos(C.theta-(C.flip||1)*al),
        y:c.y+leg*Math.sin(C.theta-(C.flip||1)*al)}};
}
function foldCompass(){                        /* 판을 벗어나면 대칭으로 접는다 */
  const c=needle(),r=Math.max(C.r,0);
  const leg=Math.max(135,r*0.62),al=Math.acos(Math.min(1,(r/2)/leg));
  const fl=C.flip||1;
  const parts=(t,f)=>[{x:c.x+r*Math.cos(t),y:c.y+r*Math.sin(t)},
                      {x:c.x+leg*Math.cos(t-f*al),y:c.y+leg*Math.sin(t-f*al)}];
  const outN=(t,f)=>parts(t,f).reduce((n,p,i)=>
    n+((p.x<10||p.x>790||p.y<10||p.y>510)?(i===0?10:1):0),0);
  if(!outN(C.theta,fl))return;
  const T=C.theta;
  const opt=[{t:-T,f:-fl},{t:Math.PI-T,f:-fl}];
  for(const o of opt)if(!outN(o.t,o.f)){C.theta=o.t;C.flip=o.f;return;}
  let best={t:T,f:fl},bn=outN(T,fl);
  for(const o of opt){const q=outN(o.t,o.f);if(q<bn){bn=q;best=o;}}
  C.theta=best.t;C.flip=best.f;
}

  if(d2(c,pos)<15||distToSeg(pos,hg,c)<12)return "needle";

}

       fill="#E9A61A" opacity=".2"/>`);
     g.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${want?7:6}"
       fill="#FCFAF3" stroke="${want?"#E9A61A":"#8A8271"}" stroke-width="${want?2.4:1.6}"
       stroke-dasharray="2.6 2.4"/>`);
   }}
  for(const o of items){
    if(o.t!=="P"||o.hidden)continue;
    const on=pend.indexOf(o.id)>=0;
    const big=o.given&&o.y>400&&["P","B","Q","M"].indexOf(o.label)>=0;
    if(o.id===LAST)g.push(`<circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="10"
      fill="#E9A61A" opacity=".30"/>`);
    g.push(`<circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="${on?7:(big?6:4.6)}"
      fill="${on?"#C98A10":"#241F16"}"/>`);
    if(o.label)g.push(`<text x="${(o.x+10).toFixed(1)}" y="${(o.y+(big?22:-9)).toFixed(1)}"
      font-size="${big?19:17}" font-weight="800" fill="#241F16"
      font-family="Georgia,serif">${o.label}</text>`);
  }

  const base=g.join("");
  if(MAG)g.push(magSVG(base));
  if(TOOL==="compass")g.push(compassSVG());
  return g.join("");
}
function arcPath(c,r,a0,sw,col,w,op){
  const s=Math.max(-6.2831,Math.min(6.2831,sw));
  if(Math.abs(s)>=6.2830)
    return `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${r.toFixed(1)}"
      fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`;
  const p0={x:c.x+r*Math.cos(a0),y:c.y+r*Math.sin(a0)};
  const p1={x:c.x+r*Math.cos(a0+s),y:c.y+r*Math.sin(a0+s)};
  const big=Math.abs(s)>Math.PI?1:0, sweep=s>0?1:0;
  return `<path d="M${p0.x.toFixed(1)} ${p0.y.toFixed(1)} A${r.toFixed(1)} ${r.toFixed(1)} 0
    ${big} ${sweep} ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}" fill="none" stroke="${col}"
    stroke-width="${w}" opacity="${op}"/>`;
}
function susSVG(tri,col,W,H){
  const c={x:(tri[0].x+tri[1].x+tri[2].x)/3,y:(tri[0].y+tri[1].y+tri[2].y)/3};
  const pts=tri.map(p=>({x:p.x-c.x,y:p.y-c.y}));
  const sp=Math.max(...pts.map(p=>Math.hypot(p.x,p.y)))*2.1;
  const k=Math.min(W,H)*0.86/Math.max(1,sp);
  const q=pts.map(p=>`${(W/2+p.x*k).toFixed(1)},${(H/2+p.y*k).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
    style="display:block;width:${W}px;height:${H}px"><polygon points="${q}" fill="${col}"
    fill-opacity=".10" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
}

function wireTools(){
  $("tools").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{

      const A=c0(s.tri),B=c0(t0);

function toBoard(e){
  const r=$("board").getBoundingClientRect();
  const k=Math.min(r.width/800,r.height/520);
  const ox=(r.width-800*k)/2, oy=(r.height-520*k)/2;
  return {x:(e.clientX-r.left-ox)/k, y:(e.clientY-r.top-oy)/k};
}
function startDraw(p,e){
  if(!C.center)return toast("<b>중심쪽 다리</b>를 잡고 끌어, 침을 점 위에 올려놓으세요.");
  if(C.r<12)return toast("<b>바깥쪽 다리</b>를 잡고 끌어 컴퍼스를 벌리세요.");
  if(d2(needle(),p)<20)return toast("침에서 조금 떨어진 곳부터 돌려 주세요.");
  pushUndo();
  drag={mode:"draw",part:"hinge",a0:C.theta,prev:ang(needle(),p),acc:0,lo:0,hi:0};
  grab(e);paintBoard();paintTools();
}
function applyOpen(p0){
  const p=inBoard(p0),c=needle();
  const h=C.center?hitPoint(p):null;
  if(h&&h.id!==C.center){
    C.r=d2(c,h);C.theta=ang(c,h);C.from=[C.center,h.id];
  }else{C.r=d2(c,p);C.theta=ang(c,p);C.from=null;}
}
function grab(e){
  const b=$("board");
  try{b.setPointerCapture(e.pointerId);}catch(_){}
  b.onpointermove=onMove;
  b.onpointerup=b.onpointercancel=onUp;
}
function onMove(e){
  const p=toBoard(e);
  if(!drag){
    if(TOOL==="point"){
      const m=magFind(p);
      const same=(!!m===!!MAG)&&(!m||(Math.abs(m.cx-MAG.cx)<1&&Math.abs(m.cy-MAG.cy)<1));
      if(!same){MAG=m;paintBoard();}
      return;
    }
    if(MAG){MAG=null;paintBoard();}
    const h=compassPart(p);
    if(h!==hover){hover=h;paintBoard();}
    return;
  }
  if(drag.mode==="move"){
    const q=inBoard({x:p.x+drag.off.x,y:p.y+drag.off.y});
    const h=hitPoint(q,28);
    drag.snap=h?{x:h.x,y:h.y,id:h.id}:null;
    C.center=null;C.free=h?{x:h.x,y:h.y}:q;
    foldCompass();paintBoard();return;
  }
  if(drag.mode==="open"){
    if(!drag.started&&d2(needle(),p)<10)return;
    drag.started=true;applyOpen(p);foldCompass();paintBoard();paintTools();return;
  }
  if(drag.mode==="draw"){
    const c=needle();
    if(d2(c,p)<8)return;
    const a=ang(c,p);
    drag.acc+=normPi(a-drag.prev);drag.prev=a;
    drag.lo=Math.min(drag.lo,drag.acc);
    drag.hi=Math.max(drag.hi,drag.acc);
    if(drag.hi-drag.lo>TAU){
      if(drag.acc>=drag.hi-1e-9)drag.lo=drag.hi-TAU;else drag.hi=drag.lo+TAU;
      drag.acc=clamp(drag.acc,drag.lo,drag.hi);
    }
    C.theta=drag.a0+drag.acc;paintBoard();return;
  }
}
function onUp(){
  const b=$("board");
  if(b){b.onpointermove=null;b.onpointerup=b.onpointercancel=null;}
  const d=drag;drag=null;
  if(!d){paintBoard();return;}
  if(d.mode==="move"){
    if(d.snap){C.center=d.snap.id;
      toast(`침을 점 <b>${P(d.snap.id)&&P(d.snap.id).label||""}</b> 위에 올렸습니다. 벌림은 그대로입니다.`);}
    else toast("침이 <b>점 위</b>에 있어야 원을 그릴 수 있습니다.");
  }else if(d.mode==="open"){
    if(!d.started){if(undo.length)undo.pop();}
    else if(C.r<12)toast("좀 더 크게 벌려 주세요.");
    else if(C.from)toast(`선분만큼 <b>${(C.r/U).toFixed(2)}칸</b> 벌렸습니다.`);
  }else if(d.mode==="draw"){
    const span=Math.min(d.hi-d.lo,TAU);
    if(span<0.08){if(undo.length)undo.pop();
      toast("<b>가운데 손잡이</b>를 잡고 빙 돌리면 원이 그려집니다.");}
    else{
      const c=needle();
      const st0=(SC==="work"&&CUR!=null)?stOf(CUR):null;
      if(st0){
        if(zoneOfPt(c)==="give")st0.arcG=(st0.arcG|0)+1; else st0.arcW=(st0.arcW|0)+1;
        if(C.from)st0.copy=true;                 /* 주어진 길이를 그대로 옮겼다 */
        saveST();
      }
      const was=spots().map(p=>p.x.toFixed(0)+","+p.y.toFixed(0));
      LAST="c"+nextId;
      items.push({t:"C",id:"c"+(nextId++),cid:C.center,cx:c.x,cy:c.y,
        r:C.r,a0:norm2pi(d.a0+d.lo),sw:span});
      FRESH=spots().filter(p=>was.indexOf(p.x.toFixed(0)+","+p.y.toFixed(0))<0);
      freshT=Date.now();
      if(FRESH.length)blink();
      refresh();
    }
  }
  paintBoard();paintTools();
}
function onDown(e){
  e.preventDefault();
  const p=toBoard(e);
  if(TOOL==="ruler"){
    const h=hitPoint(p);
    if(!h)return;
    if(pend.length===0){pend=[h.id];paintBoard();return;}
    if(pend[0]===h.id){pend=[];paintBoard();return;}
    pushUndo();
    LAST="s"+nextId;
    items.push({t:"S",id:"s"+(nextId++),a:pend[0],b:h.id,kind:KIND});
    pend=[];paintBoard();refresh();return;
  }
  if(TOOL==="compass"){
    const part=compassPart(p);
    if(part==="hinge")return startDraw(p,e);   /* 가운데 손잡이 = 돌려 그리기 */
    if(part==="pencil"){                        /* 바깥쪽 다리 = 벌리기 */
      pushUndo();
      drag={mode:"open",part:"pencil",started:false};
      grab(e);paintBoard();paintTools();return;
    }
    if(part==="needle"){                        /* 중심쪽 다리 = 옮기기 */
      pushUndo();
      const c=needle();
      drag={mode:"move",part:"needle",off:{x:c.x-p.x,y:c.y-p.y},snap:null};
      grab(e);paintBoard();paintTools();return;
    }
    const h=hitPoint(p);                        /* 점을 톡 누르면 침이 옮겨감 */
    if(!h)return;
    pushUndo();
    C.center=h.id;C.free={x:h.x,y:h.y};
    if(C.r>=1)toast("침만 옮겼습니다. <b>벌림은 그대로</b>입니다.");
    paintBoard();paintTools();return;
  }
  if(TOOL==="point"){
    let put=null;
    if(MAG&&d2(p,{x:MAG.ix,y:MAG.iy})<MAGR){    /* 돋보기 안을 누르면 그 안에서 고른다 */
      let bd=1e9;
      MAG.pts.forEach(q=>{
        const X=MAG.ix+(q.x-MAG.cx)*MAGK, Y=MAG.iy+(q.y-MAG.cy)*MAGK;
        const d=d2(p,{x:X,y:Y});if(d<bd){bd=d;put=q;}
      });
    }else{                                      /* 판에서 바로 찍어도 된다 */
      let bd=22;
      for(const q of spots()){const d=d2(q,p);if(d<bd){bd=d;put=q;}}
    }
    if(!put)return;
    pushUndo();
    LAST="p"+nextId;
    items.push({t:"P",id:"p"+(nextId++),x:put.x,y:put.y,label:newLabel()});
    MAG=null;paintBoard();refresh();return;
  }
  if(TOOL==="erase"){
    const h=hitCurve(p);
    if(!h)return;
    pushUndo();removeItem(h.id);
    if(h.id===LAST)LAST=null;
    paintBoard();refresh();return;
  }
}

    NEWB=myBadges().filter(x=>b0.indexOf(x)<0);

function susInfo(t){
  const T=triOf(t.map(p=>({x:p.x*U,y:p.y*U})));
  const s=T.sides.map(x=>(x/U).toFixed(1)).sort((a,b)=>a-b);
  const a=T.angles.map(x=>Math.round(x)).sort((x,y)=>x-y);
  return `변 ${s.join(" · ")}<br>각 ${a.join("° · ")}°`;
}
function judge(w){
  const c=CASES[CUR], s=stOf(CUR);
  const set=(s.more&&c.more)?c.more:c;
  if(SPICK==null){$("vMsg").textContent="용의자를 먼저 고르세요.";return;}
  const fit=set.fit;
  if(c.imp){
    s.tries++;saveST();report();
    $("vMsg").innerHTML=`이 용의자는 진술과 맞지 않습니다. `
      +`<b>세 변으로 삼각형이 만들어지는지</b> 먼저 따져 보세요.`;
    return;
  }
  if(fit.length>1){                            /* 아직 좁혀지지 않았다 */
    s.tries++;saveST();report();
    $("vMsg").innerHTML=`이 진술만으로는 <b>범인을 특정할 수 없습니다.</b> `
      +`조건에 맞는 용의자가 <b>${fit.length}명</b>입니다. 추가 진술을 요구하세요.`;
    return;
  }
  if(fit.indexOf(SPICK)<0){
    s.tries++;saveST();report();
    $("vMsg").innerHTML=`이 용의자는 진술과 맞지 않습니다. `
      +`<b>변의 길이와 각</b>을 다시 견주어 보세요.`;
    return;
  }
  const b0=myBadges();
  s.pick=SPICK;s.done=true;s.av=Object.assign({},AV);s.at=Date.now();saveST();report();
  NEWB=myBadges().filter(x=>b0.indexOf(x)<0);
  w.remove();result();
}

    return;
  }
  if(s.more)return;
  askPanel(w,c,s);
}

  const tot=rows.length, fin=rows.filter(r=>(r.closed|0)>=CASES.length).length;
  const sumClosed=rows.reduce((n,r)=>n+(r.closed|0),0);
  const cls=CLSL;
  $("app").innerHTML=`<div class="top">
      <b class="brand">감식 상황판</b><span class="ver">${VER}</span>
      <select class="tb" id="tCls">${cls.map(c=>
        `<option value="${c}"${c===TCLS?" selected":""}>${c}</option>`).join("")}</select>
      <button class="tb" id="tRef">새로 고침</button>
      <button class="tb" id="tCsv">표 내려받기</button>
      <span class="sp"></span>
      <button class="tb red" id="tOut">학생 화면</button>
      <span class="net" id="net">연결 확인 중</span>
    </div>
    <div class="tw"><div class="twin">
      <div class="sum">
        <div class="sm"><b>등록한 감식관</b><i>${tot}<small> 명</small></i></div>
        <div class="sm"><b>검거한 사건</b><i>${sumClosed}<small> 건</small></i></div>
        <div class="sm"><b>다섯 건 모두</b><i>${fin}<small> 명</small></i></div>
        ${rows.filter(r=>r.help).length?`<div class="sm"
          style="border-color:#D9B4AD;background:#FBF4F2"><b style="color:#8E2A22">도움 표시</b>
          <i style="color:#8E2A22">${rows.filter(r=>r.help).length}<small> 명</small></i></div>`:""}
      </div>
      ${rows.length?tTable(rows)
        +`<p class="thint"><b>줄을 누르면</b> 그 학생의 수사 보고서를 볼 수 있습니다 ·
          <b>⚑</b> 도움 표시 · <b>⇄</b> 반 옮기기 ·
          사건 칸은 위가 <b>1~5</b>, 아래가 <b>심화 6~7</b></p>`
        :`<p class="none">아직 등록한 학생이 없습니다.<br>
        학생이 신원을 등록하면 여기에 나타납니다.</p>`}
    </div></div>`;
  $("tCls").onchange=()=>{TCLS=$("tCls").value;LS.set("tcls",TCLS);tPull();};
  document.querySelectorAll("[data-n]").forEach(el=>{
    el.onfocus=()=>{NOTING=true;};
    el.onblur=()=>{NOTING=false;saveNote(el.dataset.n,{note:el.value.trim()});};
    el.onkeydown=e=>{if(e.key==="Enter")el.blur();};
  });
  document.querySelectorAll("[data-mv]").forEach(b=>{
    b.onclick=()=>moveOne(b.dataset.mv);
  });
  const tb=document.querySelector(".tw table");
  if(tb){
    tb.addEventListener("click",e=>{
      if(e.target.closest("input,button,select,textarea"))return;  /* 메모·단추는 그대로 */
      const tr=e.target.closest("[data-row]");
      if(tr)detailOf(tr.dataset.row);
    });
    tb.addEventListener("keydown",e=>{
      if(e.key!=="Enter"&&e.key!==" ")return;
      const tr=e.target.closest&&e.target.closest("[data-row]");
      if(tr){e.preventDefault();detailOf(tr.dataset.row);}
    });
  }
  document.querySelectorAll("[data-h]").forEach(b=>{
    b.onclick=()=>{
      const sid=b.dataset.h, on=!b.classList.contains("on");
      b.classList.toggle("on",on);
      b.closest("tr").classList.toggle("needhelp",on);
      if(TD[sid])TD[sid].help=on;
      saveNote(sid,{help:on});
    };
  });
  $("tRef").onclick=()=>tPull(1);
  $("tCsv").onclick=()=>tCsv(rows);
  $("tOut").onclick=()=>{SC=me?"list":"reg";draw();};
  setNet(NETOK);
}
function tTable(rows){
  const COLW=[70,116,96,54,92,64,320,46,180,64];
  let h=`<div class="tscroll"><table class="tt">
    <colgroup>${COLW.map(x=>`<col style="width:${x}px">`).join("")}</colgroup>
    <tr><th>학번</th><th>코드네임</th><th>계급</th>
    <th class="c">자격</th><th class="c">사건별 상태</th><th class="c">배지</th>
    <th class="c">작도한 몽타주</th><th class="c">옮기기</th>
    <th>선생님 메모</th><th>마지막</th></tr>`;
  for(const r of rows){
    const cs=(r.cases||[]);
    const bg=(r.badges&&r.badges.length)?r.badges:badgesFrom(r);
    h+=`<tr class="row${r.help?" needhelp":""}" data-row="${esc(r.sid)}"
      tabindex="0" title="누르면 상세보기">
      <td class="nw"><b>${esc(r.sid)}</b></td>
      <td class="nw nick">${esc(r.nick||"")}</td>
      <td class="nw"><b class="rk">${esc(r.rank||"")}</b>
        <small>${r.closed|0} / ${CASES.length}</small></td>
      <td class="c"><div class="cs">${[0,1].map(k=>
        `<i class="${(r.qual|0)>k?"ok":""}">${k+1}</i>`).join("")}</div></td>
      <td class="c"><div class="cs2">
        <div class="cs">${CASES.slice(0,BASE).map((c,i)=>{
          const s=cs[i]||{};
          const k=s.done?"ok":(s.tries?"try":"");
          return `<i class="${k}" title="${esc(c.label)}">${i+1}</i>`;}).join("")}</div>
        <div class="cs adv">${CASES.map((c,i)=>({c,i})).filter(x=>x.i>=BASE).map(({c,i})=>{
          const s=cs[i]||{};
          const k=s.done?"ok":(s.tries?"try":"");
          return `<i class="${k}" title="${esc(c.label)}">${i+1}</i>`;}).join("")}</div>
      </div></td>
      <td class="c bdgn">${bg.length
        ?`<b>${bg.length}</b><small>/ ${BADGES.length}</small>`:"—"}</td>
      <td class="c"><div class="thumbs">${CASES.map((c,i)=>{const s=cs[i]||{};
        if(!s.tri)return "";
        return `<span class="thumb" title="${esc(c.label)}">${
          susSVG(s.tri,r.color||"#1F3F94",44,32)}</span>`;}).join("")||"—"}</div></td>
      <td class="c"><button class="mv" data-mv="${esc(r.sid)}"
        title="다른 반으로 옮기기">⇄</button></td>
      <td class="memo">
        <button class="flag${r.help?" on":""}" data-h="${esc(r.sid)}"
          title="작도 절차 도움이 필요한 학생">⚑</button>
        <input class="note" data-n="${esc(r.sid)}" value="${esc(r.note||"")}"
          placeholder="메모 (예: 컴퍼스 옮기기 도움)">
      </td>
      <td class="nw">${r.at?new Date(r.at).toLocaleTimeString("ko-KR",
        {hour:"2-digit",minute:"2-digit"}):"—"}</td>
    </tr>`;
  }
  return h+`</table></div>`;
}
function tCsv(rows){
  const head=["학번","코드네임","계급","검거","사건별 종결","고른 용의자","특정 실패 횟수",
    "배지 수","배지 목록","도움 표시","선생님 메모"];
  const body=rows.map(r=>{const cs=r.cases||[];
    return [r.sid,r.nick,r.rank,r.closed,
      cs.map((s,i)=>s.done?(i+1):"").filter(Boolean).join(" "),
      cs.map((s,i)=>(s.pick!=null&&s.pick>=0)?`${i+1}->${s.pick+1}`:"").filter(Boolean).join(" "),
      cs.map(s=>s.tries|0).join(" "),
      ((r.badges&&r.badges.length)?r.badges:badgesFrom(r)).length,
      ((r.badges&&r.badges.length)?r.badges:badgesFrom(r))
        .map(id=>(badgeOf(id)||{}).n||id).join(" "),
      r.help?"O":"",r.note||""];});
  const csv=[head].concat(body).map(x=>x.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`)
    .join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));
  a.download=`감식상황판_${TCLS}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

/* 선택 창 밖을 누르면 닫는다 */
document.addEventListener("pointerdown",e=>{
  const k=$("kinds");if(!k)return;
  if(e.target.closest(".rwrap")||e.target.closest("#kinds"))return;
  k.classList.remove("open");
},true);
window.addEventListener("resize",()=>popOpen(false));
window.addEventListener("scroll",()=>popOpen(false),true);

if(qp.get("teacher")===TKEY){SC="teach";draw();tPull();setInterval(tPull,6000);}
else if(!me){SC="reg";draw();netProbe();}
else if(!quDone()){SC="cert";draw();report();}
else if(!AV.issued){SC="idcard";draw();report();}
else{SC="list";draw();report();}
