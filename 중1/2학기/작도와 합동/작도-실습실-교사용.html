<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작도 실습실 · 교사용</title>
<style>
  :root{
    --paper:#FCFAF3; --paper-2:#E4DCC6; --card:#FFFCF6; --rule:#DCD3BE;
    --ink:#1C1A16; --ink-soft:#6A6355;
    --red:#C0342A; --blue:#1F3F94; --gold:#C98A10; --green:#2A7148;
    --sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);background:var(--paper-2);color:var(--ink);overscroll-behavior:none}
  .app{height:100dvh;display:flex;flex-direction:column}

  .head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:10px 16px;flex:0 0 auto;
    background:var(--card);border-bottom:1px solid var(--rule)}
  .head strong{font:800 15px/1 var(--sans)}
  .head label{font:700 12px/1 var(--sans);color:var(--ink-soft)}
  select,input{font:600 13px/1 var(--sans);padding:9px 10px;border-radius:8px;
    border:1.5px solid var(--rule);background:#FCFAF3;color:var(--ink);margin-left:6px}
  .views{display:flex;gap:5px}
  .views button{font:700 12.5px/1 var(--sans);padding:11px 15px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--rule);background:#F4EFE3;color:var(--ink-soft)}
  .views button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .spacer{flex:1}
  .net{font:700 11px/1 var(--sans);padding:7px 10px;border-radius:999px;
    background:#EDE6D5;color:var(--ink-soft);border:1.5px solid var(--rule)}
  .net.on{background:#E4F1E8;color:#1F5C39;border-color:#B6D9C4}
  .net.off{background:#F8E3E1;color:#8E2A22;border-color:#E3B6B1}

  .sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 16px;flex:0 0 auto;
    background:#F4EFE3;border-bottom:1px solid var(--rule)}
  .btn{font:700 12px/1 var(--sans);padding:10px 12px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--rule);background:#F6F1E6;color:var(--ink)}
  .btn:hover{border-color:#B9AE94}
  .btn.danger{color:var(--red)}
  .btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#231B06}
  .modes{display:flex;gap:5px}
  .modes button{font:700 12.5px/1 var(--sans);padding:10px 14px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft)}
  .modes button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gt{font:700 12.5px/1 var(--sans);padding:10px 13px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--rule);background:#fff;color:var(--ink);display:flex;align-items:center;gap:7px}
  .gt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gt em{font-style:normal;font-weight:800;opacity:.6}
  .gt i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .gt.cls{border-style:dashed}
  .pill{font:700 12.5px/1 var(--sans);color:#8A6A0E;background:#F8EFD8;border-radius:999px;padding:8px 12px}

  .body{flex:1;min-height:0;padding:12px 16px;overflow:auto}
  .bwrap{position:relative;width:100%;height:100%;overflow:auto;padding:10px 12px}
  .bnone{margin:36px 0;text-align:center;font:800 15px/1 var(--sans);color:#8A8271}
  .bnone.s{margin:14px 0;font-size:12px}
  .bgrid{display:flex;flex-wrap:wrap;gap:12px}
  .bcount{margin:14px 0 0;text-align:center;font:800 16px/1 var(--sans);color:#6A6355}
  .bc{position:relative;width:150px;height:112px;border:2px solid var(--rule);
    border-radius:11px;background:#fff;flex:0 0 auto;
    transition:transform .78s cubic-bezier(.22,.85,.3,1),border-color .4s}
  .bc svg{width:100%;height:100%;display:block}
  .bc .bk{position:absolute;inset:10px;border-radius:7px;background:#E9E1CC;
    border:1.5px solid #C9BFA4}
  .bc.back{background:#F4EFE3}
  .bc .nm{position:absolute;left:0;right:0;bottom:4px;text-align:center;
    font:800 10.5px/1 var(--sans);color:#8A8271}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .garea{border:2px solid var(--rule);border-radius:12px;padding:9px 11px 11px;background:#FCFAF3}
  .garea.on{border-color:var(--gold);background:#FFFCF4}
  .garea h4{margin:0 0 8px;font:800 13px/1 var(--sans);display:flex;align-items:center;gap:7px}
  .garea h4 em{font-style:normal;font:700 11px/1 var(--sans);color:var(--ink-soft)}
  .garea h4 .gm{margin-left:auto;font:800 11.5px/1 var(--sans);padding:7px 11px;
    border-radius:8px;border:1.5px solid var(--rule);background:#fff;cursor:pointer;color:var(--ink)}
  .garea.on h4 .gm{background:var(--gold);border-color:var(--gold);color:#231B06}
  .gslots{position:relative;display:flex;flex-wrap:wrap;gap:10px;min-height:118px}
  .cbar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:14px;padding:10px 4px;background:var(--paper)}
  .cbar .sp{flex:1}
  .cl{display:flex;align-items:center;gap:6px;font:800 12.5px/1 var(--sans)}
  .cl b{width:12px;height:12px;border-radius:99px;display:inline-block}
  .cl em{font-style:normal;font:700 11px/1 var(--sans);color:var(--ink-soft)}
  @media (prefers-reduced-motion:reduce){.bc{transition:none}}
  .pane{display:none;height:100%}
  .pane.on{display:block}

  .__bsvg{width:100%;height:100%;display:block;background:var(--paper);border:1px solid #D3C9B2;
    border-radius:6px;box-shadow:0 3px 16px rgba(28,26,22,.11);touch-action:none;
    -webkit-user-select:none;user-select:none}

  table.grid{border-collapse:collapse;width:100%;background:#fff;border-radius:8px;overflow:hidden}
  table.grid th{background:#F4EFE3;font:800 12px/1.3 var(--sans);text-align:left;padding:10px 11px;
    border:1px solid var(--rule);position:sticky;top:0;z-index:2}
  table.grid td{font:600 12.5px/1.4 var(--sans);padding:9px 11px;border:1px solid var(--rule);
    vertical-align:middle}
  .dots{display:flex;gap:5px}
  .dots i{width:19px;height:19px;border-radius:5px;background:#E7E0CD;display:grid;place-items:center;
    font:800 10px/1 var(--sans);color:#8A8271}
  .dots i.ok{background:var(--green);color:#fff}
  tr.stuck td{background:#FDF3F1}
  tr.done td{background:#F1F7F3}
  .tag{font:800 10.5px/1 var(--sans);border-radius:999px;padding:5px 8px;white-space:nowrap}
  .tag.g{background:#E4F1E8;color:#1F5C39}
  .tag.r{background:#F8E3E1;color:#8E2A22}
  .tag.y{background:#F8EFD8;color:#8A6A0E}
  .tag.n{background:#EDE6D5;color:#6A6355}
  .muted{color:var(--ink-soft);font-weight:600}

  .cols{display:grid;grid-template-columns:250px 1fr;gap:14px;height:100%}
  .who-list{background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:auto;padding:6px}
  .who-list button{display:block;width:100%;text-align:left;font:700 12.5px/1.3 var(--sans);
    padding:10px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--ink)}
  .who-list button.on{background:var(--ink);color:#fff}
  .who-list button small{display:block;font-weight:600;opacity:.6;margin-top:3px}
  .trace{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:14px 18px;overflow:auto}
  .trace h3{margin:0 0 10px;font:800 15px/1 var(--sans)}
  .trace ol{margin:0;padding-left:20px}
  .trace li{font:500 13px/1.75 var(--sans);color:#2E2A22}
  .trace p{font:500 13.5px/1.7 var(--sans);color:#2E2A22;margin:0 0 13px;
    padding-bottom:11px;border-bottom:1px solid #EFEADD}
  .trace p b{font:800 12px/1 var(--sans);color:var(--ink-soft);letter-spacing:.03em}

  .locks{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:16px 18px;max-width:760px}
  .locks h3{margin:0 0 4px;font:800 15px/1 var(--sans)}
  .pre{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;
    margin:12px 0 16px}
  .pre .btn{text-align:left;padding:12px 14px;line-height:1.5}
  .pre .btn b{display:block;font:800 13px/1 var(--sans);margin-bottom:5px}
  .pre .btn em{font-style:normal;font:600 11px/1.5 var(--sans);color:var(--ink-soft)}
  .pre .btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#3A2A02}
  .pre .btn[aria-pressed="true"] em{color:#6A5210}
  .locks p{margin:0 0 14px;font:600 12.5px/1.6 var(--sans);color:var(--ink-soft)}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%}
  .gside,.gpick{overflow:auto;padding-right:4px}
  .gpick{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
  .gpick h3{margin:0 0 8px;font:800 14px/1 var(--sans)}
  .gc{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .gc.unit{border-color:var(--ink);border-width:2px;background:#FCFAF3}
  .gc.posted{border-color:#7FB496;background:#F4FAF6}
  .gc h4{margin:0 0 8px;font:800 13px/1 var(--sans);display:flex;align-items:center;gap:8px}
  .gc h4 em{font-style:normal;font-size:10.5px;font-weight:800;color:#1F5C39;
    background:#DDEEE4;border-radius:999px;padding:4px 8px}
  .gfr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .gfr i{font-style:normal;font-weight:800;font-size:12.5px;white-space:nowrap}
  .gfr input{flex:1;min-width:0;margin:0;font:600 13px/1 var(--sans)}
  .gfr span{font-weight:800}
  .grow{display:flex;gap:6px}
  .btn.s{font-size:11.5px;padding:8px 10px}
  .btn.s em{font-style:normal;font-weight:800;opacity:.55;margin-left:4px}
  .sent{display:block;width:100%;text-align:left;background:#FCFAF3;border:1.5px solid var(--rule);
    border-radius:9px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
  .sent:hover{border-color:var(--gold)}
  .sent b{display:block;font:600 13px/1.5 var(--sans)}
  .sent small{color:var(--ink-soft);font-weight:600}
  .sfg{display:grid;gap:9px;margin-top:10px}
  .sfc{border:1.5px solid var(--rule);border-radius:9px;padding:9px 11px;background:#fff}
  .sfc.a{border-left:5px solid #2A7148}
  .sfc.b{border-left:5px solid #C98A10}
  .sfc.c{border-left:5px solid #1F3F94}
  .sfc h5{margin:0 0 6px;font:800 12.5px/1 var(--sans);display:flex;align-items:center;gap:7px}
  .sfc h5 em{font-style:normal;font:700 11px/1 var(--sans);color:var(--ink-soft)}
  .sfc ul{margin:0;padding:0;list-style:none;max-height:210px;overflow:auto}
  .sfc li{padding:6px 0;border-bottom:1px solid #F0EADC;font:700 12.5px/1.6 var(--sans)}
  .sfc li small{display:block;font:700 10.5px/1 var(--sans);color:#B4AC9A;margin-top:3px}
  .sfc li.none{color:#B4AC9A;font-weight:700}
  .hypc{background:#FBF6EA;border:1px solid #E6D9B8;border-radius:8px;padding:9px 12px;
    margin-bottom:7px;font:600 12.5px/1.6 var(--sans)}
  .hypc b{margin-right:8px}
  .bigwrap{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}
  .bigline{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--rule);
    border-radius:12px;padding:18px 22px}
  .bigline.unit{border-color:var(--ink);background:#FFF8E6}
  .bigline span{flex:0 0 auto;font:800 15px/1 var(--sans);color:var(--ink-soft);
    background:#F4EFE3;border-radius:999px;padding:9px 13px}
  .bigline b{font:800 26px/1.4 var(--sans);letter-spacing:-.4px}
  table.chart th{text-align:center;font-size:15px;padding:13px 11px}
  table.chart td{padding:11px 10px}
  table.chart .hin{width:100%;border:0;background:#F4EFE3;font:800 13px/1.4 var(--sans);
    color:var(--ink);border-radius:5px;padding:3px 5px}
  table.chart input{width:100%;border:0;background:none;font:700 15.5px/1.5 var(--sans);
    text-align:center;padding:4px 2px;margin:0;border-radius:4px;color:var(--ink)}
  table.chart input::placeholder{font-weight:600;color:#B4AC9A}
  table.chart input:focus{background:#FFF8E6;outline:2px solid var(--gold)}
  table.chart.big td,table.chart.big th{font-size:24px;padding:20px 14px}
  table.chart.big input{font-size:24px}
  .lk{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #EFEADD}
  .lk{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #EFEADD}
  .lk:last-child{border-bottom:0}
  .lk input{width:19px;height:19px;margin:0}
  .lk b{font:800 13px/1 var(--sans);min-width:150px}
  .lk span{font:600 12px/1 var(--sans);color:var(--ink-soft)}
  .hint{margin-top:14px;background:#FFF8E6;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;
    padding:11px 14px;font:600 12.5px/1.7 var(--sans)}
  /* 신호등 자기평가 */
  .lbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#EDE6D5;
    margin:11px 0 9px}
  .lbar i{display:block;height:100%}
  .lkey{display:flex;gap:14px;flex-wrap:wrap;font:700 11.5px/1 var(--sans);color:var(--ink-soft)}
  .lkey i{display:inline-block;width:10px;height:10px;border-radius:99px;margin-right:5px;
    vertical-align:-1px}
  .lkey b{color:var(--ink)}
  /* 조건 전달 실험 */
  .xwrap{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
  @media (max-width:1100px){.xwrap{grid-template-columns:1fr}}
  .xbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .xtag{background:#fff;border:2px solid var(--rule);border-radius:999px;padding:10px 16px;
    font:800 clamp(13px,1.35vw,18px)/1 var(--sans)}
  .xtag b{color:var(--ink-soft);margin-right:9px;font-size:.82em}
  .xtag em{font-style:normal;color:#B4AC9A;font-weight:700}
  .xtag.g{background:#F1F8F4;border-color:#8BC5A6;color:#1F5C39}
  .xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:13px}
  .xc{background:#fff;border:3px solid var(--rule);border-radius:16px;padding:10px 11px 11px;
    position:relative}
  .xc.o{border-color:#3E9B72;background:#EEF8F2}
  .xc.x{border-color:#D6564A;background:#FDF1EF}
  .xc .bg{position:absolute;right:10px;top:7px;font:900 22px/1 var(--sans)}
  .xc.o .bg{color:#3E9B72}
  .xc.x .bg{color:#D6564A}
  .xc .nm{display:block;font:800 clamp(13px,1.35vw,17px)/1 var(--sans);margin-bottom:7px}
  .xc.o .nm{color:#1F5C39}
  .xc.x .nm{color:#8E2A22}
  .xc svg{width:100%;height:clamp(96px,10vw,138px);display:block}
  .xb{display:flex;gap:5px;align-items:center;margin-top:8px}
  .xb button{flex:1;font:800 12px/1 var(--sans);padding:9px 4px;border-radius:9px;cursor:pointer;
    border:1.5px solid var(--rule);background:#fff;color:var(--ink-soft)}
  .xb button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .xb em{font:700 10.5px/1 var(--sans);font-style:normal;color:#C0B8A6}
  .xright{position:sticky;top:0}
  .xans{background:#fff;border:3px dashed var(--rule);border-radius:20px;padding:16px 18px;
    text-align:center}
  .xans.on{border-style:solid;border-color:var(--red);box-shadow:0 8px 26px rgba(192,52,42,.14)}
  .xans h3{margin:0 0 10px;font:900 14px/1 var(--sans);color:var(--ink-soft)}
  .xans.on h3{color:var(--red)}
  .xans svg{width:100%;height:250px;display:block}
  .xans dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;text-align:left}
  .xans dt{font:800 12px/1.6 var(--sans);color:var(--ink-soft)}
  .xans dd{margin:0;font:800 14px/1.6 var(--sans)}
  .xans .xq{margin:14px 0 0;font:800 13px/1.7 var(--sans);color:var(--ink);
    background:#FFF8E6;border-radius:10px;padding:11px 13px}
  .xhold p{margin:10px 0 0;font:800 13.5px/1.6 var(--sans);color:var(--ink-soft)}
  .xhold em{display:block;font-style:normal;font-weight:600;font-size:12px;margin-top:7px;
    color:#A79F8D;line-height:1.7}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <strong>작도 실습실 · 교사용</strong>
    <label>반<select id="cls">
      <option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option></select></label>
    <label>과제<select id="task"></select></label>
    <div class="views">
      <button data-view="prog" aria-pressed="true">진행</button>
      <button data-view="board" aria-pressed="false">모둠 판</button>
      <button data-view="chart" aria-pressed="false">차트</button>
      <button data-view="relay" aria-pressed="false">조건 전달</button>
      <button data-view="lock" aria-pressed="false">개방</button>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="count">—</span>
    <span class="net" id="net">연결 확인 중</span>
  </div>

  <div class="sub" id="sub"></div>

  <div class="body">
    <div class="pane on" id="paneProg"></div>
    <div class="pane" id="paneBoard">
      <div class="bwrap" id="bwrap" aria-label="게시판"></div>
    </div>
    <div class="pane" id="paneGen"></div>
    <div class="pane" id="paneChart"></div>
    <div class="pane" id="paneRelay"></div>
    <div class="pane" id="paneLock"></div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);

/* ================= 통신 ================= */
const DB_URL="https://jak-do-default-rtdb.asia-southeast1.firebasedatabase.app";
const dbGet=async p=>{const r=await fetch(`${DB_URL}/${p}.json`);
  if(!r.ok)throw new Error(r.status);return r.json();};
const dbPut=async(p,v)=>{const r=await fetch(`${DB_URL}/${p}.json`,{method:"PUT",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
  if(!r.ok)throw new Error(r.status);return r.json();};
const dbDel=async p=>{const r=await fetch(`${DB_URL}/${p}.json`,{method:"DELETE"});
  if(!r.ok)throw new Error(r.status);};
let ONLINE=null;
function setNet(ok){if(ONLINE===ok)return;ONLINE=ok;
  $("net").className="net "+(ok?"on":"off");$("net").textContent=ok?"연결됨":"연결 안 됨";}

/* ================= 상태 ================= */
/* 조사 2·3은 목록에 하나로 두고, 아래 줄에서 갈래를 고른다 */
const GRP={
  g2:{n:"조사 2 · 삼각형 작도", of:["t5","t6","t7"],
      k:["가 · 세 변","나 · 두 변과 사이 각","다 · 한 변과 양 끝 각"]},
  g3:{n:"조사 3 · 하나로 정해질까", of:["t8","t9","t11"],
      k:["① 두 변과 한 각","② 세 각만","③ 한 변과 양 끝이 아닌 두 각"]}
};
const grpOfTask=id=>Object.keys(GRP).find(g=>GRP[g].of.indexOf(id)>=0)||null;
const TASKS=[
  {id:"seg",n:"훈련 1 · 길이를 그대로 옮기기",board:false},
  {id:"ang",n:"훈련 2 · 각을 그대로 옮기기",board:false},
  {id:"par",n:"훈련 3 · 나란한 선 긋기",board:false},
  {id:"pg", n:"훈련장",board:false},
  {id:"t4", n:"조사 1 · 조건 두 개로",board:false,lock:false},
  {id:"t5", n:"조사 2 · 가 · 세 변",board:true,lock:false},
  {id:"t6", n:"조사 2 · 나 · 두 변과 사이 각",board:true,lock:false},

/* ================= 도형 ================= */
const D2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const cen=t=>({x:(t[0].x+t[1].x+t[2].x)/3,y:(t[0].y+t[1].y+t[2].y)/3});
const sides3=t=>[D2(t[0],t[1]),D2(t[1],t[2]),D2(t[2],t[0])];
const sortN=a=>a.slice().sort((x,y)=>x-y);
const cmp3=(a,b)=>{for(let i=0;i<3;i++)if(Math.abs(a[i]-b[i])>0.06)return a[i]-b[i];return 0;};
function canonOrder(t){
  const P=[[0,1,2],[1,2,0],[2,0,1],[0,2,1],[2,1,0],[1,0,2]];
  let best=null,bs=null;
  for(const p of P){const Q=p.map(i=>t[i]),s=[D2(Q[0],Q[1]),D2(Q[1],Q[2]),D2(Q[2],Q[0])];
    if(!bs||cmp3(s,bs)<0){bs=s;best=Q;}}
  return best;
}
function alignT(t,anchor){                      /* 크기는 그대로, 자리와 방향만 맞춘다 */
  const P=canonOrder(t),th=Math.atan2(P[1].y-P[0].y,P[1].x-P[0].x);
  const c=Math.cos(-th),s=Math.sin(-th);
  let Q=P.map(p=>{const dx=p.x-P[0].x,dy=p.y-P[0].y;return{x:dx*c-dy*s,y:dx*s+dy*c};});
  if(Q[2].y>0)Q=Q.map(p=>({x:p.x,y:-p.y}));
  return Q.map(p=>({x:p.x+anchor.x,y:p.y+anchor.y}));
}
function clusters(list){
  const cs=[];
  for(const s of list){const sd=sortN(sides3(s.tri));
    const hit=cs.find(c=>c.sd.every((v,i)=>Math.abs(v-sd[i])<3.5));
    if(hit)hit.items.push(s);else cs.push({sd,items:[s]});}
  return cs;
}
const xform=(t,tf,k,about)=>{
  const a=about||cen(t),r=(tf&&tf.rot)||0,c=Math.cos(r),s=Math.sin(r);
  return t.map(p=>{const dx=(p.x-a.x)*k,dy=(p.y-a.y)*k;
    return{x:a.x+dx*c-dy*s+((tf&&tf.dx)||0),y:a.y+dx*s+dy*c+((tf&&tf.dy)||0)};});
};
const CCOL=["#1F3F94","#C0342A","#2A7148","#C98A10","#6A4CA8","#8A6A0E"];
const hash32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const rnd1=s=>{let a=hash32(s)>>>0;a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),1|a);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};

/* 카드 하나를 원래 방향 그대로, 무게중심을 가운데 두고 그린다 */
function cardSVG(tri,col,k){
  const c=cen(tri);
  const p=tri.map(q=>({x:(q.x-c.x)*k+CW/2,y:(q.y-c.y)*k+CH/2}));
  return `<svg viewBox="0 0 ${CW} ${CH}"><polygon points="${
    p.map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(" ")}"
    fill="${col}14" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
}
/* 그 삼각형을 표준 방향으로 돌리는 값 */
function alignParams(tri){
  const P=canonOrder(tri);
  const th=Math.atan2(P[1].y-P[0].y,P[1].x-P[0].x);
  const c=Math.cos(-th),s=Math.sin(-th);
  const dx=P[2].x-P[0].x,dy=P[2].y-P[0].y;
  const qy=dx*s+dy*c;
  return {rot:-th*180/Math.PI, flip:qy>0};
}
const tfStr=a=>a?`${a.flip?"scaleY(-1) ":""}rotate(${a.rot.toFixed(1)}deg)`:"";

let BSIG="";
function paintBoard(force){
  const list=shown(),n=list.length,wrap=$("bwrap");

    </div>`;

    return;
  }

  wrap.innerHTML=`<div class="bgrid">${list.map(s=>card(s)).join("")}</div>
    ${face?`<p class="bcount">${n}명 접수</p>`:""}`;

/* 한 모둠 카드를 가운데로 모으거나 제자리로 */
function mergeGroup(g,on){
  const area=$("bwrap").querySelector(`[data-ga="${g}"]`);
  if(!area)return;
  const slots=area.querySelector(".gslots");
  const cards=[...slots.querySelectorAll(".bc")];
  if(!cards.length)return;
  if(!on){cards.forEach(c=>{c.style.transform="";c.style.zIndex="";});return;}
  const box=slots.getBoundingClientRect();
  const cx=box.left+box.width/2, cy=box.top+box.height/2;
  cards.forEach((c,i)=>{
    const r=c.getBoundingClientRect();
    const s=shown().find(x=>String(x.no)===c.dataset.no);
    const a=s?alignParams(s.tri):null;
    c.style.transitionDelay=(i*0.07).toFixed(2)+"s";
    c.style.zIndex=String(10+i);
    c.style.transform=`translate(${(cx-(r.left+r.width/2)).toFixed(1)}px,${
      (cy-(r.top+r.height/2)).toFixed(1)}px) ${tfStr(a)}`;
  });
}

      <button class="btn" id="clBack">돌려놓기</button></div>`;
  const go=()=>{
    const W=wrap.getBoundingClientRect();

    el.style.transform="";el.style.zIndex="";el.style.borderColor="";});

const xFit=(t,w,h,pad)=>{
  const xs=t.map(p=>p.x||p[0]),ys=t.map(p=>p.y||p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.min((w-pad*2)/Math.max(1,x1-x0),(h-pad*2)/Math.max(1,y1-y0));
  return t.map(p=>({x:((p.x||p[0])-(x0+x1)/2)*k+w/2,y:((p.y||p[1])-(y0+y1)/2)*k+h/2}));
};
const xPoly=(t,col,fill,sw)=>`<polygon points="${t.map(p=>
  `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}" fill="${fill||"none"}" stroke="${col}"
  stroke-width="${sw||2.6}" stroke-linejoin="round"/>`;
function xSame(a,b){
  const s=t=>[D2(t[0],t[1]),D2(t[1],t[2]),D2(t[2],t[0])].sort((x,y)=>x-y);
  const p=s(a),q=s(b),k=q[2]/Math.max(1,p[2]);
  return p.every((v,i)=>Math.abs(v*k-q[i])<Math.max(4,q[2]*0.03));
}
function ansSVG(A,W,H,sc){
  sc=sc||1;
  const P=xFit(A.v.map(p=>({x:p[0],y:p[1]})),W,H,46*sc);
  const N=["A","B","C"];
  const cx=(P[0].x+P[1].x+P[2].x)/3, cy=(P[0].y+P[1].y+P[2].y)/3;
  const S=A.sides||{}, G=A.angles||{};
  let g=`<polygon points="${P.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}"
    fill="#C0342A10" stroke="#C0342A" stroke-width="${(4*sc).toFixed(1)}"
    stroke-linejoin="round"/>`;
  /* 각 — 호와 크기 */
  for(let i=0;i<3;i++){
    const v=P[i],u=P[(i+2)%3],w=P[(i+1)%3];
    const a1=Math.atan2(u.y-v.y,u.x-v.x),a2=Math.atan2(w.y-v.y,w.x-v.x);
    let dd=a2-a1;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;
    const r=26*sc, Q=t2=>`${(v.x+r*Math.cos(t2)).toFixed(1)},${(v.y+r*Math.sin(t2)).toFixed(1)}`;
    g+=`<path d="M${Q(a1)} A ${r} ${r} 0 0 ${dd>0?1:0} ${Q(a2)}" fill="none"
      stroke="#C0342A" stroke-width="${(2.2*sc).toFixed(1)}" opacity=".7"/>`;
    const tm=a1+dd/2,rr=r+17*sc, val=G[N[i]];
    if(val!=null)g+=`<text x="${(v.x+rr*Math.cos(tm)).toFixed(1)}"
      y="${(v.y+rr*Math.sin(tm)+4*sc).toFixed(1)}" text-anchor="middle"
      font-size="${(13*sc).toFixed(1)}" font-weight="800" fill="#8E2A22"
      font-family="var(--sans)">${val}°</text>`;
  }
  /* 변 — 길이 */
  [[0,1,"AB"],[1,2,"BC"],[2,0,"CA"]].forEach(([i,j,k])=>{
    const val=S[k];if(val==null)return;
    const mx=(P[i].x+P[j].x)/2,my=(P[i].y+P[j].y)/2;
    let dx=mx-cx,dy=my-cy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    g+=`<text x="${(mx+dx*17*sc).toFixed(1)}" y="${(my+dy*17*sc+5*sc).toFixed(1)}"
      text-anchor="middle" font-size="${(16*sc).toFixed(1)}" font-weight="800"
      fill="#1C1A16" font-family="var(--sans)">${val}</text>`;
  });
  /* 꼭짓점 */
  P.forEach((p,i)=>{
    let dx=p.x-cx,dy=p.y-cy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    g+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(4.5*sc).toFixed(1)}"
      fill="#C0342A"/>
      <text x="${(p.x+dx*20*sc).toFixed(1)}" y="${(p.y+dy*20*sc+6*sc).toFixed(1)}"
        text-anchor="middle" font-size="${(18*sc).toFixed(1)}" font-weight="800"
        fill="#C0342A" font-family="Georgia,serif">${N[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function paintRelay(){
  const rows=Object.keys(XS).map(k=>Object.assign({no:k},XS[k])).sort((a,b)=>a.at-b.at);
  const ansPts=(XA&&XA.v)?XA.v.map(p=>({x:p[0],y:p[1]})):null;
  const o=Object.values(XM).filter(v=>v==="o").length;
  const x=Object.values(XM).filter(v=>v==="x").length;

  let L=`<div class="xbar">
    <span class="xtag"><b>보낸 조건</b>${XT&&XT.items
      ?XT.items.map(i=>i.t==="seg"?`선분 ${i.cm}`:`각 ${i.deg}°`).join(" · ")
      :`<em>아직 보내지 않았습니다</em>`}</span>
    <span class="xtag"><b>제출</b>${rows.length}명</span>
    ${XA?`<span class="xtag g"><b>판정</b>같다 ${o} · 다르다 ${x}</span>`:""}
  </div>`;
  L+=!rows.length
    ?`<p class="hint2" style="margin-top:34px">아직 제출한 몽타주가 없습니다.</p>`
    :`<div class="xgrid">${rows.map(r=>{
        const t2=xFit(r.tri,220,150,18), mk=XM[r.no];
        const auto=ansPts?xSame(r.tri,ansPts):null;
        const col=mk==="o"?"#2A7148":mk==="x"?"#C0342A":"#1C1A16";
        return `<div class="xc ${mk||""}">
          ${mk?`<span class="bg">${mk==="o"?"○":"✕"}</span>`:""}
          <span class="nm">${esc(r.nick||r.no)}</span>
          <svg viewBox="0 0 220 150">${xPoly(t2,col,col+"14",3.2)}</svg>
          ${XA?`<div class="xb">
            <button data-m="o" data-no="${esc(r.no)}" aria-pressed="${mk==="o"}">같다</button>
            <button data-m="x" data-no="${esc(r.no)}" aria-pressed="${mk==="x"}">다르다</button>
            ${auto!=null&&!mk?`<em>${auto?"같음?":"다름?"}</em>`:""}</div>`:""}
        </div>`;}).join("")}</div>`;

  let R=`<div class="xans${XA?" on":""}"><h3>원래 삼각형</h3>`;
  if(ansPts){
    R+=ansSVG(XA,300,260)+
      `<p class="xq">두 조건만으로는 <b>사람마다 다른 삼각형</b>이 나옵니다.<br>
        “무엇을 더 알려 줬어야 했을까요?”</p>`;
  }else{
    R+=`<div class="xhold">
      <svg viewBox="0 0 300 230"><polygon points="60,190 240,190 150,50" fill="none"
        stroke="#D8CEB4" stroke-width="4" stroke-dasharray="10 9"/></svg>
      <p>아직 봉인되어 있습니다<em>모두의 몽타주가 모이면 열립니다</em></p></div>`;
  }
  R+=`</div>`;

  $("paneRelay").innerHTML=`<div class="xwrap"><div class="xleft">${L}</div>
    <aside class="xright">${R}</aside></div>`;
  $("paneRelay").querySelectorAll("[data-m]").forEach(b=>b.onclick=async()=>{
    b.blur();
    XM[b.dataset.no]=(XM[b.dataset.no]===b.dataset.m)?null:b.dataset.m;
    if(!XM[b.dataset.no])delete XM[b.dataset.no];
    paint(1);
    try{await dbPut(`t2x/${V.cls}/mark`,XM);setNet(true);}catch(e){setNet(false);}});
}

/* ================= 개방 ================= */
const PRESET=[
  {n:"3차시까지",  k:[], d:"훈련·조사 1·2는 늘 열려 있습니다 — 누를 것이 없습니다"},
  {n:"4차시 1단계", k:["t8"], d:"조사 3의 ①만 — 반전이 일어나는 화면"},
  {n:"4차시 2단계", k:["t8","t9","t11"], d:"조사 3 전체 — 갈라짐을 확인한 뒤에"},
  {n:"6차시 준비",  k:["t8","t9","t11","t10"], d:"모두 열기"}
];
function paintLock(){
  const on=k=>PRESET.find(p=>p.n===k).k.every(x=>DATA.unlocked[x])
    &&Object.keys(DATA.unlocked).filter(x=>DATA.unlocked[x]).length===
      PRESET.find(p=>p.n===k).k.length;
  $("paneLock").innerHTML=`<div class="locks">
    <h3>과제 개방 — ${V.cls}</h3>
    <p>스위치를 켜면 그 반 학생 화면에서 3초 안에 잠금이 풀립니다.
      <b>수업 시작 전에 미리 눌러 두는 편이 안전합니다.</b></p>
    <div class="pre">${PRESET.map(p=>
      `<button class="btn" data-p="${p.n}" aria-pressed="${on(p.n)}">
        <b>${p.n}</b><em>${p.d}</em></button>`).join("")}</div>
    ${TASKS.filter(t=>t.lock).map(t=>`<label class="lk">
      <input type="checkbox" data-k="${t.id}" ${DATA.unlocked[t.id]?"checked":""}>
      <b>${t.n}</b><span>${LESSON[t.id]||""}</span></label>`).join("")}
    <div class="hint">훈련 1~3, 훈련장, <b>조사 1~3(삼각형 작도)</b>은 항상 열려 있습니다.<br>
      연결이 되지 않을 때는 학생 주소 끝에 <b>?open=t5,t6</b> 를 붙이면
      그 기기에서만 잠금이 풀립니다.</div>
  </div>`;
  const send=async()=>{
    try{await dbPut(`classes/${V.cls}/unlocked`,DATA.unlocked);setNet(true);paintLock();}
    catch(e){setNet(false);alert("연결이 되지 않아 반영되지 않았습니다. 다시 눌러 주세요.");}
  };
  $("paneLock").querySelectorAll("input").forEach(i=>i.onchange=async()=>{
    DATA.unlocked[i.dataset.k]=i.checked;await send();
  });
  $("paneLock").querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{
    b.blur();
    const p=PRESET.find(x=>x.n===b.dataset.p);
    DATA.unlocked={};p.k.forEach(k=>DATA.unlocked[k]=true);
    await send();
  });
}

/* ================= 아래 줄 · 그리기 ================= */
function paintSub(){
  const t=TASKS.find(x=>x.id===V.task)||{};
  if(V.view==="board"&&t.board){
    $("sub").innerHTML=grpRow()+`<div class="modes">
      ${[["intake","접수"],["reveal","공개"],["merge","포개기"],["classify","분류"]]
        .map(([k,n])=>`<button data-mode="${k}" aria-pressed="${V.mode===k}">${n}</button>`).join("")}
      </div>
      <span class="muted" style="font:700 12px/1 var(--sans)">학급 전체 ${shown().length}장</span>
      <span style="flex:1"></span>
      <button class="btn" id="align">자동 정렬</button>
      <button class="btn" id="names" aria-pressed="${V.names}">코드네임 보기</button>
      <button class="btn danger" id="wipe">게시판 비우기</button>`;
    bindGrpRow();
    $("sub").querySelectorAll("[data-mode]").forEach(b=>b.onclick=async()=>{
      V.mode=b.dataset.mode;if(V.mode!=="reveal")V.pick=null;MERGED={};BSIG="";
      try{await dbPut(`classes/${V.cls}/mode`,V.mode);}catch(e){}
      paint(1);});
    $("align").onclick=()=>{V.tf={};V.mode="merge";paint(1);};
    $("names").onclick=()=>{V.names=!V.names;paint(1);};
    $("wipe").onclick=wipe;
  }else if(V.view==="prog"){
    $("sub").innerHTML=grpRow()+`<span class="muted" style="font:600 12px/1 var(--sans)">
      3분 넘게 단계가 늘지 않으면 <b style="color:#8E2A22">막힘</b>으로 표시됩니다.
      학생이 화면을 닫으면 <b>자리 비움</b>이 됩니다.</span>
      <span style="flex:1"></span>
      <button class="btn" id="tidy">안 쓰는 기록 정리</button>
      <button class="btn" id="refresh">새로 고침</button>`;
    bindGrpRow();
    $("refresh").onclick=()=>pull(1);
    $("tidy").onclick=async()=>{
      const now=Date.now();
      const old=Object.keys(DATA.prog).filter(k=>now-(DATA.prog[k].seen||DATA.prog[k].at||0)>6*3600000);
      if(!old.length)return alert("정리할 기록이 없습니다. (6시간 넘게 조용한 것만 지웁니다)");
      if(!confirm(`${old.length}명의 오래된 기록을 지웁니다.\n제출한 몽타주는 지워지지 않습니다.`))return;
      for(const k of old){try{await dbDel(`progress/${V.cls}/${k}`);}catch(e){}}
      await pull(1);
      alert(`${old.length}명의 기록을 지웠습니다.`);
    };
  }else if(V.view==="chart"){
    const d0=chartData();
    $("sub").innerHTML=`<div class="modes">
        <button data-ch="tri" aria-pressed="${V.chart==="tri"}">삼각형 성립</button>
        <button data-ch="det" aria-pressed="${V.chart==="det"}">결정조건</button>
      </div>
      ${V.chart==="det"?`<button class="btn" data-show="3"
          aria-pressed="${d0.show<=3}">세 줄</button>
        <button class="btn" data-show="6" aria-pressed="${d0.show>3}">조건 3개 추가</button>
        <button class="btn" id="congBtn" aria-pressed="${d0.cong}">열 추가</button>`:""}
      <span style="flex:1"></span>
      <button class="btn" id="bigBtn2" aria-pressed="${V.big}">크게 보기</button>`;
    $("sub").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{
      V.chart=b.dataset.ch;b.blur();
      if(V.chart==="det"){const dd=chartData();
        if(dd.show>3&&!dd.rows.slice(3).some(r=>r.some(x=>x))){dd.show=3;saveChart(dd);}}
      paint(1);});
    $("sub").querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{
      const d=chartData();d.show=+b.dataset.show;saveChart(d);b.blur();paint(1);});
    const cb=$("congBtn");if(cb)cb.onclick=()=>{const d=chartData();d.cong=!d.cong;saveChart(d);cb.blur();paint(1);};
    $("bigBtn2").onclick=()=>{V.big=!V.big;paint(1);};
  }else if(V.view==="note"){
    $("sub").innerHTML=`<span class="muted" style="font:600 12px/1 var(--sans)">
      학생이 앱 기록장에 쓴 내용입니다. 자동 저장되므로 제출하지 않아도 보입니다.</span>`;
  }else if(V.view==="board"){
    $("sub").innerHTML=`<span class="muted" style="font:600 12px/1 var(--sans)">
      이 과제는 게시판에 내는 과제가 아닙니다. 과제 5~10을 고르세요.</span>`;
  }else $("sub").innerHTML="";
}
/* ---- 다시 그리기 안전장치 -------------------------------------
   2.5초마다 도는 폴링이 타자 중인 칸을 지우지 않도록 한다.
   ① 본문 안 입력 칸에 커서가 있으면 그리지 않는다
   ② 도형을 끄는 중이면 그리지 않는다
   ③ 스크롤 위치를 그대로 되돌린다
   ---------------------------------------------------------------- */
const EDITING=()=>{
  const a=document.activeElement;
  if(!a)return false;
  if(!/^(INPUT|TEXTAREA)$/.test(a.tagName)&&!a.isContentEditable)return false;
  const bd=document.querySelector(".body"),sb=document.getElementById("sub");
  return (bd&&bd.contains(a))||(sb&&sb.contains(a));
};
function paint(force){
  if(!force&&(EDITING()||V.drag))return;
  const bd=document.querySelector(".body"),sc=bd?bd.scrollTop:0;
  paintNow();
  if(bd&&sc)bd.scrollTop=sc;
}
/* 조사 2·3 안의 갈래 고르기 */
function grpRow(){
  const g=grpOfTask(V.task);
  if(!g)return "";
  return `<div class="modes">${GRP[g].of.map((id,i)=>
    `<button data-gt="${id}" aria-pressed="${V.task===id}">${GRP[g].k[i]}</button>`).join("")}</div>`;
}
function bindGrpRow(){
  $("sub").querySelectorAll("[data-gt]").forEach(b=>b.onclick=()=>{
    V.task=b.dataset.gt;localStorage.setItem("t.task",V.task);V.tf={};b.blur();pull(1);});
}
function paintNow(){
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===V.view));
  ["prog","board","gen","chart","relay","lock"].forEach(k=>
    $("pane"+k[0].toUpperCase()+k.slice(1)).classList.toggle("on",V.view===k));
  const t=TASKS.find(x=>x.id===V.task)||{};
  const gsel=grpOfTask(V.task);
  if($("task").value!==(gsel||V.task))$("task").value=gsel||V.task;
  const now0=Date.now();
  const live=Object.values(DATA.prog).filter(p=>now0-(p.seen||p.at||0)<=90000).length;
  $("count").textContent=`${subList().length}명 접수 · ${live}명 접속`;
  paintSub();
  if(V.view==="prog")paintProg();
  if(V.view==="board"&&t.board)paintBoard();
  if(V.view==="chart")paintChart();
  if(V.view==="relay")paintRelay();
  if(V.view==="lock")paintLock();
}
async function wipe(){
  if(!confirm(`${V.cls} · ${(TASKS.find(t=>t.id===V.task)||{}).n} 게시판을 모두 비웁니다. 계속할까요?`))return;
  try{await dbDel(`boards/${V.cls}/${V.task}`);DATA.subs={};DATA.cls=[];V.tf={};setNet(true);}
  catch(e){setNet(false);}
  paint();
}

/* ================= 배선 ================= */
const TASKOPT=[];
TASKS.forEach(t=>{
  const g=grpOfTask(t.id);
  if(!g){TASKOPT.push({v:t.id,n:t.n});return;}
  if(GRP[g].of[0]===t.id)TASKOPT.push({v:g,n:GRP[g].n});
});
$("task").innerHTML=TASKOPT.map(o=>`<option value="${o.v}">${o.n}</option>`).join("");
$("cls").value=V.cls;$("task").value=grpOfTask(V.task)||V.task;
$("cls").onchange=e=>{V.cls=e.target.value;localStorage.setItem("t.cls",V.cls);V.tf={};e.target.blur();pull(1);};
$("task").onchange=e=>{
  const v=e.target.value;
  V.task=GRP[v]?GRP[v].of[0]:v;
  localStorage.setItem("t.task",V.task);
  V.tf={};V.who=null;e.target.blur();pull(1);};
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  V.view=b.dataset.view;b.blur();
  paint(1);});
pull();setInterval(pull,2500);
</script>
