<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼각형이 되는 조건 · 교사용</title>
<style>
  :root{
    --bg:#FFF6EC; --card:#FFFFFF; --ink:#3B3A45; --soft:#8C8899;
    --mint:#5FCBB0; --mint-l:#DFF6EF; --peach:#FF9273; --peach-l:#FFE7DF;
    --lav:#A497EA; --lav-l:#EEEAFD; --sun:#FFC648; --sun-l:#FFF3D6; --line:#EDE6DC;
    --f:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--f);background:var(--bg);color:var(--ink);
    word-break:keep-all;overflow-wrap:break-word}
  .app{height:100dvh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;flex:0 0 auto;
    background:#fff;border-bottom:2px solid var(--line)}
  .logo{font:900 16px/1 var(--f)}.logo b{color:var(--peach)}
  select{font:800 13px/1 var(--f);padding:10px 12px;border-radius:12px;border:2px solid var(--line);
    background:#FDFBF7;color:var(--ink)}
  .sp{flex:1}
  .chip{font:800 11.5px/1 var(--f);padding:8px 12px;border-radius:99px;background:#fff;
    border:2px solid var(--line);color:var(--soft)}
  .chip.on{background:var(--mint-l);border-color:var(--mint);color:#1F7A64}
  .chip.off{background:var(--peach-l);border-color:var(--peach);color:#A9432A}
  .cnt{font:900 12px/1 var(--f);padding:9px 13px;border-radius:99px;background:var(--sun-l);
    border:2px solid var(--sun);color:#8A5E00}
  .bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 16px;flex:0 0 auto;
    background:#FCF7F0;border-bottom:2px solid var(--line)}
  .ph{font:800 12.5px/1 var(--f);padding:11px 14px;border-radius:99px;cursor:pointer;
    border:2px solid var(--line);background:#fff;color:var(--soft)}
  .ph[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn{font:800 12.5px/1 var(--f);padding:11px 14px;border-radius:13px;cursor:pointer;
    border:2px solid var(--line);background:#fff;color:var(--ink)}
  .btn.go{background:var(--sun);border-color:var(--sun);color:#4A3300}
  .btn.warn{color:#C0342A}
  .btn[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);color:#fff}
  .body{flex:1;min-height:0;overflow:auto;padding:16px 20px 40px}
  .mid{max-width:1180px;margin:0 auto}

  .hero{text-align:center;padding:38px 20px}
  .hero .big{font:900 30px/1.3 var(--f);margin:0 0 10px}
  .hero p{font:800 15px/1.7 var(--f);color:var(--soft);margin:0}

  .split{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:center}
  .fig{background:#fff;border-radius:26px;padding:16px;border:3px solid #fff;
    box-shadow:0 12px 34px rgba(90,70,50,.12)}
  .fig svg{width:100%;height:min(56vh,470px);display:block}
  .lines{display:grid;gap:12px}
  .ln{background:var(--lav-l);border:3px solid #DCD4FA;border-radius:18px;padding:16px 20px;
    font:800 clamp(16px,1.9vw,25px)/1.6 var(--f)}
  .ln b{color:#5B4BC4}
  .ln.sun{background:var(--sun-l);border-color:var(--sun)}
  .ln.dim{opacity:.45}

  .qwrap{max-width:960px;margin:0 auto}
  .qn{text-align:center;font:900 13px/1 var(--f);color:var(--soft);letter-spacing:.06em}
  .qq{text-align:center;font:900 clamp(20px,2.6vw,36px)/1.4 var(--f);margin:10px 0 14px}
  .tl{height:14px;border-radius:99px;background:#EFE7DC;overflow:hidden;margin:0 0 8px}
  .tl i{display:block;height:100%;background:var(--sun);border-radius:99px}
  .secs{text-align:center;font:900 22px/1 var(--f);color:var(--sun);margin:0 0 14px}
  .qgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
  .opts{display:grid;gap:11px}
  .opt{border:3px solid var(--line);border-radius:18px;padding:16px 20px;background:#fff;
    font:900 clamp(16px,1.8vw,24px)/1.3 var(--f);display:flex;align-items:center;gap:14px}
  .opt em{font-style:normal;font-weight:900;color:var(--soft);font-size:.85em}
  .opt.ok{border-color:var(--mint);background:var(--mint-l);color:#14634F}
  .opt .n{margin-left:auto;font:900 16px/1 var(--f);color:var(--soft)}
  .vc{text-align:center;font:800 15px/1 var(--f);color:var(--soft);margin-top:12px}
  .why{margin-top:14px;background:var(--mint-l);border:3px solid var(--mint);border-radius:18px;
    padding:15px 20px;font:800 clamp(15px,1.7vw,22px)/1.6 var(--f);color:#14634F}

  table.g{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}
  table.g th{background:var(--lav-l);font:900 clamp(13px,1.4vw,19px)/1.3 var(--f);
    padding:14px 8px;border:2px solid var(--line);text-align:center}
  table.g td{border:2px solid var(--line);padding:13px 8px;text-align:center;
    font:800 clamp(14px,1.5vw,21px)/1.3 var(--f)}
  table.g td.set{background:#FBF8F2;font-weight:900}
  .cellbtn{cursor:pointer}
  .cellbtn:hover{background:var(--sun-l)}
  td.hide{background:#F3EFE7;color:transparent;cursor:pointer}
  td.hide:hover{background:var(--sun-l);color:#C9A24A}
  .bars{display:flex;gap:5px;align-items:center;justify-content:center}
  .bars i{display:block;height:16px;border-radius:99px}
  .pick{display:flex;gap:6px;justify-content:center}
  .pick button{font:900 12.5px/1 var(--f);padding:9px 12px;border-radius:10px;cursor:pointer;
    border:2px solid var(--line);background:#fff;color:var(--soft)}
  .pick .y[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:#fff}
  .pick .n[aria-pressed="true"]{background:var(--peach);border-color:var(--peach);color:#fff}
  .hint{text-align:center;font:800 13.5px/1.7 var(--f);color:var(--soft);margin:16px 0 0}
  .rank{display:grid;gap:9px;max-width:620px;margin:0 auto}
  .rk{display:flex;align-items:center;gap:13px;background:#fff;border:3px solid var(--line);
    border-radius:16px;padding:14px 18px;font:900 clamp(15px,1.7vw,22px)/1 var(--f)}
  .rk .no{width:40px;text-align:center;color:var(--soft)}
  .rk .sc{margin-left:auto;color:#5B4BC4}
  .rk.t1{border-color:var(--sun);background:var(--sun-l)}
  .rk.t2{border-color:#D5D8E0}.rk.t3{border-color:#E8CDB6}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="logo">삼각형이 <b>되는 조건</b> · 교사용</span>
    <select id="cls"><option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option></select>
    <span class="sp"></span>
    <span class="cnt" id="cnt">—</span>
    <span class="chip" id="net">연결 확인 중</span>
  </div>
  <div class="bar" id="bar"></div>
  <div class="body"><div class="mid" id="main"></div></div>
</div>

<script>
/* ══════════ 2차시 공용 자료 ══════════ */
const INK="#3B3A45", DIM="#9C96A8", HI="#C0342A", HI2="#1F7A64", SOFT="#F2EEF9";

/* ── 삼각형 그림 ──
   T = {v:[[x,y,"A"],…], sides:{AB:9,…}, angles:{A:65,…}}
   opt = {v,s,a: 무엇을 보일지, hiS:"BC", hiA:"A"}                     */
function triSVG(T,opt){
  opt=opt||{};
  const V=T.v.map(p=>({x:p[0],y:p[1],n:p[2]}));
  const cx=(V[0].x+V[1].x+V[2].x)/3, cy=(V[0].y+V[1].y+V[2].y)/3;
  const out=[];
  const pts=V.map(p=>`${p.x},${p.y}`).join(" ");
  out.push(`<polygon points="${pts}" fill="#fff" stroke="${INK}" stroke-width="3.4"
    stroke-linejoin="round"/>`);
  /* 변 강조 */
  if(opt.hiS){
    for(let i=0;i<3;i++){
      const a=V[i],b=V[(i+1)%3],nm=a.n+b.n,rv=b.n+a.n;
      if(opt.hiS===nm||opt.hiS===rv)
        out.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
          stroke="${HI}" stroke-width="7" stroke-linecap="round"/>`);
    }
  }
  /* 각 */
  for(let i=0;i<3;i++){
    const v=V[i],u=V[(i+2)%3],w=V[(i+1)%3];
    const a1=Math.atan2(u.y-v.y,u.x-v.x),a2=Math.atan2(w.y-v.y,w.x-v.x);
    let dd=a2-a1; while(dd>Math.PI)dd-=2*Math.PI; while(dd<-Math.PI)dd+=2*Math.PI;
    const r=32,hot=opt.hiA===v.n;
    const P=t=>`${(v.x+r*Math.cos(t)).toFixed(1)},${(v.y+r*Math.sin(t)).toFixed(1)}`;
    if(opt.a||hot)
      out.push(`<path d="M${P(a1)} A ${r} ${r} 0 0 ${dd>0?1:0} ${P(a2)}"
        fill="none" stroke="${hot?HI:DIM}" stroke-width="${hot?5:2.6}"/>`);
    if(opt.a){
      const tm=a1+dd/2,rr=r+22;
      out.push(`<text x="${(v.x+rr*Math.cos(tm)).toFixed(1)}"
        y="${(v.y+rr*Math.sin(tm)+5).toFixed(1)}" text-anchor="middle"
        font-size="17" font-weight="800" fill="${hot?HI:"#6B6577"}"
        font-family="sans-serif">${T.angles[v.n]}°</text>`);
    }
  }
  /* 변의 길이 */
  if(opt.s){
    for(let i=0;i<3;i++){
      const a=V[i],b=V[(i+1)%3],nm=a.n+b.n;
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      let dx=mx-cx,dy=my-cy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
      const hot=opt.hiS===nm||opt.hiS===(b.n+a.n);
      const val=T.sides[nm]!=null?T.sides[nm]:T.sides[b.n+a.n];
      out.push(`<text x="${(mx+dx*24).toFixed(1)}" y="${(my+dy*24+6).toFixed(1)}"
        text-anchor="middle" font-size="19" font-weight="800"
        fill="${hot?HI:INK}" font-family="sans-serif">${val}</text>`);
    }
  }
  /* 꼭짓점 */
  for(const p of V){
    let dx=p.x-cx,dy=p.y-cy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    out.push(`<circle cx="${p.x}" cy="${p.y}" r="6" fill="${INK}"/>`);
    if(opt.v!==false)
      out.push(`<text x="${(p.x+dx*26).toFixed(1)}" y="${(p.y+dy*26+8).toFixed(1)}"
        text-anchor="middle" font-size="23" font-weight="800"
        fill="${opt.hiA===p.n?HI:INK}" font-family="serif">${p.n}</text>`);
  }
  return `<svg viewBox="-30 -20 420 290" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
}

const T1={v:[[50,210,"A"],[310,210,"B"],[120,50,"C"]],
  sides:{AB:9,BC:8,CA:6}, angles:{A:65,B:40,C:75}};
const T2={v:[[60,60,"D"],[60,220,"E"],[300,180,"F"]],
  sides:{DE:6,EF:9,FD:10}, angles:{D:62,E:80,F:38}};
const T3={v:[[180,40,"P"],[50,220,"Q"],[320,220,"R"]],
  sides:{PQ:7,QR:9,RP:8}, angles:{P:72,Q:58,R:50}};

/* ── 퀴즈 6문항 ── */
const QUIZ=[
  {t:T1,q:"∠A의 <b>대변</b>의 길이는?",o:["6","8","9","7"],a:1,
   why:"∠A와 마주 보는 변은 <b>변 BC</b>이고 길이는 8입니다."},
  {t:T1,q:"변 AB의 <b>대각</b>의 크기는?",o:["40°","65°","75°","50°"],a:2,
   why:"변 AB와 마주 보는 각은 <b>∠C</b>이고 75°입니다."},
  {t:T2,q:"∠E의 <b>대변</b>의 길이는?",o:["6","9","10","8"],a:2,
   why:"∠E와 마주 보는 변은 <b>변 FD</b>이고 길이는 10입니다."},
  {t:T2,q:"변 EF의 <b>대각</b>의 크기는?",o:["38°","62°","80°","70°"],a:1,
   why:"변 EF와 마주 보는 각은 <b>∠D</b>이고 62°입니다."},
  {t:T3,q:"∠P의 <b>대변</b>은 어느 것인가?",o:["변 PQ","변 QR","변 RP","변 PQ와 변 RP"],a:1,
   why:"∠P와 마주 보는 변은 <b>변 QR</b> 하나입니다."},
  {t:T3,q:"변 QR의 <b>대각</b>은 어느 것인가?",o:["∠P","∠Q","∠R","∠Q와 ∠R"],a:0,
   why:"변 QR과 마주 보는 각은 <b>∠P</b> 하나입니다."}
];
const QDUR=10000, QRES=5000, QMAX=200;

/* ── 종이띠 여섯 세트 ── */
const SETS=[
  {n:"①",v:[3,4,6],ok:true},
  {n:"②",v:[5,5,5],ok:true},
  {n:"③",v:[4,4,5],ok:true},
  {n:"④",v:[3,4,7],ok:false},
  {n:"⑤",v:[3,4,9],ok:false},
  {n:"⑥",v:[2,5,9],ok:false}
];
/* 종이띠 그림 — 길이에 비례한 띠 세 장 */
function stripSVG(v,w){
  w=w||300;const u=(w-30)/9;
  return `<svg viewBox="0 0 ${w} 96" xmlns="http://www.w3.org/2000/svg">${
    v.map((x,i)=>`<rect x="6" y="${8+i*29}" width="${(x*u).toFixed(1)}" height="19" rx="5"
      fill="${["#FFD9C7","#CDEFE4","#DCD6F7"][i]}" stroke="#B7AFA0" stroke-width="1.8"/>
      <text x="${(12+x*u).toFixed(1)}" y="${23+i*29}" font-size="15" font-weight="800"
        fill="#6B6577" font-family="sans-serif">${x}</text>`).join("")}</svg>`;
}

/* ── 교차 비교 차트 ── */
const CH_HEAD=["세 변의 길이","가장 긴 변","대소","나머지 두 변의 길이 합","성공 여부"];
const CH_ROWS=SETS.map(s=>{
  const mx=Math.max(...s.v), rest=s.v.reduce((a,b)=>a+b,0)-mx;
  return [s.v.join("·"), String(mx), mx<rest?"<":(mx===rest?"=":">"),
          String(rest), s.ok?"성공":"실패"];
});

</script>
<script>
"use strict";
const $=i=>document.getElementById(i);
const DB="https://jak-do-default-rtdb.asia-southeast1.firebasedatabase.app";
const gj=async p=>{const r=await fetch(`${DB}/${p}.json`);if(!r.ok)throw 0;return r.json();};
const pj=async(p,v)=>{const r=await fetch(`${DB}/${p}.json`,{method:"PUT",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw 0;};
const dj=async p=>{const r=await fetch(`${DB}/${p}.json`,{method:"DELETE"});if(!r.ok)throw 0;};
const esc=s=>String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
let ON=null;
const setNet=ok=>{if(ON===ok)return;ON=ok;
  $("net").className="chip "+(ok?"on":"off");$("net").textContent=ok?"연결됨":"연결 안 됨";};

const PH=[["intro","6요소"],["oppo","대변·대각"],["strips","종이띠 결과"],["chart","교차 비교"]];
const STEPS={intro:5,oppo:4};
let V={cls:localStorage.getItem("t2.cls")||"1-1"};
let ST={phase:"intro",step:0,open:{}};      /* 이 화면에서만 쓰는 상태 */
let STR={},FIN={};

async function pull(force){
  try{
    const [st,fi]=await Promise.all([gj(`t2/${V.cls}/strips`),gj(`t2/${V.cls}/final`)]);
    STR=st||{};FIN=fi||{};setNet(true);
  }catch(e){setNet(false);}
  paint(force);
}
const push=o=>{ST=Object.assign({},ST,o);paint(1);};
const live=()=>Object.keys(STR||{}).length;

const INTRO=[
  "삼각형은 <b>△ABC</b>처럼 나타냅니다.",
  "세 <b>꼭짓점</b> A, B, C",
  "세 <b>변</b> AB, BC, CA",
  "세 <b>각</b> ∠A, ∠B, ∠C",
  "그래서 삼각형에는 <b>여섯 개</b>의 요소가 있습니다."
];
const OPPO=[
  "<b>대(對)</b> 는 <b>마주 본다</b>는 뜻입니다.",
  "∠A와 마주 보는 변은 <b>변 BC</b> — 이것을 <b>∠A의 대변</b>이라 합니다.",
  "변 BC와 마주 보는 각은 <b>∠A</b> — 이것을 <b>변 BC의 대각</b>이라 합니다.",
  "∠B ↔ 변 CA · ∠C ↔ 변 AB 도 마찬가지입니다."
];

function bar(){
  let h=PH.map(([k,n])=>`<button class="ph" data-ph="${k}" aria-pressed="${ST.phase===k}">${n}</button>`).join("");
  h+=`<span class="sp"></span>`;
  if(STEPS[ST.phase])h+=`<button class="btn" id="back">◀</button>
    <button class="btn go" id="fwd">다음 ▶ ${(ST.step||0)+1}/${STEPS[ST.phase]}</button>`;

  if(ST.phase==="chart")h+=`<button class="btn" id="openRow">한 줄 열기</button>
    <button class="btn" id="openAll">전부 열기</button>
    <button class="btn" id="closeAll">모두 덮기</button>`;
  h+=`<button class="btn warn" id="reset">이 반 초기화</button>`;
  $("bar").innerHTML=h;
  $("bar").querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.ph;b.blur();push({phase:k,step:0});});
  const g=id=>$(id);
  if(g("fwd"))g("fwd").onclick=()=>{g("fwd").blur();
    push({step:Math.min((ST.step||0)+1,STEPS[ST.phase]-1)});};
  if(g("back"))g("back").onclick=()=>{g("back").blur();push({step:Math.max((ST.step||0)-1,0)});};

  if(g("openRow"))g("openRow").onclick=()=>{
    const o=Object.assign({},ST.open);
    for(let ri=0;ri<CH_ROWS.length;ri++){
      let done=true;
      for(let ci=1;ci<CH_HEAD.length;ci++)if(!o[ri+"-"+ci])done=false;
      if(!done){for(let ci=1;ci<CH_HEAD.length;ci++)o[ri+"-"+ci]=true;break;}
    }
    push({open:o});};
  if(g("openAll"))g("openAll").onclick=()=>{
    const o={};CH_ROWS.forEach((r,ri)=>r.forEach((v,ci)=>{if(ci)o[ri+"-"+ci]=true;}));
    push({open:o});};
  if(g("closeAll"))g("closeAll").onclick=()=>push({open:{}});
  g("reset").onclick=async()=>{
    if(!confirm(`${V.cls} 반의 종이띠 기록과 결론을 지웁니다. 계속할까요?`))return;
    for(const k of ["strips","final","quiz","here","state"]){try{await dj(`t2/${V.cls}/${k}`);}catch(e){}}
    STR={};FIN={};push({phase:"intro",step:0,open:{}});};
}

const EDIT=()=>{const a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName));};
function paint(force){
  if(!force&&EDIT())return;
  const bd=document.querySelector(".body"),sc=bd?bd.scrollTop:0;
  paintNow();if(bd&&sc)bd.scrollTop=sc;
}
function paintNow(){
  $("cnt").textContent=`${live()}명 기록`;
  bar();
  const M=$("main"),ph=ST.phase,s=ST.step||0;

  if(ph==="intro"||ph==="oppo"){
    const list=ph==="intro"?INTRO:OPPO;
    const opt=ph==="intro"?{v:s>=1,s:s>=2,a:s>=3}
      :{v:true,s:true,a:true,hiS:s>=1?"BC":null,hiA:s>=1?"A":null};
    M.innerHTML=`<div class="split">
      <div class="fig">${triSVG(T1,opt)}</div>
      <div class="lines">${list.map((x,i)=>
        `<div class="ln${i===s?" sun":""}${i>s?" dim":""}"${i>s?' style="visibility:hidden"':""}>${x}</div>`
        ).join("")}</div></div>`;return;}

  if(ph==="strips"){
    const rows=Object.values(STR);
    M.innerHTML=`<div class="hero" style="padding:14px"><p class="big">종이띠 · 우리 반의 결과</p>
      <p>${rows.length}명이 기록했습니다. 함께 이야기하고 아래에서 결론을 정합니다.</p></div>
      <table class="g"><tr><th>세트</th><th>세 길이</th><th style="width:26%">띠</th>
        <th>됐다</th><th>안 됐다</th><th style="width:18%">비율</th><th style="width:18%">우리 반 결론</th></tr>
      ${SETS.map((st,i)=>{
        const vals=Object.values(STR).map(x=>x[i]).filter(Boolean);
        const y=vals.filter(v=>v==="ok").length,n=vals.filter(v=>v==="no").length;
        const tt=Math.max(1,y+n);
        return `<tr><td class="set">${st.n}</td><td>${st.v.join(" · ")}</td>
          <td>${stripSVG(st.v,240)}</td><td>${y}</td><td>${n}</td>
          <td><div class="bars">
            <i style="width:${Math.round(y/tt*100)}%;background:var(--mint)"></i>
            <i style="width:${Math.round(n/tt*100)}%;background:var(--peach)"></i></div></td>
          <td><div class="pick">
            <button class="y" data-i="${i}" data-v="ok" aria-pressed="${FIN[i]==="ok"}">성공</button>
            <button class="n" data-i="${i}" data-v="no" aria-pressed="${FIN[i]==="no"}">실패</button>
          </div></td></tr>`;}).join("")}
      </table>
      <p class="hint">정한 결론은 각자 기기의 종이띠 칸에도 <b>우리 반 결론</b>으로 표시됩니다.</p>`;
    M.querySelectorAll(".pick button").forEach(b=>b.onclick=async()=>{
      b.blur();FIN[b.dataset.i]=b.dataset.v;paint(1);
      try{await pj(`t2/${V.cls}/final`,FIN);setNet(true);}catch(e){setNet(false);}});
    return;}

  if(ph==="chart"){
    M.innerHTML=`<div class="hero" style="padding:14px"><p class="big">교차 비교 차트</p>
      <p>칸을 하나씩 열어 봅니다.</p></div>
      <table class="g"><tr>${CH_HEAD.map(h=>`<th>${h}</th>`).join("")}</tr>
      ${CH_ROWS.map((r,ri)=>`<tr>${r.map((v,ci)=>{
        if(ci===0)return `<td class="set">${v}</td>`;
        const open=(ST.open||{})[ri+"-"+ci];
        return `<td class="${open?"cellbtn":"hide"}" data-k="${ri}-${ci}">${open?v:"?"}</td>`;
      }).join("")}</tr>`).join("")}</table>
      <p class="hint"><b>대소</b> 칸만 보고도 성공 여부를 알 수 있을까요?</p>`;
    M.querySelectorAll("[data-k]").forEach(td=>td.onclick=()=>{
      const o=Object.assign({},ST.open);
      if(o[td.dataset.k])delete o[td.dataset.k];else o[td.dataset.k]=true;
      push({open:o});});
    return;}
}
$("cls").value=V.cls;
$("cls").onchange=e=>{V.cls=e.target.value;localStorage.setItem("t2.cls",V.cls);e.target.blur();pull(1);};
setInterval(()=>pull(),1600);
pull(1);
</script>
</body>
</html>
