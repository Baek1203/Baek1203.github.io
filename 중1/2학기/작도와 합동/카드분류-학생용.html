<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작도인가, 아닌가</title>
<style>
  :root{
    --bg:#FFF6EC; --card:#FFFFFF; --ink:#3B3A45; --soft:#8C8899;
    --mint:#5FCBB0; --mint-l:#DFF6EF; --peach:#FF9273; --peach-l:#FFE7DF;
    --lav:#A497EA; --lav-l:#EEEAFD; --sun:#FFC648; --sun-l:#FFF3D6;
    --line:#EDE6DC;
    --f:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:var(--f);background:var(--bg);color:var(--ink);overscroll-behavior:none;
    word-break:keep-all;overflow-wrap:break-word}
  .app{height:100dvh;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:9px;padding:11px 15px;flex:0 0 auto}
  .logo{font:900 16px/1 var(--f);letter-spacing:-.4px}
  .logo b{color:var(--peach)}
  .sp{flex:1}
  .chip{font:800 11.5px/1 var(--f);padding:8px 12px;border-radius:99px;background:#fff;
    border:2px solid var(--line);color:var(--soft)}
  .chip.on{background:var(--mint-l);border-color:var(--mint);color:#1F7A64}
  .chip.off{background:var(--peach-l);border-color:var(--peach);color:#A9432A}
  .me{font:800 12px/1 var(--f);padding:9px 14px;border-radius:99px;background:var(--sun-l);
    border:2px solid var(--sun);color:#8A5E00;cursor:pointer}

  .body{flex:1;min-height:0;overflow:auto;padding:6px 15px 30px}
  .mid{max-width:660px;margin:0 auto}

  .hero{text-align:center;padding:34px 18px}
  .hero .big{font:900 25px/1.35 var(--f);letter-spacing:-.6px;margin:0 0 8px}
  .hero p{font:700 13.5px/1.7 var(--f);color:var(--soft);margin:0}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:22px}
  .dots i{width:11px;height:11px;border-radius:99px;background:#E6DFD4;
    animation:bob 1.4s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.16s;background:#F3D8C8}
  .dots i:nth-child(3){animation-delay:.32s;background:#D8D0F3}
  @keyframes bob{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

  .stage{background:var(--card);border-radius:26px;padding:18px 18px 20px;
    box-shadow:0 10px 30px rgba(90,70,50,.10);border:2px solid #fff}
  .ring{display:block;margin:0 auto 6px}
  .cardno{text-align:center;font:900 12px/1 var(--f);color:var(--soft);letter-spacing:.06em}
  .secs{display:block;font:900 15px/1 var(--f);color:var(--sun);margin-top:5px}
  .draw{background:var(--bg);border-radius:20px;padding:12px;margin:10px 0 12px}
  .draw svg{width:100%;height:min(30vh,190px);display:block}
  .cap{text-align:center;font:800 clamp(17px,4.6vw,21px)/1.55 var(--f);margin:0 0 4px;
    letter-spacing:-.3px}

  .pick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
  .pick button{border:3px solid transparent;border-radius:20px;padding:18px 8px;cursor:pointer;
    font:900 17px/1.2 var(--f);transition:transform .12s,box-shadow .12s}
  .pick button small{display:block;font:800 11px/1 var(--f);opacity:.7;margin-top:6px}
  .pick .ex{background:var(--mint-l);color:#1F7A64}
  .pick .non{background:var(--peach-l);color:#A9432A}
  .pick .ex.on{border-color:var(--mint);box-shadow:0 7px 0 #46B79B;transform:translateY(-3px)}
  .pick .non.on{border-color:var(--peach);box-shadow:0 7px 0 #E97455;transform:translateY(-3px)}
  .pick button:active{transform:translateY(1px)}
  .voted{text-align:center;font:800 12.5px/1 var(--f);color:var(--soft);margin-top:12px}

  .res{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:14px}
  .res .n{font:900 30px/1 var(--f);text-align:center}
  .res .n.ex{color:#1F7A64}.res .n.non{color:#A9432A}
  .res .vs{font:900 13px/1 var(--f);color:var(--soft)}
  .bar{height:14px;border-radius:99px;background:var(--peach);overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;background:var(--mint)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .col{background:var(--card);border-radius:22px;padding:12px;border:2px solid var(--line)}
  .col h3{margin:0 0 10px;text-align:center;font:900 15px/1 var(--f);padding:11px;border-radius:14px}
  .col.ex h3{background:var(--mint-l);color:#1F7A64}
  .col.non h3{background:var(--peach-l);color:#A9432A}
  .mini{background:var(--bg);border-radius:16px;padding:10px 11px 12px;margin-bottom:9px}
  .mini svg{width:100%;height:74px;display:block}
  .mini p{margin:8px 2px 1px;font:800 13.5px/1.5 var(--f);color:#4A4756}
  .mini .lab{float:right;font:900 14px/1 var(--f);color:#A9A2B6}

  .ask{background:var(--lav-l);border-radius:22px;padding:16px 17px;margin-top:14px;
    border:2px solid #DCD4FA}
  .ask h2{margin:0 0 3px;font:900 15.5px/1.4 var(--f);letter-spacing:-.3px}
  .ask h2 em{font-style:normal;color:var(--lav)}
  .ask p{margin:0 0 11px;font:700 12px/1.6 var(--f);color:var(--soft)}
  textarea{width:100%;font:600 14.5px/1.7 var(--f);padding:13px 15px;border-radius:16px;
    border:2px solid #E4DDF7;background:#fff;color:var(--ink);resize:vertical;min-height:86px}
  textarea:focus{outline:0;border-color:var(--lav)}
  .saved{font:800 11.5px/1 var(--f);color:var(--mint);opacity:0;transition:opacity .3s}
  .saved.on{opacity:1}

  .flip{background:var(--card);border-radius:22px;padding:16px;margin-bottom:11px;cursor:pointer;
    border:3px dashed #E2DAD0;text-align:center;transition:transform .14s}
  .flip:active{transform:scale(.98)}
  .flip.open{border-style:solid;border-color:var(--sun);background:var(--sun-l);cursor:default}
  .flip h3{margin:0;font:900 16px/1.4 var(--f)}
  .flip .hint{font:800 11.5px/1 var(--f);color:var(--soft);margin-top:7px}
  .flip ul{text-align:left;margin:11px 0 0;padding-left:20px}
  .flip li{font:700 13.5px/1.8 var(--f)}

  .note{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:9px;
    border:2px solid var(--line)}
  .note b{display:block;font:900 11.5px/1 var(--f);color:var(--lav);margin-bottom:5px}
  .note p{margin:0;font:600 13.5px/1.65 var(--f)}
  .word{display:inline-block;font:900 12.5px/1 var(--f);padding:9px 13px;border-radius:99px;
    background:var(--sun-l);border:2px solid var(--sun);color:#8A5E00;margin:0 6px 6px 0}
  .word em{font-style:normal;opacity:.65;margin-left:5px}

  .frayer{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;
    background:#fff}
  .frayer .q{padding:14px 15px 16px}
  .frayer .tl,.frayer .bl{border-bottom:2px solid var(--ink)}
  .frayer .tr{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
  .frayer .bl{background:#F4FBF8}
  .frayer .br{background:#FFF6F2;border-top:2px solid var(--ink)}
  .frayer h3{margin:0 0 9px;font:900 14px/1 var(--f)}
  .frayer .bl h3{color:#1F7A64}.frayer .br h3{color:#A9432A}
  .frayer .ans{margin:0;font:800 16px/1.6 var(--f)}
  .frayer .ans i{font-style:normal;color:var(--soft);font-weight:700}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fcard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 9px 10px;
    position:relative}
  .fcard .lab{position:absolute;right:9px;top:7px;font:900 12px/1 var(--f);color:#BDB6C6}
  .fcard svg{width:100%;height:58px;display:block}
  .fcard p{margin:6px 2px 0;font:800 12px/1.45 var(--f);color:#4A4756}
  .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--ink);color:#fff;border-radius:99px;padding:9px 20px;
    font:900 15px/1 var(--f);box-shadow:0 0 0 5px #fff}
  @media (min-width:620px){
    .frayer{display:grid;grid-template-columns:1fr 1fr}
    .frayer .tl,.frayer .bl{border-right:2px solid var(--ink)}
    .frayer .tr{border-top:0}
    .frayer .br{border-top:0}
  }
  .wait{text-align:center;padding:26px 16px;font:800 13.5px/1.7 var(--f);color:var(--soft)}

  .modal{position:fixed;inset:0;background:rgba(59,58,69,.45);display:grid;place-items:center;
    padding:18px;z-index:40}
  .modal[hidden]{display:none}
  .sheet{background:#fff;border-radius:26px;width:min(400px,100%);padding:24px 24px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .sheet h1{margin:0 0 5px;font:900 20px/1.3 var(--f)}
  .sheet p{margin:0 0 16px;font:700 12.5px/1.6 var(--f);color:var(--soft)}
  .row{display:flex;align-items:center;gap:9px;margin:11px 0}
  .row label{flex:0 0 58px;font:900 12.5px/1 var(--f);color:var(--soft)}
  .row select,.row input{flex:1;font:700 15px/1 var(--f);padding:13px;border-radius:14px;
    border:2px solid var(--line);background:#FDFBF7;color:var(--ink)}
  .row .dice{flex:0 0 auto;font:800 13px/1 var(--f);padding:13px 12px;border-radius:14px;
    border:2px solid var(--line);background:var(--sun-l);cursor:pointer}
  .msg{margin:2px 0 10px;font:700 12px/1.5 var(--f);color:var(--soft);min-height:1px}
  .msg.bad{color:#C0342A}
  .go{width:100%;padding:15px;border:0;border-radius:16px;cursor:pointer;
    font:900 15px/1 var(--f);background:var(--ink);color:#fff}
  .go2{width:100%;margin-top:8px;padding:13px;border-radius:16px;cursor:pointer;
    font:800 12.5px/1 var(--f);background:#fff;border:2px solid var(--line);color:var(--soft)}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="logo">작도인가, <b>아닌가</b></span>
    <span class="saved" id="saved">저장됨</span>
    <span class="sp"></span>
    <span class="chip" id="net">연결 확인 중</span>
    <button class="me" id="me">입장하기</button>
  </div>
  <div class="body"><div class="mid" id="main"></div></div>
</div>

<div class="modal" id="idModal" hidden><div class="sheet">
  <h1>도형 수사대 입장</h1>
  <p>반을 고르고 코드네임을 넣으세요. 작도 실습실에서 쓰던 코드네임 그대로 쓰면 됩니다.</p>
  <div class="row"><label>반</label><select id="idCls">
    <option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option></select></div>
  <div class="row"><label>코드네임</label><input id="idNick" maxlength="12" autocomplete="off">
    <button class="dice" id="idDice">🎲</button></div>
  <p class="msg" id="idMsg"></p>
  <button class="go" id="idGo">들어가기</button>
  <button class="go2" id="idHand">이 기기를 다른 사람에게 넘기기</button>
</div></div>

th=\"1.5\"/><line x1=\"126.3\" y1=\"30\" x2=\"126.3\" y2=\"41\" stroke=\"#9A917C\" stroke-width=\"1.5\"/><line x1=\"136.2\" y1=\"30\" x2=\"136.2\" y2=\"36\" stroke=\"#9A917C\" stroke-width=\"1.5\"/><text x=\"88\" y=\"24\" font-size=\"17\" font-weight=\"700\" fill=\"#9A917C\" font-family=\"sans-serif\" text-anchor=\"middle\">5 cm</text><line x1=\"34\" y1=\"86\" x2=\"132\" y2=\"86\" stroke=\"#1C1A16\" stroke-width=\"2.6\"/><circle cx=\"34\" cy=\"86\" r=\"3.6\" fill=\"#1C1A16\"/><circle cx=\"132\" cy=\"86\" r=\"3.6\" fill=\"#1C1A16\"/><path d=\"M34 96 L132 96\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><path d=\"M34 92 v8 M132 92 v8\" stroke=\"#9A917C\" stroke-width=\"1.4\"/></svg>"}, {"id": "다", "ans": "ex", "cap": "컴퍼스로 한 점을 중심으로 원을 그렸다.", "svg": "<svg viewBox=\"0 0 250 118\" ><path d=\"M172 92 A 86 86 0 0 0 45 20\" stroke=\"#C0342A\" stroke-width=\"2.8\" fill=\"none\"/><line x1=\"86\" y1=\"92\" x2=\"147\" y2=\"31\" stroke=\"#C0342A\" stroke-width=\"2.6\"/><circle cx=\"147\" cy=\"31\" r=\"4\" fill=\"#C0342A\"/><circle cx=\"86\" cy=\"92\" r=\"4.5\" fill=\"#1C1A16\"/><text x=\"78\" y=\"110\" font-size=\"15\" font-weight=\"700\" fill=\"#1C1A16\" font-family=\"sans-serif\" text-anchor=\"middle\">O</text></svg>"}, {"id": "라", "ans": "non", "cap": "삼각자를 대고 모양을 그대로 본떠 그렸다.", "svg": "<svg viewBox=\"0 0 250 118\" ><path d=\"M40 96 L200 96 L40 20 Z\" fill=\"#F2EEE2\" stroke=\"#9A917C\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><rect x=\"40\" y=\"83\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"#9A917C\" stroke-width=\"1.6\"/><path d=\"M40 96 L200 96\" stroke=\"#1C1A16\" stroke-width=\"2.8\"/><path d=\"M40 20 L40 96\" stroke=\"#1C1A16\" stroke-width=\"2.8\"/></svg>"}, {"id": "마", "ans": "ex", "cap": "눈금 없는 자로 이미 찍혀 있는 두 점을 이었다.", "svg": "<svg viewBox=\"0 0 250 118\" ><rect x=\"34\" y=\"36\" width=\"176\" height=\"20\" rx=\"3.5\" fill=\"#E7EDF9\" stroke=\"#1F3F94\" stroke-width=\"2.2\"/><circle cx=\"46\" cy=\"84\" r=\"3.6\" fill=\"#1C1A16\"/><circle cx=\"198\" cy=\"84\" r=\"3.6\" fill=\"#1C1A16\"/><line x1=\"46\" y1=\"84\" x2=\"198\" y2=\"84\" stroke=\"#1F3F94\" stroke-width=\"2.8\"/><text x=\"46\" y=\"107\" font-size=\"15\" font-weight=\"700\" fill=\"#1C1A16\" font-family=\"sans-serif\" text-anchor=\"middle\">A</text><text x=\"198\" y=\"107\" font-size=\"15\" font-weight=\"700\" fill=\"#1C1A16\" font-family=\"sans-serif\" text-anchor=\"middle\">B</text></svg>"}, {"id": "바", "ans": "non", "cap": "각도기로 40°를 재어 각을 그렸다.", "svg": "<svg viewBox=\"0 0 250 118\" ><path d=\"M40 92 A 85 85 0 0 1 210 92 Z\" fill=\"#F2EEE2\" stroke=\"#9A917C\" stroke-width=\"2.2\"/><line x1=\"47.0\" y1=\"92.0\" x2=\"40.0\" y2=\"92.0\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"49.7\" y1=\"71.8\" x2=\"42.9\" y2=\"70.0\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"57.5\" y1=\"53.0\" x2=\"51.4\" y2=\"49.5\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"69.8\" y1=\"36.8\" x2=\"64.9\" y2=\"31.9\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"86.0\" y1=\"24.5\" x2=\"82.5\" y2=\"18.4\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"104.8\" y1=\"16.7\" x2=\"103.0\" y2=\"9.9\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"125.0\" y1=\"14.0\" x2=\"125.0\" y2=\"7.0\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"145.2\" y1=\"16.7\" x2=\"147.0\" y2=\"9.9\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"164.0\" y1=\"24.5\" x2=\"167.5\" y2=\"18.4\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"180.2\" y1=\"36.8\" x2=\"185.1\" y2=\"31.9\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"192.5\" y1=\"53.0\" x2=\"198.6\" y2=\"49.5\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"200.3\" y1=\"71.8\" x2=\"207.1\" y2=\"70.0\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><line x1=\"203.0\" y1=\"92.0\" x2=\"210.0\" y2=\"92.0\" stroke=\"#9A917C\" stroke-width=\"1.4\"/><text x=\"125\" y=\"60\" font-size=\"18\" font-weight=\"700\" fill=\"#9A917C\" font-family=\"sans-serif\" text-anchor=\"middle\">40°</text><path d=\"M125 92 L215 92\" stroke=\"#1C1A16\" stroke-width=\"2.6\"/><path d=\"M125 92 L194 34\" stroke=\"#1C1A16\" stroke-width=\"2.6\"/><circle cx=\"125\" cy=\"92\" r=\"3.6\" fill=\"#1C1A16\"/></svg>"}, {"id": "사", "ans": "ex", "cap": "컴퍼스와 눈금 없는 자만으로 각을 옮겨 그렸다.", "svg": "<svg viewBox=\"0 0 250 118\" ><path d=\"M22 96 L104 96 M22 96 L92 34\" stroke=\"#1C1A16\" stroke-width=\"2.4\"/><path d=\"M62 96 A 40 40 0 0 0 51.9 69.5\" stroke=\"#C0342A\" stroke-width=\"2.4\" fill=\"none\"/><circle cx=\"62\" cy=\"96\" r=\"3.2\" fill=\"#C0342A\"/><circle cx=\"51.9\" cy=\"69.5\" r=\"3.2\" fill=\"#C0342A\"/><circle cx=\"22\" cy=\"96\" r=\"3\" fill=\"#1C1A16\"/><path d=\"M112 66 L134 66\" stroke=\"#9A917C\" stroke-width=\"2\"/><path d=\"M134 66 l-7 -4.5 v9 z\" fill=\"#9A917C\"/><path d=\"M152 96 L234 96 M152 96 L222 34\" stroke=\"#1C1A16\" stroke-width=\"2.4\"/><path d=\"M192 96 A 40 40 0 0 0 181.9 69.5\" stroke=\"#C0342A\" stroke-width=\"2.4\" fill=\"none\"/><circle cx=\"192\" cy=\"96\" r=\"3.2\" fill=\"#C0342A\"/><circle cx=\"181.9\" cy=\"69.5\" r=\"3.2\" fill=\"#C0342A\"/><circle cx=\"152\" cy=\"96\" r=\"3\" fill=\"#1C1A16\"/></svg>"}, {"id": "아", "ans": "non", "cap": "눈대중으로 비슷해 보이는 자리에 점을 찍었다.", "svg": "<svg viewBox=\"0 0 250 118\" ><line x1=\"24\" y1=\"86\" x2=\"96\" y2=\"86\" stroke=\"#1C1A16\" stroke-width=\"2.6\"/><circle cx=\"24\" cy=\"86\" r=\"3.6\" fill=\"#1C1A16\"/><circle cx=\"96\" cy=\"86\" r=\"3.6\" fill=\"#1C1A16\"/><path d=\"M110 62 L136 62\" stroke=\"#9A917C\" stroke-width=\"2\"/><path d=\"M136 62 l-7 -4.5 v9 z\" fill=\"#9A917C\"/><line x1=\"150\" y1=\"86\" x2=\"244\" y2=\"86\" stroke=\"#1C1A16\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><circle cx=\"160\" cy=\"86\" r=\"3.6\" fill=\"#1C1A16\"/><circle cx=\"222\" cy=\"86\" r=\"5\" fill=\"none\" stroke=\"#C98A10\" stroke-width=\"2.4\" stroke-dasharray=\"3 3\"/><text x=\"222\" y=\"56\" font-size=\"24\" font-weight=\"800\" fill=\"#C98A10\" font-family=\"sans-serif\" text-anchor=\"middle\">?</text></svg>"}];
</script>
<script>
"use strict";
const $=i=>document.getElementById(i);
const DB="https://jak-do-default-rtdb.asia-southeast1.firebasedatabase.app";
const gj=async p=>{const r=await fetch(`${DB}/${p}.json`);if(!r.ok)throw 0;return r.json();};
const pj=async(p,v)=>{const r=await fetch(`${DB}/${p}.json`,{method:"PUT",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw 0;};
const NS="jakdo.v2";
const LS={get(k,d){try{const v=localStorage.getItem(NS+":"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(NS+":"+k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(NS+":"+k);}catch(e){}}};
const esc=s=>String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
let ON=null;
const setNet=ok=>{if(ON===ok)return;ON=ok;
  $("net").className="chip "+(ok?"on":"off");$("net").textContent=ok?"연결됨":"연결 안 됨";};

/* ── 신원 ── */
let me=LS.get("me",{cls:"1-1",nick:"",no:"",group:"",color:"#5FCBB0"});
const DEV=(()=>{let d=LS.get("dev",null);if(!d){d=Math.random().toString(36).slice(2,10);LS.set("dev",d);}return d;})();
const cls=()=>me.cls||"1-1";
const NA=["초록","파랑","노랑","붉은","하얀","검은","은빛","금빛","작은","날쌘","조용한","용감한",
  "슬기로운","다정한","씩씩한","반짝이는","느긋한","부지런한"];
const NB=["거북","여우","수달","담비","사슴","부엉이","고래","다람쥐","두더지","고슴도치","까치",
  "해달","살쾡이","알파카","펭귄","오소리","너구리","물총새"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const clean=t=>t.replace(/[.#$\[\]\/]/g,"").trim().slice(0,12);
const note=(t,bad)=>{$("idMsg").textContent=t||"";$("idMsg").className="msg"+(bad?" bad":"");};
function openId(f){$("idCls").value=me.cls||"1-1";$("idNick").value=me.nick||"";note("");
  $("idModal").hidden=false;$("idModal").dataset.f=f?"1":"";}
const paintMe=()=>$("me").textContent=me.nick?`${me.cls} · ${me.nick}`:"입장하기";
let busy=false;
async function enter(force){
  if(busy)return;
  const c=$("idCls").value,nk=clean($("idNick").value);
  if(!nk)return note("코드네임을 넣거나 🎲를 눌러 주세요.",1);
  busy=true;note("확인하는 중…");
  let o=null;try{o=await gj(`codes/${c}/${nk}`);setNet(true);}catch(e){o="off";setNet(false);}
  if(o&&o!=="off"&&o.dev!==DEV&&!force){busy=false;
    note("이미 쓰이고 있는 코드네임입니다. 내가 쓰던 것이면 “이어서 하기”를 누르세요.",1);
    $("idGo").textContent="이어서 하기";$("idGo").dataset.f="1";return;}
  me=Object.assign({},me,{cls:c,nick:nk,no:nk});LS.set("me",me);
  if(o!=="off"){pj(`codes/${c}/${nk}`,{dev:DEV,at:Date.now()}).catch(()=>{});
    pj(`frayer/${c}/here/${nk}`,{nick:nk,at:Date.now()}).catch(()=>{});}
  busy=false;note("");$("idGo").textContent="들어가기";delete $("idGo").dataset.f;
  $("idModal").hidden=true;paintMe();MY={};hello();await pull();paint();
}
$("idGo").onclick=()=>enter($("idGo").dataset.f==="1");
$("idDice").onclick=()=>{$("idNick").value=rnd(NA)+rnd(NB);note("");
  $("idGo").textContent="들어가기";delete $("idGo").dataset.f;};
$("idHand").onclick=()=>{
  if(!confirm("이 기기의 코드네임을 지웁니다."))return;
  LS.del("me");me={cls:me.cls,nick:"",no:"",group:"",color:"#5FCBB0"};
  $("idNick").value="";paintMe();MY={};openId(1);paint();};
$("me").onclick=()=>openId();
/* 접속 표시 — 새로 열 때마다, 그리고 25초마다 갱신 */
async function hello(){
  if(!me.nick)return;
  try{await pj(`frayer/${cls()}/here/${me.no}`,{nick:me.nick,at:Date.now()});setNet(true);}
  catch(e){setNet(false);}
}
setInterval(hello,25000);
$("idModal").addEventListener("click",e=>{
  if(e.target===$("idModal")&&$("idModal").dataset.f!=="1")$("idModal").hidden=true;});

/* ── 자료 ── */
const DUR=18000, RESD=5000;
let ST={phase:"wait",idx:0,at:0,done:false,flip:{}}, VOTE={}, FEAT={}, DEF={}, HERE={}, MODEL={}, MY={};
async function pull(){
  if(!me.nick)return;
  try{
    const [s,v,f,d,h,mo]=await Promise.all([
      gj(`frayer/${cls()}/state`),gj(`frayer/${cls()}/votes`),
      gj(`frayer/${cls()}/feat`),gj(`frayer/${cls()}/def`),gj(`frayer/${cls()}/here`),
      gj(`frayer/${cls()}/model`)]);
    ST=Object.assign({phase:"wait",idx:0,at:0,done:false,flip:{}},s||{});
    VOTE=v||{};FEAT=f||{};DEF=d||{};HERE=h||{};MODEL=mo||{};
    setNet(true);
  }catch(e){setNet(false);}
}
const myVote=id=>(VOTE[id]||{})[me.no];
const tally=id=>{const o=VOTE[id]||{};let e=0,n=0;
  for(const k in o){if(o[k]==="ex")e++;else n++;}return{e,n};};
const winner=id=>{const t=tally(id);
  if(ST.flip&&ST.flip[id])return ST.flip[id];
  return t.n>t.e?"non":"ex";};
async function vote(id,v){
  (VOTE[id]=VOTE[id]||{})[me.no]=v;paint();
  try{await pj(`frayer/${cls()}/votes/${id}/${me.no}`,v);setNet(true);}catch(e){setNet(false);}
}
let tmr={},fl=null;
const flash=()=>{$("saved").classList.add("on");clearTimeout(fl);
  fl=setTimeout(()=>$("saved").classList.remove("on"),1000);};
function save(kind,text){
  MY[kind]=text;clearTimeout(tmr[kind]);
  tmr[kind]=setTimeout(async()=>{
    try{await pj(`frayer/${cls()}/${kind}/${me.no}`,{nick:me.nick,text,at:Date.now()});
      setNet(true);flash();}catch(e){setNet(false);}
  },800);
}

/* ── 그리기 ── */
const card=i=>CARDS[Math.max(0,Math.min(i,CARDS.length-1))];
function ring(p){
  const r=22,c=2*Math.PI*r;
  return `<svg class="ring" width="52" height="52" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="#EFE7DC" stroke-width="5"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--sun)" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"
      transform="rotate(-90 26 26)"/></svg>`;
}
function miniCard(c,showAns){
  return `<div class="mini"><span class="lab">${c.id}</span>${c.svg}<p>${esc(c.cap)}</p></div>`;
}
function sorted(){
  const ex=[],non=[];
  CARDS.forEach(c=>{(winner(c.id)==="ex"?ex:non).push(c);});
  return{ex,non};
}
function colsHTML(){
  const {ex,non}=sorted();
  return `<div class="cols">
    <div class="col ex"><h3>예 · 작도이다</h3>${ex.map(c=>miniCard(c)).join("")||"<p class='wait'>없음</p>"}</div>
    <div class="col non"><h3>비예 · 작도가 아니다</h3>${non.map(c=>miniCard(c)).join("")||"<p class='wait'>없음</p>"}</div>
  </div>`;
}
const TOOLS=[
  {k:"ruler",t:"눈금 없는 자",li:["이미 찍혀 있는 두 점을 잇는다","그은 선을 곧게 늘인다"]},
  {k:"compass",t:"컴퍼스",li:["한 점을 중심으로 원을 그린다","주어진 길이를 집어서 옮긴다"]}
];
const KEYS=[["재지 않",/재지\s*않|안\s*재|재지않/],["눈금",/눈금/],["컴퍼스",/컴퍼스/],
  ["자",/(^|[^숫])자[^리]/],["옮기",/옮기|옮겨/],["그리",/그리|그린|그려/],
  ["숫자",/숫자/],["길이",/길이/],["각",/각(도|을|이|과)?/]];

function paint(){
  paintMe();
  const M=$("main");
  if(!me.nick){M.innerHTML=`<div class="hero"><p class="big">먼저 입장하세요</p>
    <p>오른쪽 위 <b>입장하기</b>를 누르면 시작합니다.</p></div>`;return;}
  const ph=ST.phase;

  if(ph==="wait"){
    M.innerHTML=`<div class="hero"><p class="big">준비됐어요!</p>
      <p>선생님이 시작하면 카드가 한 장씩 나타납니다.<br>지금 <b>${Object.keys(HERE).length}명</b>이 들어와 있어요.</p>
      <div class="dots"><i></i><i></i><i></i></div></div>`;return;}

  if(ph==="cards"){
    const c=card(ST.idx),mv=myVote(c.id),t=tally(c.id);
    const left=Math.max(0,DUR-(Date.now()-(ST.at||0)));
    const p=ST.done?0:left/DUR;
    let h=`<div class="stage">${ring(p)}
      <div class="cardno">${ST.idx+1} / ${CARDS.length}<span class="secs"></span></div>
      <div class="draw">${c.svg}</div>
      <p class="cap">${esc(c.cap)}</p>`;
    if(ST.done){
      const tot=Math.max(1,t.e+t.n);
      h+=`<div class="res"><div class="n ex">${t.e}</div><div class="vs">우리 반 생각</div>
        <div class="n non">${t.n}</div></div>
        <div class="bar"><i style="width:${Math.round(t.e/tot*100)}%"></i></div>
        <p class="voted">${winner(c.id)==="ex"?"예 · 작도이다":"비예 · 작도가 아니다"} 쪽으로 갔습니다</p>`;
    }else{
      h+=`<div class="pick">
        <button class="ex${mv==="ex"?" on":""}" data-v="ex">예<small>작도이다</small></button>
        <button class="non${mv==="non"?" on":""}" data-v="non">비예<small>작도가 아니다</small></button></div>
        <p class="voted">${t.e+t.n}명 투표함${mv?" · 바꿀 수 있어요":""}</p>`;
    }
    M.innerHTML=h+`</div>`;
    M.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>vote(c.id,b.dataset.v));
    return;}

  if(ph==="sort"){
    M.innerHTML=`<div class="hero" style="padding:16px 8px"><p class="big">우리 반이 나눈 결과</p>
      <p>두 무리를 천천히 견주어 보세요.</p></div>`+colsHTML();return;}

  if(ph==="feature"){
    let h=colsHTML();
    h+=`<div class="ask"><h2><em>Q.</em> 왼쪽 무리는 무엇을 하지 <em>않고</em> 있나요?</h2>
      <p>두 무리를 견주어, 왼쪽에만 있는 점을 한 문장으로 쓰세요.</p>
      <textarea id="ft" rows="3" placeholder="여기에 쓰세요">${esc(MY.feat||"")}</textarea></div>`;
    if(ST.share){
      const rows=Object.values(FEAT).filter(x=>x&&x.text&&x.text.trim());
      h+=`<div class="ask" style="background:#fff;border-color:var(--line)">
        <h2>친구들은 이렇게 썼어요 <em>${rows.length}명</em></h2>
        ${rows.map(r=>`<div class="note"><b>${esc(r.nick)}</b><p>${esc(r.text)}</p></div>`).join("")}</div>`;
    }else{
      h+=`<p class="wait">다 쓴 사람이 ${Object.keys(FEAT).length}명이에요.
        모두의 생각은 선생님이 열어 줍니다.</p>`;
    }
    M.innerHTML=h;
    const ft=$("ft");ft.oninput=()=>save("feat",ft.value);
    return;}

  if(ph==="tools"){
    M.innerHTML=`<div class="hero" style="padding:16px 8px"><p class="big">도구가 하는 일</p>
      <p>먼저 짝과 말로 정리한 다음, 눌러서 확인하세요.</p></div>`+
      TOOLS.map(t=>{
        const open=ST.flip&&ST.flip[t.k];
        return `<div class="flip${open?" open":""}" data-k="${t.k}">
          <h3>${t.t}</h3>
          ${open?`<ul>${t.li.map(x=>`<li>${x}</li>`).join("")}</ul>`
                :`<p class="hint">눌러서 확인하기</p>`}</div>`;}).join("")+
      `<p class="wait">두 도구 모두 <b>새로운 길이나 각을 만들어 내지 못합니다.</b><br>
        이미 있는 것을 옮길 뿐이에요.</p>`;
    M.querySelectorAll(".flip").forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;ST.flip=Object.assign({},ST.flip,{[k]:true});paint();
      try{await pj(`frayer/${cls()}/state/flip/${k}`,true);}catch(e){}});
    return;}

  if(ph==="model"){
    const ex=[],non=[];CARDS.forEach(c=>(winner(c.id)==="ex"?ex:non).push(c));
    const cell=c=>`<div class="fcard"><span class="lab">${c.id}</span>${c.svg}
      <p>${esc(c.cap)}</p></div>`;
    M.innerHTML=`<div class="hero" style="padding:14px 8px"><p class="big">작도 정리표</p>
      <p>공책이나 학습지에 그대로 옮겨 적으세요.</p></div>
      <div class="frayer">
        <div class="q tl"><h3>작도란 무엇인가</h3>
          <p class="ans">${MODEL.def?esc(MODEL.def):"<i>아직 정하지 않았어요</i>"}</p></div>
        <div class="q tr"><h3>특징</h3>
          <p class="ans">${MODEL.feat?esc(MODEL.feat):"<i>아직 정하지 않았어요</i>"}</p></div>
        <div class="q bl"><h3>해당되는 예 · 작도이다</h3>
          <div class="fgrid">${ex.map(cell).join("")}</div></div>
        <div class="q br"><h3>해당되지 않는 예 · 작도가 아니다</h3>
          <div class="fgrid">${non.map(cell).join("")}</div></div>
        <div class="core">작도</div>
      </div>`;
    return;}

  if(ph==="define"){
    let h="";
    if(MODEL.def)h+=`<div class="ask" style="background:#FFF3D6;border-color:var(--sun)">
      <h2>우리 반이 정한 정의</h2>
      <p style="font:800 17px/1.7 var(--f);color:var(--ink);margin:0">${esc(MODEL.def)}</p></div>`;
    h+=`<div class="ask"><h2>이제 <em>정의</em>를 써 봅시다</h2>
      <p>특징을 종합해서, 작도가 무엇인지 내 문장으로 쓰세요.</p>
      <textarea id="df" rows="3" placeholder="작도란 …">${esc(MY.def||"")}</textarea></div>`;
    if(ST.shareD){
      const rows=Object.values(DEF).filter(x=>x&&x.text&&x.text.trim());
      const txt=rows.map(r=>r.text).join(" ");
      const chips=KEYS.map(([w,re])=>{
        const n=rows.filter(r=>re.test(r.text)).length;return{w,n};})
        .filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
      h+=`<div class="ask" style="background:var(--sun-l);border-color:var(--sun)">
        <h2>우리 반이 많이 쓴 말</h2>
        <p>가장 많이 나온 말이 곧 작도의 뜻입니다.</p>
        ${chips.map(c=>`<span class="word">${c.w}<em>${c.n}</em></span>`).join("")||"<p class='wait'>아직 없어요</p>"}
      </div>
      <div class="ask" style="background:#fff;border-color:var(--line)">
        <h2>모두의 정의 <em>${rows.length}명</em></h2>
        ${rows.map(r=>`<div class="note"><b>${esc(r.nick)}</b><p>${esc(r.text)}</p></div>`).join("")}</div>`;
    }else{
      h+=`<p class="wait">${Object.keys(DEF).length}명이 썼어요. 모두의 문장은 선생님이 열어 줍니다.</p>`;
    }
    M.innerHTML=h;
    const df=$("df");df.oninput=()=>save("def",df.value);
    return;}
  M.innerHTML=`<p class="wait">기다리는 중…</p>`;
}

/* ── 새로 고침 (타자 중에는 다시 그리지 않는다) ── */
const editing=()=>{const a=document.activeElement;
  return a&&a.tagName==="TEXTAREA";};
let sig="",bigSig="";
async function tick(){
  await pull();
  const big=JSON.stringify([ST.phase,ST.idx,ST.done,ST.share,ST.shareD,ST.flip]);
  const s=big+JSON.stringify([Object.keys(FEAT).length,Object.keys(DEF).length,
    Object.keys(HERE).length,CARDS.map(c=>tally(c.id))]);
  const ed=editing();
  if(ed&&big===bigSig)return;                 /* 타자 중 사소한 변화는 무시 */
  if(s===sig&&big===bigSig)return;
  const id=ed?document.activeElement.id:null;
  const pos=ed?document.activeElement.selectionStart:0;
  sig=s;bigSig=big;paint();
  if(id){const el=$(id);if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}}
}
setInterval(tick,1600);
setInterval(()=>{
  if(ST.phase!=="cards"||ST.done)return;
  const el=document.querySelector(".ring");if(!el)return;
  const p=Math.max(0,DUR-(Date.now()-(ST.at||0)))/DUR;
  const r=22,cc=2*Math.PI*r;
  el.querySelectorAll("circle")[1].setAttribute("stroke-dashoffset",cc*(1-p));
  const s=document.querySelector(".secs");
  if(s)s.textContent=Math.ceil(p*DUR/1000)+"초";
},80);

paintMe();
(async()=>{hello();await pull();paint();if(!me.nick)setTimeout(()=>openId(1),250);})();
</script>
</body>
