<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위치 관계 실험실 · 교사용 현황판</title>
<style>
:root{
  --paper:#eef1f7; --card:#fff; --ink:#17223b; --ink-soft:#5b6580; --rule:#dce2ee;
  --l:#e0398a; --m:#1189c4; --seal:#12855a; --lock:#98a2b8; --warn:#c2410c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:18px 16px 60px}
.wrap{max-width:1180px;margin:0 auto}

header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;
  padding-bottom:13px;border-bottom:2px solid var(--ink);margin-bottom:16px}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em}
.sub{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}
.sub b{color:var(--ink)}

.btn{appearance:none;border:1.5px solid var(--rule);background:#fff;color:var(--ink);border-radius:9px;
  padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:#b9c3d8;background:#f7f9fc}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.main{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.main:hover{background:#0d1526}
select,input[type=text]{font:inherit;font-size:13px;font-weight:700;padding:7px 10px;border-radius:9px;
  border:1.5px solid var(--rule);background:#fff;color:var(--ink)}
label.sel{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-soft)}

.setup{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:16px}
.setup h2{margin:0 0 4px;font-size:16px;font-weight:800}
.setup p{margin:0 0 12px;font-size:13px;color:var(--ink-soft)}
.setup .row{display:flex;gap:8px;flex-wrap:wrap}
.setup input{flex:1;min-width:280px;font-weight:600}
.err{margin:10px 0 0;font-size:12.5px;font-weight:700;color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--rule);border-radius:13px;padding:11px 13px}
.stat i{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.stat b em{font-style:normal;font-size:13px;color:var(--ink-soft);font-weight:700}

.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.classchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.cchip{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700;
  color:var(--ink-soft);cursor:pointer}
.cchip b{color:var(--ink)}
.cchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.cchip[aria-pressed="true"] b{color:#fff}

table.roster{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule);
  border-radius:13px;overflow:hidden}
table.roster th,table.roster td{padding:9px 11px;font-size:13px;text-align:left;border-bottom:1px solid var(--rule)}
table.roster th{background:#f5f7fb;font-weight:800;font-size:12px;color:var(--ink-soft);white-space:nowrap}
table.roster tbody tr{cursor:pointer}
table.roster tbody tr:hover{background:#f7f9fd}
table.roster tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-weight:800}
.pbar{height:7px;background:#e7ebf3;border-radius:99px;overflow:hidden;min-width:80px}
.pbar i{display:block;height:100%;background:var(--seal);border-radius:99px}
.dots{display:flex;gap:3px}
.dots i{width:13px;height:13px;border-radius:3.5px;background:#e4e9f1;font-size:0}
.dots i.p{background:#9fd4bb}
.dots i.f{background:var(--seal)}
.warn{color:var(--warn);font-weight:800}
.empty{background:#fff;border:1px dashed var(--rule);border-radius:13px;padding:30px;text-align:center;
  color:var(--ink-soft);font-size:13.5px}

h3.tsec{margin:24px 0 4px;font-size:15px;font-weight:800}
h3.tsec + p{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft)}
.qrate{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:9px}
.qr{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;cursor:pointer}
.qr:hover{border-color:#b9c3d8}
.qr .t{font-size:12.8px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qr .t em{font-style:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:11.5px;white-space:nowrap}
.qr .sec{font-size:10.5px;font-weight:800;color:var(--lock);letter-spacing:.03em}
.qr .pbar{margin-top:7px}
.qr .miss{margin-top:8px;font-size:11.5px;color:var(--warn);font-weight:700;line-height:1.5;
  border-top:1px dashed var(--rule);padding-top:7px}
.qr.low{border-color:rgba(194,65,12,.45)}

#modal{position:fixed;inset:0;background:rgba(23,34,59,.45);display:grid;place-items:center;padding:20px;z-index:20}
.sheet{background:#fff;border-radius:18px;width:min(620px,100%);max-height:86vh;overflow:auto;padding:20px}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet h2{margin:0;font-size:20px;font-weight:800}
.sheet .meta{font-size:12.5px;color:var(--ink-soft)}
.grp{margin-top:14px}
.grp h4{margin:0 0 7px;font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center}
.grp h4 em{font-style:normal;font-size:11px;font-weight:800;color:var(--ink-soft);background:#eef1f7;
  border-radius:99px;padding:2px 8px}
.item{display:flex;gap:9px;align-items:center;padding:6px 9px;border:1px solid var(--rule);border-radius:9px;
  margin-bottom:5px;font-size:13px}
.item.done{border-color:rgba(18,133,90,.4);background:rgba(18,133,90,.05)}
.item .ic{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
  border:1.5px solid var(--lock);color:var(--lock);flex:none}
.item.done .ic{border-color:var(--seal);color:var(--seal)}
.item .shn{margin-left:7px;font-size:10.5px;font-weight:800;color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:99px;padding:1px 7px;white-space:nowrap}
.item .tm{margin-left:auto;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hidden{display:none !important}
@media (max-width:700px){ .hide-sm{display:none} h1{font-size:20px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:3px solid #1189c4;outline-offset:2px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>학급 진행 현황</h1>
    <p class="sub" id="sub">위치 관계 실험실 · 교사용</p>
  </div>
  <div class="tbar" style="margin:0">
    <button class="btn" id="reload">새로고침</button>
    <button class="btn" id="auto" aria-pressed="true">자동 갱신 20초</button>
    <button class="btn" id="csv">CSV 내려받기</button>
    <button class="btn" id="setupBtn">연결 설정</button>
  </div>
</header>

<section class="setup hidden" id="setup">
  <h2>데이터베이스 연결</h2>
  <p>Firebase 실시간 데이터베이스 주소를 붙여넣으세요. 학생용 파일에 넣은 주소와 같아야 합니다.</p>
  <div class="row">
    <input type="text" id="dbUrl" placeholder="https://내프로젝트-default-rtdb.asia-southeast1.firebasedatabase.app" autocomplete="off">
    <button class="btn main" id="save">연결</button>
  </div>
  <p class="err hidden" id="err"></p>
</section>

<div id="main" class="hidden">
  <div class="stats" id="stats"></div>
  <div class="classchips" id="chips"></div>
  <div class="tbar">
    <label class="sel">정렬<select id="sort">
      <option value="id">학번순</option>
      <option value="count">해금 많은 순</option>
      <option value="low">해금 적은 순</option>
      <option value="last">최근 활동순</option>
    </select></label>
    <span class="sub" id="cnt"></span>
  </div>
  <div id="table"></div>

  <h3 class="tsec">위치 관계별 해금률</h3>
  <p>비율이 낮은 항목이 학생들이 막힌 지점입니다. 칸을 누르면 아직 열지 못한 학생 번호가 보입니다.</p>
  <div class="qrate" id="rate"></div>
</div>

<p class="sub" style="margin-top:26px;padding-top:12px;border-top:1px solid var(--rule)">
  이 파일은 선생님 기기에만 두세요. 학생용 파일에는 이 화면이 들어 있지 않습니다.
  수업이 끝나면 Firebase 규칙에서 <b>students 읽기</b>를 다시 잠가 주세요.
</p>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════
   DB_URL을 여기에 적어 두면 열 때마다 입력하지 않아도 됩니다.
   주소 뒤에 ?db=... 를 붙여도 되고, 화면에서 입력해도 됩니다.
   ══════════════════════════════════════════════════════ */
var CONFIG = { DB_URL: "https://math-teaching-7dc48-default-rtdb.asia-southeast1.firebasedatabase.app" };

var QUESTS = [
 {id:"s1-on",   st:1, title:"점이 직선 위에 있다", sheet:1},
 {id:"s1-off",  st:1, title:"점이 직선 위에 있지 않다", sheet:2},
 {id:"s1-pass", st:1, title:"직선이 점을 지난다"},
 {id:"s1-many", st:1, title:"한 점을 지나는 직선은 무수히 많다", star:true},
 {id:"s2-cross",st:2, title:"한 점에서 만난다", sheet:3},
 {id:"s2-same", st:2, title:"일치한다", sheet:4},
 {id:"s2-para", st:2, title:"평행하다", sym:"l ∥ m", sheet:5},
 {id:"s2-far",  st:2, title:"직선은 끝없이 뻗는다", star:true},
 {id:"s3-cross",st:3, title:"한 점에서 만난다", sheet:6},
 {id:"s3-same", st:3, title:"일치한다", sheet:7},
 {id:"s3-para", st:3, title:"평행하다", sym:"l ∥ m", sheet:8},
 {id:"s3-skew", st:3, title:"꼬인 위치에 있다", sheet:9},
 {id:"s3-all",  st:3, title:"AB와 꼬인 위치인 모서리 4개", star:true},
 {id:"x-synth", st:3, title:"꼬인 위치는 공간에만 있다", star:true},
 {id:"s4-cross",st:4, title:"한 점에서 만난다", sheet:10},
 {id:"s4-in",   st:4, title:"평면에 포함된다", sheet:11},
 {id:"s4-para", st:4, title:"평행하다", sym:"l ∥ P", sheet:12},
 {id:"s4-perp", st:4, title:"평면 EFGH의 수선 4개", star:true},
 {id:"s4-noskew",st:4,title:"직선과 평면에는 꼬인 위치가 없다", star:true},
 {id:"s5-cross",st:5, title:"한 직선에서 만난다", sheet:13},
 {id:"s5-same", st:5, title:"일치한다", sheet:14},
 {id:"s5-para", st:5, title:"평행하다", sym:"P ∥ Q", sheet:15},
 {id:"s5-perp", st:5, title:"평면 ABCD와 수직인 면 4개", star:true}
];
var SEC = { 1:"① 점과 직선", 2:"② 평면에서 두 직선", 3:"③ 공간에서 두 직선",
            4:"④ 공간에서 직선과 평면", 5:"⑤ 공간에서 두 평면" };
var IDS = {}; QUESTS.forEach(function(q){ IDS[q.id] = q; });
var T = QUESTS.length;

var $ = function(id){ return document.getElementById(id); };
var base = "", rows = [], filter = "", sortKey = "id", timer = null, openQ = null;

function store(k, v){
  try { if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; }
}
(function boot(){
  var q = new URLSearchParams(location.search).get("db");
  base = (q || store("lab_db") || CONFIG.DB_URL || "").replace(/\/+$/, "");
  $("dbUrl").value = base;
  if(base){ store("lab_db", base); load(); } else { $("setup").classList.remove("hidden"); }
})();
$("setupBtn").onclick = function(){ $("setup").classList.toggle("hidden"); $("dbUrl").focus(); };
$("save").onclick = function(){
  var v = $("dbUrl").value.trim().replace(/\/+$/, "");
  if(!/^https:\/\/.+/.test(v)){ fail("https:// 로 시작하는 주소를 넣어 주세요."); return; }
  base = v; store("lab_db", v); $("err").classList.add("hidden"); load();
};
$("dbUrl").addEventListener("keydown", function(e){ if(e.key === "Enter") $("save").click(); });
$("reload").onclick = load;
$("csv").onclick = csv;
$("sort").onchange = function(e){ sortKey = e.target.value; render(); };
$("auto").onclick = function(e){
  var on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on));
  clearInterval(timer);
  if(on) timer = setInterval(load, 20000);
};
timer = setInterval(load, 20000);

function fail(msg){
  var e = $("err"); e.textContent = msg; e.classList.remove("hidden");
  $("setup").classList.remove("hidden");
}
function load(){
  if(!base) return;
  $("sub").textContent = "불러오는 중…";
  fetch(base + "/students.json", { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("응답 " + r.status); return r.json(); })
    .then(function(d){
      rows = Object.keys(d || {}).map(function(id){
        var v = d[id] || {}, u = v.unlocked || {}, m = v.meta || {};
        var done = Object.keys(u).filter(function(k){ return !!IDS[k]; });
        return { id:id, done:done, at:u, count:done.length, last:m.last || 0, first:m.first || 0,
                 got:v.got || {} };
      });
      $("setup").classList.add("hidden");
      $("err").classList.add("hidden");
      $("main").classList.remove("hidden");
      render();
      var t = new Date();
      $("sub").textContent = "마지막 확인 " +
        t.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
    })
    .catch(function(e){
      $("sub").textContent = "불러오지 못했습니다";
      fail("연결하지 못했습니다 (" + e.message + "). 주소가 맞는지, 보안 규칙에서 students 읽기가 허용되어 있는지 확인해 주세요.");
    });
}
function klass(id){ return /^[0-9]{5}$/.test(id) ? (+id[0]) + "-" + (+id.slice(1,3)) : "기타"; }
function klabel(k){ var a = k.split("-"); return a.length === 2 ? a[0] + "학년 " + a[1] + "반" : k; }
function num(id){ return /^[0-9]{5}$/.test(id) ? +id.slice(3,5) : 0; }
function ago(ts){
  if(!ts) return "—";
  var d = Date.now() - ts;
  if(d < 60000) return "방금";
  if(d < 3600000) return Math.floor(d/60000) + "분 전";
  if(d < 86400000) return Math.floor(d/3600000) + "시간 전";
  var t = new Date(ts);
  return (t.getMonth()+1) + "/" + t.getDate();
}
function hhmm(ts){
  if(!ts) return "";
  var t = new Date(ts);
  return t.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });
}
function view(){
  var out = rows.filter(function(r){ return !filter || klass(r.id) === filter; });
  out.sort(function(a,b){
    if(sortKey === "count") return b.count - a.count || a.id.localeCompare(b.id);
    if(sortKey === "low") return a.count - b.count || a.id.localeCompare(b.id);
    if(sortKey === "last") return (b.last||0) - (a.last||0);
    return klass(a.id).localeCompare(klass(b.id)) || num(a.id) - num(b.id) || a.id.localeCompare(b.id);
  });
  return out;
}
function stat(l, v, sub){
  return '<div class="stat"><i>' + l + '</i><b>' + v + (sub ? ' <em>' + sub + '</em>' : '') + '</b></div>';
}
function secDots(r){
  return [1,2,3,4,5].map(function(s){
    var list = QUESTS.filter(function(q){ return q.st === s; });
    var d = list.filter(function(q){ return r.done.indexOf(q.id) >= 0; }).length;
    return '<i class="' + (d === list.length ? "f" : d ? "p" : "") + '" title="' +
           SEC[s] + " " + d + "/" + list.length + '">' + s + '</i>';
  }).join("");
}
function render(){
  // 학급 칩
  var ks = {};
  rows.forEach(function(r){ var k = klass(r.id); ks[k] = ks[k] || { n:0, sum:0 }; ks[k].n++; ks[k].sum += r.count; });
  var keys = Object.keys(ks).sort();
  $("chips").innerHTML = '<button class="cchip" data-k="" aria-pressed="' + (!filter) + '">전체 <b>' +
      rows.length + '명</b></button>' +
    keys.map(function(k){
      return '<button class="cchip" data-k="' + k + '" aria-pressed="' + (filter === k) + '">' +
        klabel(k) + ' <b>' + ks[k].n + '명 · 평균 ' + (ks[k].sum/ks[k].n).toFixed(1) + '</b></button>';
    }).join("");
  Array.prototype.forEach.call($("chips").children, function(b){
    b.onclick = function(){ filter = b.dataset.k; render(); };
  });

  var v = view();
  var sum = v.reduce(function(a, r){ return a + r.count; }, 0);
  $("stats").innerHTML =
    stat("참여 학생", v.length + "명") +
    stat("평균 해금", (v.length ? (sum/v.length).toFixed(1) : "0"), "/ " + T) +
    stat("전부 모음", v.filter(function(r){ return r.count === T; }).length + "명") +
    stat("5개 미만", v.filter(function(r){ return r.count < 5; }).length + "명") +
    stat("최근 10분 활동", v.filter(function(r){ return Date.now() - r.last < 600000; }).length + "명");
  $("cnt").textContent = v.length + "명 표시 중";

  if(!v.length){
    $("table").innerHTML = '<div class="empty">아직 기록이 없습니다. 학생이 학번을 넣고 위치 관계를 하나라도 열면 여기에 나타납니다.</div>';
    $("rate").innerHTML = ""; return;
  }
  var html = '<table class="roster"><thead><tr><th>학번</th><th class="hide-sm">학급·번호</th>' +
             '<th>해금</th><th style="width:30%">진행</th><th class="hide-sm">①②③④⑤</th><th>마지막</th></tr></thead><tbody>';
  v.forEach(function(r){
    var bad = !/^[0-9]{5}$/.test(r.id);
    html += '<tr data-id="' + r.id + '">' +
      '<td class="num' + (bad ? ' warn' : '') + '">' + r.id + (bad ? ' ⚠' : '') + '</td>' +
      '<td class="hide-sm">' + (bad ? "형식 오류" : klabel(klass(r.id)) + " " + num(r.id) + "번") + '</td>' +
      '<td class="num">' + r.count + ' <span style="color:var(--ink-soft);font-weight:700">/ ' + T + '</span></td>' +
      '<td><div class="pbar"><i style="width:' + Math.round(r.count/T*100) + '%"></i></div></td>' +
      '<td class="hide-sm"><div class="dots">' + secDots(r) + '</div></td>' +
      '<td>' + ago(r.last) + '</td></tr>';
  });
  $("table").innerHTML = html + '</tbody></table>';
  Array.prototype.forEach.call($("table").querySelectorAll("tbody tr"), function(tr){
    tr.onclick = function(){ detail(tr.dataset.id); };
  });

  $("rate").innerHTML = QUESTS.map(function(q){
    var miss = v.filter(function(r){ return r.done.indexOf(q.id) < 0; });
    var n = v.length - miss.length, pc = v.length ? Math.round(n/v.length*100) : 0;
    return '<div class="qr' + (pc < 50 ? ' low' : '') + '" data-q="' + q.id + '">' +
      '<div class="sec">' + SEC[q.st] + (q.sheet ? " · 활동지 " + q.sheet + "번" : " · ★칸") + '</div>' +
      '<div class="t"><span>' + q.title + '</span><em>' + n + '명 · ' + pc + '%</em></div>' +
      '<div class="pbar"><i style="width:' + pc + '%"></i></div>' +
      (openQ === q.id
        ? '<div class="miss">아직 못 연 학생 ' + miss.length + '명<br>' +
          (miss.length ? miss.map(function(r){ return r.id; }).sort().join(", ") : "없음") + '</div>'
        : '') + '</div>';
  }).join("");
  Array.prototype.forEach.call($("rate").children, function(el){
    el.onclick = function(){ openQ = (openQ === el.dataset.q) ? null : el.dataset.q; render(); };
  });
}
function detail(id){
  var r = rows.filter(function(x){ return x.id === id; })[0];
  if(!r) return;
  var bad = !/^[0-9]{5}$/.test(id);
  var h = '<div class="top"><div><h2>' + id + '</h2><div class="meta">' +
    (bad ? "학번 형식이 올바르지 않습니다" : klabel(klass(id)) + " " + num(id) + "번") +
    ' · 해금 ' + r.count + ' / ' + T + ' · 마지막 활동 ' + ago(r.last) + '</div></div>' +
    '<button class="btn" id="close">닫기</button></div>';
  [1,2,3,4,5].forEach(function(s){
    var list = QUESTS.filter(function(q){ return q.st === s; });
    var d = list.filter(function(q){ return r.done.indexOf(q.id) >= 0; }).length;
    h += '<div class="grp"><h4>' + SEC[s] + ' <em>' + d + ' / ' + list.length + '</em></h4>';
    list.forEach(function(q){
      var ok = r.done.indexOf(q.id) >= 0;
      var extra = "";
      if(!ok && r.got && r.got[q.id] && r.got[q.id].length)
        extra = '<span class="tm">진행 ' + r.got[q.id].length + '개</span>';
      h += '<div class="item' + (ok ? ' done' : '') + '"><span class="ic">' + (ok ? "✓" : "🔒") + '</span>' +
           '<span>' + q.title + (q.star ? " ★" : "") +
           (q.sheet ? '<span class="shn">활동지 ' + q.sheet + '번</span>' : '') + '</span>' +
           (ok ? '<span class="tm">' + hhmm(r.at[q.id]) + '</span>' : extra) + '</div>';
    });
    h += '</div>';
  });
  $("sheet").innerHTML = h;
  $("modal").classList.remove("hidden");
  $("close").onclick = close;
}
function close(){ $("modal").classList.add("hidden"); }
$("modal").onclick = function(e){ if(e.target === $("modal")) close(); };
document.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });

function csv(){
  var v = view();
  var head = ["학번","학급","번호","해금수","마지막활동"].concat(QUESTS.map(function(q){ return q.title + "(" + q.st + ")"; }));
  var lines = [head.join(",")];
  v.forEach(function(r){
    var line = [r.id, klabel(klass(r.id)), num(r.id), r.count,
                r.last ? new Date(r.last).toLocaleString("ko-KR") : ""];
    QUESTS.forEach(function(q){ line.push(r.done.indexOf(q.id) >= 0 ? 1 : 0); });
    lines.push(line.map(function(x){ return '"' + String(x).replace(/"/g, '""') + '"'; }).join(","));
  });
  var blob = new Blob(["\ufeff" + lines.join("\n")], { type:"text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "위치관계-진행현황.csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}
</script>
