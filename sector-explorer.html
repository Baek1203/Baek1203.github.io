<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부채꼴 탐구실 — 원에서 부채꼴로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --grid:#E2E7EE; --surface:#FFFFFF; --ink:#17202E; --ink2:#4B5669; --line:#C9D1DC;
  --sector:#2F5BD3; --sector-soft:#DCE4F8; --rest:#EDF1F7; --arc:#E9A200; --chord:#C8246B;
  --ok:#1B7F4B; --ok-soft:#E1F3E9; --bad:#B23A1E; --bad-soft:#FBE7E1;
  --f:#5A6A80; --c:#2F5BD3; --d:#C8246B; --r:#7A5AA8;
  --memo:#FFF3C2; --memo-ink:#4A3A00; --focus:#E9A200;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --display:"Hahmlet","Nanum Myeongjo","AppleMyungjo","Noto Serif KR",serif;
  --math:"STIX Two Text","Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111923; --grid:#1B2531; --surface:#172230; --ink:#E7ECF3; --ink2:#A3AFBF; --line:#2F3C4D;
    --sector:#6F96F4; --sector-soft:#223459; --rest:#1C2736; --arc:#F5C33F; --chord:#F062A0;
    --ok:#4CC38A; --ok-soft:#173527; --bad:#F27B5F; --bad-soft:#3A1E17;
    --f:#9AA8BC; --c:#7FA2F6; --d:#F062A0; --r:#B79BE0;
    --memo:#2F2912; --memo-ink:#F2DE95; --focus:#F5C33F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111923; --grid:#1B2531; --surface:#172230; --ink:#E7ECF3; --ink2:#A3AFBF; --line:#2F3C4D;
  --sector:#6F96F4; --sector-soft:#223459; --rest:#1C2736; --arc:#F5C33F; --chord:#F062A0;
  --ok:#4CC38A; --ok-soft:#173527; --bad:#F27B5F; --bad-soft:#3A1E17;
  --f:#9AA8BC; --c:#7FA2F6; --d:#F062A0; --r:#B79BE0;
  --memo:#2F2912; --memo-ink:#F2DE95; --focus:#F5C33F; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,1.05vw + 2px,21px)}
body{
  margin:0; font-family:var(--sans); color:var(--ink); line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  min-height:100vh; display:grid; grid-template-rows:auto 1fr auto;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.m{font-family:var(--math)}
i.v,.m i{font-family:var(--math);font-style:italic}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em;font-size:.86em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .18em .08em}
.fr>span:last-child{padding:.08em .18em 0}

/* header */
.top{display:flex;align-items:center;gap:1rem;padding:.55rem 1.1rem;background:var(--surface);border-bottom:2px solid var(--ink);flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;font-size:.74rem;color:var(--ink2)}
.stepper{display:flex;gap:.25rem;flex:1;flex-wrap:wrap;justify-content:center}
.stepper button{display:flex;align-items:baseline;gap:.3rem;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.2rem .7rem .22rem .45rem;font-size:.78rem;color:var(--ink2)}
.stepper button .n{font-family:var(--math);font-weight:600;font-size:.82rem;min-width:1.1em;text-align:center}
.stepper button.seen{border-color:var(--sector);color:var(--ink)}
.stepper button[aria-current="step"]{background:var(--sector);border-color:var(--sector);color:#fff}
.tools{display:flex;gap:.4rem}
.tools button{border:1.5px solid var(--ink);background:var(--surface);border-radius:.4rem;padding:.25rem .7rem;font-size:.8rem;font-weight:600}
.tools button[aria-pressed="true"]{background:var(--memo);color:var(--memo-ink);border-color:var(--memo-ink)}

/* main */
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:1.1rem;padding:1rem 1.1rem .6rem;min-height:0;position:relative}
main.wide{grid-template-columns:1fr}
main.wide .figcol{display:none}
.figcol{display:flex;flex-direction:column;align-items:center;min-height:0;gap:.5rem}
#fig{width:100%;flex:1;min-height:260px;max-height:62vh;overflow:visible}
.views{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
.views button{border:1.5px solid var(--line);background:var(--surface);border-radius:.4rem;padding:.3rem .75rem;font-size:.82rem}
.views button[aria-pressed="true"]{border-color:var(--sector);background:var(--sector-soft);color:var(--ink);font-weight:600}
#strip{width:100%;max-width:520px}

.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:.6rem;padding:1rem 1.2rem 1.2rem;overflow:auto;min-height:0;max-height:calc(100vh - 12.5rem)}
main.wide .panel{max-height:none}
.head{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:.7rem}
.head .num{font-family:var(--math);font-weight:600;font-size:2.3rem;line-height:1;color:var(--sector);min-width:1.4ch}
.head h2{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.2;margin:0}
.head .phase{margin:.15rem 0 0;color:var(--ink2);font-size:.82rem}
.head .phase .min{border:1px solid var(--line);border-radius:.3rem;padding:0 .35rem;margin-left:.3rem;font-size:.74rem}

.qs{list-style:none;margin:0 0 .9rem;padding:0;display:grid;gap:.45rem}
.q{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start;padding:.5rem .65rem;border-left:4px solid var(--f);background:color-mix(in srgb,var(--f) 7%,transparent);border-radius:0 .35rem .35rem 0}
.q p{margin:0;font-size:1.02rem;line-height:1.5}
.q .chip{font-size:.7rem;font-weight:700;padding:.12rem .45rem;border-radius:.3rem;background:var(--f);color:#fff;white-space:nowrap;margin-top:.18rem}
.q-c{border-left-color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)} .q-c .chip{background:var(--c)}
.q-d{border-left-color:var(--d);background:color-mix(in srgb,var(--d) 8%,transparent)} .q-d .chip{background:var(--d)}
.q-r{border-left-color:var(--r);background:color-mix(in srgb,var(--r) 8%,transparent)} .q-r .chip{background:var(--r)}
.q small{display:block;color:var(--ink2);font-size:.78rem;margin-top:.1rem}

.block{margin-top:.9rem;padding-top:.8rem;border-top:1px dashed var(--line)}
.block h3{font-size:.92rem;margin:0 0 .5rem;font-weight:700}
.note{font-size:.88rem;color:var(--ink2);margin:.3rem 0}
.card{border:1.5px solid var(--line);border-radius:.5rem;padding:.7rem .85rem;background:var(--paper)}
.card.pi{border-color:var(--sector);background:var(--sector-soft)}
.card.pi p{margin:.2rem 0}
.big{font-size:1.25rem}

/* tasks */
.task{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;padding:.45rem 0}
.task label{display:flex;align-items:center;gap:.4rem;font-size:1.08rem;flex-wrap:wrap}
.task input{width:4.6em;padding:.25rem .4rem;border:1.5px solid var(--line);border-radius:.35rem;background:var(--surface);text-align:center;font-family:var(--math);font-size:1.1rem}
.task input:focus{border-color:var(--sector)}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:0}
.fin input{width:3.4em;padding:.1rem .3rem}
.fin input:first-child{border-bottom-width:1.5px;margin-bottom:3px}
.fin .fl{width:100%;height:2px;background:var(--ink);margin-bottom:3px}
.chk{border:1.5px solid var(--ink);background:var(--surface);border-radius:.35rem;padding:.22rem .7rem;font-size:.85rem;font-weight:600}
.fb{flex-basis:100%;margin:0;font-size:.88rem;min-height:0}
.task.ok input{border-color:var(--ok);background:var(--ok-soft)}
.task.ok .fb{color:var(--ok)}
.task.no .fb{color:var(--bad)}
.task.ok .chk{border-color:var(--ok);color:var(--ok)}
.tabs{display:flex;gap:.4rem;margin:.2rem 0 .4rem}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:.4rem;padding:.25rem .9rem;font-family:var(--math);font-size:1rem}
.tabs button[aria-pressed="true"]{border-color:var(--sector);background:var(--sector);color:#fff}
.choices{display:flex;flex-wrap:wrap;gap:.4rem}
.choices button{border:1.5px solid var(--line);background:var(--surface);border-radius:.4rem;padding:.35rem .75rem;font-size:.9rem;text-align:left}
.choices button[aria-pressed="true"]{border-color:var(--sector);background:var(--sector-soft);font-weight:600}
.choices button .cnt{font-family:var(--math);font-weight:600;margin-left:.4rem;color:var(--sector)}

/* builder */
.builder{border:1.5px solid var(--sector);border-radius:.55rem;padding:.8rem .9rem;background:color-mix(in srgb,var(--sector) 5%,var(--surface))}
.eq{display:flex;align-items:center;gap:.6rem;font-family:var(--math);font-size:1.6rem;flex-wrap:wrap}
.eq .lhs i{font-style:italic}
.slot{min-width:3.2em;min-height:1.7em;border:2px dashed var(--sector);border-radius:.4rem;background:var(--surface);font-family:var(--math);font-size:1.25rem;padding:0 .35rem;display:inline-flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid}
.vfrac{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.vfrac .bar{width:100%;height:2.5px;background:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:.4rem;margin:.75rem 0 .5rem}
.tile{border:1.5px solid var(--ink);background:var(--surface);border-radius:.4rem;padding:.2rem .7rem;font-family:var(--math);font-size:1.15rem;min-width:2.6em}
.tile:hover{background:var(--sector-soft)}
.brow{display:flex;gap:.5rem;flex-wrap:wrap}
.primary{border:1.5px solid var(--sector);background:var(--sector);color:#fff;border-radius:.4rem;padding:.35rem .9rem;font-weight:600;font-size:.88rem}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:.4rem;padding:.35rem .8rem;font-size:.85rem}
.vo{margin-top:.6rem}
.vgrid{display:flex;flex-wrap:wrap;gap:.35rem}
.vcell{border:1.5px solid var(--line);border-radius:.35rem;padding:.2rem .5rem;font-size:.86rem;background:var(--surface)}
.vcell.y{border-color:var(--ok);background:var(--ok-soft)}
.vcell.n{border-color:var(--bad);background:var(--bad-soft)}
.vcell b{font-family:var(--math);font-weight:600}
.vmsg{margin:.45rem 0 0;font-size:.9rem}
.vmsg.y{color:var(--ok);font-weight:600}
.vmsg.n{color:var(--bad)}
textarea{width:100%;min-height:4.2em;border:1.5px solid var(--line);border-radius:.4rem;padding:.5rem .6rem;background:var(--surface);font-size:1rem;resize:vertical}
.warn{font-size:.85rem;color:var(--bad);margin:.3rem 0 0}
.good{font-size:.85rem;color:var(--ok);margin:.3rem 0 0}

/* arc grid */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:.1rem .9rem}
.agrid .task{padding:.2rem 0}
.agrid .task label{font-size:1rem}
.agrid .task input{width:3.8em}

/* compare table */
table{border-collapse:collapse}
.cmp{width:100%;font-size:.95rem;margin-top:.5rem}
.cmp th,.cmp td{border:1.5px solid var(--line);padding:.35rem .5rem;text-align:center}
.cmp th{background:var(--paper);font-weight:600}
.cmp td.lab{text-align:left;font-weight:600}
.cmp td.y{color:var(--ok);font-weight:700}
.cmp td.n{color:var(--bad);font-weight:700}
.tw{overflow-x:auto}

/* slider */
.sl{display:grid;grid-template-columns:5.5rem 1fr 4.2rem;align-items:center;gap:.6rem;margin:.35rem 0}
.sl input[type=range]{width:100%;accent-color:var(--sector)}
.sl output{font-family:var(--math);font-size:1.15rem;font-weight:600;text-align:right}
.res{font-family:var(--math);font-size:1.3rem;line-height:1.9;margin:.4rem 0}
.res .lab{font-family:var(--sans);font-size:.85rem;color:var(--ink2);margin-right:.4rem}
.approx{font-family:var(--sans);font-size:.8rem;color:var(--ink2);margin-left:.5rem}

/* prep grid */
.prep{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.8rem}
.pcard{border:1.5px solid var(--line);border-radius:.55rem;background:var(--surface);padding:.75rem .9rem;display:flex;flex-direction:column;gap:.4rem}
.pcard .src{font-size:.74rem;color:var(--ink2);font-weight:600}
.pcard .pq{margin:0;font-size:1.02rem}
.pcard .pa{display:none;border-top:1px dashed var(--line);padding-top:.4rem;font-size:.95rem}
.pcard.open .pa{display:block}
.pcard .pa .use{display:block;color:var(--ink2);font-size:.82rem;margin-top:.2rem}
.pcard .reveal{align-self:flex-start;margin-top:auto}
.pcard svg{max-width:160px}

/* pattern table */
.pattern{padding:.2rem 1.1rem .8rem}
.pattern.hide{display:none}
.pt{width:auto;background:var(--surface);border:2px solid var(--ink);font-size:.92rem}
.pt th,.pt td{border:1.5px solid var(--line);padding:.22rem .45rem;text-align:center;min-width:5.4rem}
.pt th[scope=row]{text-align:left;font-weight:600;white-space:nowrap;background:var(--paper);min-width:9rem}
.pt thead th{font-family:var(--math);font-size:1.12rem;font-weight:600}
.pt td{font-family:var(--math);font-size:1.12rem}
.pt td.empty{color:var(--line)}
.pt .cur{background:var(--sector-soft)}
.pt .xcol{border-left:2.5px solid var(--sector)}
.pt tr.hide{display:none}
.pt caption{caption-side:top;text-align:left;font-size:.8rem;color:var(--ink2);padding-bottom:.2rem;font-weight:600}

/* memo */
.memo{position:absolute;right:1.3rem;bottom:.8rem;width:min(30rem,46%);max-height:calc(100% - 1.6rem);overflow:auto;background:var(--memo);color:var(--memo-ink);border-radius:.3rem;padding:.8rem 1rem .9rem;box-shadow:0 6px 18px rgba(40,30,0,.22);font-size:.88rem;z-index:5;transform:rotate(-.4deg)}
.memo h4{margin:0 0 .35rem;font-size:.95rem}
.memo p{margin:.3rem 0}
.memo ul{margin:.2rem 0;padding-left:1.1rem}
.memo .gen{border-top:1px dashed currentColor;margin-top:.5rem;padding-top:.4rem}
.memo .mrow{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.memo button{border:1.5px solid currentColor;background:transparent;border-radius:.35rem;padding:.2rem .6rem;font-size:.8rem;font-weight:600}
main.wide .memo{width:min(30rem,90%)}

/* overlays */
dialog{border:2px solid var(--ink);border-radius:.6rem;padding:0;max-width:min(60rem,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,26,.55)}
.dlg{padding:1.1rem 1.4rem 1.4rem;max-height:86vh;overflow:auto}
.dlg h2{font-family:var(--display);font-size:1.45rem;margin:0 0 .6rem}
.dlg h3{font-size:1rem;margin:1.1rem 0 .35rem;border-bottom:1.5px solid var(--line);padding-bottom:.2rem}
.dlg p,.dlg li{font-size:.9rem;max-width:72ch}
.dlg ol,.dlg ul{padding-left:1.2rem;margin:.3rem 0}
.dlg .qline{margin:.15rem 0}
.dlg .qline b{display:inline-block;min-width:3.4rem;font-size:.76rem;color:var(--ink2)}
.dlg .close{float:right;border:1.5px solid var(--ink);background:var(--surface);border-radius:.35rem;padding:.2rem .7rem;font-weight:600}
.dlg .gcard{border-left:4px solid var(--sector);background:var(--sector-soft);padding:.45rem .7rem;margin:.35rem 0;font-size:.92rem;border-radius:0 .3rem .3rem 0}
.dlg table{width:100%;font-size:.86rem}
.dlg td,.dlg th{border:1px solid var(--line);padding:.3rem .45rem;text-align:left;vertical-align:top}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:.4rem;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:.25rem .8rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stmt-big{position:fixed;inset:0;background:var(--surface);z-index:20;display:none;align-items:center;justify-content:center;padding:6vw}
.stmt-big.on{display:flex}
.stmt-big p{font-family:var(--display);font-size:clamp(1.6rem,3.6vw,3.4rem);line-height:1.4;max-width:30ch;margin:0}
.stmt-big button{position:absolute;top:1rem;right:1rem}

@media (min-width:901px) and (min-height:620px){
  body{height:100vh;overflow:hidden}
  main{min-height:0}
  #fig{max-height:none}
  .panel{max-height:none;height:100%}
}
@media (max-width:900px){
  body{display:block}
  main{grid-template-columns:1fr}
  .panel{max-height:none}
  #fig{max-height:48vh}
  .memo{position:static;width:auto;transform:none;margin-top:.5rem}
  .stepper{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;flex-basis:100%;order:3;padding-bottom:.2rem}
  .stepper button{flex:none}
  .brand{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>부채꼴 탐구실</h1><p>원에서 부채꼴로: 넓이와 호의 길이</p></div>
  <nav class="stepper" id="stepper" aria-label="탐구 단계"></nav>
  <div class="tools">
    <button type="button" id="btnGuide">수업 안내</button>
    <button type="button" id="btnMemo" aria-pressed="false" title="단축키 T">교사용 메모</button>
  </div>
</header>

<main id="main">
  <section class="figcol" aria-label="도형">
    <svg id="fig" viewBox="0 0 440 440" role="img" aria-label="원과 부채꼴 그림"></svg>
    <div class="views" id="views"></div>
    <div id="strip"></div>
  </section>
  <section class="panel" id="panel" aria-live="off"></section>
  <aside class="memo" id="memo" hidden></aside>
</main>

<footer class="pattern" id="pattern"></footer>

<dialog id="guide"><div class="dlg" id="guideBody"></div></dialog>
<div class="stmt-big" id="stmtBig" role="dialog" aria-label="학생 문장 크게 보기"><button class="ghost" type="button" id="stmtClose">닫기</button><p id="stmtText"></p></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const gcd=(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){[a,b]=[b,a%b];}return a||1;};
const red=(n,d)=>{const g=gcd(n,d);return [n/g,d/g];};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const PI='<span class="m">π</span>';
const V=x=>`<i class="v">${x}</i>`;
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function coef(n,d,pi=1){ // rational coefficient with π
  if(n===0) return '0';
  const [a,b]=red(n,d);
  const piS=pi===1?PI:pi===0?'':(pi===2?PI+'²':'/'+PI);
  if(b===1) return (a===1&&pi===1?'':a)+piS;
  return fr(a,b)+piS;
}
function parseNum(raw){
  if(raw==null) return NaN;
  const orig=String(raw);
  let s=orig.trim().replace(/\s+/g,'').replace(/cm²|cm\^?2|cm|㎠/gi,'').replace(/π|pi|파이|p/gi,'').replace(/[°도개배]/g,'').replace(/,/g,'');
  if(s===''&&/π|pi|파이|p/i.test(orig)) return 1;
  if(s==='') return NaN;
  let m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m){const d=parseFloat(m[2]);return d===0?NaN:parseFloat(m[1])/d;}
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  return NaN;
}
const near=(a,b,tol=1e-9)=>Math.abs(a-b)<=tol;

/* ---------- state ---------- */

function ph(str){return String(str).replace(/\{(r|D|R314|ch120|A\d+|L\d+)\}/g,(m,k)=>{const r=S.r;
  if(k==='r')return r; if(k==='D')return 2*r; if(k==='R314')return +(r*r*3.14).toFixed(2); if(k==='ch120')return (2*r*Math.sin(Math.PI/3)).toFixed(1);
  const n=+k.slice(1); return k[0]==='A'?coef(r*r*n,360):coef(2*r*n,360);});}
// render π and variables inside question text

  const slot=i=>`<button type="button" class="slot ${sl[i]?'filled':''}" data-bk="${kind}" data-i="${i}" aria-label="${['곱할 식','분자','분모'][i]} 빈칸${sl[i]?', 누르면 비워집니다':''}">${sl[i]?tileHTML(sl[i]):'&nbsp;'}</button>`;
  return `<div class="builder" id="b-${kind}">
   <div class="eq"><span class="lhs">${lhs} =</span>${slot(0)}<span>×</span><span class="vfrac">${slot(1)}<span class="bar"></span>${slot(2)}</span></div>
   <div class="tiles" role="group" aria-label="식 조각">${TILES.map(t=>`<button type="button" class="tile" data-bt="${kind}" data-t="${t}">${tileHTML(t)}</button>`).join('')}</div>
   <div class="brow"><button type="button" class="primary" data-verify="${kind}">표의 모든 경우로 확인하기</button><button type="button" class="ghost" data-bclear="${kind}">비우기</button></div>
   <div class="vo" id="vo-${kind}">${S.done.has('formula-'+kind)?verifyHTML(kind):''}</div></div>`;
}
function evalSlots(kind,a){
  const [A,B,C]=S.slots[kind].map(t=>tileVal(t,a));
  return {n:A[0]*B[0],d:C[0],pi:A[1]+B[1]-C[1]};
}
function verifyHTML(kind){
  const sl=S.slots[kind];
  if(sl.some(x=>!x)) return `<p class="vmsg n">빈칸 세 곳을 모두 채워 주세요. 식 조각을 누르면 빈칸에 들어가고, 빈칸을 누르면 비워집니다.</p>`;
  let all=true; const cells=CASES.map(a=>{
    const v=evalSlots(kind,a); const exp=kind==='area'?[S.r*S.r*a,360]:[2*S.r*a,360];
    const ok=v.pi===1&&near(v.n/v.d,exp[0]/exp[1]); if(!ok) all=false;
    return `<span class="vcell ${ok?'y':'n'}">${a}° → <b>${coef(v.n,v.d,v.pi)}</b> ${ok?'✓':'✗ (표: '+coef(exp[0],exp[1])+')'}</span>`;
  }).join('');
  let msg='';
  if(all){ msg=kind==='area'
      ?'<p class="vmsg y">표의 일곱 가지 경우에 모두 맞습니다.</p>'
      :(sl[0]==='2πr'&&sl[2]==='360'?'<p class="vmsg y">표의 일곱 가지 경우에 모두 맞습니다.</p>':'<p class="vmsg y">모든 경우에 맞습니다. 교과서의 식 2πr × x/360과 같은 식인지 설명해 보세요.</p>');
  } else {
    if(sl[1]==='360'&&sl[2]==='x') msg='<p class="vmsg n">분자와 분모가 바뀌지 않았나요? x가 360보다 작으면 360/x는 1보다 커서 원보다 큰 부채꼴이 됩니다.</p>';
    else if(kind==='area'&&sl[0]!=='πr²') msg=`<p class="vmsg n">${tileHTML(sl[0])}는 무엇을 나타내는 식인가요? 넓이의 기준이 되는 ‘전체’는 무엇일까요?</p>`;
    else if(kind==='arc'&&sl[0]==='πr²') msg='<p class="vmsg n">πr²은 원의 넓이예요. 호의 길이의 기준이 되는 ‘전체’는 무엇일까요?</p>';
    else if(sl[2]==='180') msg='<p class="vmsg n">180°는 반원의 중심각이에요. 원 전체를 기준으로 하면?</p>';
    else msg='<p class="vmsg n">✗가 있는 칸을 보고 식의 어느 부분을 바꿀지 생각해 보세요.</p>';
  }
  return `<div class="vgrid">${cells}</div>${msg}`;
}
function runVerify(kind){
  const sl=S.slots[kind]; const box=$('#vo-'+kind);
  if(!sl.some(x=>!x)){
    const all=CASES.every(a=>{const v=evalSlots(kind,a);const exp=kind==='area'?S.r*S.r*a/360:2*S.r*a/360;return v.pi===1&&near(v.n/v.d,exp);});
    if(all) S.done.add('formula-'+kind); else S.done.delete('formula-'+kind);
    renderTable();
  }
  box.innerHTML=verifyHTML(kind);
}

function stmtCheck(s){
  if(!s.trim()) return '';

  const kw=['중심각','360','원','몇 분의 몇','비율','넓이'].filter(k=>s.includes(k)).length;

  if(nums.length) h+=`<p class="warn">특정한 수(${[...new Set(nums)].join(', ')})가 들어 있어요. 다른 원, 다른 중심각에서도 참인 문장인가요?</p>`;
  if(kw<2) h+='<p class="warn">제시한 낱말을 두 개 이상 넣어 보세요.</p>';
  if(!h) h='<p class="good">조건을 지켰습니다. 짝의 문장과 비교해 보세요.</p>';
  return h;
}

   <tbody>
    <tr><th scope="row">원의 몇 분의 몇</th>${cs.map(a=>tdc(a,fracCell(a))).join('')}${showX?`<td class="xcol ${xS?'':'empty'}">${xS?fr('<i>x</i>',360):'?'}</td>`:''}</tr>
    <tr><th scope="row">넓이 (cm²)</th>${cs.map(a=>tdc(a,cell('area-'+a,coef(S.r*S.r*a,360)))).join('')}${showX?`<td class="xcol ${xS?'':'empty'}">${xS?`π<i>r</i>² × ${fr('<i>x</i>',360)}`:'?'}</td>`:''}</tr>
    <tr class="${showArc?'':'hide'}"><th scope="row">호의 길이 (cm)</th>${cs.map(a=>tdc(a,cell('arc-'+a,coef(2*S.r*a,360)))).join('')}${showX?`<td class="xcol ${xL?'':'empty'}">${arcX}</td>`:''}</tr>
   </tbody></table></div>`;
}

/* ---------- memo & guide ---------- */
function renderMemo(){
  const m=$('#memo'); if(!S.memo){m.hidden=true;return;}
  const st=STAGES[S.stage]; m.hidden=false;
  const fill=['prep','edge','free'].includes(st.key)?'':`<button type="button" id="fillAns">이 단계 정답 채우기</button>`;
  m.innerHTML=`${ph(MEMO[st.key]||'')}<div class="mrow">${fill}<button type="button" id="memoClose">메모 닫기</button></div>`;
}
const FILL={
 c360:['area-360','approx-360'],c180:['frac-180','area-180'],c120:['count-120','frac-120','area-120'],
 c9060:['count-90','frac-90','area-90','count-60','frac-60','area-60'],c240:['count-240','times-240','frac-240','area-240'],
 c100:['frac-1','frac-100','area-100'],genA:['@area'],arc:CASES.map(a=>'arc-'+a).concat('@arc')
};
function fillAnswers(){
  const keys=FILL[STAGES[S.stage].key]||[];
  keys.forEach(k=>{
    if(k==='@area'){S.slots.area=['πr²','x','360'];S.done.add('formula-area');return;}
    if(k==='@arc'){S.slots.arc=['2πr','x','360'];S.done.add('formula-arc');return;}
    const [t,a]=k.split('-'); const e=expected(k);
    if(t==='frac'){const [n,d]=red(+a,360);S.entries[k]=[String(n),String(d)];}
    else if(t==='arc'||t==='area'){const [n,d]=red(t==='arc'?2*S.r*+a:S.r*S.r*+a,360);S.entries[k]=d===1?String(n):`${n}/${d}`;}
    else S.entries[k]=String(+e.toFixed(2));
    S.done.add(k); if(k==='area-360') onSolved(k);
  });
  render();
}
function guideHTML(){
  const qlist=STAGES.slice(1).map((st,i)=>{
    const qs=QS[st.key]||[]; return `<li><b>${st.short}</b> ${st.title} <span style="color:var(--ink2)">(${st.phase}, ${st.min}분)</span>${qs.map(q=>`<div class="qline"><b>${TYPE[q.t]}</b>${qfmt(q.q)}</div>`).join('')}</li>`;}).join('');
  return `<button type="button" class="close" id="guideClose">닫기</button>
  <h2>수업 안내 (교사용)</h2>
  <h3>차시의 위치</h3>
  <p><b>[9수03-06]</b> 부채꼴의 중심각과 호의 관계를 이해하고, 이를 이용하여 부채꼴의 호의 길이와 넓이를 구할 수 있다.</p>
  <p>교과서: 비상교육 중학 수학 1, Ⅴ-1 평면도형의 성질 &gt; 02 원과 부채꼴. 7차시(부채꼴의 성질, 196~197쪽) 다음의 8차시(부채꼴의 호의 길이와 넓이, 198~199쪽)에 해당합니다. 연결되는 학습: 초6 [6수03-16] 원주와 원의 넓이, 초6 비와 비율, 중1 [9수02-07] 정비례.</p>
  <h3>개념적 렌즈와 개념</h3>
  <p><b>렌즈: 구조</b> (단원 렌즈와 같음). 부채꼴을 ‘원이라는 전체의 한 부분’으로 보고, 부분과 전체를 잇는 비율이 넓이와 호의 길이에 똑같이 작동하는 구조를 탐구합니다.</p>
  <table><tr><th>매크로</th><td>구조, 측정</td></tr><tr><th>메소</th><td>비율(부분과 전체), 정비례</td></tr><tr><th>마이크로</th><td>부채꼴, 중심각, 호, 반지름, 원주율 π</td></tr></table>
  <p style="margin-top:.5rem"><b>개념: 중심각으로 정해지는 양</b><br>예시: 호의 길이, 부채꼴의 넓이 / 비예시: 현의 길이, 부채꼴의 둘레(호 + 반지름 2개)<br>판별 기준: 한 원에서 중심각이 2배, 3배가 될 때 함께 2배, 3배가 되는가 (9단계에서 탐구)</p>
  <h3>향하는 일반화 (학생에게 먼저 제시하지 않습니다)</h3>
  <div class="gcard"><b>G1 (L2)</b> ${G1}</div><div class="gcard"><b>G2 (L3)</b> ${G2}</div>
  <p>영역 핵심 아이디어와의 정렬: ‘측정은 … 양을 수치화함으로써 … 문제를 해결하는 데 활용된다’의 단원 수준 사례이며, 직선으로 재기 어려운 곡선 도형의 양을 전체에 대한 비율로 수치화합니다.</p>
  <h3>단계별 탐구질문</h3><ol start="1">${qlist}</ol>
  <h3>선수학습 점검 문항</h3><ol>${PREP.map(p=>`<li>${p.q} <span style="color:var(--ink2)">[${p.src}]</span> 답: ${p.a}</li>`).join('')}</ol>
  <h3>3범주와 역량</h3>
  <table>
   <tr><th>지식·이해</th><td>평면도형의 성질 (부채꼴의 호의 길이와 넓이)</td></tr>
   <tr><th>과정·기능</th><td>도형의 길이, 넓이, 겉넓이, 부피 구하기 / 도형의 성질 설명하기 / 구체적인 모형이나 공학 도구 이용하기</td></tr>
   <tr><th>가치·태도</th><td>다양한 정당화 방법을 이용하여 체계적으로 사고하고 타인을 합리적으로 설득하려는 태도 (5단계: 120°의 2배와 원의 몇 분의 몇, 두 방법 비교)</td></tr>
   <tr><th>교과 역량</th><td>추론(사례에서 규칙을 추측하고 표로 검증), 연결(초6 원의 넓이·비율, 7차시 정비례), 의사소통(일반화 문장 진술), 정보처리(공학 도구)</td></tr></table>
  <h3>교육과정 범위 점검</h3>
  <ul><li>π는 교과서 198쪽에서 이 차시에 도입하는 기호이므로 1단계에서 도입합니다.</li>
   <li>현의 길이는 제곱근 없이 측정값(약 10.4 cm)으로만 제시합니다(제곱근은 중3).</li>
   <li>복잡하게 변형된 평면도형의 넓이와 둘레는 다루지 않습니다(단원 지도상의 유의점).</li>
   <li>S = ½rl은 교과서 199쪽 후속 내용으로, 10단계에서 선택적으로만 연결합니다.</li></ul>
  <h3>설계 점검</h3>
  <p>일반화 G1은 개념 2개 이상, 현재시제, [원리] 태그, L2를 충족합니다. 학생 화면에는 일반화 문장이 나타나지 않고, 7단계에서 학생이 직접 문장과 식을 만든 뒤 표로 검증합니다. 3범주와 가치·태도(원문 인용), 성취기준 [9수03-06]을 모두 포함하며, 정비례 [9수02-07]과 묶여 도형과 측정의 ‘측정’ 핵심 아이디어에 기여합니다.</p>
  <h3>설정과 조작</h3>
  <p>반지름: <span class="seg" role="group" aria-label="반지름 선택"><button type="button" data-setr="6" aria-pressed="${S.r===6}">6 cm</button><button type="button" data-setr="12" aria-pressed="${S.r===12}">12 cm</button></span> (바꾸면 입력한 답이 모두 지워집니다)</p>
  <p>키보드: ← → 단계 이동, T 교사용 메모 열고 닫기.</p>`;
}

/* ---------- render ---------- */
function renderStepper(){
  $('#stepper').innerHTML=STAGES.map((st,i)=>`<button type="button" data-go="${i}" class="${S.seen.has(i)?'seen':''}" ${i===S.stage?'aria-current="step"':''}><span class="n">${i}</span><span>${st.short}</span></button>`).join('');
}
function render(){
  const st=STAGES[S.stage];
  $('#main').classList.toggle('wide',st.key==='prep');
  renderStepper();
  const panel=$('#panel');
  panel.innerHTML=`<div class="head"><span class="num">${S.stage}</span><div><h2>${st.title}</h2><p class="phase">${st.phase}<span class="min">${st.min}분</span></p></div></div>`+
   ((QS[st.key]||[]).length?`<ol class="qs">${QS[st.key].map(q=>`<li class="q q-${q.t}"><span class="chip">${TYPE[q.t]}</span><p>${qfmt(q.q)}${q.s?`<small>${qfmt(q.s)}</small>`:''}</p></li>`).join('')}</ol>`:'')+
   R_[st.key]();
  renderViews(); renderTable(); renderMemo();
  if(st.key!=='prep') refreshFig();
}
function go(i){
  if(i<0||i>=STAGES.length) return;
  S.stage=i; S.seen.add(i);
  const st=STAGES[i];
  if(st.key==='free'&&!S.views.free) S.views.free={arcHi:true};
  render(); $('#panel').scrollTop=0;
}

/* ---------- events ---------- */
$('#stepper').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go);});
$('#btnMemo').addEventListener('click',()=>{S.memo=!S.memo;$('#btnMemo').setAttribute('aria-pressed',S.memo);renderMemo();});
$('#memo').addEventListener('click',e=>{
  if(e.target.id==='memoClose'){S.memo=false;$('#btnMemo').setAttribute('aria-pressed','false');renderMemo();}
  if(e.target.id==='fillAns') fillAnswers();
});
const guide=$('#guide');
$('#btnGuide').addEventListener('click',()=>{$('#guideBody').innerHTML=guideHTML();if(guide.showModal)guide.showModal();else guide.setAttribute('open','');});
guide.addEventListener('click',e=>{
  if(e.target===guide||e.target.id==='guideClose'){guide.close?guide.close():guide.removeAttribute('open');return;}
  const b=e.target.closest('[data-setr]'); if(b){const nr=+b.dataset.setr; if(nr!==S.r){S.r=nr;S.free.r=nr;S.done.clear();S.entries={};S.slots={area:[null,null,null],arc:[null,null,null]};}
    $('#guideBody').innerHTML=guideHTML(); render();}
});
const panel=$('#panel');
panel.addEventListener('click',e=>{
  const t=e.target;
  const chk=t.closest('.chk'); if(chk){checkTask(chk.closest('.task'));return;}
  const rev=t.closest('[data-rev]'); if(rev){const c=$('#pc'+rev.dataset.rev);c.classList.toggle('open');rev.textContent=c.classList.contains('open')?'정답 숨기기':'정답 보기';return;}
  const sub=t.closest('[data-sub]'); if(sub){S.sub=+sub.dataset.sub;render();return;}
  const p=t.closest('[data-p240]'); if(p){S.pred240=+p.dataset.p240;panel.querySelectorAll('[data-p240]').forEach(b=>b.setAttribute('aria-pressed',b===p));return;}
  const tile=t.closest('[data-bt]'); if(tile){const k=tile.dataset.bt;const sl=S.slots[k];const i=sl.indexOf(null);if(i>-1){sl[i]=tile.dataset.t;S.done.delete('formula-'+k);rerenderBuilder(k);renderTable();}else{$('#vo-'+k).innerHTML='<p class="vmsg n">빈칸이 모두 찼어요. 바꾸고 싶은 빈칸을 눌러 비운 뒤 넣으세요.</p>';}return;}
  const slot=t.closest('[data-bk]'); if(slot){const k=slot.dataset.bk;S.slots[k][+slot.dataset.i]=null;S.done.delete('formula-'+k);rerenderBuilder(k);renderTable();return;}
  const ver=t.closest('[data-verify]'); if(ver){runVerify(ver.dataset.verify);return;}
  const cl=t.closest('[data-bclear]'); if(cl){const k=cl.dataset.bclear;S.slots[k]=[null,null,null];S.done.delete('formula-'+k);rerenderBuilder(k);renderTable();return;}
  if(t.id==='stmtShow'){if(!S.stmt.trim())return;$('#stmtText').textContent=S.stmt;$('#stmtBig').classList.add('on');$('#stmtClose').focus();return;}
  const pl=t.closest('[data-poll]'); if(pl){const v=pl.dataset.poll;if(v==='reset')S.poll=[0,0,0];else S.poll[+v]++;render();return;}
  const bp=t.closest('[data-bp]'); if(bp){const i=+bp.dataset.bp;S.bPick.has(i)?S.bPick.delete(i):S.bPick.add(i);bp.setAttribute('aria-pressed',S.bPick.has(i));return;}
  if(t.id==='bShow'){S.bShow=!S.bShow;$('#bOut').innerHTML=S.bShow?edgeTable():'';t.textContent=S.bShow?'결과 숨기기':'결과 보기';return;}
  const pre=t.closest('[data-pre]'); if(pre){const [r,x]=pre.dataset.pre.split(',').map(Number);S.free.r=r;S.free.x=x;$('#fr').value=r;$('#fx').value=x;$('#frO').textContent=r+' cm';$('#fxO').textContent=x+'°';$('#freeOut').innerHTML=freeOut();refreshFig();return;}
  const hb=t.closest('#halfBtn'); if(hb){S.free.half=!S.free.half;hb.setAttribute('aria-pressed',S.free.half);$('#freeOut').innerHTML=freeOut();return;}
});
panel.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.task input')){e.preventDefault();checkTask(e.target.closest('.task'));}});
panel.addEventListener('input',e=>{
  if(e.target.id==='stmt'){S.stmt=e.target.value;$('#stmtChk').innerHTML=stmtCheck(S.stmt);}
  if(e.target.id==='fr'||e.target.id==='fx'){S.free.r=+$('#fr').value;S.free.x=+$('#fx').value;$('#frO').textContent=S.free.r+' cm';$('#fxO').textContent=S.free.x+'°';$('#freeOut').innerHTML=freeOut();S.disp=S.free.x;drawFig(S.free.x);}
});
panel.addEventListener('focusin',e=>{const t=e.target.closest('.task[data-angle]');if(t&&STAGES[S.stage].key==='arc'){const a=+t.dataset.angle;if(a!==S.arcSel){S.arcSel=a;refreshFig();renderTable();}}});
$('#stmtClose').addEventListener('click',()=>$('#stmtBig').classList.remove('on'));
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(guide.open) return;
  if(e.key==='Escape'){$('#stmtBig').classList.remove('on');return;}
  if(e.key==='ArrowRight'){go(S.stage+1);} else if(e.key==='ArrowLeft'){go(S.stage-1);}
  else if(e.key==='t'||e.key==='T'||e.key==='ㅅ'){S.memo=!S.memo;$('#btnMemo').setAttribute('aria-pressed',S.memo);renderMemo();}
});
if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');const f=()=>{if(STAGES[S.stage].key!=='prep')drawFig(S.disp);};mq.addEventListener?mq.addEventListener('change',f):mq.addListener(f);}
new MutationObserver(()=>{if(STAGES[S.stage].key!=='prep')drawFig(S.disp);}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

render();
})();
</script>
</body>
</html>
