<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>테이크 잇 이지</title>
<style>
  :root{
    --bg:#14181f; --panel:#1e242e; --panel2:#252c38; --line:#2f3746;
    --ink:#e8ebf0; --mute:#828d9f; --white:#ffffff;
    --ok:#3fbf6f; --warn:#f2b134; --bad:#e2574c;
    --c1:#8a8f98; --c5:#2f6fd0; --c9:#c62828;
    --c2:#1b7f3b; --c6:#e07b00; --c7:#7b2fbe;
    --c3:#8d5a00; --c4:#d81b7a; --c8:#00767f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    user-select:none; -webkit-user-select:none; -ms-user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",Roboto,"Helvetica Neue",sans-serif;
    font-size:15px; line-height:1.5; overflow:hidden;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input{font:inherit; user-select:text; -webkit-user-select:text}
  svg,svg text{user-select:none; -webkit-user-select:none}
  .hidden{display:none !important}

  /* ---------- 공통 ---------- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
  .btn{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    padding:11px 18px; border-radius:9px; font-weight:600; transition:background .12s;
  }
  .btn:hover{background:#2f3846}
  .btn:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.primary{background:var(--white);color:#14181f;border-color:var(--white)}
  .btn.primary:hover{background:#dfe4ec}
  .btn.big{padding:16px 30px;font-size:18px;border-radius:11px}
  .field{display:block;width:100%;background:#11151c;border:1px solid var(--line);
    color:var(--ink);padding:12px 14px;border-radius:9px;margin-top:7px}
  .field:focus{outline:none;border-color:#5b7fb8}
  label.lab{display:block;margin-top:16px;font-size:13px;color:var(--mute)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
  .err{color:var(--bad);font-size:13.5px;margin-top:12px;min-height:20px}

  /* ---------- 시작 화면 ---------- */
  #home{align-items:center;justify-content:center;overflow:auto}
  .homewrap{width:100%;max-width:430px;padding:28px}
  .brand{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:0}
  .brandsub{color:var(--mute);margin:6px 0 26px;font-size:14px}
  .rolerow{display:flex;gap:10px;margin-bottom:4px}
  .rolerow .btn{flex:1;justify-content:center;text-align:center}
  .rolerow .btn[aria-pressed="true"]{background:var(--white);color:#14181f;border-color:var(--white)}
  .modetag{margin-top:20px;font-size:12.5px;color:var(--mute)}

  /* ---------- 교사 ---------- */
  #teacher{padding:18px 22px;gap:16px}
  .thead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .code{font-size:15px;color:var(--mute)}
  .code b{color:var(--ink);font-size:26px;letter-spacing:5px;font-weight:800;margin-left:8px;
    font-variant-numeric:tabular-nums}
  .tbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;min-height:0}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0;padding:20px}
  .roundnum{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
  .roundnum b{color:var(--ink);font-size:40px;font-weight:800;margin:0 3px}
  .bigtile{width:min(44vh,380px);aspect-ratio:1/.866}
  .tclock{display:flex;align-items:center;gap:18px;width:min(100%,560px)}
  .tclock .num{font-size:clamp(34px,6.5vh,60px);font-weight:800;font-variant-numeric:tabular-nums;
    min-width:3.4ch;text-align:right;line-height:1;transition:color .3s}
  .tclock .num.over{color:var(--bad)}
  .tclock .sec{font-size:17px;color:var(--mute);margin-left:-6px;flex:0 0 auto}
  .tclock .bar{flex:1 1 auto;height:16px;background:#0d1117;border:1px solid var(--line);
    border-radius:9px;overflow:hidden;min-width:120px}
  .tclock .fill{height:100%;width:0%;background:var(--ok);transition:width .1s linear,background .3s}
  .tprog{font-size:16px;color:var(--mute)}
  .tprog b{color:var(--ink);font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
  .tprog.all b{color:var(--ok)}
  .aichips{display:flex;gap:6px}
  .chip{flex:1;padding:7px 4px;border:1px solid var(--line);border-radius:8px;
    background:#11151c;color:var(--mute);text-align:center;line-height:1.25}
  .chip b{display:block;font-size:14px;font-weight:800}
  .chip i{display:block;font-size:11px;font-style:normal;opacity:.75}
  .chip:hover{background:#1b2029}
  .chip[aria-pressed="true"]{background:#2b3a52;border-color:#47618c;color:var(--ink)}
  .aiview{width:100%;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
  .aitop{display:flex;align-items:center;gap:16px;flex:0 0 auto}
  .aitop .call{font-size:24px;font-weight:800;letter-spacing:4px;font-variant-numeric:tabular-nums;min-width:6.5ch}
  .aitop .bar{flex:1;height:11px;background:#0d1117;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .aitop .fill{height:100%;width:0%;background:var(--ok);transition:width .1s linear,background .3s}
  .aitop .num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
  .aiboards{flex:1;min-height:0;display:flex;gap:12px;justify-content:center}
  .aicard{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px}
  .aicard svg{width:100%;flex:1;min-height:0}
  .aihead{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
  .aihead .nm{font-weight:800}
  .aihead .sc{color:#ffd166;font-weight:800;font-variant-numeric:tabular-nums}
  .aihead .pg{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
  .aistep{flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .aistep input[type=range]{flex:1;accent-color:#6ea8ff}
  .aistep .lab{font-size:13px;color:var(--mute);min-width:9ch;font-variant-numeric:tabular-nums}
  .aistep .btn{padding:7px 12px;font-size:13px}
  .badge{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:4px;
    background:#3a4a66;color:#cfe0ff;letter-spacing:.5px}
  .stageinner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%}
  .rankpanel{width:100%;height:100%;display:flex;flex-direction:column;gap:12px;min-height:0}
  .rankhead{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  .rankhead .t{font-size:27px;font-weight:800}
  .rankhead .m{font-size:15px;color:var(--mute)}
  .rankcols{flex:1;min-height:0;overflow:auto;column-gap:20px;column-count:2}
  .rkline{break-inside:avoid;display:flex;align-items:center;gap:11px;padding:8px 13px;
    border-radius:9px;background:var(--panel2);margin-bottom:6px;font-size:16px}
  .rkline .no{min-width:2.2ch;text-align:right;font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
  .rkline .sid{color:var(--mute);font-variant-numeric:tabular-nums;min-width:5ch;font-size:14px}
  .rkline .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rkline .sc{font-weight:800;font-variant-numeric:tabular-nums}
  .rkline.top{background:#3a3520;border:1px solid #6d5f2a}
  .rkline.top .no,.rkline.top .sc{color:#ffd166}
  .rkline.wait{opacity:.55}
  .rkline.wait .sc{font-weight:600;color:var(--mute);font-size:14px}
  .callout{font-size:clamp(28px,5vh,46px);font-weight:800;letter-spacing:6px;font-variant-numeric:tabular-nums}
  .side{display:flex;flex-direction:column;gap:14px;min-height:0}
  .sidebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:0;display:flex;flex-direction:column}
  .sidebox h3{margin:0 0 10px;font-size:13px;color:var(--mute);font-weight:600}
  .plist{overflow:auto;display:flex;flex-direction:column;gap:5px}
  .prow{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--panel2);border-radius:8px;font-size:13.5px}
  .prow .sid{color:var(--mute);font-variant-numeric:tabular-nums;min-width:42px}
  .prow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .pg{color:var(--mute);font-variant-numeric:tabular-nums}
  .prow.done .pg{color:var(--ok);font-weight:700}

  /* ---------- 학생 ---------- */
  #play{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:18px 20px}
  .boardpane{display:flex;flex-direction:column;gap:12px;min-height:0}
  .bhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--mute)}
  .bhead .who{color:var(--ink);font-weight:700;font-size:15px}
  .boardwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  #board{width:100%;height:100%;max-height:100%;touch-action:manipulation}
  .cell{cursor:pointer}
  .cell .hit{fill:transparent}
  .cell.open:hover .slot{fill:#39445a}
  .cell.target .slot{fill:#54668c}
  .rightpane{display:flex;flex-direction:column;gap:14px;min-height:0}
  .nowbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .nowtile{width:190px;aspect-ratio:1/.866;position:relative;touch-action:none}
  .nowtile.draggable{cursor:grab}
  .nowtile.dragging{cursor:grabbing}
  body.dragging{cursor:grabbing}
  .nowtile.dragging{opacity:.25}
  .timerline{width:100%;height:7px;background:#11151c;border-radius:4px;overflow:hidden}
  .timerfill{height:100%;width:100%;background:var(--ok);transition:width .1s linear,background .3s}
  .timertext{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
  .nowhint{font-size:12.5px;color:var(--mute);text-align:center;min-height:18px}
  .tracker{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;
    flex:1;min-height:0;display:flex;flex-direction:column}
  .tracker h3{margin:0 0 9px;font-size:12.5px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
  .tgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;overflow:auto;align-content:start}
  .tgrid .mini{width:100%;aspect-ratio:1/.866}
  .tgrid .mini.used{opacity:.17}
  .actions{display:flex;gap:8px}
  .actions .btn{flex:1;padding:10px;text-align:center;font-size:13.5px}
  #ghost{position:fixed;width:190px;aspect-ratio:1/.866;pointer-events:none;z-index:99;
    transform:translate(-50%,-50%);filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));
    transition:left .06s ease-out, top .06s ease-out}

  /* ---------- 결과 ---------- */
  #result{align-items:center;justify-content:center;overflow:auto;padding:24px}
  .rwrap{width:100%;max-width:940px}
  .rtop{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .rscore{font-size:60px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .ceilbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 16px;min-width:215px}
  .ceilbox .lab{font-size:12.5px;color:var(--mute)}
  .ceilbox .val{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;color:#ffd166;line-height:1.2}
  .ceilbox .sub{font-size:13px;color:var(--mute)}
  .rgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
  @media(max-width:820px){.rgrid{grid-template-columns:1fr}}
  .lines{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow:auto}
  .lrow{display:flex;justify-content:space-between;background:var(--panel2);padding:7px 11px;border-radius:7px;font-size:13.5px}
  .rank{display:flex;flex-direction:column;gap:5px;max-height:340px;overflow:auto}
  .rkrow{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:8px 11px;border-radius:8px;font-size:14px}
  .rkrow .no{min-width:26px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
  .rkrow.me{background:#33405a}
  .rkrow .sc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#0d1117;border:1px solid var(--line);padding:11px 20px;border-radius:10px;
    font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}

  @media(max-width:900px){
    #play{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;overflow:auto}
    .rightpane{flex-direction:row;align-items:stretch}
    .nowbox{flex:0 0 190px}
    .tracker{flex:1}
    .tbody{grid-template-columns:1fr}
    .side{display:none}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<!-- =================== 시작 =================== -->
<section class="screen" id="home">
  <div class="homewrap">
    <h1 class="brand">테이크 잇 이지</h1>
    <p class="brandsub">같은 타일을 받아 각자 판을 채우고, 끝에서 끝까지 이어진 줄로 점수를 냅니다.</p>

    <div class="card">
      <div class="rolerow">
        <button class="btn" id="roleStudent" aria-pressed="true">학생</button>
        <button class="btn" id="roleTeacher" aria-pressed="false">교사</button>
      </div>

      <div id="studentForm">
        <label class="lab" for="inSid">학번</label>
        <input class="field" id="inSid" inputmode="numeric" placeholder="10203" autocomplete="off">
        <label class="lab" for="inName">이름</label>
        <input class="field" id="inName" placeholder="김수학" autocomplete="off">
        <label class="lab" for="inCode">방 번호</label>
        <input class="field" id="inCode" inputmode="numeric" maxlength="4" placeholder="교사 화면에 뜬 네 자리" autocomplete="off">
        <div class="err" id="joinErr"></div>
        <button class="btn primary big" id="btnJoin" style="width:100%">들어가기</button>
      </div>

      <div id="teacherForm" class="hidden">
        <label class="lab" for="inCodeT">방 번호</label>
        <input class="field" id="inCodeT" inputmode="numeric" maxlength="4" placeholder="네 자리 숫자" autocomplete="off">
        <div id="pwWrap">
          <label class="lab" for="inPw">교사 비밀번호</label>
          <input class="field" id="inPw" type="password" autocomplete="current-password" placeholder="미리 정해 둔 비밀번호">
        </div>
        <div class="err" id="hostErr"></div>
        <button class="btn primary big" id="btnHost" style="width:100%">방 열기</button>
      </div>

      <p class="modetag" id="modeTag"></p>
    </div>
  </div>
</section>

<!-- =================== 교사 =================== -->
<section class="screen hidden" id="teacher">
  <div class="thead">
    <div class="code">방 번호 <b id="tCode">0000</b></div>
    <div class="roundnum"><b id="tRound">0</b>/ 19</div>
    <div style="flex:1"></div>
    <button class="btn" id="btnAi">AI 판 보기</button>
    <button class="btn" id="btnRank">순위 보기</button>
    <button class="btn" id="btnReset">새 게임</button>
    <button class="btn primary big" id="btnDraw">타일 뽑기</button>
  </div>
  <div class="tbody">
    <div class="stage">
     <div class="stageinner" id="tPlayView">
      <div class="callout" id="tCall">시작 준비</div>
      <div class="bigtile" id="tBig"></div>
      <div class="tclock" id="tClock" style="visibility:hidden">
        <div class="num" id="tNum">20.0</div><div class="sec">초</div>
        <div class="bar"><div class="fill" id="tFill"></div></div>
      </div>
      <div class="tprog" id="tProg">타일을 놓은 학생 <b>0</b> / 0</div>
      <div class="roundnum" id="tSub">타일 뽑기를 누르면 학생 화면에 나타납니다</div>
     </div>
     <div class="aiview" id="tAiView" style="display:none">
       <div class="aitop">
         <span class="call" id="tAiCall">—</span>
         <div class="bar"><div class="fill" id="tAiFill"></div></div>
         <span class="num" id="tAiNum">—</span>
       </div>
       <div class="aiboards" id="tAiBoards"></div>
       <div class="aistep">
         <button class="btn" id="aiFirst">처음</button>
         <button class="btn" id="aiPrev">◀</button>
         <input type="range" id="aiRange" min="0" max="19" value="19">
         <button class="btn" id="aiNext">▶</button>
         <button class="btn" id="aiLastBtn">최신</button>
         <span class="lab" id="aiStepLab">19수</span>
       </div>
     </div>
     <div class="rankpanel" id="tRankView" style="display:none">
       <div class="rankhead"><span class="t">순위</span><span class="m" id="tRankMeta"></span></div>
       <div class="rankcols" id="tRankList"></div>
     </div>
    </div>
    <div class="side">
      <div class="sidebox" style="flex:0 0 auto">
        <h3>AI 참가 <span id="aiNote">꺼짐</span></h3>
        <div class="aichips">
          <button class="chip" data-ai="zero" aria-pressed="false"><b>제로</b><i>모험</i></button>
          <button class="chip" data-ai="nova" aria-pressed="false"><b>노바</b><i>균형</i></button>
          <button class="chip" data-ai="lumen" aria-pressed="false"><b>루멘</b><i>집중</i></button>
        </div>
      </div>
      <div class="sidebox" style="flex:1">
        <h3>접속한 학생 <span id="tCount">0명</span></h3>
        <div class="plist" id="tPlayers"></div>
      </div>
      <div class="sidebox" style="flex:0 0 auto">
        <h3>남은 타일 <span id="tLeft">27장</span></h3>
        <div class="tgrid" id="tTracker" style="grid-template-columns:repeat(7,minmax(0,1fr))"></div>
        <button class="btn" id="btnCopySeqT" style="margin-top:10px;padding:8px;font-size:13px">타일 순서 복사</button>
      </div>
    </div>
  </div>
</section>

<!-- =================== 학생 플레이 =================== -->
<section class="screen hidden" id="play">
  <div class="boardpane">
    <div class="bhead">
      <span class="who" id="pWho">—</span>
      <span id="pRound">0 / 19</span>
      <span id="pFilled">놓은 타일 0칸</span>
    </div>
    <div class="boardwrap"><svg id="board" viewBox="0 0 400 433" role="img" aria-label="게임판"></svg></div>
  </div>
  <div class="rightpane">
    <div class="nowbox">
      <div class="nowtile" id="pNow"></div>
      <div class="timerline"><div class="timerfill" id="pFill"></div></div>
      <div class="timertext" id="pTime">대기 중</div>
      <div class="nowhint" id="pHint">교사가 타일을 뽑기를 기다리는 중입니다.</div>
      <div class="actions">
        <button class="btn" id="btnUndo" disabled>취소</button>
      </div>
    </div>
    <div class="tracker">
      <h3><span>전체 타일</span><span id="pLeft">27장 남음</span></h3>
      <div class="tgrid" id="pTracker"></div>
    </div>
  </div>
</section>

<!-- =================== 결과 =================== -->
<section class="screen hidden" id="result">
  <div class="rwrap">
    <div class="rtop">
      <div>
        <div style="color:var(--mute);font-size:14px" id="rWho">—</div>
        <div class="rscore" id="rScore">0</div>
      </div>
      <div style="color:var(--mute);font-size:14px" id="rNote"></div>
      <div style="flex:1"></div>
      <div class="ceilbox">
        <div class="lab">이 판에서 가능한 최고점 (탐색값)</div>
        <div class="val" id="rCeil">계산 중…</div>
        <div class="sub" id="rCeilSub">잠시만 기다려 주세요</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">

<script>
/* ============================================================
   Firebase 설정 — 본인 값으로 채우세요. 비워 두면 연습 모드.

const FIREBASE_CONFIG = {

  authDomain:        "take-it-easy-e70f1.firebaseapp.com",
  databaseURL:       "https://take-it-easy-e70f1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "take-it-easy-e70f1",
  storageBucket:     "take-it-easy-e70f1.firebasestorage.app",

  appId:             "1:31254087836:web:219575f1c81fdc8c508559"

// Authentication 에 만든 교사 계정의 이메일. 비밀번호는 저장하지 않습니다.
const TEACHER_EMAIL = "teacher@takeiteasy.local";

// Authentication 을 쓰지 않을 때만 채우세요. 소스에 노출되니 시험용으로만.
const TEACHER_PASSWORD = "";

const SECONDS_PER_TURN = 20;
const TOTAL_ROUNDS = 19;

/* ---------- 게임 상수 ---------- */
const VERT = [1,5,9], DIA1 = [2,6,7], DIA2 = [3,4,8];
const COLOR = {1:'#8a8f98',5:'#2f6fd0',9:'#c62828',2:'#1b7f3b',6:'#e07b00',7:'#7b2fbe',3:'#8d5a00',4:'#d81b7a',8:'#00767f'};
const TILES = [];
for (const a of VERT) for (const b of DIA1) for (const c of DIA2) TILES.push([a,b,c]);

const CELLS = [];
for (let q=-2;q<=2;q++) for (let r=-2;r<=2;r++) if (Math.abs(q+r)<=2) CELLS.push({q,r});
const ck = (q,r)=>q+','+r;

const LINES = [];
for (let q=-2;q<=2;q++) LINES.push({dir:0, name:'세로', cells:CELLS.filter(c=>c.q===q)});
for (let r=-2;r<=2;r++) LINES.push({dir:1, name:'왼쪽아래에서 오른쪽위', cells:CELLS.filter(c=>c.r===r)});
for (let s=-2;s<=2;s++) LINES.push({dir:2, name:'왼쪽위에서 오른쪽아래', cells:CELLS.filter(c=>-c.q-c.r===s)});

/* ---------- 타일 그리기 ---------- */
const S3 = Math.sqrt(3);
function hexPath(cx,cy,R){
  let d='';
  for (let i=0;i<6;i++){
    const a = Math.PI/180*(60*i);
    const x = cx+R*Math.cos(a), y = cy - R*Math.sin(a);
    d += (i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)+' ';
  }
  return d+'Z';
}
function stripeEnds(cx,cy,R,dir){
  if (dir===0) return [[cx,cy-R*S3/2],[cx,cy+R*S3/2]];
  if (dir===1) return [[cx-0.75*R,cy+R*S3/4],[cx+0.75*R,cy-R*S3/4]];
  return [[cx-0.75*R,cy-R*S3/4],[cx+0.75*R,cy+R*S3/4]];
}
function beadPos(cx,cy,R,dir,f){
  f = f===undefined?0.50:f;
  if (dir===0) return [cx, cy-f*R*S3/2];
  if (dir===1) return [cx-f*0.75*R, cy+f*R*S3/4];
  return [cx+f*0.75*R, cy+f*R*S3/4];
}
/** 타일 한 장을 SVG 문자열로. tile=null 이면 빈 칸 */
function tileSVG(tile, cx, cy, R, opt){
  opt = opt||{};
  let s = '';
  s += `<path d="${hexPath(cx,cy,R)}" fill="${opt.slotFill||'#ffffff'}" stroke="${opt.stroke||'#2a2f3a'}" stroke-width="${(R*0.03).toFixed(2)}" ${opt.slotClass?`class="${opt.slotClass}"`:''}/>`;
  if (!tile) return s;
  for (let dir=0;dir<3;dir++){
    const n = tile[dir];
    const [p0,p1] = stripeEnds(cx,cy,R,dir);
    s += `<line x1="${p0[0].toFixed(2)}" y1="${p0[1].toFixed(2)}" x2="${p1[0].toFixed(2)}" y2="${p1[1].toFixed(2)}" stroke="${COLOR[n]}" stroke-width="${(R*0.15).toFixed(2)}" stroke-linecap="butt"/>`;
  }
  for (let dir=0;dir<3;dir++){
    const n = tile[dir];
    const [bx,by] = beadPos(cx,cy,R,dir);
    s += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="${(R*0.215).toFixed(2)}" fill="#fff" stroke="${COLOR[n]}" stroke-width="${(R*0.045).toFixed(2)}"/>`;
    s += `<text x="${bx.toFixed(2)}" y="${by.toFixed(2)}" fill="${COLOR[n]}" font-size="${(R*0.34).toFixed(2)}" font-weight="800" text-anchor="middle" dominant-baseline="central" font-family="inherit">${n}</text>`;
  }
  return s;
}
function tileBox(tile,opt){
  const R=50, pad=4, w=2*R+pad*2, h=R*S3+pad*2;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">${tileSVG(tile,w/2,h/2,R,opt)}</svg>`;
}
const tileBoxSmall = tileBox;

/* ---------- 점수 ---------- */
function scoreBoard(board){
  let total=0; const got=[];
  for (const L of LINES){
    const vals = L.cells.map(c=>{ const t=board[ck(c.q,c.r)]; return (t===undefined||t===null)?null:TILES[t][L.dir]; });
    if (vals.some(v=>v===null)) continue;
    if (vals.every(v=>v===vals[0])){
      const pts = vals[0]*L.cells.length;
      total += pts;
      got.push({name:L.name, n:vals[0], len:L.cells.length, pts, cells:L.cells});
    }
  }
  got.sort((a,b)=>b.pts-a.pts);
  return {total, got};
}

/* ---------- 유틸 ---------- */
const $ = id=>document.getElementById(id);
function show(id){ ['home','teacher','play','result'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================================================
   백엔드 — Firebase 또는 로컬(연습 모드)
   ============================================================ */
const HAS_FB = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL);
let db=null, fb=null, auth=null, authMod=null;

async function initBackend(){
  if (!HAS_FB) return false;
  if (db) return true;
  const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const dbMod  = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  db = dbMod.getDatabase(app);
  fb = dbMod;
  if (TEACHER_EMAIL && FIREBASE_CONFIG.apiKey){
    authMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    auth = authMod.getAuth(app);
  }
  return true;
}

/** 방을 열 수 있는지 확인. 통과하면 null, 아니면 보여 줄 메시지 */
async function verifyTeacher(pw){
  if (HAS_FB && TEACHER_EMAIL && !FIREBASE_CONFIG.apiKey){
    return '파일 위쪽 FIREBASE_CONFIG 의 apiKey 가 비어 있습니다. Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 에서 복사해 채워 주세요.';
  }
  if (HAS_FB && TEACHER_EMAIL){
    try {
      await authMod.signInWithEmailAndPassword(auth, TEACHER_EMAIL, pw);
      return null;
    } catch(e){
      const c = (e && e.code) || '';
      if (c.indexOf('operation-not-allowed')>=0) return 'Firebase 콘솔에서 이메일/비밀번호 로그인을 사용 설정해 주세요.';
      if (c.indexOf('user-not-found')>=0) return TEACHER_EMAIL+' 계정이 아직 없습니다. Authentication > Users 에서 만들어 주세요.';
      if (c.indexOf('network')>=0) return '네트워크에 연결되지 않았습니다.';
      return '비밀번호가 맞지 않습니다.';
    }
  }
  if (TEACHER_PASSWORD) return pw===TEACHER_PASSWORD ? null : '비밀번호가 맞지 않습니다.';
  return null;
}
const NEEDS_PW = (HAS_FB && !!TEACHER_EMAIL) || !!TEACHER_PASSWORD;
const KEY_MISSING = HAS_FB && !!TEACHER_EMAIL && !FIREBASE_CONFIG.apiKey;

/* 연습 모드용 로컬 이벤트 버스 */
const local = { data:{}, subs:{} };
function localPath(p){ return p.split('/').filter(Boolean); }
function localGet(p){ let n=local.data; for(const k of localPath(p)){ if(n==null) return null; n=n[k]; } return n===undefined?null:n; }
function localSet(p,v){
  const ks=localPath(p); let n=local.data;
  for(let i=0;i<ks.length-1;i++){ if(typeof n[ks[i]]!=='object'||n[ks[i]]===null) n[ks[i]]={}; n=n[ks[i]]; }
  n[ks[ks.length-1]] = v;
  Object.keys(local.subs).forEach(k=>{ if(p.startsWith(k)||k.startsWith(p)) local.subs[k].forEach(f=>f(localGet(k))); });
}
function localOn(p,cb){ (local.subs[p] = local.subs[p]||[]).push(cb); cb(localGet(p)); }

async function bSet(path,val){ if(db){ await fb.set(fb.ref(db,path), val); } else { localSet(path,val); } }
async function bUpdate(path,val){ if(db){ await fb.update(fb.ref(db,path), val); } else { const cur=localGet(path)||{}; localSet(path,Object.assign({},cur,val)); } }
async function bGet(path){ if(db){ const s=await fb.get(fb.ref(db,path)); return s.exists()?s.val():null; } return localGet(path); }
function bOn(path,cb){ if(db){ return fb.onValue(fb.ref(db,path), s=>cb(s.exists()?s.val():null)); } localOn(path,cb); return ()=>{}; }

/* ============================================================
   시작 화면
   ============================================================ */
let role='student';
function setRole(r){
  role=r;
  $('roleStudent').setAttribute('aria-pressed', r==='student');
  $('roleTeacher').setAttribute('aria-pressed', r==='teacher');

  $('teacherForm').classList.toggle('hidden', r!=='teacher');
}
$('roleStudent').onclick = ()=>setRole('student');
$('roleTeacher').onclick = ()=>setRole('teacher');

$('pwWrap').classList.toggle('hidden', !NEEDS_PW);
$('modeTag').textContent = KEY_MISSING
  ? '설정이 아직 끝나지 않았습니다. 파일 위쪽 FIREBASE_CONFIG 의 apiKey 를 채워 주세요.'
  : (HAS_FB
      ? (NEEDS_PW ? '학생 기기와 실시간으로 연결됩니다. 방 열기는 교사 비밀번호가 필요합니다.'
                  : '학생 기기와 실시간으로 연결됩니다.')
      : '연습 모드입니다. 이 기기 안에서만 동작하며, 학생 화면에서 직접 타일을 뽑아 전체 흐름을 확인할 수 있습니다.');
if (KEY_MISSING) $('modeTag').style.color = 'var(--warn)';

// 노트북에서 엔터로 넘어가도록
['inSid','inName','inCode'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') $('btnJoin').click(); }));
['inCodeT','inPw'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter') $('btnHost').click(); }));

/* ============================================================
   교사 화면

let roomCode=null, drawing=false, tRound=0, tTimerId=null, tDeadline=0, tList=[], rankOpen=false;

$('btnHost').onclick = async ()=>{
  const code = ($('inCodeT').value||'').trim() || String(Math.floor(1000+Math.random()*9000));
  if (!/^\d{4}$/.test(code)){ $('hostErr').textContent='네 자리 숫자로 입력하세요.'; return; }
  $('hostErr').textContent='';
  if (KEY_MISSING){
    $('hostErr').textContent = '파일 위쪽 FIREBASE_CONFIG 의 apiKey 가 비어 있습니다. Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 에서 복사해 채워 주세요.';
    return;
  }
  $('btnHost').disabled = true;
  try { await initBackend(); } catch(e){ $('hostErr').textContent='Firebase 에 연결하지 못했습니다. 설정값을 확인해 주세요.'; $('btnHost').disabled=false; return; }
  const bad = await verifyTeacher(($('inPw').value||''));
  $('btnHost').disabled = false;
  if (bad){ $('hostErr').textContent = bad; return; }
  roomCode = code;
  await bSet('rooms/'+code, { status:'playing', round:0, tile:null, drawn:null, players:null, ranking:null, at:Date.now() });
  $('tCode').textContent = code;
  renderTeacherTracker([]);
  show('teacher');
  watchTeacher();
};

/** 교사 화면 카운트다운 — 타일을 뽑은 시각부터 셉니다 */
function teacherTimer(startAt, roundNo){
  clearInterval(tTimerId); tTimerId=null;
  const clock=$('tClock');
  if (!startAt || Date.now()-startAt > SECONDS_PER_TURN*1000 + 3000){
    clock.style.visibility='hidden'; return;
  }
  clock.style.visibility='visible';
  tDeadline = startAt + SECONDS_PER_TURN*1000;
  const tick=()=>{
    const left=Math.max(0, tDeadline-Date.now());
    const pct=left/(SECONDS_PER_TURN*1000);
    $('tFill').style.width=(pct*100).toFixed(1)+'%';
    $('tFill').style.background = pct>0.5?'var(--ok)':(pct>0.22?'var(--warn)':'var(--bad)');
    $('tNum').textContent=(left/1000).toFixed(1);
    $('tAiNum').textContent=(left/1000).toFixed(1);
    $('tAiFill').style.width=$('tFill').style.width;
    $('tAiFill').style.background=$('tFill').style.background;
    $('tNum').classList.toggle('over', left<=0);
    if (left<=0){
      clearInterval(tTimerId); tTimerId=null; $('tNum').textContent='0.0';
      // 마지막 타일의 20초가 끝나면 순위로 넘어간다
      if (roundNo>=TOTAL_ROUNDS && !rankOpen) showRank(true);
    }
  };
  tick(); tTimerId=setInterval(tick,100);
}

let tView = 'play';          // play | ai | rank
function setView(v){
  tView = v; rankOpen = (v==='rank');
  $('tPlayView').style.display = v==='play' ? 'flex' : 'none';
  $('tAiView').style.display   = v==='ai'   ? 'flex' : 'none';
  $('tRankView').style.display = v==='rank' ? 'flex' : 'none';
  $('btnRank').textContent = v==='rank' ? '게임 화면' : '순위 보기';
  $('btnAi').textContent   = v==='ai'   ? '게임 화면' : 'AI 판 보기';
  if (v==='rank') renderRanking();
  if (v==='ai'){ aiFollow = true; renderAIView(); }
}
function showRank(on){ setView(on ? 'rank' : 'play'); }
$('btnRank').onclick = ()=>setView(tView==='rank' ? 'play' : 'rank');
$('btnAi').onclick   = ()=>setView(tView==='ai'   ? 'play' : 'ai');

/* ---------- AI 판 관전 / 복기 ---------- */
let aiFollow = true, aiStep = 19;
function aiMaxStep(){
  return Math.max(0, ...aiOn.map(lv=>(aiSeq[lv]||[]).length));
}
/** n수까지만 놓은 판을 만든다 */
function aiBoardAt(lv, n){
  const seq = aiSeq[lv]||[], b = {};
  for (let i=0;i<Math.min(n,seq.length);i++) b[seq[i].k] = seq[i].id;
  return { b, last: (n>0 && seq[n-1]) ? seq[n-1].k : null };
}
function renderAIView(){
  if (tView!=='ai') return;
  const wrap = $('tAiBoards'), mx = aiMaxStep();
  if (!aiOn.length){
    wrap.innerHTML = '<div style="color:var(--mute);font-size:16px;align-self:center">오른쪽에서 AI를 켜면 판이 여기에 보입니다.</div>';
    $('aiStepLab').textContent = '—'; return;
  }
  if (aiFollow) aiStep = mx;
  aiStep = Math.min(aiStep, mx);
  const r = $('aiRange'); r.max = String(Math.max(mx,1)); r.value = String(aiStep);
  $('aiStepLab').textContent = aiStep + ' / ' + mx + '수';
  wrap.innerHTML = aiOn.map(lv=>{
    const {b,last} = aiBoardAt(lv, aiStep);
    const {total,got} = scoreBoard(b);
    const hl = new Set(); got.forEach(g=>g.cells.forEach(c=>hl.add(ck(c.q,c.r))));
    return '<div class="aicard"><div class="aihead">'
      + '<span class="nm">'+AI_DEFS[lv].name+'</span>'
      + '<span style="color:var(--mute);font-size:12px">'+AI_DEFS[lv].trait+'</span>'
      + '<span class="sc">'+total+'점</span>'
      + '<span class="pg">'+Object.keys(b).length+'/19</span></div>'
      + '<svg viewBox="0 0 400 433">'+boardSVGString(hl,b,last)+'</svg></div>';
  }).join('');
}
function aiRefresh(){ if (tView==='ai') renderAIView(); }
$('aiRange').oninput = ()=>{ aiFollow=false; aiStep=+$('aiRange').value; renderAIView(); };
$('aiPrev').onclick  = ()=>{ aiFollow=false; aiStep=Math.max(0,aiStep-1); renderAIView(); };
$('aiNext').onclick  = ()=>{ aiStep=Math.min(aiMaxStep(),aiStep+1); aiFollow=(aiStep===aiMaxStep()); renderAIView(); };
$('aiFirst').onclick = ()=>{ aiFollow=false; aiStep=0; renderAIView(); };
$('aiLastBtn').onclick = ()=>{ aiFollow=true; renderAIView(); };

function renderRanking(){
  if (!rankOpen) return;
  const done = tList.filter(p=>p.done).sort((a,b)=>(b.score||0)-(a.score||0));
  const rest = tList.filter(p=>!p.done).sort((a,b)=>(b.placed||0)-(a.placed||0));
  let html='', rank=0, prev=null;
  done.forEach((p,i)=>{
    const sc=p.score||0;
    if (sc!==prev){ rank=i+1; prev=sc; }          // 동점은 같은 등수
    html += '<div class="rkline '+(rank<=3?'top':'')+'">'
          + '<span class="no">'+rank+'</span>'
          + (p.ai ? '<span class="badge">AI</span>' : '<span class="sid">'+esc(p.sid)+'</span>')
          + '<span class="nm">'+esc(p.name)+'</span>'
          + '<span class="sc">'+sc+'점</span></div>';
  });
  rest.forEach(p=>{
    html += '<div class="rkline wait">'
          + '<span class="no">·</span>'
          + '<span class="sid">'+esc(p.sid)+'</span>'
          + '<span class="nm">'+esc(p.name)+'</span>'
          + '<span class="sc">'+(p.placed||0)+'/19</span></div>';
  });
  const list=$('tRankList');
  list.innerHTML = html || '<div style="color:var(--mute);font-size:15px">아직 끝낸 학생이 없습니다.</div>';
  list.style.columnCount = tList.length>14 ? 3 : (tList.length>6 ? 2 : 1);
  const meta=$('tRankMeta');
  if (done.length){
    const sum=done.reduce((s,p)=>s+(p.score||0),0);
    const avg=Math.round(sum/done.length);
    const mid=done[Math.floor((done.length-1)/2)].score||0;
    meta.textContent = tList.length+'명 중 '+done.length+'명 완료  ·  평균 '+avg+'점  ·  최고 '+(done[0].score||0)+'점  ·  중앙값 '+mid+'점';
  } else {
    meta.textContent = tList.length+'명 접속  ·  아직 완료한 학생이 없습니다';
  }
}

function renderProgress(){
  const done = tRound ? tList.filter(x=>(x.placed||0)>=tRound).length : 0;
  const prog=$('tProg');
  prog.innerHTML = '타일을 놓은 학생 <b>'+done+'</b> / '+tList.length;
  prog.classList.toggle('all', tRound>0 && tList.length>0 && done===tList.length);
  // 마지막 타일까지 전원이 끝냈으면 20초를 다 기다리지 않는다
  if (tRound>=TOTAL_ROUNDS && tList.length>0 && !rankOpen
      && tList.every(x=>x.done)) showRank(true);
}

function watchTeacher(){
  bOn('rooms/'+roomCode+'/ai', v=>{ aiOn = Array.isArray(v)?v:[]; renderAIChips(); aiRefresh(); });
  bOn('rooms/'+roomCode+'/tile', v=>{
    if (!v){ teacherTimer(0,0); return; }
    teacherTimer(v.at||0, v.round||0);
    aiOnTile(v);
    // 이미 끝난 게임을 나중에 열었을 때는 바로 순위

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   AI 참가자 — 교사 화면에서만 돌아갑니다
   같은 상황이면 늘 같은 수를 두므로, 교사가 창을 여러 개 띄워도
   모든 창이 똑같이 계산해서 서로 충돌하지 않습니다.
   ============================================================ */
const AI_DEFS = {
  // eps = 일부러 아무 칸에 두는 비율. 평균 점수는 차례로 약 93 / 141 / 150점.
  // 서열이 아니라 성향 차이입니다. 같은 타일로 붙으면 절반쯤은 순서가 뒤집힙니다.
  zero:  { name:'제로', trait:'모험', eps:0.25, mode:'base', delay:[2.0,4.0] },
  nova:  { name:'노바', trait:'균형', eps:0.00, mode:'base', delay:[1.5,3.0] },
  lumen: { name:'루멘', trait:'집중', eps:0.00, mode:'long', delay:[1.2,2.5] }
};
const AI_ORDER = ['zero','nova','lumen'];
let aiOn = [], aiBoards = { zero:{}, nova:{}, lumen:{} }, aiSeq = { zero:[], nova:[], lumen:[] };

/** 씨앗이 같으면 늘 같은 값이 나오는 난수 */
function seeded(n){
  let a = n|0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
const aiSeed = (lv,round,id)=> (AI_ORDER.indexOf(lv)+1)*104729 + round*7919 + id*131;

/** 살아 있는 줄의 진행도를 점수로 환산 — 끊긴 줄은 0 */
function aiPotential(b){
  let p = 0;
  for (const L of LINES){
    const f = [];
    for (const c of L.cells){ const t=b[ck(c.q,c.r)]; if(t!==undefined) f.push(TILES[t][L.dir]); }
    if (!f.length) continue;
    const v0 = f[0];
    if (!f.every(x=>x===v0)) continue;
    p += v0 * L.cells.length * Math.pow(f.length/L.cells.length, 1.5);
  }
  return p;
}
/** 긴 줄과 큰 수에 가중치를 더 준다 */
function aiPotLong(b){
  let p = 0;
  for (const L of LINES){
    const f = [];
    for (const c of L.cells){ const t=b[ck(c.q,c.r)]; if(t!==undefined) f.push(TILES[t][L.dir]); }
    if (!f.length) continue;
    const v0 = f[0];
    if (!f.every(x=>x===v0)) continue;
    const n = L.cells.length;
    p += v0*n*Math.pow(f.length/n,1.5)*(1+0.35*(n-3))*(1+0.05*(v0-1));
  }
  return p;
}
/** 아직 나오지 않은 타일로 완성이 가능한 줄만 센다 */
function aiPotBag(b, bag){
  const cnt = [{},{},{}];
  for (const t of bag) for (let d=0;d<3;d++){ const v=TILES[t][d]; cnt[d][v]=(cnt[d][v]||0)+1; }
  let p = 0;
  for (const L of LINES){
    const f = [];
    for (const c of L.cells){ const t=b[ck(c.q,c.r)]; if(t!==undefined) f.push(TILES[t][L.dir]); }
    if (!f.length) continue;
    const v0 = f[0];
    if (!f.every(x=>x===v0)) continue;
    const n = L.cells.length;
    if ((cnt[L.dir][v0]||0) < n-f.length) continue;    // 남은 타일로는 불가능
    p += v0*n*Math.pow(f.length/n,1.5);
  }
  return p;
}
function aiScoreFn(mode, bag){
  return (mode==='long' && bag) ? (b=>aiPotLong(b)*0.6 + aiPotBag(b,bag)*0.6) : aiPotential;
}
function aiBestCell(b, id, empty, fn){
  let k0 = empty[0], bv = -Infinity;
  for (const k of empty){
    b[k] = id; const v = fn(b); delete b[k];
    if (v > bv){ bv = v; k0 = k; }
  }
  return k0;
}
function aiPickCell(lv, b, id, round, bag){
  const empty = CELLS.map(c=>ck(c.q,c.r)).filter(k=>b[k]===undefined);
  if (!empty.length) return null;
  const rnd = seeded(aiSeed(lv,round,id));
  if (rnd() < AI_DEFS[lv].eps) return empty[Math.floor(rnd()*empty.length)];
  return aiBestCell(b, id, empty, aiScoreFn(AI_DEFS[lv].mode, bag));
}
async function aiSave(lv){
  const b = aiBoards[lv], n = Object.keys(b).length, done = n>=TOTAL_ROUNDS;
  const sc = done ? scoreBoard(b).total : 0;
  aiRefresh();
  await bUpdate('rooms/'+roomCode+'/players/ai_'+lv,
    { sid:'AI', name:AI_DEFS[lv].name, placed:n, score:sc, done, ai:true,
      board:JSON.stringify(b), seq:JSON.stringify(aiSeq[lv]||[]) });
  if (done) await bSet('rooms/'+roomCode+'/ranking/ai_'+lv,
    { sid:'AI', name:AI_DEFS[lv].name, score:sc, at:Date.now() });
}
/** 뽑혀 있는 타일을 처음부터 다시 두어 진도를 맞춘다 */
async function aiCatchUp(lv){
  const drawn = (await bGet('rooms/'+roomCode+'/drawn')) || [];   // 교사 화면이므로 서버에서 읽는다
  const b = {}, seq = [];
  drawn.forEach((id,i)=>{
    const seen = new Set(drawn.slice(0,i+1));
    const bag = TILES.map((_,x)=>x).filter(x=>!seen.has(x));
    const k = aiPickCell(lv, b, id, i+1, bag);
    if (k){ b[k] = id; seq.push({k, id}); }
  });
  aiBoards[lv] = b; aiSeq[lv] = seq;
  await aiSave(lv);
}
async function aiPlace(lv, v){
  if (aiOn.indexOf(lv)<0) return;
  let b = aiBoards[lv];
  if (Object.keys(b).length < v.round-1){        // 창을 늦게 열었으면 저장된 판을 읽는다
    const prev = await bGet('rooms/'+roomCode+'/players/ai_'+lv);
    if (prev && prev.board){ try{ b = JSON.parse(prev.board)||{}; }catch(_){ b={}; } }
    if (prev && prev.seq){ try{ aiSeq[lv] = JSON.parse(prev.seq)||[]; }catch(_){ aiSeq[lv]=[]; } }
    aiBoards[lv] = b;
  }
  if (Object.values(b).indexOf(v.id) >= 0) return;   // 이미 놓았다
  const drawn = (await bGet('rooms/'+roomCode+'/drawn')) || [];
  const seen = new Set(drawn.slice(0, v.round));
  const bag = TILES.map((_,x)=>x).filter(x=>!seen.has(x));
  const k = aiPickCell(lv, b, v.id, v.round, bag);
  if (!k) return;
  b[k] = v.id;
  (aiSeq[lv] = aiSeq[lv] || []).push({k, id:v.id});
  await aiSave(lv);
}
function aiOnTile(v){
  aiOn.forEach(lv=>{
    const d = AI_DEFS[lv]; if(!d) return;
    const rnd = seeded(aiSeed(lv,v.round,v.id)+7);
    const wait = (d.delay[0] + (d.delay[1]-d.delay[0])*rnd()) * 1000;
    setTimeout(()=>aiPlace(lv,v).catch(()=>{}), wait);
  });
}
function renderAIChips(){
  document.querySelectorAll('.chip[data-ai]').forEach(el=>{
    el.setAttribute('aria-pressed', aiOn.indexOf(el.dataset.ai)>=0);
  });
  $('aiNote').textContent = aiOn.length ? (aiOn.length+'명 참가') : '꺼짐';
}
document.querySelectorAll('.chip[data-ai]').forEach(el=>{
  el.onclick = async ()=>{
    const lv = el.dataset.ai;
    const next = aiOn.indexOf(lv)>=0 ? aiOn.filter(x=>x!==lv) : AI_ORDER.filter(x=>x===lv||aiOn.indexOf(x)>=0);
    await bSet('rooms/'+roomCode+'/ai', next.length?next:null);
    if (next.indexOf(lv)>=0){ aiOn=next; renderAIChips(); await aiCatchUp(lv); }
    else { aiBoards[lv]={}; aiSeq[lv]=[]; aiRefresh(); await bSet('rooms/'+roomCode+'/players/ai_'+lv, null);
           await bSet('rooms/'+roomCode+'/ranking/ai_'+lv, null); }
  };
});

/* ============================================================
   학생 화면
   ============================================================ */
let me = null;            // {pid, sid, name}
let board = {};           // cellKey -> tileId
let drawnList = [];
let curTile = null;       // {id, round}
let placedThisRound = false;
let lastPlacedKey = null;
let timerId = null, deadline = 0, finished = false;
const DRAG = { active:false, snapKey:null, cancel:function(){} };

/** 학번과 이름으로 늘 같은 키를 만든다 (새로고침해도 같은 사람) */
function pidOf(sid,name){
  return (sid+'-'+name).trim().replace(/\s+/g,' ').replace(/[.#$\[\]\/]/g,'_').slice(0,120);
}

$('btnJoin').onclick = async ()=>{
  const sid=($('inSid').value||'').trim(), name=($('inName').value||'').trim(), code=($('inCode').value||'').trim();
  if (!sid || !name){ $('joinErr').textContent='학번과 이름을 모두 입력하세요.'; return; }
  if (HAS_FB && !/^\d{4}$/.test(code)){ $('joinErr').textContent='교사 화면에 뜬 네 자리 방 번호를 입력하세요.'; return; }
  $('joinErr').textContent='';
  try { await initBackend(); } catch(e){
    if (HAS_FB){ $('joinErr').textContent='서버에 연결하지 못했습니다. 선생님께 알려 주세요.'; return; }
  }
  roomCode = HAS_FB ? code : (roomCode || '0000');

  if (HAS_FB){
    const room = await bGet('rooms/'+roomCode);
    if (!room){ $('joinErr').textContent='그런 방이 없습니다. 번호를 확인해 주세요.'; return; }
  } else {
    if (!(await bGet('rooms/'+roomCode))){
      await bSet('rooms/'+roomCode, { status:'playing', round:0, tile:null, drawn:null, players:null, ranking:null });
    }
  }

  me = { pid: pidOf(sid,name), sid, name };
  board = {}; lastPlacedKey=null; curTile=null; placedThisRound=false; finished=false;

  // 같은 학번·이름으로 다시 들어오면 놓았던 타일을 되살린다
  const prev = await bGet('rooms/'+roomCode+'/players/'+me.pid);
  if (prev && prev.board){
    try { board = JSON.parse(prev.board) || {}; } catch(_) { board = {}; }
  }
  const restored = Object.keys(board).length;
  await bUpdate('rooms/'+roomCode+'/players/'+me.pid,
    { sid, name, placed: restored, score:(prev&&prev.score)||0, done: !!(prev&&prev.done) });

  try { localStorage.setItem('tie.me', JSON.stringify({sid,name,code:roomCode})); } catch(_){}

  $('pWho').textContent = sid+' '+name;
  renderBoard(); renderStudentTracker([]);
  show('play');

  if (restored >= TOTAL_ROUNDS){ finish(); return; }
  if (restored > 0) toast('이전에 놓은 타일 '+restored+'칸을 불러왔습니다.');
  watchStudent();
  if (!HAS_FB) enablePracticeDraw();
};

function watchStudent(){
  bOn('rooms/'+roomCode+'/drawn', v=>{
    const fresh = v||[];
    if (fresh.length===0 && Object.keys(board).length>0 && !finished){
      board={}; curTile=null; placedThisRound=false; lastPlacedKey=null; stopTimer();
      $('pNow').innerHTML=''; $('pFill').style.width='0%'; $('pTime').textContent='대기 중';
      $('pHint').textContent='새 게임이 시작되었습니다. 첫 타일을 기다리세요.';
      $('btnUndo').disabled=true; renderBoard();
      bUpdate('rooms/'+roomCode+'/players/'+me.pid,{placed:0,score:0,done:false,board:'{}'});
      toast('선생님이 새 게임을 시작했습니다.');
    }
    drawnList = fresh;
    renderStudentTracker(drawnList);
    $('pLeft').textContent = (27-drawnList.length)+'장 남음';
    $('pRound').textContent = drawnList.length+' / '+TOTAL_ROUNDS;
  });
  bOn('rooms/'+roomCode+'/tile', v=>{
    if (!v) return;
    if (curTile && curTile.round===v.round && curTile.id===v.id) return;
    onNewTile(v);
  });
}

function onNewTile(v){
  const placedIds = new Set(Object.values(board));

  // 이 타일을 이미 놓았다면 (새로고침 후 복귀) 다시 놓지 않는다
  if (placedIds.has(v.id)){
    curTile = { id:v.id, round:v.round };
    placedThisRound = true; lastPlacedKey = null;
    $('btnUndo').disabled = true;
    $('pNow').innerHTML = tileBox(TILES[v.id]);
    $('pNow').classList.remove('draggable');
    stopTimer(); $('pFill').style.width='0%'; $('pTime').textContent='놓았습니다';
    $('pHint').textContent = '이번 타일은 이미 놓았습니다. 다음 타일을 기다리세요.';
    renderBoard();
    return;
  }

  // 직전 타일을 못 놓은 채 다음 타일이 온 경우 (다른 탭에 있었거나 시간 초과)
  let auto = 0;
  if (curTile && !placedThisRound && curTile.id!==v.id && !placedIds.has(curTile.id)){
    const k = randomEmptyCell();
    if (k){ board[k]=curTile.id; placedIds.add(curTile.id); auto++; }
  }
  // 그 밖에 아직 놓지 않은 지난 타일을 채운다 — 같은 타일을 두 번 놓지 않는다
  for (const id of drawnList){
    if (id===v.id || placedIds.has(id)) continue;
    const k = randomEmptyCell();
    if (!k) break;
    board[k]=id; placedIds.add(id); auto++;
  }
  if (auto>0){
    toast('놓지 못한 타일 '+auto+'장은 빈 칸에 임의로 들어갔습니다.');
    bUpdate('rooms/'+roomCode+'/players/'+me.pid,
      { placed:Object.keys(board).length, board:JSON.stringify(board) });
  }

  if (Object.keys(board).length >= TOTAL_ROUNDS){ renderBoard(); finish(); return; }

  curTile = { id:v.id, round:v.round };
  placedThisRound = false;
  lastPlacedKey = null;
  $('btnUndo').disabled = true;
  $('pNow').innerHTML = tileBox(TILES[v.id]);
  $('pNow').classList.add('draggable');
  $('pHint').textContent = '빈 칸을 누르거나 타일을 끌어다 놓으세요.';
  renderBoard();
  startTimer();
}

function startTimer(){
  stopTimer();
  deadline = Date.now() + SECONDS_PER_TURN*1000;
  tick();
  timerId = setInterval(tick, 100);
}
function stopTimer(){ if(timerId){clearInterval(timerId); timerId=null;} }
function tick(){
  const left = Math.max(0, deadline-Date.now());
  const pct = left/(SECONDS_PER_TURN*1000);
  const fill=$('pFill');
  fill.style.width = (pct*100).toFixed(1)+'%';
  fill.style.background = pct>0.5?'var(--ok)':(pct>0.22?'var(--warn)':'var(--bad)');
  $('pTime').textContent = (left/1000).toFixed(1)+'초';
  if (left<=0){
    stopTimer();
    if (!placedThisRound){
      let k = (DRAG.active && DRAG.snapKey && board[DRAG.snapKey]===undefined) ? DRAG.snapKey : null;
      const wasHolding = DRAG.active;
      if (DRAG.active) DRAG.cancel();
      if (!k) k = randomEmptyCell();
      if (k){
        doPlace(k, true);
        toast(wasHolding && k===DRAG.snapKey
          ? '시간이 다 되어 잡고 있던 자리에 놓았습니다.'
          : '시간이 다 되어 자동으로 놓았습니다.');
      }
    }
  }
}
// 다른 탭에 있다 돌아오면 브라우저가 늦춘 타이머를 즉시 따라잡는다
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden && timerId) tick();
});

function randomEmptyCell(){
  const empty = CELLS.filter(c=>board[ck(c.q,c.r)]===undefined);
  if (!empty.length) return null;
  const c = empty[Math.floor(Math.random()*empty.length)];
  return ck(c.q,c.r);
}

/* ---------- 판 ---------- */
function boardSVGString(hl, src, lastKey){
  const b = src || board;
  const R=50; let s='';
  for (const c of CELLS){
    const key = ck(c.q,c.r);
    const x = 200 + 1.5*R*c.q, y = 216.5 - R*S3*(c.r + c.q/2);
    const t = b[key], empty = (t===undefined);
    s += tileSVG(empty?null:TILES[t], x, y, R, {slotFill: empty?'#232a35':'#ffffff', stroke:'#2a2f3a'});
    if (hl && hl.has(key)) s += `<path d="${hexPath(x,y,R)}" fill="none" stroke="#ffd166" stroke-width="4"/>`;
    if (lastKey===key) s += `<path d="${hexPath(x,y,R)}" fill="none" stroke="#5aa9ff" stroke-width="5.5"/>`;
  }
  return s;
}
function renderBoard(highlight){
  const R=50, svg=$('board');
  const hl = highlight? new Set(highlight) : null;
  let s='';
  for (const c of CELLS){
    const key = ck(c.q,c.r);
    const x = 200 + 1.5*R*c.q;
    const y = 216.5 - R*S3*(c.r + c.q/2);
    const t = board[key];
    const empty = (t===undefined);
    const opt = {
      slotFill: empty ? (hl?'#232a35':'#313b4d') : '#ffffff',
      stroke: hl && hl.has(key) ? '#ffd166' : '#2a2f3a',
      slotClass: 'slot'
    };
    s += `<g class="cell ${empty&&curTile&&!placedThisRound?'open':''}" data-key="${key}">`;
    s += tileSVG(empty?null:TILES[t], x, y, R, opt);
    if (hl && hl.has(key)) s += `<path d="${hexPath(x,y,R)}" fill="none" stroke="#ffd166" stroke-width="3"/>`;
    s += `<path class="hit" d="${hexPath(x,y,R)}"/>`;
    s += `</g>`;
  }
  svg.innerHTML = s;
  svg.querySelectorAll('.cell').forEach(g=>{
    g.addEventListener('click', ()=>{
      const key=g.dataset.key;
      if (!curTile || placedThisRound || board[key]!==undefined) return;
      doPlace(key,false);
    });
  });
  $('pFilled').textContent = '놓은 타일 '+Object.keys(board).length+'칸';
}

async function doPlace(key, auto){
  if (!curTile || placedThisRound || board[key]!==undefined) return;
  board[key] = curTile.id;
  placedThisRound = true;
  lastPlacedKey = auto?null:key;
  stopTimer();
  $('pFill').style.width='0%';
  $('pTime').textContent = '놓았습니다';
  $('pHint').textContent = '다음 타일을 기다리는 중입니다.';
  $('pNow').classList.remove('draggable');
  $('btnUndo').disabled = !lastPlacedKey;
  renderBoard();
  await bUpdate('rooms/'+roomCode+'/players/'+me.pid,
    { placed: Object.keys(board).length, board: JSON.stringify(board) });
  if (Object.keys(board).length >= TOTAL_ROUNDS) finish();
}

$('btnUndo').onclick = ()=>{
  if (!lastPlacedKey) return;
  delete board[lastPlacedKey];
  bUpdate('rooms/'+roomCode+'/players/'+me.pid,
    { placed: Object.keys(board).length, board: JSON.stringify(board) });
  lastPlacedKey=null; placedThisRound=false;
  $('btnUndo').disabled=true;
  $('pNow').classList.add('draggable');
  $('pHint').textContent = '다시 놓으세요. 남은 시간은 이어집니다.';
  renderBoard();
  if (deadline>Date.now()){ timerId=setInterval(tick,100); }
};

/* ---------- 드래그 ---------- */
(function setupDrag(){
  const now=$('pNow'), ghost=$('ghost');
  let dragging=false, cells=[], cellW=120, snapKey=null, pid=null;
  DRAG.cancel = ()=>{ if(dragging) endDrag(); };

  /** 드래그 시작 시점의 칸 위치를 한 번만 계산해 둔다 */
  function cacheCells(){
    cells=[];
    document.querySelectorAll('#board .cell').forEach(g=>{
      const r=g.getBoundingClientRect();
      cells.push({key:g.dataset.key, el:g, cx:r.left+r.width/2, cy:r.top+r.height/2, w:r.width});
    });
    cellW = cells.length ? cells[0].w : 120;
  }
  /** 가장 가까운 칸. 이미 찬 칸이거나 너무 멀면 null */
  function snapTarget(x,y){
    let best=null, bd=Infinity;
    for (const c of cells){
      const d=Math.hypot(c.cx-x, c.cy-y);
      if (d<bd){ bd=d; best=c; }
    }
    if (!best || bd > cellW*0.72) return null;
    if (board[best.key]!==undefined) return null;
    return best;
  }
  function clearTarget(){
    document.querySelectorAll('.cell.target').forEach(g=>g.classList.remove('target'));
  }
  function endDrag(){
    dragging=false; snapKey=null; DRAG.active=false; DRAG.snapKey=null;
    ghost.classList.add('hidden');
    ghost.innerHTML='';
    now.classList.remove('dragging');
    document.body.classList.remove('dragging');
    clearTarget();
    if (pid!==null){ try{ now.releasePointerCapture(pid); }catch(_){} pid=null; }
  }

  now.addEventListener('pointerdown', e=>{
    if (!curTile || placedThisRound) return;
    e.preventDefault();
    dragging=true; pid=e.pointerId; DRAG.active=true;
    try{ now.setPointerCapture(pid); }catch(_){}
    cacheCells();
    ghost.style.width = Math.round(cellW*1.08)+'px';  // tileBox 여백 보정
    ghost.innerHTML = tileBox(TILES[curTile.id]);
    ghost.classList.remove('hidden');
    now.classList.add('dragging');
    document.body.classList.add('dragging');
    place(e.clientX, e.clientY);
  });

  now.addEventListener('pointermove', e=>{ if(dragging) place(e.clientX, e.clientY); });

  now.addEventListener('pointerup', e=>{
    if (!dragging) return;
    const key = snapKey;
    endDrag();
    if (key && !placedThisRound && board[key]===undefined) doPlace(key,false);
  });
  now.addEventListener('pointercancel', ()=>{ if(dragging) endDrag(); });
  window.addEventListener('blur', ()=>{ if(dragging) endDrag(); });

  /** 칸 근처에서는 칸 중심으로 붙고, 아니면 커서를 따라간다 */
  function place(x,y){
    const t = snapTarget(x,y);
    clearTarget();
    if (t){
      snapKey = t.key; DRAG.snapKey = t.key;
      t.el.classList.add('target');
      ghost.style.left = t.cx+'px';
      ghost.style.top  = t.cy+'px';
    } else {
      snapKey = null; DRAG.snapKey = null;
      ghost.style.left = x+'px';
      ghost.style.top  = y+'px';
    }
  }
})();

/* ---------- 타일 순서 코드 ---------- */
const SEQ_ALPHA = '0123456789abcdefghijklmnopq';   // 27가지
function seqCode(ids){ return (ids||[]).map(i=>SEQ_ALPHA[i]).join(''); }
async function copySeq(ids){
  const code = seqCode(ids);
  if (!code){ toast('아직 뽑은 타일이 없습니다.'); return; }
  try { await navigator.clipboard.writeText(code); toast('타일 순서를 복사했습니다 ('+code.length+'장)'); }
  catch(_){ prompt('아래 코드를 복사하세요', code); }
}

/* ---------- 이 판에서 가능한 최고점 찾기 ---------- */
function climbOnce(ids){
  const ks = CELLS.map(c=>ck(c.q,c.r)).sort(()=>Math.random()-0.5);
  const b = {};
  ks.forEach((k,i)=>{ b[k] = ids[i]; });         // 빈 칸은 undefined 로 남고 채점에서 제외된다
  let cur = scoreBoard(b).total, noImp = 0;
  while (noImp < 1500){
    const i = Math.floor(Math.random()*ks.length), j = Math.floor(Math.random()*ks.length);
    if (i===j){ noImp++; continue; }
    const ki=ks[i], kj=ks[j];
    const t=b[ki]; b[ki]=b[kj]; b[kj]=t;
    const sc = scoreBoard(b).total;
    if (sc>=cur){ if(sc>cur) noImp=0; else noImp++; cur=sc; }
    else { const t2=b[ki]; b[ki]=b[kj]; b[kj]=t2; noImp++; }
  }
  return cur;
}
/** 화면이 멈추지 않도록 잘라서 계산한다 */
function findCeiling(ids, budget, done){
  const t0 = Date.now(); let best = 0;
  (function chunk(){
    const c0 = Date.now();
    while (Date.now()-c0 < 70 && Date.now()-t0 < budget){
      const v = climbOnce(ids); if (v>best) best = v;
    }
    if (Date.now()-t0 < budget) setTimeout(chunk, 0); else done(best);
  })();
}

/* ---------- 결과 ---------- */
async function finish(){
  if (finished) return;
  finished = true;
  stopTimer();
  const {total, got} = scoreBoard(board);
  await bUpdate('rooms/'+roomCode+'/players/'+me.pid,
    { placed:19, score:total, done:true, board:JSON.stringify(board) });
  await bSet('rooms/'+roomCode+'/ranking/'+me.pid, { sid:me.sid, name:me.name, score:total, at:Date.now() });

  $('rWho').textContent = me.sid+' '+me.name;
  $('rScore').textContent = total+'점';
  $('rNote').textContent = total>=250?'아주 드문 점수입니다':(total>=200?'잘한 편입니다':(total>=150?'괜찮은 점수입니다':'한 판 더 해 봅시다'));
  $('rLines').innerHTML = got.length ? got.map(g=>
    `<div class="lrow"><span>${g.name} · ${g.n}이 ${g.len}칸</span><b>${g.pts}점</b></div>`).join('')
    : '<div style="color:var(--mute);font-size:13.5px">완성한 줄이 없습니다.</div>';

  const hl=new Set(); got.forEach(g=>g.cells.forEach(c=>hl.add(ck(c.q,c.r))));
  $('rBoard').innerHTML = boardSVGString(hl);

  // 같은 타일 19장을 가장 잘 놓았다면 몇 점이었을까
  $('rCeil').textContent='계산 중…'; $('rCeilSub').textContent='잠시만 기다려 주세요';
  findCeiling(Object.values(board), 1300, ceil=>{
    $('rCeil').textContent = '약 '+ceil+'점';
    $('rCeilSub').textContent = ceil ? ('당신은 그중 '+Math.round(total/ceil*100)+'%') : '';
  });
  bOn('rooms/'+roomCode+'/ranking', v=>{
    const list = Object.entries(v||{}).filter(([,x])=>x && typeof x==='object')
                       .map(([pid,x])=>Object.assign({pid},x));
    list.sort((a,b)=>b.score-a.score);
    $('rRank').innerHTML = list.map((x,i)=>
      `<div class="rkrow ${x.pid===me.pid?'me':''}"><span class="no">${i+1}</span><span>${esc(x.sid)}</span><span>${esc(x.name)}</span><span class="sc">${x.score}점</span></div>`).join('')
      || '<div style="color:var(--mute);font-size:13.5px">아직 없습니다</div>';
  });
  show('result');
}

/* ---------- 연습 모드: 학생 화면에서 직접 뽑기 ---------- */
function enablePracticeDraw(){
  const b=document.createElement('button');
  b.className='btn primary'; b.textContent='타일 뽑기 (연습 모드)';
  b.style.width='100%';
  b.onclick = async ()=>{
    if (drawing) return;
    const drawn = (await bGet('rooms/'+roomCode+'/drawn'))||[];
    if (drawn.length>=TOTAL_ROUNDS) return;
    if (curTile && !placedThisRound){ toast('먼저 타일을 놓으세요.'); return; }
    drawing = true;
    try {
      const used=new Set(drawn);
      const left=TILES.map((_,i)=>i).filter(i=>!used.has(i));
      const pick=left[Math.floor(Math.random()*left.length)];
      const next=drawn.concat([pick]);
      await bUpdate('rooms/'+roomCode, { drawn:next, round:next.length, tile:{id:pick, round:next.length, at:Date.now()} });
    } finally { drawing = false; }
  };
  $('pNow').parentElement.querySelector('.actions').appendChild(b);
}
