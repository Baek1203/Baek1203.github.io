<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>렌주룰 오목 · 학급 대국실 (Firebase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#fbf1da; --ink-900:#fffdf8; --ink-800:#ffffff;
    --wood-500:#e2842e; --wood-300:#ffb457; --wood-100:#8a5a2b;
    --gold:#b5850f; --cream:#3c352c; --cream-dim:#9b8f7a;
    --black-win:#c65a3f; --white-win:#3f9166; --line:#b9a37e;
    --vote:#4fa8d8; --forbid:#c65a3f; --paper:#fdf9f0; --border:#e6d7b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle, #ecdfc0 1.4px, transparent 1.6px) 0 0/24px 24px,
      radial-gradient(1200px 700px at 50% -10%, #fff7e3 0%, var(--paper) 60%);
    color:var(--cream); font-family:'Jua', 'Noto Sans KR', sans-serif;
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;

  }
  .wrap{ width:100%; max-width:600px; }
  h1.brand{
    font-family:'Jua', sans-serif; font-weight:400; font-size:24px;
    letter-spacing:0.01em; margin:0 0 4px; color:var(--wood-100);
    display:flex; align-items:center; gap:10px;
  }
  h1.brand .dot{ width:20px;height:20px;border-radius:48% 52% 45% 55%/55% 48% 52% 45%;
    background:radial-gradient(circle at 35% 30%, #57504a, #2b2621 70%);
    border:1.5px solid #1f1a15; box-shadow:1px 2px 0 rgba(138,90,43,.25); }
  .tagline{ font-size:13px; color:var(--cream-dim); margin-bottom:20px; letter-spacing:0.02em; }
  .card{ background:linear-gradient(180deg, var(--ink-800), var(--ink-900));
    border:2px solid var(--border); border-radius:18px 22px 20px 16px; padding:20px;
    box-shadow:4px 5px 0 rgba(201,169,120,.18); }
  .card + .card{ margin-top:16px; }
  label{ display:block; font-size:13px; color:var(--cream-dim); margin-bottom:6px; letter-spacing:.02em; }
  input[type=text], input[type=password], input[type=number]{
    width:100%; padding:11px 13px; border-radius:10px; border:2px solid var(--border);
    background:var(--ink-950); color:var(--cream); font-size:16px;
    font-family:'Jua', sans-serif; font-weight:700; outline:none;
  }
  textarea{
    width:100%; padding:11px 13px; border-radius:10px; border:2px solid var(--border);
    background:var(--ink-950); color:var(--cream); font-size:15px; font-family:'Jua', sans-serif;
    outline:none; resize:vertical; min-height:130px; line-height:1.6;
  }
  select{
    width:100%; padding:11px 13px; border-radius:10px; border:2px solid var(--border);
    background:var(--ink-950); color:var(--cream); font-size:15px; font-family:'Jua', sans-serif; outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--gold); }
  button{ font-family:'Jua', sans-serif; font-weight:700; font-size:15px;
    border:2px solid transparent; border-radius:20px 8px 20px 8px; padding:11px 15px; cursor:pointer;
    transition:transform .12s ease, filter .12s ease; }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  button:active{ transform:scale(0.97) rotate(-0.5deg); }
  .btn-primary{ background:linear-gradient(180deg, var(--wood-300), var(--wood-500)); color:#4a2a05;
    border-color:#c9701f; box-shadow:2px 3px 0 rgba(201,112,31,.35); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:#fffefa; color:var(--cream); border:2px solid var(--border); }
  .btn-ghost:hover{ filter:brightness(0.97); border-color:var(--gold); }
  .btn-danger{ background:#fff1ec; color:#a8492c; border:2px solid #e2916f; }
  .btn-danger:hover{ background:#ffe4d8; }
  .btn-small{ padding:7px 11px; font-size:13px; }
  .btn-tiny{ padding:4px 9px; font-size:12px; }
  .section-title{ font-family:'Jua', sans-serif; font-weight:700; font-size:16px; color:var(--wood-100); margin:0 0 12px; }
  .hint{ font-size:12px; color:var(--cream-dim); margin-top:8px; line-height:1.6; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .room-chip{ font-family:'Jua', sans-serif; font-weight:700; font-size:13.5px; background:var(--ink-950);
    border:2px solid var(--border); border-radius:10px; padding:6px 10px; color:var(--wood-100); }
  .role-chip{ font-size:12px; padding:5px 9px; border-radius:20px; border:1.5px solid var(--border); }
  .role-chip.teacher{ background:rgba(181,133,15,.13); color:var(--gold); border-color:rgba(181,133,15,.4); }
  .role-chip.student{ background:rgba(79,168,216,.13); color:#1f6fa3; border-color:rgba(79,168,216,.4); }
  .live-chip{ font-size:11px; padding:4px 8px; border-radius:20px; background:rgba(63,145,102,.13); color:var(--white-win); border:1px solid rgba(63,145,102,.4); }
  .live-dot{ display:inline-block; width:6px;height:6px;border-radius:50%; background:var(--white-win); margin-right:5px; animation:pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .assign-line{ font-size:12.5px; color:var(--cream-dim); text-align:center; margin-bottom:10px; }
  .status-line{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; justify-content:center; }
  .stone-mini{ width:13px;height:13px;border-radius:48% 52% 45% 55%/55% 48% 52% 45%; display:inline-block; }
  .stone-mini.black{ background:radial-gradient(circle at 35% 30%, #57504a,#2b2621 70%); border:1px solid #1f1a15; }
  .stone-mini.white{ background:radial-gradient(circle at 35% 30%, #fff,#f0e6cf 75%); border:1px solid var(--wood-100);}
  .board-wrap{ background:#fffaf0;
    border:3px dashed #e2c98a; border-radius:16px; padding:14px; box-shadow: 0 10px 24px -14px rgba(138,90,43,.35); }
  svg{ width:100%; height:auto; display:block; touch-action:manipulation; }
  .msg-banner{ text-align:center; font-family:'Jua', sans-serif; font-weight:700; font-size:16px;
    padding:11px; border-radius:12px 6px 12px 6px; margin-bottom:14px; }
  .msg-banner.win-black{ background:rgba(198,90,63,.13); color:var(--black-win); border:1.5px solid rgba(198,90,63,.4); }
  .msg-banner.win-white{ background:rgba(63,145,102,.13); color:var(--white-win); border:1.5px solid rgba(63,145,102,.4); }
  .msg-banner.draw{ background:rgba(181,133,15,.13); color:var(--gold); border:1.5px solid rgba(181,133,15,.4); }
  .msg-banner.wait{ background:rgba(181,133,15,.1); color:var(--gold); border:1.5px solid rgba(181,133,15,.32); }
  .msg-banner.vote{ background:rgba(79,168,216,.13); color:#1f6fa3; border:1.5px solid rgba(79,168,216,.4); }
  .foul-toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#fff1ec; border:2px solid #e2916f; color:#a8492c; padding:12px 18px; border-radius:14px 6px 14px 6px;
    font-size:14px; font-weight:700; font-family:'Jua', sans-serif; box-shadow:3px 4px 0 rgba(198,90,63,.2); z-index:50; max-width:90vw; text-align:center;
    animation: fadeUp .18s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateX(-50%) translateY(8px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
  .rules-box{ font-size:12.5px; color:var(--cream-dim); line-height:1.75; margin-top:8px; }
  .rules-box b{ color:var(--wood-100); }
  .footer-note{ text-align:center; font-size:11.5px; color:var(--cream-dim); margin-top:20px; line-height:1.7; }
  .settings-grid{ display:flex; gap:10px; align-items:flex-end; }
  .settings-grid > div{ flex:1; }
  .teacher-panel{ margin-top:14px; }
  .stat-row{ display:flex; gap:10px; margin-top:12px; }
  .stat-box{ flex:1; background:var(--ink-950); border:2px solid var(--border); border-radius:12px; padding:10px 12px; text-align:center; }
  .stat-box .num{ font-family:'Jua', sans-serif; font-size:22px; font-weight:700; color:var(--wood-100); }
  .stat-box .lbl{ font-size:11px; color:var(--cream-dim); margin-top:2px; }
  .controls{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .controls > *{ flex:1; min-width:120px; }
  hr.sep{ border:none; border-top:2px dashed var(--border); margin:16px 0; }
  code.inline{ background:var(--ink-950); border:1.5px solid var(--border); border-radius:6px; padding:1px 6px; font-family:'Jua', sans-serif; font-weight:700; font-size:12px; color:var(--wood-100); }
  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; margin-top:6px; }
  .slot-btn{ text-align:left; font-size:13px; padding:10px 12px; border-radius:10px; border:2px solid var(--border); background:var(--ink-950); color:var(--cream); }
  .slot-open:hover{ border-color:var(--gold); }
  .slot-taken{ background:#f2ece0; color:#a99b80; }
  .slot-mine{ background:rgba(181,133,15,.15); border-color:var(--gold); color:var(--wood-100); font-weight:700; }
  .class-item{ background:var(--ink-950); border:2px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .class-item .meta{ font-size:11.5px; color:var(--cream-dim); margin-top:2px; }
  .roster-row{ display:flex; justify-content:space-between; align-items:center; padding:6px 2px; border-bottom:1.5px dashed var(--border); font-size:13px; }
  .roster-row:last-child{ border-bottom:none; }
  .tag-joined{ font-size:11px; color:var(--white-win); margin-right:8px; }
  .tag-empty{ font-size:11px; color:var(--cream-dim); margin-right:8px; }
  .roster-panel{ max-height:220px; overflow:auto; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap" id="app">설정을 불러오는 중...</div>

<script type="module">
/* ======================================================================
   Firebase 설정 — Firebase 콘솔(https://console.firebase.google.com)에서
   프로젝트를 만들고 아래 값을 반드시 채워 넣어야 앱이 동작합니다.
   1) Build > Authentication > Sign-in method > "익명" 사용 설정
   2) Build > Realtime Database > 데이터베이스 만들기
   3) 프로젝트 설정 > 일반 > 앱 추가(웹) > 아래 firebaseConfig 값 붙여넣기
   4) Realtime Database > 규칙 탭에 채팅에서 안내한 최신 보안 규칙 붙여넣기
====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAcQmT4f8zP1L153PojICdiuZ-d-N2aL6U",
  authDomain: "math-fly-catch.firebaseapp.com",
  databaseURL: "https://math-fly-catch-default-rtdb.firebaseio.com",
  projectId: "math-fly-catch",
  storageBucket: "math-fly-catch.firebasestorage.app",
  messagingSenderId: "748954569516",
  appId: "1:748954569516:web:c474da7f087530f39b7a89"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const NEEDS_SETUP = firebaseConfig.apiKey === "YOUR_API_KEY";

/* ============ 상수 ============ */
const TEACHER_PASSWORD = 'Rhcdlwlrhsktjdi';
const SIZE = 15;
const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
const DEFAULT_TIME_LIMIT = 15;

/* ============ 전역 상태 ============ */
const S = {
  screen: 'home',       // setup | home | classManage | roomCreate | teacher | studentPick | student
  myId: null,
  authReady: false,
  name: '',
  role: null,            // 'teacher' | 'student'
  roomKey: '',
  core: null,
  votes: {},
  claims: {},
  classesIndex: {},      // { classKey: {className, roster, updatedAt} } (교사용 캐시)
  openRooms: {},         // { roomKey: core } (학생 참가 화면에 표시할, 현재 개설된 방 목록)
  classRosterCache: {},  // 현재 방/선택화면에 쓰는 명단 {번호: 이름} (정적, 자주 안 바뀜)
  editingClassKey: null,
  teacherAuthed: false,
  teacherSelected: null, // 교사가 확정 전에 선택한 자리 {r,c}
  unsub: [],
  resolving: false,
  ticker: null,
};

let app, auth, db;

/* ============ 오목판 / 렌주룰 로직 ============ */
function idx(r,c){ return r*SIZE+c; }
function boardArrayFromSparse(sparse){
  const arr = new Array(SIZE*SIZE).fill(0);
  if(sparse){ Object.keys(sparse).forEach(k=>{ arr[parseInt(k)] = sparse[k]; }); }
  return arr;
}
function getCell(board,r,c){
  if(r<0||r>=SIZE||c<0||c>=SIZE) return 'E';
  const v = board[idx(r,c)];
  return v===0 ? '_' : (v===1 ? 'X' : 'O');
}
function runLength(board,r,c,dr,dc,sym){
  let cnt=1;
  for(let s=1;;s++){ if(getCell(board,r+dr*s,c+dc*s)===sym) cnt++; else break; }
  for(let s=1;;s++){ if(getCell(board,r-dr*s,c-dc*s)===sym) cnt++; else break; }
  return cnt;
}
function checkWinAt(board,r,c,color){
  const sym = color===1?'X':'O';
  for(const [dr,dc] of DIRS){
    const len = runLength(board,r,c,dr,dc,sym);
    if(color===1){ if(len===5) return true; } else { if(len>=5) return true; }
  }
  return false;
}
function checkOverline(board,r,c){
  for(const [dr,dc] of DIRS){ if(runLength(board,r,c,dr,dc,'X')>=6) return true; }
  return false;
}
function lineString9(board,r,c,dr,dc){
  let s=''; for(let o=-4;o<=4;o++) s += getCell(board,r+dr*o,c+dc*o); return s;
}
function uniqueFourPoints(board,r,c){
  const set = new Set();
  for(const [dr,dc] of DIRS){
    const str = lineString9(board,r,c,dr,dc);
    for(let S0=0;S0<=4;S0++){
      const win = str.substr(S0,5);
      if(win.length<5) continue;
      const xCount = (win.match(/X/g)||[]).length;
      const blank = win.indexOf('_');
      if(xCount===4 && blank!==-1 && !win.includes('O') && !win.includes('E')){
        const off = (S0+blank)-4;
        set.add((r+dr*off)+','+(c+dc*off));
      }
    }
  }
  return set;
}
function openThreeDirCount(board,r,c){
  const patterns = ['_XXX__','__XXX_','_XX_X_','_X_XX_'];
  let count=0;
  for(const [dr,dc] of DIRS){
    const str = lineString9(board,r,c,dr,dc);
    let found=false;
    for(let S0=0;S0<=3;S0++){
      const win = str.substr(S0,6);
      if(win.length<6) continue;
      if(patterns.includes(win)){ found=true; break; }
    }
    if(found) count++;
  }
  return count;
}
function isForbiddenForBlack(board,r,c){
  if(checkWinAt(board,r,c,1)) return null;
  if(checkOverline(board,r,c)) return '장목(6목 이상)';
  const fours = uniqueFourPoints(board,r,c);
  if(fours.size>=2) return '사사(4-4)';
  const threeDirs = openThreeDirCount(board,r,c);
  if(threeDirs>=2) return '삼삼(3-3)';
  return null;
}
function cellForbiddenIfBlackPlays(board,r,c){
  if(board[idx(r,c)]!==0) return null;
  const nb = board.slice();
  nb[idx(r,c)] = 1;
  return isForbiddenForBlack(nb,r,c);
}
function colorLabel(n){ return n===1 ? '흑' : '백'; }
function controllerLabel(room, colorNum){ return colorNum===room.studentColor ? '학생팀' : '교사'; }

/* ============ Firebase 초기화 ============ */
function bootFirebase(){
  if(NEEDS_SETUP){ S.screen='setup'; render(); return; }
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getDatabase(app);
  onAuthStateChanged(auth, user=>{
    if(user){ S.myId = user.uid; S.authReady = true; if(S.screen==='home'){ render(); refreshOpenRooms(); } }
  });
  // 세션(탭) 단위 로그인 유지: 같은 브라우저의 다른 탭과 로그인을 공유하지 않도록 하여
  // 한 브라우저에서 여러 탭으로 여러 학생을 테스트해도 각 탭이 서로 다른 사용자로 인식되게 함.
  setPersistence(auth, browserSessionPersistence)
    .then(()=> signInAnonymously(auth))
    .catch(err=>{ toast('로그인 실패: ' + err.message); });
}

/* ============ 경로 헬퍼 ============ */
function coreRef(key){ return ref(db, `rooms/${key}/core`); }
function votesRef(key){ return ref(db, `rooms/${key}/votes`); }
function claimsRef(key){ return ref(db, `rooms/${key}/claims`); }
function roomRef(key){ return ref(db, `rooms/${key}`); }
function myVoteRef(key){ return ref(db, `rooms/${key}/votes/${S.myId}`); }
function classRef(key){ return ref(db, `classes/${key}`); }
function classesRootRef(){ return ref(db, 'classes'); }

function sanitizeKey(s){
  return (s||'').toString().trim().replace(/\s+/g,'_').replace(/["'\\\/.#$\[\]]/g,'').slice(0,80);
}
function freshCorePayload(teacherId, teacherName, roomLabel, classKey, timeLimit, studentColor){
  const sc = studentColor===2 ? 2 : 1;
  return {
    roomLabel, classKey, teacherId, teacherName,
    turn: 1, status: 'waiting', winner: 0, lastMove: -1,
    timeLimitSec: timeLimit || DEFAULT_TIME_LIMIT,
    turnStartedAt: 0, round: 1,
    studentColor: sc, teacherColor: sc===1?2:1,
    updatedAt: Date.now()
  };
}
function parseRosterText(text){
  const lines = (text||'').split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const roster = {};
  for(const line of lines){
    let no, name;
    if(line.includes(',')){
      const parts = line.split(',').map(s=>s.trim());
      no = parts[0]; name = parts.slice(1).join(' ');
    } else {
      const parts = line.split(/\s+/);
      no = parts[0]; name = parts.slice(1).join(' ');
    }
    no = sanitizeKey(no);
    if(!no || !name) continue;
    roster[no] = name;
  }
  return roster;
}
function rosterToText(roster){
  const keys = Object.keys(roster||{}).sort((a,b)=>{
    const na = parseInt(a), nb = parseInt(b);
    if(!isNaN(na) && !isNaN(nb)) return na-nb;
    return a.localeCompare(b);
  });
  return keys.map(k=>`${k} ${roster[k]}`).join('\n');
}
function sortedRosterKeys(roster){
  return Object.keys(roster||{}).sort((a,b)=>{
    const na = parseInt(a), nb = parseInt(b);
    if(!isNaN(na) && !isNaN(nb)) return na-nb;
    return a.localeCompare(b);
  });
}

/* ============ 실시간 리스너 부착/해제 ============ */
function attachRoomListeners(key){
  detachRoomListeners();
  const u1 = onValue(coreRef(key), snap=>{
    const newCore = snap.val();
    if(S.teacherSelected && (!newCore || newCore.status!=='playing' || newCore.turn!==newCore.teacherColor)){
      S.teacherSelected = null;
    }
    S.core = newCore; render();
  });
  const u2 = onValue(votesRef(key), snap=>{ S.votes = snap.val()||{}; render(); });
  const u3 = onValue(claimsRef(key), snap=>{ S.claims = snap.val()||{}; render(); });
  S.unsub = [u1,u2,u3];
}
function detachRoomListeners(){
  S.unsub.forEach(fn=>{ try{ fn(); }catch(e){} });
  S.unsub = [];
}

/* ============ 화면 흐름 ============ */
function render(){
  const app = document.getElementById('app');
  if(S.screen==='setup'){ app.innerHTML = renderSetup(); return; }
  if(S.screen==='home'){ app.innerHTML = renderHome(); bindHome(); return; }
  if(S.screen==='classManage'){ app.innerHTML = renderClassManage(); bindClassManage(); return; }
  if(S.screen==='roomCreate'){ app.innerHTML = renderRoomCreate(); bindRoomCreate(); return; }
  if(S.screen==='teacher'){
    const prevPanel = document.querySelector('.roster-panel');
    const prevScrollTop = prevPanel ? prevPanel.scrollTop : 0;
    app.innerHTML = renderTeacher();
    bindTeacher();
    const newPanel = document.querySelector('.roster-panel');
    if(newPanel) newPanel.scrollTop = prevScrollTop;
    return;
  }
  if(S.screen==='studentPick'){ app.innerHTML = renderStudentPick(); bindStudentPick(); return; }
  if(S.screen==='student'){ app.innerHTML = renderStudent(); bindStudent(); return; }
}

function renderSetup(){
  return `
    <h1 class="brand"><span class="dot"></span>Firebase 설정이 필요합니다</h1>
    <div class="card">
      <div class="section-title">아직 firebaseConfig가 비어있습니다</div>
      <div class="rules-box">

async function enterClassManage(){
  S.screen = 'classManage';

async function loadClassesIndex(){
  try{
    const snap = await get(classesRootRef());
    return snap.exists() ? snap.val() : {};
  }catch(e){ toast('학급 목록을 불러오지 못했습니다.'); return {}; }
}
async function refreshClassesIndex(){
  S.classesIndex = await loadClassesIndex();
  toast('학급 목록을 새로고침했습니다.');
  render();
}
function sortedClassKeys(){
  const keys = Object.keys(S.classesIndex||{});
  return keys.sort((a,b)=>{
    const oa = S.classesIndex[a].order, ob = S.classesIndex[b].order;
    if(oa!=null && ob!=null) return oa-ob;
    if(oa!=null) return -1;
    if(ob!=null) return 1;
    return (S.classesIndex[a].updatedAt||0) - (S.classesIndex[b].updatedAt||0);
  });
}
async function moveClass(key, direction){
  const keys = sortedClassKeys();
  const idx = keys.indexOf(key);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= keys.length) return;
  // 순서값이 없던 기존 학급들도 이 기회에 현재 정렬 순서대로 순서값을 확정해 둠
  const updates = {};
  keys.forEach((k,i)=>{ updates[`${k}/order`] = i; });
  const a = updates[`${key}/order`], b = updates[`${keys[swapIdx]}/order`];
  updates[`${key}/order`] = b;
  updates[`${keys[swapIdx]}/order`] = a;
  await update(classesRootRef(), updates);
  S.classesIndex = await loadClassesIndex();
  render();
}
function nextClassOrder(){
  const vals = Object.values(S.classesIndex||{}).map(c=>c.order).filter(v=>typeof v==='number');
  return vals.length ? Math.max(...vals)+1 : 0;
}
async function refreshOpenRooms(){
  try{
    const classesSnap = await get(classesRootRef());
    const classes = classesSnap.exists() ? classesSnap.val() : {};
    const keys = Object.keys(classes);
    const results = {};
    await Promise.all(keys.map(async key=>{
      try{
        const coreSnap = await get(coreRef(key));
        if(coreSnap.exists()){ results[key] = coreSnap.val(); }
      }catch(e){ /* 개별 방 조회 실패는 무시 */ }
    }));
    S.openRooms = results;
  }catch(e){
    S.openRooms = {};
  }
  if(S.screen==='home') render();
}

async function saveClass(){
  const nameRaw = document.getElementById('cm-classname').value.trim();
  const rosterText = document.getElementById('cm-roster').value;
  if(!nameRaw){ toast('학급 이름을 입력해 주세요.'); return; }
  const newKey = sanitizeKey(nameRaw);
  if(!newKey){ toast('학급 이름을 다시 입력해 주세요.'); return; }
  const roster = parseRosterText(rosterText);
  if(Object.keys(roster).length===0){ toast('명단을 확인해 주세요. 예: 1 김민준'); return; }

  const originalKey = S.editingClassKey;
  const existing = originalKey ? S.classesIndex[originalKey] : null;
  const order = (existing && existing.order!=null) ? existing.order : nextClassOrder();

  await set(classRef(newKey), { className: nameRaw, roster, order, updatedAt: Date.now() });
  if(originalKey && originalKey !== newKey){
    // 이름이 바뀌어 키가 달라진 경우, 기존 항목이 중복으로 남지 않도록 정리
    await remove(classRef(originalKey));
  }
  toast('학급이 저장되었습니다.');
  S.editingClassKey = null;
  S.classesIndex = await loadClassesIndex();
  render();
}
async function deleteClass(key){
  const c = S.classesIndex[key];
  const ok = confirm(`"${c ? c.className : key}" 학급을 삭제할까요? 이 학급으로 열린 방이 있다면 방 자체는 남아있을 수 있습니다.`);
  if(!ok) return;
  await remove(classRef(key));
  if(S.editingClassKey===key) S.editingClassKey=null;
  S.classesIndex = await loadClassesIndex();
  render();
}

function startTicker(){
  if(S.ticker) clearInterval(S.ticker);
  S.ticker = setInterval(()=>{
    if(!S.core) return;
    if(S.role==='teacher' && S.core.status==='playing' && S.core.turn===S.core.studentColor && !S.resolving){
      const elapsed = (Date.now() - (S.core.turnStartedAt||0))/1000;
      if(elapsed >= (S.core.timeLimitSec||DEFAULT_TIME_LIMIT)){
        resolveVote();
        return;
      }
    }
    render();
  }, 1000);
}

  render();

/* ============ 투표 집계 및 자동 확정 ============ */
function tallyVotes(votes){
  const counts = {};
  Object.values(votes||{}).forEach(cellIdx=>{ counts[cellIdx] = (counts[cellIdx]||0)+1; });
  return counts;
}
async function resolveVote(){
  if(S.resolving) return;
  const core = S.core, votes = S.votes;
  if(!core || core.status!=='playing' || core.turn!==core.studentColor) return;
  S.resolving = true;
  try{
    const board = boardArrayFromSparse(core.board);
    const counts = tallyVotes(votes);
    const applyForbidden = core.turn===1;
    let remaining = Object.keys(counts).map(k=>parseInt(k)).sort((a,b)=>counts[b]-counts[a]);
    let chosen = -1;

    while(remaining.length>0 && chosen===-1){
      const topCount = counts[remaining[0]];
      const tiedGroup = remaining.filter(c=>counts[c]===topCount);
      const shuffled = tiedGroup.slice().sort(()=>Math.random()-0.5);
      for(const c of shuffled){
        const r = Math.floor(c/SIZE), cc = c%SIZE;
        if(board[c]!==0) continue;
        if(applyForbidden && cellForbiddenIfBlackPlays(board,r,cc)!==null) continue;
        chosen = c; break;
      }
      remaining = remaining.filter(c=>counts[c]!==topCount);
    }

    if(chosen===-1){
      const emptyLegal = [];
      for(let i=0;i<board.length;i++){
        if(board[i]===0){
          const r=Math.floor(i/SIZE), c=i%SIZE;
          if(!applyForbidden || cellForbiddenIfBlackPlays(board,r,c)===null) emptyLegal.push(i);
        }
      }
      if(emptyLegal.length===0){
        await update(coreRef(S.roomKey), { status:'finished', winner:0, updatedAt: Date.now() });
        await remove(votesRef(S.roomKey));
        return;
      }
      chosen = emptyLegal[Math.floor(Math.random()*emptyLegal.length)];
    }

    const r = Math.floor(chosen/SIZE), c = chosen%SIZE;
    const newBoard = board.slice();
    newBoard[chosen] = core.turn;
    const isWin = checkWinAt(newBoard, r, c, core.turn);
    const isFull = newBoard.every(v=>v!==0);

    const updates = { [`board/${chosen}`]: core.turn, lastMove: chosen, updatedAt: Date.now() };
    if(isWin){ updates.status='finished'; updates.winner=core.turn; }
    else if(isFull){ updates.status='finished'; updates.winner=0; }
    else { updates.turn = core.teacherColor; updates.turnStartedAt = Date.now(); }

    await update(coreRef(S.roomKey), updates);
    await remove(votesRef(S.roomKey));
  } finally {
    S.resolving = false;
  }
}

let toastTimer=null;
function toast(msg){
  const old = document.querySelector('.foul-toast'); if(old) old.remove();
  const div = document.createElement('div'); div.className='foul-toast'; div.textContent = msg;
  document.body.appendChild(div);

/* ============ 보드 렌더링 ============ */
function stoneStatusText(room){
  if(room.winner===0) return '무승부입니다';
  return controllerLabel(room, room.winner) + '(' + colorLabel(room.winner) + ') 승리!';
}
function renderBoardSVG(){
  const core = S.core, votes = S.votes;
  const board = boardArrayFromSparse(core.board);
  const margin = 24, gap = 32;
  const total = margin*2 + gap*(SIZE-1);
  const stars = [[3,3],[3,11],[11,3],[11,11],[7,7]];
  let lines = '';
  for(let i=0;i<SIZE;i++){
    const p = margin + i*gap;
    lines += `<line x1="${margin}" y1="${p}" x2="${total-margin}" y2="${p}" stroke="var(--line)" stroke-width="1.6" stroke-linecap="round"/>`;
    lines += `<line x1="${p}" y1="${margin}" x2="${p}" y2="${total-margin}" stroke="var(--line)" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  let starsSvg = stars.map(([r,c])=>{
    const x = margin+c*gap, y = margin+r*gap;
    return `<circle cx="${x}" cy="${y}" r="3" fill="var(--line)"/>`;
  }).join('');

  const counts = tallyVotes(votes);
  const totalVoteEntries = Object.keys(votes||{}).length;
  const forbiddenPhase = core.status==='playing' && core.turn===1;
  const votePhase = core.status==='playing' && core.turn===core.studentColor;
  const myVoteCell = votes ? votes[S.myId] : undefined;

  let stones = '', hitboxes = '', voteLayer = '', forbidLayer = '';
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const i = idx(r,c);
      const v = board[i];
      const x = margin+c*gap, y = margin+r*gap;

      if(v===0){
        hitboxes += `<rect data-r="${r}" data-c="${c}" class="cell-hit" x="${x-gap/2}" y="${y-gap/2}" width="${gap}" height="${gap}" fill="transparent"/>`;
      }
      if(v===1){ stones += `<circle cx="${x}" cy="${y}" r="13.5" fill="url(#gradBlack)" stroke="#1f1a15" stroke-width="1.3"/>`; }
      else if(v===2){ stones += `<circle cx="${x}" cy="${y}" r="13.5" fill="url(#gradWhite)" stroke="var(--wood-100)" stroke-width="1.3"/>`; }
      if(i === core.lastMove){
        stones += `<circle cx="${x}" cy="${y}" r="4.5" fill="none" stroke="#e2842e" stroke-width="1.8"/>`;
      }

      if(v===0){
        if(forbiddenPhase && cellForbiddenIfBlackPlays(board,r,c)!==null){
          forbidLayer += `<line x1="${x-8}" y1="${y-8}" x2="${x+8}" y2="${y+8}" stroke="var(--forbid)" stroke-width="2" opacity="0.85"/>`;
          forbidLayer += `<line x1="${x-8}" y1="${y+8}" x2="${x+8}" y2="${y-8}" stroke="var(--forbid)" stroke-width="2" opacity="0.85"/>`;
        } else if(votePhase && counts[i]){
          const pct = totalVoteEntries>0 ? Math.round((counts[i]/totalVoteEntries)*100) : 0;
          const isMine = myVoteCell === i;
          const rad = 8 + Math.min(13, pct/6);
          voteLayer += `<circle cx="${x}" cy="${y}" r="${rad}" fill="var(--vote)" opacity="0.30"/>`;
          if(isMine){ voteLayer += `<circle cx="${x}" cy="${y}" r="${rad+2}" fill="none" stroke="var(--gold)" stroke-width="1.6"/>`; }
          voteLayer += `<text x="${x}" y="${y+3}" font-size="9" font-family="Jua, sans-serif" font-weight="700" text-anchor="middle" fill="#1f6fa3">${pct}%</text>`;
        }
      }
    }
  }

  let selectionLayer = '';
  if(S.role==='teacher' && S.teacherSelected && core.status==='playing' && core.turn===core.teacherColor){
    const { r: sr, c: sc } = S.teacherSelected;
    const sx = margin+sc*gap, sy = margin+sr*gap;
    const previewFill = core.teacherColor===1 ? '#2b2621' : '#f0e6cf';
    const previewStroke = core.teacherColor===1 ? '#1f1a15' : '#8a5a2b';
    selectionLayer = `<circle cx="${sx}" cy="${sy}" r="13.5" fill="${previewFill}" opacity="0.5" stroke="${previewStroke}" stroke-width="1.8" stroke-dasharray="3,2.5"/>`;
  }

  return `
  <svg viewBox="0 0 ${total} ${total}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="gradBlack" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#5c554e"/><stop offset="70%" stop-color="#2b2621"/>
      </radialGradient>
      <radialGradient id="gradWhite" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#fffefa"/><stop offset="80%" stop-color="#f0e6cf"/>
      </radialGradient>
    </defs>
    ${lines}${starsSvg}${stones}${forbidLayer}${voteLayer}${selectionLayer}${hitboxes}
  </svg>`;
}

function renderStudent(){
  const room = S.core;
  if(!room) return `<div class="card">방 정보를 불러오는 중...</div>`;
  const voteCount = Object.keys(S.votes||{}).length;
  const studentCount = Object.keys(S.claims||{}).length;

  let banner = '';
  if(room.status==='waiting'){
    banner = `<div class="msg-banner wait">대국 시작을 기다리는 중입니다</div>`;
  } else if(room.status==='finished'){
    const cls = room.winner===0?'draw':(room.winner===1?'win-black':'win-white');
    banner = `<div class="msg-banner ${cls}">${stoneStatusText(room)}</div>`;
  } else if(room.turn===room.studentColor){
    banner = `<div class="msg-banner vote">우리 팀(${colorLabel(room.studentColor)}) 차례 · 두고 싶은 자리를 클릭! 언제든 다시 클릭해 바꿀 수 있어요</div>`;
  } else {
    banner = `<div class="status-line"><span class="stone-mini ${room.teacherColor===1?'black':'white'}"></span>선생님(${colorLabel(room.teacherColor)})이 두는 중입니다...</div>`;
  }

  return `
    <div class="top-bar">
      <h1 class="brand" style="font-size:18px;"><span class="dot"></span>오목 대국실</h1>
      <span class="live-chip"><span class="live-dot"></span>실시간 연결됨</span>
      <span class="role-chip student">학생 · ${escapeHtml(S.name)}</span>
      <span class="room-chip">${escapeHtml(room.roomLabel)}</span>
    </div>
    <div class="assign-line">우리 팀: ${colorLabel(room.studentColor)}(${room.studentColor===1?'선공':'후공'})</div>
    <div class="card">
      ${banner}
      <div class="board-wrap">${renderBoardSVG()}</div>
      <div class="hint" style="text-align:center;margin-top:10px;">
        빨간 X는 렌주룰 금수(반칙) 자리 · 파란 원은 현재 투표 비율, 금색 테두리는 내가 선택한 자리
        ${room.status==='playing' && room.turn===room.studentColor ? ` · 지금 ${voteCount}명 투표 중` : ''}
      </div>
      <div class="controls">
        <button class="btn-ghost" id="btn-leave">방 나가기</button>
      </div>
    </div>
    <div class="footer-note">방 이름: ${escapeHtml(room.roomLabel)}</div>
  `;
}
function bindStudent(){
  bindBoardClicks((r,c)=>studentVote(r,c));
  const lv = document.getElementById('btn-leave'); if(lv) lv.onclick = leaveRoom;
}

function bindBoardClicks(handler){
  const svg = document.querySelector('svg');
  if(!svg) return;
  svg.querySelectorAll('.cell-hit').forEach(rect=>{
    rect.addEventListener('click', ()=>{
      const r = parseInt(rect.getAttribute('data-r'));
      const c = parseInt(rect.getAttribute('data-c'));
      handler(r,c);
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

bootFirebase();
</script>
