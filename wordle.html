<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학시간에 하는 워들 게임</title>
    <!-- 화려한 폭죽 이펙트를 위한 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <!-- 칠판/분필 느낌의 손글씨 한글 폰트 + 가독성 좋은 본문 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #16281f;
            --panel: #1f3b2e;
            --panel-soft: #244435;
            --line: rgba(245, 243, 234, 0.22);
            --line-strong: rgba(245, 243, 234, 0.4);
            --chalk: #f5f3ea;
            --chalk-dim: #cbd8ce;
            --yellow: #f4d35e;
            --coral: #ee6c4d;
            --sky: #7fc8d9;
            --green-tile: #4c9a6a;
            --yellow-tile: #d9b44a;
            --gray-tile: #55605a;
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg);
            background-image:
                linear-gradient(rgba(245,243,234,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245,243,234,0.045) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--chalk);
            margin: 0;
            padding: 32px 16px 60px;
            min-height: 100vh;
        }

        h1 {
            font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
            font-weight: 400;
            font-size: 2.5rem;
            color: var(--chalk);
            margin: 0 0 6px;
            text-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 0 20px rgba(244, 211, 94, 0.3);
            letter-spacing: 0.5px;
        }
        p.subtitle {
            color: var(--chalk-dim);
            margin: 0 0 32px;
            font-size: 1rem;
            word-break: keep-all;
        }

        /* 메인 게임 레이아웃: 좌(교사설정) - 중앙(보드) - 우(키보드) */
        #game-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 32px;
            max-width: 1120px;
            width: 100%;
        }

        /* 좌측: 교사 전용 설정 패널 */
        #teacher-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 300px;
            background-color: var(--panel);
            border: 2px dashed var(--line-strong);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
        }
        #teacher-panel .panel-title {
            font-family: 'Gaegu', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--yellow);
            text-align: center;
            margin: 0 0 2px;
        }
        .setting-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
        }
        .setting-block label {
            font-size: 0.85rem;
            color: var(--chalk-dim);
            font-weight: 500;
        }
        #word-input {
            padding: 10px;
            font-size: 1.4rem;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            text-align: center;
            letter-spacing: 6px;
            border: 2px solid var(--line-strong);
            border-radius: 8px;
            background-color: #0f2018;
            color: var(--chalk);
            outline-offset: 2px;
        }
        #word-input::placeholder { color: #5c6f64; letter-spacing: 2px; font-size: 0.95rem; }

        /* 시도 횟수 스테퍼 */
        .stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        .stepper button {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--line-strong);
            background-color: #0f2018;
            color: var(--chalk);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
        }
        .stepper button:hover { background-color: var(--sky); color: #0f2018; }
        #tries-value {
            font-family: 'Gaegu', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            min-width: 34px;
            text-align: center;
            color: var(--sky);
        }

        #apply-settings-btn {
            font-family: 'Gaegu', sans-serif;
            background-color: var(--yellow);
            color: #16281f;
            border: none;
            padding: 13px;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        #apply-settings-btn:hover { background-color: var(--sky); transform: translateY(-1px); }
        #apply-settings-btn:active { transform: translateY(0); }

        .panel-note {
            font-size: 0.78rem;
            color: var(--chalk-dim);
            line-height: 1.5;
            text-align: center;
            opacity: 0.85;
            word-break: keep-all;
            overflow-wrap: break-word;
        }
        .panel-note .tries-note {
            display: block;
            white-space: nowrap;
        }

        /* 중앙: 게임 보드 */
        #board-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #board {
            display: grid;
            gap: 6px;
            margin-bottom: 20px;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .tile {
            width: 62px;
            height: 62px;
            border: 2px solid rgba(245, 243, 234, 0.55);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.9rem;
            font-weight: 700;
            text-transform: uppercase;
            background-color: #0f2018;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25), 0 2px 4px rgba(0,0,0,0.2);
            color: var(--chalk);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .tile:not(:empty) {
            border-color: var(--sky);
        }
        .tile.pop { animation: pop 0.3s ease; }

        /* 우측 패널 (키보드) */
        #right-panel {
            display: flex;
            flex-direction: column;
            width: 320px;
        }

        /* 색상 클래스 */
        .green { background-color: var(--green-tile) !important; color: #fff !important; border-color: var(--green-tile) !important; }
        .yellow { background-color: var(--yellow-tile) !important; color: #1c1707 !important; border-color: var(--yellow-tile) !important; }
        .gray { background-color: var(--gray-tile) !important; color: #e9ece9 !important; border-color: var(--gray-tile) !important; }

        /* 세로형 키보드 */
        #keyboard-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-color: var(--panel);
            border: 2px dashed var(--line-strong);
            border-radius: var(--radius);
            padding: 18px;
        }
        #alpha-keys {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-flow: row;
            gap: 6px;
        }
        #action-keys {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .key {
            background-color: rgba(245,243,234,0.1);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--chalk);
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 38px;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .key:hover { background-color: rgba(245,243,234,0.2); }
        .key:active { transform: scale(0.95); }
        .key.large {
            flex: 1;
            font-size: 0.95rem;
            background-color: var(--sky);
            color: #0f2018;
            border: none;
        }
        .key.large:hover { background-color: #9adae6; }

        button:focus-visible, input:focus-visible {
            outline: 2px solid var(--yellow);
        }

        /* 메시지 박스 */
        #message-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .message {
            background-color: rgba(15, 32, 24, 0.95);
            border: 1px solid var(--line-strong);
            color: var(--chalk);
            padding: 14px 22px;
            border-radius: 8px;
            font-weight: 700;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        /* 정답 시 타일 점프 애니메이션 */
        @keyframes jump {
            0%, 20% { transform: translateY(0); }
            40% { transform: translateY(-22px); }
            50% { transform: translateY(0); }
            60% { transform: translateY(-11px); }
            80% { transform: translateY(0); }
            100% { transform: translateY(0); }
        }
        .win-animation { animation: jump 0.6s ease-in-out; }

        @keyframes pop {
            0% { transform: scale(0.85); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @media (max-width: 640px) {
            #teacher-panel, #right-panel { width: 100%; max-width: 345px; }
            .tile { width: 52px; height: 52px; font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <h1>🧮 수학시간에 하는 워들 게임</h1>
    <p class="subtitle">5글자 영어 단어를 정해진 횟수 안에 맞춰보세요!</p>

    <div id="message-container"></div>

    <div id="game-wrapper">
        <!-- 좌측: 선생님 전용 설정 패널 -->
        <div id="teacher-panel">
            <h3 class="panel-title">🖊 선생님 전용 설정</h3>

            <div class="setting-block">
                <label for="word-input">정답 단어 (영어 5글자)</label>
                <input type="password" id="word-input" maxlength="5" placeholder="정답 5글자" oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')">
            </div>

            <div class="setting-block">
                <label>시도 횟수</label>
                <div class="stepper">
                    <button type="button" onclick="changeTries(-1)" aria-label="시도 횟수 줄이기">−</button>
                    <span id="tries-value">6</span>
                    <button type="button" onclick="changeTries(1)" aria-label="시도 횟수 늘리기">+</button>
                </div>
            </div>

            <button id="apply-settings-btn" onclick="setNewTargetWord()">단어 설정 및 게임 초기화</button>
            <p class="panel-note">설정을 적용하면 보드가 초기화됩니다.<br><span class="tries-note">시도 횟수는 3~10회 사이로 정할 수 있어요.</span></p>
        </div>

        <!-- 중앙: 게임 보드 -->
        <div id="board-panel">
            <div id="board"></div>
        </div>

        <!-- 우측: 키보드 패널 -->
        <div id="right-panel">
            <div id="keyboard-container">
                <div id="alpha-keys"></div>
                <div id="action-keys">
                    <button class="key large" onclick="handleInput('ENTER')">입력 (ENTER)</button>
                    <button class="key large" onclick="handleInput('⌫')">지우기 (⌫)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 기본 정답 단어 및 시도 횟수
        let TARGET_WORD = "SMILE";
        let TRIES = 6;      // 교사가 조정 가능한 시도 횟수 (rows)
        const MIN_TRIES = 3;
        const MAX_TRIES = 10;
        const cols = 5;

        let currentRow = 0;
        let currentCol = 0;
        let gameOver = false;

        // 메시지 표시 함수
        function showMessage(text, duration = 3000) {
            const container = document.getElementById('message-container');
            const msgElement = document.createElement('div');
            msgElement.className = 'message';
            msgElement.innerText = text;
            container.appendChild(msgElement);

            setTimeout(() => {
                msgElement.style.opacity = '0';
                setTimeout(() => { msgElement.remove(); }, 500);
            }, duration);
        }

        // 시도 횟수 +/- 조절
        function changeTries(delta) {
            const next = TRIES + delta;
            if (next < MIN_TRIES || next > MAX_TRIES) return;
            TRIES = next;
            document.getElementById('tries-value').innerText = TRIES;
        }

        // 교사용 단어/시도횟수 설정 및 게임 초기화
        function setNewTargetWord() {
            const inputField = document.getElementById("word-input");
            const newWord = inputField.value.toUpperCase();

            const regex = /^[A-Z]{5}$/;
            if (!regex.test(newWord)) {
                showMessage("❌ 5글자의 영어 알파벳만 입력해주세요!");
                return;
            }

            TARGET_WORD = newWord;
            inputField.value = "";
            showMessage(`✨ 새로운 단어와 시도 횟수(${TRIES}회)가 설정되었습니다!`, 4000);

            generateBoard();
            resetGame();
        }

        // 게임 보드 생성 (시도 횟수에 맞춰 행 재생성)
        function generateBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";
            board.style.gridTemplateRows = `repeat(${TRIES}, 1fr)`;
            for (let r = 0; r < TRIES; r++) {
                let row = document.createElement("div");
                row.className = "row";
                for (let c = 0; c < cols; c++) {
                    let tile = document.createElement("div");
                    tile.id = r.toString() + "-" + c.toString();
                    tile.className = "tile";
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }

        // 게임 보드 및 변수 초기화
        function resetGame() {
            currentRow = 0;
            currentCol = 0;
            gameOver = false;

            const tiles = document.querySelectorAll(".tile");
            tiles.forEach(tile => {
                tile.innerText = "";
                tile.className = "tile";
            });

            const keys = document.querySelectorAll(".key");
            keys.forEach(key => {
                key.classList.remove("green", "yellow", "gray");
            });
        }

        // 초기 보드 생성
        generateBoard();

        // A-Z 세로 2줄 키보드 생성
        const alphaKeysContainer = document.getElementById("alpha-keys");
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        alphabet.forEach(key => {
            let keyButton = document.createElement("button");
            keyButton.innerText = key;
            keyButton.id = "key-" + key;
            keyButton.className = "key";
            keyButton.addEventListener("click", () => handleInput(key));
            alphaKeysContainer.appendChild(keyButton);
        });

        // 물리적 키보드 입력 처리
        document.addEventListener("keyup", (e) => {
            if (document.activeElement.id === "word-input") {
                if (e.key === "Enter") {
                    setNewTargetWord();
                }
                return;
            }

            if (gameOver) return;
            let code = e.code;
            if (code >= "KeyA" && code <= "KeyZ") {
                handleInput(code.replace("Key", ""));
            } else if (code === "Enter") {
                handleInput("ENTER");
            } else if (code === "Backspace") {
                handleInput("⌫");
            }
        });

        // 입력 처리 로직
        function handleInput(key) {
            if (gameOver) return;

            if (key === "⌫") {
                if (currentCol > 0) {
                    currentCol--;
                    let tile = document.getElementById(currentRow.toString() + "-" + currentCol.toString());
                    tile.innerText = "";
                }
            } else if (key === "ENTER") {
                if (currentCol === cols) {
                    checkGuess();
                } else {
                    showMessage("단어 5글자를 모두 채워주세요!");
                }
            } else {
                if (currentCol < cols) {
                    let tile = document.getElementById(currentRow.toString() + "-" + currentCol.toString());
                    tile.innerText = key;
                    tile.classList.add("pop");
                    currentCol++;
                }
            }
        }

        // 정답 확인 로직
        function checkGuess() {
            let guess = "";
            let tileElements = [];

            for (let c = 0; c < cols; c++) {
                let tile = document.getElementById(currentRow.toString() + "-" + c.toString());
                guess += tile.innerText;
                tileElements.push(tile);
            }

            let targetArray = TARGET_WORD.split("");
            let guessArray = guess.split("");
            let tileColors = ["gray", "gray", "gray", "gray", "gray"];

            for (let i = 0; i < cols; i++) {
                if (guessArray[i] === targetArray[i]) {
                    tileColors[i] = "green";
                    targetArray[i] = null;
                }
            }

            for (let i = 0; i < cols; i++) {
                if (tileColors[i] === "green") continue;
                let targetIndex = targetArray.indexOf(guessArray[i]);
                if (targetIndex !== -1) {
                    tileColors[i] = "yellow";
                    targetArray[targetIndex] = null;
                }
            }

            for (let i = 0; i < cols; i++) {
                setTimeout(() => {
                    tileElements[i].classList.add(tileColors[i]);
                    updateKeyboardColor(guessArray[i], tileColors[i]);
                }, i * 200);
            }

            setTimeout(() => {
                if (guess === TARGET_WORD) {
                    tileElements.forEach((tile, index) => {
                        setTimeout(() => { tile.classList.add("win-animation"); }, index * 100);
                    });
                    fireConfetti();
                    showMessage("축하합니다! 정답을 맞췄어요! 🎉", 5000);
                    gameOver = true;
                } else if (currentRow === TRIES - 1) {
                    showMessage("아쉽네요! 정답은 " + TARGET_WORD + " 였습니다! 😢", 5000);
                    gameOver = true;
                } else {
                    currentRow++;
                    currentCol = 0;
                }
            }, 1200);
        }

        // 폭죽 이펙트 실행 함수
        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = {
                startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999,
                colors: ['#f4d35e', '#ee6c4d', '#7fc8d9', '#f5f3ea', '#4c9a6a']
            };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // 키보드 색상 업데이트
        function updateKeyboardColor(letter, color) {
            let keyBtn = document.getElementById("key-" + letter);
            if (!keyBtn) return;
            if (keyBtn.classList.contains("green")) return;
            if (keyBtn.classList.contains("yellow") && color === "gray") return;

            keyBtn.classList.remove("green", "yellow", "gray");
            keyBtn.classList.add(color);
        }
    </script>
</body>
</html>
